 {id:"de27", lvl:"B1", ic:"📜", t:"Es war einmal…", sub:"Präteritum para narrar",
  h:[["A","Gestern ging ich in die Stadt.","Ayer fui al centro."],["B","Und was passierte dann?","¿Y qué pasó después?"],["A","Plötzlich sah ich meinen alten Lehrer.","De repente vi a mi viejo profesor."],["B","Erkannte er dich?","¿Te reconoció?"],["A","Nein, er lief einfach weiter.","No, siguió caminando."],["B","Wahrscheinlich wollte er nicht mit dir reden.","Seguramente no quería hablar con vos."]],
  v:[["ging","fui, fue (gehen)","🚶","guing"],["kam","vine, vino (kommen)","🏠","kaam"],["sah","vi, vio (sehen)","👀","saa"],["sagte","dije, dijo","💬","ságte"],["lief","corrí, caminé (laufen)","🏃","liif"],["wollte","quería","🙋","vólte"],["konnte","podía","💪","kónte"],["erkennen","reconocer","🔍","erkénen"],["plötzlich","de repente","⚡","plœtslij"],["es war einmal","había una vez","📖","es var áinmaal"]],
  r:{t:"El Präteritum",x:"Para escribir y contar historias el alemán usa el Präteritum (en la charla, el Perfekt). Regulares: raíz + -te (sagen → sagte). Irregulares cambian la vocal: gehen → ging, kommen → kam, sehen → sah. Los modales siempre en Präteritum: wollte, konnte, musste.",tabla:[["ich sagte / ging","dije / fui"],["du sagtest / gingst","dijiste / fuiste"],["er sagte / ging","dijo / fue"],["wir sagten / gingen","dijimos / fuimos"],["ich wollte, konnte, musste","quería, podía, tenía que"]]},
  c:[["Gestern ___ ich ins Kino.",["ging","gehte","gang"],"Ayer fui al cine.","gehen → ging."],["Er ___ spät nach Hause.",["kam","kommte","kamm"],"Llegó tarde a casa.","kommen → kam."],["Als Kind ___ ich Arzt werden.",["wollte","willte","wolle"],"De chico quería ser médico.","wollen → wollte."],["Sie ___ „Hallo“ und ging.",["sagte","sag","sagtet"],"Dijo «hola» y se fue.","Regular: sag- + te."]],
  d:[["Was machtest du im Urlaub?","¿Qué hiciste en las vacaciones?",[["Ich las viele Bücher und schwamm im Meer.",null],["Ich lesete viele Bücher.","lesen es irregular: las."],["Ich lese gestern viele Bücher.","Pasado: las."]]],
     ["Warum kamst du nicht?","¿Por qué no viniste?",[["Ich konnte nicht, ich war krank.",null],["Ich kann nicht, ich war krank.","Pasado: konnte."],["Ich konnte nicht, ich bin krank gewesen gestern.","Mejor: ich war krank."]]],
     ["Was sagte der Chef?","¿Qué dijo el jefe?",[["Er sagte, dass wir morgen arbeiten müssen.",null],["Er sagtet, dass wir arbeiten.","er → sagte."],["Er sagte, dass wir müssen morgen arbeiten.","Con dass, el verbo al final."]]]]},
 {id:"de28", lvl:"B1", ic:"🔗", t:"Der Mann, der…", sub:"Relativsätze",
  h:[["A","Wer ist die Frau, die da drüben steht?","¿Quién es la mujer que está allá?"],["B","Das ist die Ärztin, der ich mein Leben verdanke.","Es la médica a la que le debo la vida."],["A","Und der Mann, mit dem sie spricht?","¿Y el hombre con el que está hablando?"],["B","Das ist ihr Mann, den ich nicht leiden kann.","Es su marido, al que no soporto."],["A","Das Auto, das draußen steht, gehört ihm?","¿El auto que está afuera es de él?"],["B","Ja. Das Auto, dessen Motor immer kaputt ist.","Sí. El auto cuyo motor siempre está roto."]],
  v:[["der / die / das (relativo)","que, el cual","🔗","der / di / das"],["den","al que (acusativo)","➡️","deen"],["dem / der","al que / a la que (dativo)","🎁","deem / der"],["dessen / deren","cuyo / cuya","🔑","désen / déren"],["da drüben","allá","👉","da drúben"],["verdanken","deber (agradecimiento)","🙏","ferdánken"],["leiden können","soportar","😤","láiden kœnen"],["gehören","pertenecer","🏷️","guejœren"],["draußen","afuera","🌳","dráusen"],["kaputt","roto","💥","kapút"]],
  r:{t:"Oraciones de relativo",x:"El pronombre relativo tiene el GÉNERO del sustantivo y el CASO de su función en la subordinada. El verbo va al final. Nominativo: der/die/das; acusativo: den/die/das; dativo: dem/der/dem (plural: denen). Con preposición: der Mann, mit dem…",tabla:[["der Mann, der hier wohnt","el hombre que vive acá"],["der Mann, den ich kenne","el hombre que conozco"],["der Mann, dem ich helfe","el hombre al que ayudo"],["die Frau, mit der ich arbeite","la mujer con la que trabajo"],["die Leute, denen ich danke","la gente a la que agradezco"]]},
  c:[["Das ist der Film, ___ ich gesehen habe.",["den","der","dem"],"Esa es la película que vi.","der Film, objeto → den."],["Die Frau, ___ dort steht, ist meine Chefin.",["die","der","den"],"La mujer que está ahí es mi jefa.","Sujeto femenino: die."],["Der Freund, mit ___ ich wohne, kocht gut.",["dem","den","der"],"El amigo con el que vivo cocina bien.","mit + dativo: dem."],["Das Kind, ___ Hund bellt, heißt Tim.",["dessen","deren","das"],"El chico cuyo perro ladra se llama Tim.","cuyo (masc./neutro): dessen."]],
  d:[["Welches Buch liest du?","¿Qué libro estás leyendo?",[["Das Buch, das du mir geschenkt hast.",null],["Das Buch, das du hast mir geschenkt.","Verbo conjugado al final: geschenkt hast."],["Das Buch, was du mir geschenkt hast.","Con sustantivo: das (no was)."]]],
     ["Wer ist Peter?","¿Quién es Peter?",[["Der Kollege, dem ich immer helfe.",null],["Der Kollege, den ich immer helfe.","helfen pide dativo: dem."],["Der Kollege, der ich immer helfe.","Dativo masculino: dem."]]],
     ["Wo ist das Restaurant?","¿Dónde está el restaurante?",[["Das Restaurant, in dem wir waren? Am Markt.",null],["Das Restaurant, in das wir waren?","Lugar fijo: in dem."],["Das Restaurant, wo in wir waren?","Se dice: in dem wir waren."]]]]},
 {id:"de29", lvl:"B1", ic:"💭", t:"Wenn ich reich wäre…", sub:"Konjunktiv II",
  h:[["A","Was würdest du machen, wenn du reich wärst?","¿Qué harías si fueras rico?"],["B","Ich würde eine Weltreise machen.","Haría un viaje por el mundo."],["A","Wenn ich Zeit hätte, würde ich Gitarre lernen.","Si tuviera tiempo, aprendería guitarra."],["B","Könntest du mir das Salz geben?","¿Me podrías pasar la sal?"],["A","Hier. An deiner Stelle würde ich weniger salzen.","Tomá. Yo que vos, salaría menos."],["B","Ich hätte gern noch ein Bier.","Me gustaría otra cerveza."]],
  v:[["würde","-ría (condicional)","🔮","vúrde"],["wäre","sería, estaría","💭","vére"],["hätte","tendría","🎒","jéte"],["könnte","podría","🤲","kœnte"],["müsste","debería (tendría que)","📌","müste"],["sollte","debería (consejo)","👉","sólte"],["an deiner Stelle","yo que vos","🔄","an dáiner shtéle"],["Ich hätte gern…","quisiera…","🙏","ij jéte guern"],["die Weltreise","el viaje por el mundo","🌍","di véltraize"],["salzen","salar","🧂","sáltsen"]],
  r:{t:"Konjunktiv II: deseos, hipótesis y cortesía",x:"würde + infinitivo al final para casi todos los verbos (ich würde reisen). Los verbos más comunes tienen forma propia: wäre, hätte, könnte, müsste. Sirve también para pedir con cortesía: Könnten Sie…? / Ich hätte gern…",tabla:[["Wenn ich Zeit hätte, …","Si tuviera tiempo…"],["Ich würde gern reisen.","Me gustaría viajar."],["Das wäre toll!","¡Eso sería genial!"],["Könnten Sie mir helfen?","¿Podría ayudarme?"],["Du solltest schlafen.","Deberías dormir."]]},
  c:[["Wenn ich Geld ___, würde ich reisen.",["hätte","habe","wäre"],"Si tuviera plata, viajaría.","Konjunktiv de haben: hätte."],["Ich ___ gern nach Japan fliegen.",["würde","wurde","werde"],"Me gustaría volar a Japón.","Condicional: würde (con diéresis)."],["___ Sie das Fenster öffnen?",["Könnten","Können","Konnten"],"¿Podría abrir la ventana?","Cortesía: Könnten."],["Das ___ super!",["wäre","war","ist"],"¡Eso sería genial!","Konjunktiv de sein: wäre."]],
  d:[["Was würdest du mit einer Million machen?","¿Qué harías con un millón?",[["Ich würde ein Haus am Meer kaufen.",null],["Ich würde kaufen ein Haus am Meer.","El infinitivo va al final."],["Ich wurde ein Haus kaufen.","wurde es pasado; condicional: würde."]]],
     ["Möchtest du etwas trinken?","¿Querés tomar algo?",[["Ich hätte gern einen Kaffee.",null],["Ich habe gern einen Kaffee.","Para pedir: Ich hätte gern…"],["Ich hätte gern ein Kaffee.","der Kaffee → einen Kaffee."]]],
     ["Ich bin immer so müde.","Estoy siempre tan cansado.",[["An deiner Stelle würde ich früher schlafen.",null],["An deiner Stelle ich würde früher schlafen.","Verbo segundo: würde ich."],["An deine Stelle würde ich schlafen.","an + dativo: deiner Stelle."]]]]},
 {id:"de30", lvl:"B1", ic:"🏗️", t:"Hier wird gebaut", sub:"Passiv Präsens",
  h:[["A","Was wird hier gebaut?","¿Qué se está construyendo acá?"],["B","Hier wird ein neuer Bahnhof gebaut.","Acá se construye una estación nueva."],["A","Und wann wird er eröffnet?","¿Y cuándo se inaugura?"],["B","Nächstes Jahr. Die Arbeiten werden von einer Firma aus Berlin gemacht.","El año que viene. Los trabajos los hace una empresa de Berlín."],["A","Wird hier auch nachts gearbeitet?","¿Acá se trabaja también de noche?"],["B","Leider ja. Hier wird nie geschlafen.","Lamentablemente sí. Acá no se duerme nunca."]],
  v:[["bauen","construir","🏗️","báuen"],["der Bahnhof","la estación de tren","🚉","der bánjof"],["eröffnen","inaugurar","🎀","erœfnen"],["die Arbeit","el trabajo","👷","di árbait"],["die Firma","la empresa","🏢","di fírma"],["von","por (quién lo hace)","👤","fon"],["nachts","de noche","🌙","najts"],["reparieren","reparar","🔧","reparíren"],["verkaufen","vender","🏷️","ferkáufen"],["leider","lamentablemente","😔","láider"]],
  r:{t:"La voz pasiva",x:"werden (conjugado) + participio al final. Quien hace la acción va con «von» + dativo. A menudo equivale al «se» español: Hier wird Deutsch gesprochen = Acá se habla alemán.",tabla:[["Das Haus wird gebaut.","La casa se construye."],["Die Autos werden repariert.","Los autos se reparan."],["Hier wird Deutsch gesprochen.","Acá se habla alemán."],["Das Essen wird von meiner Mutter gekocht.","La comida la cocina mi mamá."]]},
  c:[["Das Auto ___ repariert.",["wird","werden","ist"],"El auto se repara.","Singular: wird."],["Die Briefe werden morgen ___.",["geschickt","schicken","schickt"],"Las cartas se mandan mañana.","Participio al final."],["Das Bild wurde ___ Picasso gemalt.",["von","durch","mit"],"El cuadro lo pintó Picasso.","Quién lo hace: von."],["Hier ___ Englisch gesprochen.",["wird","werden","ist"],"Acá se habla inglés.","Pasiva impersonal: wird."]],
  d:[["Wo werden die Autos hergestellt?","¿Dónde se fabrican los autos?",[["Sie werden in Wolfsburg hergestellt.",null],["Sie werden in Wolfsburg herstellen.","Pasiva: participio, hergestellt."],["Sie wird in Wolfsburg hergestellt.","die Autos (plural): werden."]]],
     ["Wird das Frühstück serviert?","¿Se sirve el desayuno?",[["Ja, es wird ab sieben Uhr serviert.",null],["Ja, es wird ab sieben Uhr servieren.","Participio: serviert."],["Ja, es ist ab sieben serviert werden.","Se dice: es wird … serviert."]]],
     ["Wer kocht bei euch?","¿Quién cocina en tu casa?",[["Bei uns wird von meinem Vater gekocht.",null],["Bei uns wird von mein Vater gekocht.","von + dativo: meinem Vater."],["Bei uns wird mein Vater gekocht.","😄 ¡Eso es que cocinan a tu papá! Falta von."]]]]},
 {id:"de31", lvl:"B1", ic:"🔀", t:"Obwohl…", sub:"obwohl, trotzdem, deshalb",
  h:[["A","Obwohl es regnet, gehe ich joggen.","Aunque llueve, voy a correr."],["B","Du bist erkältet. Trotzdem willst du laufen?","Estás resfriado. ¿Y aun así querés correr?"],["A","Ich habe einen Marathon. Deshalb muss ich trainieren.","Tengo una maratón. Por eso tengo que entrenar."],["B","Obwohl du rauchst?","¿Aunque fumás?"],["A","Ich rauche nur am Wochenende.","Solo fumo los fines de semana."],["B","Felipe sagt dasselbe, und schau ihn an.","Felipe dice lo mismo, y miralo."]],
  v:[["obwohl","aunque","🔀","opvóol"],["trotzdem","sin embargo, aun así","↩️","trótsdeem"],["deshalb","por eso","➡️","désjalp"],["deswegen","por eso","➡️","désveeguen"],["sondern","sino","🔄","zóndern"],["erkältet","resfriado","🤧","erkéltet"],["joggen","correr (trotar)","🏃","yóguen"],["trainieren","entrenar","🏋️","treníren"],["dasselbe","lo mismo","🟰","dasélbe"],["anschauen","mirar","👀","ánshauen"]],
  r:{t:"Conectores y orden de palabras",x:"obwohl (aunque) manda el verbo AL FINAL. trotzdem y deshalb son adverbios: ocupan la posición 1 y el verbo va segundo (Trotzdem gehe ich). sondern = sino, después de una negación (nicht Bier, sondern Wein).",tabla:[["Obwohl ich müde bin, arbeite ich.","Aunque estoy cansado, trabajo."],["Ich bin müde. Trotzdem arbeite ich.","Estoy cansado. Aun así trabajo."],["Es regnet. Deshalb bleibe ich zu Hause.","Llueve. Por eso me quedo en casa."],["Nicht heute, sondern morgen.","No hoy, sino mañana."]]},
  c:[["___ es kalt ist, trage ich keine Jacke.",["Obwohl","Trotzdem","Deshalb"],"Aunque hace frío, no llevo campera.","+ verbo al final: obwohl."],["Ich habe Hunger. ___ esse ich jetzt.",["Deshalb","Obwohl","Sondern"],"Tengo hambre. Por eso como ahora.","Consecuencia: deshalb."],["Er ist krank. Trotzdem ___ er ins Büro.",["geht","er geht","gehen"],"Está enfermo. Aun así va a la oficina.","Después de trotzdem: verbo."],["Nicht Tee, ___ Kaffee, bitte.",["sondern","aber","oder"],"No té, sino café, por favor.","Después de negación: sondern."]],
  d:[["Warum lernst du Deutsch?","¿Por qué estudiás alemán?",[["Ich will in Berlin arbeiten. Deshalb lerne ich Deutsch.",null],["Deshalb ich lerne Deutsch.","Verbo segundo: Deshalb lerne ich."],["Obwohl ich will in Berlin arbeiten.","Con obwohl, verbo al final; y acá corresponde deshalb."]]],
     ["Du hast kein Geld. Kaufst du das Handy?","No tenés plata. ¿Comprás el celular?",[["Ja, trotzdem kaufe ich es.",null],["Ja, trotzdem ich kaufe es.","Verbo segundo: trotzdem kaufe ich."],["Ja, obwohl kaufe ich es.","obwohl necesita una oración con verbo al final."]]],
     ["Gehst du ins Kino, obwohl du müde bist?","¿Vas al cine aunque estás cansado?",[["Ja, obwohl ich müde bin.",null],["Ja, obwohl ich bin müde.","Con obwohl: verbo al final."],["Ja, trotzdem ich müde bin.","trotzdem no es subordinante."]]]]},
 {id:"de32", lvl:"B1", ic:"🎯", t:"Um zu / damit", sub:"para qué",
  h:[["A","Warum lernst du so viel?","¿Por qué estudiás tanto?"],["B","Um die Prüfung zu bestehen.","Para aprobar el examen."],["A","Ich spreche langsam, damit du mich verstehst.","Hablo despacio para que me entiendas."],["B","Danke. Ich höre Podcasts, um mein Hören zu verbessern.","Gracias. Escucho podcasts para mejorar la comprensión auditiva."],["A","Und ich rauche, um mich zu entspannen.","Y yo fumo para relajarme."],["B","Du klingst wie Felipe.","Sonás como Felipe."]],
  v:[["um … zu","para (+ infinitivo)","🎯","um … tsu"],["damit","para que","🤝","damít"],["die Prüfung","el examen","📝","di prúfung"],["bestehen","aprobar","✅","beshtéen"],["verbessern","mejorar","📈","ferbésern"],["sich entspannen","relajarse","😌","zij entshpánen"],["verstehen","entender","💡","fershtéen"],["das Hören","la escucha","🎧","das jœren"],["langsam","despacio","🐢","lángsam"],["klingen","sonar","🔔","klínguen"]],
  r:{t:"Finalidad",x:"um … zu + infinitivo al final, cuando el sujeto es el MISMO (Ich lerne, um zu bestehen). damit + verbo al final, cuando el sujeto CAMBIA (Ich spreche langsam, damit du mich verstehst). Con verbos separables el zu va en el medio: um früh aufzustehen.",tabla:[["Ich spare, um ein Auto zu kaufen.","Ahorro para comprar un auto."],["Ich erkläre es, damit du es verstehst.","Te lo explico para que lo entiendas."],["Ich gehe früh, um den Zug zu erreichen.","Salgo temprano para alcanzar el tren."],["um früh aufzustehen","para levantarme temprano"]]},
  c:[["Ich arbeite, ___ Geld zu verdienen.",["um","damit","für"],"Trabajo para ganar plata.","Mismo sujeto: um … zu."],["Ich rufe an, ___ du nicht wartest.",["damit","um","zu"],"Llamo para que no esperes.","Cambia el sujeto: damit."],["Er lernt, um die Prüfung zu ___.",["bestehen","besteht","bestanden"],"Estudia para aprobar el examen.","Infinitivo al final."],["Ich stelle den Wecker, um früh ___.",["aufzustehen","zu aufstehen","aufstehen zu"],"Pongo el despertador para levantarme temprano.","Separable: auf-zu-stehen."]],
  d:[["Warum sparst du?","¿Por qué ahorrás?",[["Um eine Reise zu machen.",null],["Um zu machen eine Reise.","El infinitivo va al final: eine Reise zu machen."],["Für eine Reise zu machen.","Finalidad con verbo: um … zu."]]],
     ["Warum sprichst du so laut?","¿Por qué hablás tan fuerte?",[["Damit mich alle hören.",null],["Um mich alle zu hören.","Cambia el sujeto: damit."],["Damit hören mich alle.","Con damit, el verbo al final."]]],
     ["Wozu brauchst du den Laptop?","¿Para qué necesitás la notebook?",[["Um von zu Hause zu arbeiten.",null],["Um von zu Hause arbeiten.","Falta zu antes del infinitivo."],["Damit ich arbeite von zu Hause.","Con damit, verbo al final."]]]]},
 {id:"de33", lvl:"B1", ic:"🎨", t:"Ein guter Wein", sub:"declinación del adjetivo",
  h:[["A","Das ist ein guter Wein!","¡Este es un buen vino!"],["B","Ja, der rote Wein aus Mendoza ist der beste.","Sí, el vino tinto de Mendoza es el mejor."],["A","Ich trinke gern kalten Weißwein im Sommer.","Me gusta tomar vino blanco frío en verano."],["B","Mit einem kleinen Stück Käse?","¿Con un pedacito de queso?"],["A","Mit frischem Brot und guter Musik.","Con pan fresco y buena música."],["B","Das klingt nach einem perfekten Abend.","Suena a una noche perfecta."]],
  v:[["gut","bueno","👍","gut"],["rot","rojo, tinto","🍷","root"],["kalt","frío","🧊","kalt"],["klein","pequeño","🤏","kláin"],["frisch","fresco","🥖","frish"],["das Stück","el pedazo","🧀","das shtük"],["der Käse","el queso","🧀","der kéze"],["perfekt","perfecto","💯","perfékt"],["der Weißwein","el vino blanco","🥂","der váisvain"],["klingen nach","sonar a","🎶","klínguen naj"]],
  r:{t:"Terminaciones del adjetivo",x:"Después de der/die/das el adjetivo lleva -e o -en (der gute Wein, den guten Wein). Después de ein/kein/mein, el adjetivo muestra el género si el artículo no lo muestra (ein guter Wein, ein gutes Bier). Sin artículo, el adjetivo toma la terminación del artículo (kalter Wein, frisches Brot).",tabla:[["der gute Wein / ein guter Wein","el / un buen vino"],["das kalte Bier / ein kaltes Bier","la / una cerveza fría"],["die rote Rose / eine rote Rose","la / una rosa roja"],["Ich trinke den guten Wein.","Tomo el buen vino (acus.)"],["mit frischem Brot","con pan fresco (dat.)"]]},
  c:[["Das ist ein ___ Auto.",["schnelles","schneller","schnelle"],"Es un auto rápido.","ein + neutro: -es."],["Der ___ Mann ist mein Onkel.",["alte","alter","alten"],"El hombre viejo es mi tío.","Después de der (nom.): -e."],["Ich kaufe einen ___ Tisch.",["neuen","neuer","neue"],"Compro una mesa nueva.","Acusativo masculino: -en."],["Ich trinke gern ___ Kaffee.",["heißen","heiße","heißer"],"Me gusta tomar café caliente.","Sin artículo, acus. masc.: -en."]],
  d:[["Was für ein Hund ist das?","¿Qué clase de perro es?",[["Das ist ein kleiner, süßer Hund.",null],["Das ist ein kleine, süße Hund.","ein + masculino nominativo: -er."],["Das ist ein kleinen Hund.","Nominativo masculino: ein kleiner."]]],
     ["Was möchtest du trinken?","¿Qué querés tomar?",[["Ein kaltes Bier, bitte.",null],["Ein kalter Bier, bitte.","das Bier → ein kaltes Bier."],["Ein kalte Bier, bitte.","Neutro con ein: -es."]]],

 {id:"de34", lvl:"B1", ic:"🪞", t:"Ich freue mich", sub:"verbos reflexivos",
  h:[["A","Ich freue mich auf das Wochenende!","¡Tengo ganas de que llegue el fin de semana!"],["B","Ich mich auch. Interessierst du dich für Kunst?","Yo también. ¿Te interesa el arte?"],["A","Ja, sehr. Ich habe mich über die neue Ausstellung gefreut.","Sí, mucho. Me alegró la nueva exposición."],["B","Wir treffen uns um zehn vor dem Museum.","Nos encontramos a las diez frente al museo."],["A","Ich muss mich beeilen, ich bin noch nicht angezogen.","Me tengo que apurar, todavía no estoy vestido."],["B","Beeil dich! Und ärgere dich nicht, wenn ich zu spät komme.","¡Apurate! Y no te enojes si llego tarde."]],
  v:[["sich freuen auf","esperar con ganas","🤩","zij fróien auf"],["sich freuen über","alegrarse por","😊","zij fróien úber"],["sich interessieren für","interesarse por","🎨","zij interesíren für"],["sich treffen","encontrarse","🤝","zij tréfen"],["sich beeilen","apurarse","🏃","zij beáilen"],["sich anziehen","vestirse","👕","zij ántsien"],["sich ärgern über","enojarse por","😠","zij érguern úber"],["sich erinnern an","acordarse de","🧠","zij erínern an"],["die Ausstellung","la exposición","🖼️","di áusshtelung"],["die Kunst","el arte","🎨","di kunst"]],
  r:{t:"Verbos reflexivos",x:"Como en español: ich freue mich (me alegro). Pronombres: mich, dich, sich, uns, euch, sich. Muchos van con preposición fija: sich freuen AUF (algo futuro) / ÜBER (algo que ya pasó), sich interessieren FÜR, sich erinnern AN.",tabla:[["ich freue mich","me alegro"],["du freust dich","te alegrás"],["er freut sich","se alegra"],["wir treffen uns","nos encontramos"],["Ich erinnere mich an dich.","Me acuerdo de vos."]]},
  c:[["Ich freue ___ auf die Ferien.",["mich","mir","dich"],"Tengo ganas de que lleguen las vacaciones.","ich → mich."],["Interessierst du dich ___ Musik?",["für","auf","über"],"¿Te interesa la música?","sich interessieren für."],["Wir treffen ___ morgen.",["uns","euch","sich"],"Nos encontramos mañana.","wir → uns."],["Erinnerst du dich ___ mich?",["an","auf","für"],"¿Te acordás de mí?","sich erinnern an."]],
  d:[["Worauf freust du dich?","¿Qué esperás con ganas?",[["Ich freue mich auf den Urlaub.",null],["Ich freue auf den Urlaub.","Falta el reflexivo: mich."],["Ich freue mich für den Urlaub.","Algo futuro: sich freuen auf."]]],
     ["Wofür interessierst du dich?","¿Qué te interesa?",[["Ich interessiere mich für Geschichte.",null],["Ich interessiere mir für Geschichte.","Acusativo: mich."],["Ich interessiere mich an Geschichte.","Preposición: für."]]],
     ["Warum bist du so sauer?","¿Por qué estás tan enojado?",[["Ich ärgere mich über meinen Chef.",null],["Ich ärgere über meinen Chef.","Falta mich."],["Ich ärgere mich auf meinen Chef.","sich ärgern über."]]]]},
 {id:"de35", lvl:"B1", ic:"🧷", t:"Worauf wartest du?", sub:"verbos con preposición",
  h:[["A","Worauf wartest du?","¿Qué estás esperando?"],["B","Ich warte auf den Bus. Und du?","Espero el colectivo. ¿Y vos?"],["A","Ich denke an meine Ex. Denkst du auch oft daran?","Pienso en mi ex. ¿Vos también pensás seguido en eso?"],["B","An meine Ex? Nie. Ich habe Angst davor.","¿En mi ex? Nunca. Le tengo miedo."],["A","Worüber sprecht ihr zu Hause?","¿De qué hablan en casa?"],["B","Über das Wetter. Das ist sicherer.","Del clima. Es más seguro."]],
  v:[["warten auf","esperar","⏳","várten auf"],["denken an","pensar en","💭","dénken an"],["sprechen über","hablar de","🗣️","shpréjen úber"],["Angst haben vor","tener miedo de","😱","angst jáben for"],["träumen von","soñar con","🌙","tróimen fon"],["sich kümmern um","ocuparse de","🤲","zij kümern um"],["worauf? / darauf","¿qué? / eso (auf)","❓","vorráuf / daráuf"],["woran? / daran","¿en qué? / en eso","❓","vorrán / darán"],["worüber? / darüber","¿de qué? / de eso","❓","vorrúber / darúber"],["sicher","seguro","🛡️","síjer"]],
  r:{t:"wo- y da- + preposición",x:"Muchos verbos llevan preposición fija (warten AUF, denken AN). Para preguntar por COSAS: wo(r) + preposición (Worauf wartest du?). Para referirse a una cosa ya nombrada: da(r) + preposición (Ich warte darauf). Con personas: Auf wen wartest du? / Ich warte auf ihn.",tabla:[["Worauf wartest du? — Auf den Bus.","¿Qué esperás? — El colectivo."],["Ich warte darauf.","Lo espero (eso)."],["Woran denkst du?","¿En qué pensás?"],["Auf wen wartest du? — Auf Anna.","¿A quién esperás? — A Anna."],["Wovon träumst du?","¿Con qué soñás?"]]},
  c:[["Ich warte ___ meinen Freund.",["auf","an","für"],"Espero a mi amigo.","warten auf."],["___ denkst du?",["Woran","Worauf","Wovon"],"¿En qué pensás?","denken an → woran."],["Wir sprechen oft ___ Politik.",["über","von","an"],"Hablamos seguido de política.","sprechen über."],["Hast du Angst vor Spinnen? — Ja, ich habe Angst ___.",["davor","darauf","daran"],"¿Tenés miedo de las arañas? — Sí, les tengo miedo.","Angst vor → davor."]],
  d:[["Worüber habt ihr gesprochen?","¿De qué hablaron?",[["Über den neuen Job.",null],["Von den neuen Job.","sprechen über + acus."],["Über dem neuen Job.","über aquí pide acusativo: den."]]],
     ["Denkst du an die Prüfung?","¿Pensás en el examen?",[["Ja, ich denke ständig daran.",null],["Ja, ich denke ständig an es.","Para cosas: daran."],["Ja, ich denke ständig darauf.","denken an → daran."]]],
     ["Wovon träumst du?","¿Con qué soñás?",[["Von einem Haus am Strand.",null],["Über einem Haus am Strand.","träumen von."],["Von ein Haus am Strand.","von + dativo: einem Haus."]]]]},
 {id:"de36", lvl:"B1", ic:"✍️", t:"Es ist wichtig, … zu …", sub:"zu + infinitivo",
  h:[["A","Hast du Lust, heute Abend auszugehen?","¿Tenés ganas de salir esta noche?"],["B","Nein, ich habe keine Zeit, mich zu amüsieren.","No, no tengo tiempo para divertirme."],["A","Es ist wichtig, auch mal Pause zu machen.","Es importante hacer una pausa de vez en cuando."],["B","Ich versuche, meine Arbeit zu beenden.","Estoy tratando de terminar mi trabajo."],["A","Vergiss nicht, etwas zu essen!","¡No te olvides de comer algo!"],["B","Ich habe aufgehört, am Abend zu essen.","Dejé de comer de noche."]],
  v:[["Lust haben, … zu","tener ganas de","😃","lust jáben tsu"],["Zeit haben, … zu","tener tiempo para","⏰","tsait jáben tsu"],["versuchen","intentar","🎯","ferzújen"],["vergessen","olvidar","🤦","ferguésen"],["aufhören","dejar de","🛑","áufjœren"],["anfangen","empezar","▶️","ánfanguen"],["beenden","terminar","🏁","beénden"],["ausgehen","salir","🎉","áusgueen"],["sich amüsieren","divertirse","🥳","zij amüsíren"],["wichtig","importante","❗","víjtij"]],
  r:{t:"Infinitivo con zu",x:"Después de muchos verbos y expresiones el infinitivo va con «zu» y al final: Ich versuche, Deutsch zu lernen. Con verbos separables, zu va en el medio: auszugehen. ¡Los modales (können, wollen…) NO llevan zu!",tabla:[["Ich habe keine Lust zu arbeiten.","No tengo ganas de trabajar."],["Es ist schwer, früh aufzustehen.","Es difícil levantarse temprano."],["Ich versuche, weniger zu rauchen.","Trato de fumar menos."],["Ich kann schwimmen. (sin zu)","Sé nadar."]]},
  c:[["Ich habe keine Zeit, ___.",["zu kochen","kochen","zu koche"],"No tengo tiempo para cocinar.","zu + infinitivo."],["Es ist wichtig, Wasser zu ___.",["trinken","trinkt","getrunken"],"Es importante tomar agua.","Infinitivo al final."],["Hast du Lust, heute ___?",["auszugehen","zu ausgehen","ausgehen zu"],"¿Tenés ganas de salir hoy?","Separable: aus-zu-gehen."],["Ich kann gut ___.",["tanzen","zu tanzen","tanze"],"Sé bailar bien.","Modal: sin zu."]],
  d:[["Was hast du vergessen?","¿Qué te olvidaste?",[["Ich habe vergessen, Milch zu kaufen.",null],["Ich habe vergessen, zu kaufen Milch.","Infinitivo al final: Milch zu kaufen."],["Ich habe vergessen Milch kaufen.","Falta zu."]]],
     ["Was ist schwer für dich?","¿Qué te resulta difícil?",[["Es ist schwer, früh aufzustehen.",null],["Es ist schwer, früh zu aufstehen.","Separable: aufzustehen."],["Es ist schwer, früh aufstehen.","Falta zu: aufzustehen."]]],
     ["Rauchst du noch?","¿Seguís fumando?",[["Nein, ich habe aufgehört zu rauchen.",null],["Nein, ich habe aufgehört rauchen.","Falta zu."],["Nein, ich habe aufgehört, zu rauche.","Infinitivo: rauchen."]]]]},
 {id:"de37", lvl:"B1", ic:"❔", t:"Wissen Sie, ob…?", sub:"preguntas indirectas",
  h:[["A","Entschuldigung, wissen Sie, wo der Bahnhof ist?","Disculpe, ¿sabe dónde está la estación?"],["B","Nein, leider nicht. Fragen Sie am Kiosk, ob sie es wissen.","No, lamentablemente no. Pregunte en el kiosco si saben."],["A","Können Sie mir sagen, wann der nächste Zug fährt?","¿Me puede decir cuándo sale el próximo tren?"],["B","Ich weiß nicht, ob heute noch Züge fahren.","No sé si hoy salen más trenes."],["A","Wissen Sie, wie viel ein Taxi kostet?","¿Sabe cuánto cuesta un taxi?"],["B","Keine Ahnung, aber ich glaube, dass es teuer ist.","Ni idea, pero creo que es caro."]],
  v:[["ob","si (en preguntas indirectas)","❔","op"],["wissen","saber","🧠","vísen"],["Keine Ahnung","ni idea","🤷","káine ánung"],["der Kiosk","el kiosco","🏪","der kíosk"],["fragen","preguntar","❓","fráguen"],["der nächste Zug","el próximo tren","🚆","der néjste tsuk"],["Entschuldigung","disculpe","🙇","entshúldigung"],["glauben","creer","🤔","gláuben"],["Können Sie mir sagen…?","¿Me puede decir…?","🗣️","kœnen zi mir ságuen"],["wie viel","cuánto","💶","vi fiil"]],
  r:{t:"Preguntas indirectas",x:"Son más corteses. Con palabra interrogativa: Wissen Sie, WO der Bahnhof IST? (verbo al final). Sin palabra interrogativa (preguntas de sí/no) se usa «ob»: Ich weiß nicht, OB er kommt. ¡«ob» es «si» de duda; «wenn» es «si» condicional!",tabla:[["Wo ist die Bank? → Wissen Sie, wo die Bank ist?","¿Sabe dónde está el banco?"],["Kommt er? → Ich weiß nicht, ob er kommt.","No sé si viene."],["Wann fährt der Bus? → Können Sie mir sagen, wann der Bus fährt?","¿Me puede decir cuándo sale el colectivo?"]]},
  c:[["Wissen Sie, wo die Toilette ___?",["ist","sein","ist die"],"¿Sabe dónde está el baño?","Verbo al final."],["Ich weiß nicht, ___ er heute kommt.",["ob","wenn","dass"],"No sé si viene hoy.","Duda: ob."],["Können Sie mir sagen, wie spät es ___?",["ist","sind","es ist"],"¿Me puede decir qué hora es?","Verbo al final."],["Weißt du, ___ das Konzert beginnt?",["wann","wenn","als"],"¿Sabés cuándo empieza el recital?","Preguntar cuándo: wann."]],
  d:[["Wissen Sie, wo das Hotel ist?","¿Sabe dónde está el hotel?",[["Ja, es ist gleich um die Ecke.",null],["Ja, wo das Hotel ist, ist um die Ecke.","Más simple: Es ist um die Ecke."],["Ja, ob es ist um die Ecke.","ob no corresponde acá."]]],
     ["Kommt Anna zur Party?","¿Viene Anna a la fiesta?",[["Ich weiß nicht, ob sie kommt.",null],["Ich weiß nicht, wenn sie kommt.","Duda: ob."],["Ich weiß nicht, ob sie kommt nicht.","Verbo al final: ob sie kommt."]]],
     ["Wie komme ich zum Museum?","¿Cómo llego al museo?",[["Können Sie mir sagen, wie ich zum Museum komme?",null],["Können Sie mir sagen, wie komme ich zum Museum?","Pregunta indirecta: verbo al final."],["Können Sie sagen mir, wie ich komme?","Orden: Können Sie mir sagen…"]]]]},

  h:[["A","Guten Tag, ich habe mich um die Stelle als Verkäufer beworben.","Buen día, me postulé al puesto de vendedor."],["B","Willkommen. Erzählen Sie etwas über sich.","Bienvenido. Cuénteme algo sobre usted."],["A","Ich habe fünf Jahre Berufserfahrung im Verkauf.","Tengo cinco años de experiencia laboral en ventas."],["B","Warum möchten Sie bei uns arbeiten?","¿Por qué quiere trabajar con nosotros?"],["A","Ihre Firma hat einen sehr guten Ruf.","Su empresa tiene muy buena reputación."],["B","Wann könnten Sie anfangen?","¿Cuándo podría empezar?"]],
  v:[["die Bewerbung","la postulación","📨","di bevérbung"],["sich bewerben um","postularse a","✍️","zij bevérben um"],["die Stelle","el puesto","💼","di shtéle"],["der Lebenslauf","el currículum","📄","der lébenslauf"],["die Berufserfahrung","la experiencia laboral","🧳","di berúfserfarung"],["das Vorstellungsgespräch","la entrevista de trabajo","🤝","das fórshtelungsgueshpréj"],["der Ruf","la reputación","⭐","der ruuf"],["das Gehalt","el sueldo","💶","das guejált"],["die Stärke / die Schwäche","la fortaleza / la debilidad","💪","di shtérke / di shvéje"],["zuverlässig","confiable","✅","tsuférlesij"]],
  r:{t:"Hablar de uno en una entrevista",x:"Sustantivos compuestos: el último manda el género (die Berufs-erfahrung). Fórmulas útiles: Ich habe Erfahrung in… / Meine Stärken sind… / Ich bin zuverlässig und teamfähig. En la entrevista se usa siempre Sie.",tabla:[["Ich bewerbe mich um die Stelle als…","Me postulo al puesto de…"],["Ich habe Erfahrung im Verkauf.","Tengo experiencia en ventas."],["Meine Stärke ist…","Mi fortaleza es…"],["Ich könnte sofort anfangen.","Podría empezar de inmediato."],["Wie hoch ist das Gehalt?","¿Cuánto es el sueldo?"]]},
  c:[["Ich bewerbe mich ___ die Stelle.",["um","für","auf"],"Me postulo al puesto.","sich bewerben um."],["Hier ist mein ___.",["Lebenslauf","Lebenslauft","Leben"],"Acá está mi currículum.","CV: der Lebenslauf."],["Ich habe viel Erfahrung ___ Marketing.",["im","am","zum"],"Tengo mucha experiencia en marketing.","Erfahrung in (im)."],["Ich bin sehr ___ und pünktlich.",["zuverlässig","zuverlassen","verlässig"],"Soy muy confiable y puntual.","confiable: zuverlässig."]],

     ["Wann könnten Sie anfangen?","¿Cuándo podría empezar?",[["Ich könnte am ersten März anfangen.",null],["Ich könnte anfangen am ersten März.","El infinitivo va al final."],["Ich kann anfangen gestern.","😄 gestern es ayer."]]],
     ["Haben Sie noch Fragen?","¿Tiene alguna pregunta más?",[["Ja. Wie sieht ein typischer Arbeitstag aus?",null],["Nein, tschüss!","Muy abrupto para una entrevista."],["Ja. Wie viel Urlaub ich habe?","Pregunta directa: Wie viel Urlaub habe ich?"]]]]},

  h:[["A","Als ich am Bahnhof ankam, war der Zug schon abgefahren.","Cuando llegué a la estación, el tren ya se había ido."],["B","Hattest du den Fahrplan nicht gecheckt?","¿No habías revisado el horario?"],["A","Doch, aber ich hatte meine Brille vergessen.","Sí, pero me había olvidado los anteojos."],["B","Nachdem du den Zug verpasst hattest, was hast du gemacht?","Después de perder el tren, ¿qué hiciste?"],["A","Ich bin ins Café gegangen, bevor ich ein Taxi genommen habe.","Fui a un café antes de tomar un taxi."],["B","Typisch. Du hattest es wieder nicht eilig.","Típico. De nuevo no tenías apuro."]],
  v:[["ankommen","llegar","📍","ánkomen"],["abfahren","partir, salir","🚆","ápfaren"],["der Fahrplan","el horario","🗓️","der fárplan"],["die Brille","los anteojos","👓","di bríle"],["verpassen","perder (tren)","🏃","ferpásen"],["nachdem","después de que","⏭️","najdéem"],["bevor","antes de que","⏮️","befór"],["schon","ya","✅","shoon"],["es eilig haben","tener apuro","⏰","es áilij jáben"],["typisch","típico","🙄","túpish"]],
  r:{t:"El pluscuamperfecto",x:"hatte / war + participio (como «había» + participio): lo que pasó ANTES de otro pasado. Con «nachdem» la acción anterior va en Plusquamperfekt y el verbo al final: Nachdem ich gegessen hatte, ging ich.",tabla:[["Ich hatte gegessen.","Había comido."],["Er war schon gegangen.","Ya se había ido."],["Nachdem wir gegessen hatten, …","Después de que comimos…"],["Bevor ich ging, rief ich an.","Antes de irme, llamé."]]},
  c:[["Als ich kam, ___ er schon gegangen.",["war","hatte","ist"],"Cuando llegué, ya se había ido.","gehen → war gegangen."],["Ich ___ das Buch schon gelesen.",["hatte","war","habe"],"Ya había leído el libro.","lesen → hatte gelesen."],["Nachdem wir gegessen ___, tranken wir Kaffee.",["hatten","waren","haben"],"Después de comer, tomamos café.","essen → hatten gegessen."],["___ ich schlafe, lese ich.",["Bevor","Nachdem","Als"],"Antes de dormir, leo.","Antes de: bevor."]],
  d:[["Warum warst du so hungrig?","¿Por qué tenías tanta hambre?",[["Ich hatte den ganzen Tag nichts gegessen.",null],["Ich war den ganzen Tag nichts gegessen.","essen va con haben: hatte gegessen."],["Ich habe den ganzen Tag nichts gegessen gehabt.","Mejor: Ich hatte … gegessen."]]],
     ["Was hast du nach der Arbeit gemacht?","¿Qué hiciste después del trabajo?",[["Nachdem ich nach Hause gekommen war, habe ich gekocht.",null],["Nachdem ich nach Hause gekommen hatte, …","kommen va con sein: war."],["Nachdem ich war nach Hause gekommen, …","Con nachdem: verbo al final."]]],

 {id:"de41", lvl:"B2", ic:"🏛️", t:"Es wurde gebaut", sub:"Passiv en pasado y con modales",
  h:[["A","Wann wurde das Brandenburger Tor gebaut?","¿Cuándo se construyó la Puerta de Brandeburgo?"],["B","Es wurde im 18. Jahrhundert gebaut.","Se construyó en el siglo XVIII."],["A","Und die Mauer? Wann ist sie abgerissen worden?","¿Y el Muro? ¿Cuándo fue derribado?"],["B","1989. Heute muss die Geschichte erklärt werden.","En 1989. Hoy hay que explicar la historia."],["A","Darf hier fotografiert werden?","¿Se pueden sacar fotos acá?"],["B","Ja, aber es darf nichts angefasst werden.","Sí, pero no se puede tocar nada."]],

  c:[["Wenn ich Zeit gehabt ___, wäre ich gekommen.",["hätte","wäre","würde"],"Si hubiera tenido tiempo, habría venido.","haben → hätte gehabt."],["Ich ___ fast den Bus verpasst.",["hätte","wäre","würde"],"Casi pierdo el colectivo.","verpassen con haben: hätte."],["Wir ___ gern mitgekommen.",["wären","hätten","würden"],"Habríamos venido con gusto.","kommen con sein: wären."],["Du hättest mich anrufen ___.",["sollen","gesollt","sollst"],"Me tendrías que haber llamado.","Doble infinitivo: anrufen sollen."]],
  d:[["Warum bist du nicht gekommen?","¿Por qué no viniste?",[["Wenn ich es gewusst hätte, wäre ich gekommen.",null],["Wenn ich es gewusst wäre, …","wissen va con haben: hätte."],["Wenn ich es wusste, würde ich kommen.","Pasado irreal: hätte gewusst, wäre gekommen."]]],

 {id:"de43", lvl:"B2", ic:"☂️", t:"Wegen des Regens", sub:"genitivo y sus preposiciones",

  c:[["___ des Regens bleiben wir zu Hause.",["Wegen","Trotz","Statt"],"Por la lluvia nos quedamos en casa.","Causa: wegen."],["Das ist das Handy ___ Vaters.",["meines","meinem","mein"],"Es el celular de mi papá.","Genitivo masculino: meines Vaters."],["Trotz ___ Kälte gehen wir spazieren.",["der","die","dem"],"A pesar del frío salimos a caminar.","die Kälte → genitivo: der."],["Während ___ Films habe ich geschlafen.",["des","dem","der"],"Durante la película dormí.","der Film → des Films."]],

 {id:"de45", lvl:"B2", ic:"⚖️", t:"Je mehr, desto besser", sub:"conectores dobles",
  h:[["A","Je mehr ich lerne, desto weniger weiß ich.","Cuanto más aprendo, menos sé."],["B","Du sprichst sowohl Englisch als auch Deutsch.","Hablás tanto inglés como alemán."],["A","Aber weder Französisch noch Italienisch.","Pero ni francés ni italiano."],["B","Entweder du lernst jetzt Latein, oder Felipe wird böse.","O aprendés latín ahora, o Felipe se enoja."],["A","Zwar ist Latein schwer, aber es ist faszinierend.","Es cierto que el latín es difícil, pero es fascinante."],["B","Nicht nur faszinierend, sondern auch nützlich.","No solo fascinante, sino también útil."]],
  v:[["je … desto","cuanto más… más","📈","ye … désto"],["sowohl … als auch","tanto… como","➕","zovóol … als auj"],["weder … noch","ni… ni","🚫","véder … noj"],["entweder … oder","o… o","🔀","entvéder … óder"],["zwar … aber","es cierto que… pero","⚖️","tsvar … áber"],["nicht nur … sondern auch","no solo… sino también","✨","nijt nur … zóndern auj"],["faszinierend","fascinante","🤩","fastsiníerent"],["nützlich","útil","🛠️","nútslij"],["böse","enojado","😠","bœze"],["weniger","menos","📉","véniguer"]],
  r:{t:"Conectores de dos partes",x:"«je + comparativo … desto + comparativo»: la parte de je lleva el verbo AL FINAL; la de desto, el verbo inmediatamente después (Je älter ich werde, desto ruhiger bin ich). Los demás (sowohl…als auch, weder…noch, entweder…oder) unen palabras o frases.",tabla:[["Je früher, desto besser.","Cuanto antes, mejor."],["Je mehr ich esse, desto dicker werde ich.","Cuanto más como, más engordo."],["Ich trinke weder Kaffee noch Tee.","No tomo ni café ni té."],["Entweder heute oder morgen.","O hoy o mañana."],["Zwar ist es teuer, aber gut.","Es caro, eso sí, pero bueno."]]},
  c:[["Je länger ich warte, ___ nervöser werde ich.",["desto","je","umso mehr"],"Cuanto más espero, más nervioso me pongo.","je … desto."],["Er spricht ___ Deutsch noch Englisch.",["weder","entweder","sowohl"],"No habla ni alemán ni inglés.","ni… ni: weder … noch."],["___ du kommst mit, oder du bleibst hier.",["Entweder","Weder","Sowohl"],"O venís o te quedás.","o… o: entweder … oder."],["Sie ist nicht nur klug, ___ auch lustig.",["sondern","aber","oder"],"No solo es inteligente, sino también divertida.","nicht nur … sondern auch."]],
  d:[["Möchtest du Tee oder Kaffee?","¿Querés té o café?",[["Weder noch, danke. Ein Wasser, bitte.",null],["Entweder noch, danke.","Ninguno de los dos: weder noch."],["Sowohl noch, danke.","Se dice: weder noch."]]],

  h:[["A","Möchtest du ein gekochtes Ei?","¿Querés un huevo duro?"],["B","Nein, danke. Ich hasse gekochte Eier.","No, gracias. Odio los huevos duros."],["A","Siehst du die lachende Frau da drüben?","¿Ves a la mujer que se ríe allá?"],["B","Die mit dem blühenden Kleid?","¿La del vestido floreado?"],["A","Ja. Sie ist die frisch verheiratete Chefin.","Sí. Es la jefa recién casada."],["B","Deshalb lacht sie. Warte ein paar Jahre.","Por eso se ríe. Esperá unos años."]],

  r:{t:"Partizip I y Partizip II",x:"Partizip I (infinitivo + d) = acción en curso, activa: die lachende Frau (la mujer que ríe). Partizip II = acción terminada o pasiva: das gekochte Ei (el huevo que fue hervido). Usados como adjetivo, se declinan como cualquier adjetivo.",tabla:[["das schlafende Kind","el niño que duerme"],["die gestohlene Tasche","la cartera robada"],["ein gebrauchtes Auto","un auto usado"],["die geschlossene Tür","la puerta cerrada"],["kochendes Wasser","agua hirviendo"]]},

 {id:"de47", lvl:"B2", ic:"🗣️", t:"Meiner Meinung nach…", sub:"opinar y discutir",
  h:[["A","Meiner Meinung nach sollten wir das Projekt verschieben.","En mi opinión, deberíamos postergar el proyecto."],["B","Da bin ich anderer Meinung. Wir haben genug Zeit.","Ahí no estoy de acuerdo. Tenemos suficiente tiempo."],["A","Ich bin der Ansicht, dass das Budget nicht reicht.","Soy de la idea de que el presupuesto no alcanza."],["B","Da haben Sie teilweise recht, aber…","En eso tiene razón en parte, pero…"],["A","Einerseits ist es riskant, andererseits könnten wir viel gewinnen.","Por un lado es arriesgado; por otro, podríamos ganar mucho."],["B","Lassen Sie uns einen Kompromiss finden.","Busquemos un término medio."]],
  v:[["meiner Meinung nach","en mi opinión","💭","máiner máinung naj"],["anderer Meinung sein","no estar de acuerdo","🙅","ánderer máinung zain"],["der Ansicht sein","ser de la idea","🧠","der ánzijt zain"],["recht haben","tener razón","✅","rejt jáben"],["teilweise","en parte","🍰","táilvaize"],["einerseits … andererseits","por un lado… por otro","⚖️","áinerzaits … ándererzaits"],["verschieben","postergar","📅","fershíben"],["reichen","alcanzar (ser suficiente)","💶","ráijen"],["der Kompromiss","el término medio","🤝","der kompromís"],["überzeugen","convencer","🎯","übertsóiguen"]],
  r:{t:"Estructurar una opinión",x:"Opinar: Meiner Meinung nach + verbo (Meiner Meinung nach IST das falsch). Ich finde/glaube/denke, dass… (verbo al final). Discrepar con cortesía: Da bin ich anderer Meinung / Das sehe ich anders. Conceder: Da haben Sie recht, aber…",tabla:[["Meiner Meinung nach ist das gut.","En mi opinión, eso está bien."],["Ich bin der Meinung, dass…","Opino que…"],["Das sehe ich anders.","Lo veo distinto."],["Da stimme ich Ihnen zu.","Coincido con usted."],["Einerseits…, andererseits…","Por un lado…, por otro…"]]},
  c:[["Meiner Meinung ___ ist das zu teuer.",["nach","noch","nah"],"En mi opinión, eso es demasiado caro.","Fórmula: meiner Meinung nach."],["Meiner Meinung nach ___ das eine gute Idee.",["ist","das ist","sei"],"En mi opinión, es una buena idea.","Verbo segundo: ist."],["Da bin ich ___ Meinung.",["anderer","andere","anders"],"Ahí no estoy de acuerdo.","Genitivo: anderer Meinung."],["Da ___ Sie recht.",["haben","sind","machen"],"En eso tiene razón.","recht haben."]],
  d:[["Sollten wir mehr Geld investieren?","¿Deberíamos invertir más plata?",[["Einerseits ja, andererseits ist das Risiko hoch.",null],["Einerseits ja, andererseits das Risiko ist hoch.","Verbo segundo: andererseits ist das Risiko…"],["Einseits ja, anderseits nein.","Se dice: einerseits … andererseits."]]],

 {id:"de48", lvl:"B2", ic:"📨", t:"Die Beschwerde", sub:"carta formal de reclamo",
  h:[["A","Sehr geehrte Damen und Herren, hiermit möchte ich mich beschweren.","Estimados señores: por la presente quiero presentar un reclamo."],["B","Worum geht es genau?","¿De qué se trata exactamente?"],["A","Am 3. Mai habe ich bei Ihnen einen Fernseher bestellt.","El 3 de mayo les pedí un televisor."],["A","Leider wurde das Gerät beschädigt geliefert.","Lamentablemente el aparato llegó dañado."],["A","Ich bitte Sie daher, mir den Betrag zu erstatten.","Por lo tanto, les pido que me reintegren el monto."],["A","Ich erwarte Ihre Antwort bis zum 20. Mai. Mit freundlichen Grüßen.","Espero su respuesta hasta el 20 de mayo. Saludos cordiales."]],
  v:[["sich beschweren","quejarse","😤","zij beshvéren"],["die Beschwerde","el reclamo","📨","di beshvérde"],["hiermit","por la presente","📜","jírmit"],["bestellen","pedir, encargar","🛒","beshtélen"],["das Gerät","el aparato","📺","das gueréet"],["beschädigt","dañado","💥","beshédigt"],["liefern","entregar","🚚","líefern"],["erstatten","reintegrar","💶","ershtáten"],["der Betrag","el monto","🔢","der betrák"],["daher","por lo tanto","➡️","dajér"]],
  r:{t:"Estructura de la carta formal",x:"Asunto (Betreff: Beschwerde). Saludo: Sehr geehrte Damen und Herren, / Sehr geehrte Frau X, (la línea siguiente arranca en minúscula). Motivo: hiermit möchte ich… Hechos con fechas. Pedido: Ich bitte Sie, … zu … Plazo. Cierre: Mit freundlichen Grüßen.",tabla:[["Betreff: Beschwerde über…","Asunto: reclamo sobre…"],["Hiermit möchte ich mich beschweren.","Por la presente presento un reclamo."],["Ich bitte Sie, den Betrag zu erstatten.","Les pido que reintegren el monto."],["Ich erwarte Ihre Antwort bis…","Espero su respuesta hasta…"],["Mit freundlichen Grüßen","Saludos cordiales"]]},
  c:[["___ möchte ich mich beschweren.",["Hiermit","Damit","Womit"],"Por la presente quiero presentar un reclamo.","Fórmula: hiermit."],["Das Paket wurde beschädigt ___.",["geliefert","liefern","lieferte"],"El paquete llegó dañado.","Pasiva: geliefert."],["Ich bitte Sie, mir das Geld ___.",["zurückzuzahlen","zurück zahlen","zurückzahlen zu"],"Les pido que me devuelvan la plata.","Separable: zurück-zu-zahlen."],["Mit ___ Grüßen",["freundlichen","freundliche","freundlicher"],"Saludos cordiales","Dativo plural: freundlichen."]],
  d:[["Wie beginnt eine formelle Beschwerde?","¿Cómo empieza un reclamo formal?",[["Sehr geehrte Damen und Herren,",null],["Hallo Leute,","Demasiado informal."],["Liebe Firma,","No se usa en cartas formales."]]],
     ["Was möchten Sie von uns?","¿Qué quiere que hagamos?",[["Ich bitte Sie, das Gerät umzutauschen.",null],["Ich bitte Sie, das Gerät umtauschen.","Falta zu: umzutauschen."],["Tauschen Sie sofort!","Demasiado brusco para una carta."]]],
     ["Wann haben Sie bestellt?","¿Cuándo hizo el pedido?",[["Ich habe am 3. Mai bestellt.",null],["Ich habe im 3. Mai bestellt.","Fecha: am 3. Mai."],["Ich bestellen am 3. Mai.","Pasado: Ich habe … bestellt."]]]]},
 {id:"de49", lvl:"B2", ic:"🧱", t:"Bei der Ankunft", sub:"nominalización",
  h:[["A","Bei Ankunft des Zuges bitte nicht einsteigen, bevor alle ausgestiegen sind.","Al llegar el tren, por favor no suban antes de que todos bajen."],["B","Nach dem Essen machen wir einen Spaziergang.","Después de comer damos un paseo."],["A","Zur Verbesserung der Qualität brauchen wir neue Maschinen.","Para mejorar la calidad necesitamos máquinas nuevas."],["B","Vor der Unterzeichnung des Vertrags müssen wir alles prüfen.","Antes de firmar el contrato tenemos que revisar todo."],["A","Das Rauchen ist hier verboten.","Acá está prohibido fumar."],["B","Das Lernen macht mit Felipe mehr Spaß.","Aprender con Felipe es más divertido."]],
  v:[["die Ankunft","la llegada","🛬","di ánkunft"],["die Abfahrt","la partida","🛫","di ápfart"],["die Verbesserung","la mejora","📈","di ferbéserung"],["die Unterzeichnung","la firma","✍️","di untertsáijnung"],["der Vertrag","el contrato","📄","der fertrák"],["prüfen","revisar","🔍","prúfen"],["das Rauchen","el fumar","🚬","das ráujen"],["verboten","prohibido","⛔","ferbóten"],["der Spaziergang","el paseo","🚶","der shpatsírgang"],["einsteigen / aussteigen","subir / bajar (vehículo)","🚆","áinshtaiguen / áusshtaiguen"]],
  r:{t:"Estilo nominal",x:"El alemán escrito (administrativo, técnico, periodístico) convierte verbos en sustantivos: ankommen → die Ankunft; verbessern → die Verbesserung (-ung, siempre femenino); cualquier infinitivo → das + infinitivo (das Rauchen). Así «wenn der Zug ankommt» se vuelve «bei Ankunft des Zuges».",tabla:[["wenn der Zug ankommt → bei Ankunft des Zuges","al llegar el tren"],["nachdem wir gegessen haben → nach dem Essen","después de comer"],["um die Qualität zu verbessern → zur Verbesserung der Qualität","para mejorar la calidad"],["bevor man unterschreibt → vor der Unterzeichnung","antes de firmar"]]},
  c:[["Nach dem ___ gehen wir spazieren.",["Essen","essen","Gegessen"],"Después de comer salimos a caminar.","Infinitivo sustantivado: das Essen."],["Die ___ des Produkts dauert lange.",["Entwicklung","Entwickeln","Entwicklen"],"El desarrollo del producto lleva tiempo.","entwickeln → die Entwicklung."],["Bei ___ des Flugzeugs bitte sitzen bleiben.",["Landung","Landen","Gelandet"],"Durante el aterrizaje, permanezcan sentados.","landen → die Landung."],["Das ___ ist hier verboten.",["Parken","parken","Geparkt"],"Acá está prohibido estacionar.","das Parken, con mayúscula."]],
  d:[["Wann trinken wir Kaffee?","¿Cuándo tomamos café?",[["Nach dem Mittagessen.",null],["Nach dem Mittag essen.","Se escribe junto: das Mittagessen."],["Nach das Mittagessen.","nach + dativo: dem."]]],
     ["Was braucht die Firma?","¿Qué necesita la empresa?",[["Eine Verbesserung der Kommunikation.",null],["Eine Verbessern der Kommunikation.","Sustantivo: die Verbesserung."],["Eine Verbesserung die Kommunikation.","Genitivo: der Kommunikation."]]],
     ["Darf man hier rauchen?","¿Se puede fumar acá?",[["Nein, das Rauchen ist hier verboten.",null],["Nein, das rauchen ist hier verboten.","Sustantivo: con mayúscula, Rauchen."],["Nein, die Rauchen ist verboten.","Infinitivos sustantivados son neutros: das."]]]]},
 {id:"de50", lvl:"B2", ic:"🧂", t:"Das ist ja toll!", sub:"partículas modales",
  h:[["A","Komm doch mal vorbei!","¡Vení a visitarme!"],["B","Das ist ja nett! Wann denn?","¡Qué amable! ¿Cuándo?"],["A","Na, heute Abend halt. Du hast ja Zeit.","Y, esta noche, digamos. Total tenés tiempo."],["B","Ich muss eben noch einkaufen.","Tengo que ir a comprar un momento."],["A","Bring doch Wein mit!","¡Traé vino!"],["B","Mal sehen. Du trinkst ja sowieso alles.","Ya veremos. Total vos tomás cualquier cosa."]],
  v:[["doch","(anima, suaviza una orden)","🤗","doj"],["mal","(suaviza: «un ratito»)","🪶","mal"],["ja","(«ya sabés», sorpresa)","😮","ya"],["denn","(interés en preguntas)","❓","den"],["halt / eben","(así es, qué le vas a hacer)","🤷","jalt / ében"],["vorbeikommen","pasar (visitar)","🚪","forbáikomen"],["nett","amable","😊","net"],["einkaufen","hacer las compras","🛒","áinkaufen"],["mitbringen","traer","🎁","mítbringuen"],["Mal sehen.","Ya veremos.","👀","mal zéen"]],
  r:{t:"Las partículas: la sal del alemán",x:"No se traducen palabra por palabra, pero cambian el tono. doch/mal suavizan órdenes (Komm doch mal!); ja expresa algo obvio o sorpresa (Das ist ja toll!); denn da interés a una pregunta (Wie geht's denn?); halt/eben = resignación (Das ist halt so). Sin ellas el alemán suena seco.",tabla:[["Setz dich doch!","¡Sentate, dale!"],["Das ist ja super!","¡Pero qué genial!"],["Was machst du denn hier?","¿Pero qué hacés acá?"],["Das ist halt so.","Y bueno, es así."],["Hör mal!","¡Escuchá!"]]},
  c:[["Komm ___ rein!",["doch","ja","denn"],"¡Pasá, dale!","Invitar con suavidad: doch."],["Was ist ___ los?",["denn","doch","halt"],"¿Pero qué pasa?","Pregunta con interés: denn."],["Das ist ___ toll!",["ja","denn","mal"],"¡Qué genial!","Sorpresa: ja."],["Das ist ___ so. Man kann nichts machen.",["halt","denn","mal"],"Y bueno, es así. No se puede hacer nada.","Resignación: halt."]],
  d:[["Ich habe keine Lust zu arbeiten.","No tengo ganas de trabajar.",[["Das ist halt so. Montag ist Montag.",null],["Das ist denn so.","denn es para preguntas."],["Das ist mal so.","Resignación: halt / eben."]]],
     ["Hallo! Ich bin's!","¡Hola! ¡Soy yo!",[["Was machst du denn hier?",null],["Was machst du halt hier?","Para sorpresa en preguntas: denn."],["Was machst du ja hier?","ja no va en preguntas."]]],
     ["Kann ich reinkommen?","¿Puedo pasar?",[["Na klar, komm doch rein!",null],["Na klar, komm denn rein!","denn no se usa en órdenes."],["Na klar, kommst du doch rein!","Imperativo: komm."]]]]},
 {id:"de51", lvl:"B2", ic:"🍅", t:"Tomaten auf den Augen", sub:"Redewendungen",
  h:[["A","Hast du Tomaten auf den Augen? Da ist doch die Brille!","¿Estás ciego? ¡Ahí están los anteojos!"],["B","Ich verstehe nur Bahnhof. Welche Brille?","No entiendo nada. ¿Qué anteojos?"],["A","Ach, das ist mir Wurst.","Bah, me da igual."],["B","Morgen habe ich eine Prüfung. Drück mir die Daumen!","Mañana tengo un examen. ¡Deseame suerte!"],["A","Du schaffst das. Das ist ein Kinderspiel.","Lo vas a lograr. Es pan comido."],["B","Hoffentlich trete ich nicht wieder ins Fettnäpfchen.","Ojalá no vuelva a meter la pata."]],
  v:[["Tomaten auf den Augen haben","no ver lo obvio","🍅","tomáten auf den áuguen jáben"],["nur Bahnhof verstehen","no entender nada","🚉","nur bánjof fershtéen"],["Das ist mir Wurst.","me da igual","🌭","das ist mir vurst"],["die Daumen drücken","desear suerte","🤞","di dáumen drúken"],["ein Kinderspiel","pan comido","🧸","áin kíndershpiil"],["ins Fettnäpfchen treten","meter la pata","🦶","ins fétnepfjen tréten"],["Schwein haben","tener suerte","🐷","shváin jáben"],["die Nase voll haben","estar harto","👃","di náze fol jáben"],["Ich glaub, mein Schwein pfeift!","¡no lo puedo creer!","🐖","ij glaub main shváin pfáift"],["auf dem Holzweg sein","estar equivocado","🪵","auf deem jóltsveek zain"]],
  r:{t:"Dichos alemanes",x:"Los alemanes usan muchísimo estos dichos en la conversación. Aprendelos como bloques con su situación. Muchos tienen animales (Schwein) y comida (Wurst, Tomaten).",tabla:[["Ich drücke dir die Daumen!","¡Te deseo suerte!"],["Da hast du Schwein gehabt!","¡Qué suerte tuviste!"],["Ich habe die Nase voll.","Estoy harto."],["Das ist nicht mein Bier.","No es asunto mío."],["Alles hat ein Ende, nur die Wurst hat zwei.","Todo tiene un final, solo la salchicha tiene dos."]]},
  c:[["Viel Glück! Ich drücke dir die ___!",["Daumen","Finger","Hände"],"¡Mucha suerte! ¡Cruzo los dedos!","Dicho: die Daumen drücken."],["Das ist mir ___. Mach, was du willst.",["Wurst","Käse","Brot"],"Me da igual. Hacé lo que quieras.","Dicho: Das ist mir Wurst."],["Du hast den Lotto gewonnen? Du hast ___ gehabt!",["Schwein","Hund","Glück gehabt"],"¿Ganaste la lotería? ¡Qué suerte tuviste!","Dicho: Schwein haben."],["Ich habe die ___ voll von diesem Wetter.",["Nase","Hand","Mund"],"Estoy harto de este clima.","Dicho: die Nase voll haben."]],
  d:[["Verstehst du Quantenphysik?","¿Entendés física cuántica?",[["Nein, da verstehe ich nur Bahnhof.",null],["Nein, da verstehe ich nur Flughafen.","El dicho es con Bahnhof."],["Nein, ich verstehe den Bahnhof.","Se dice: nur Bahnhof verstehen."]]],
     ["Ich habe den Zug gerade noch erwischt!","¡Alcancé el tren justo!",[["Da hast du Schwein gehabt!",null],["Da hast du Schwein gewesen!","Participio de haben: gehabt."],["Da bist du Schwein!","😄 Eso es un insulto. Se dice: Schwein gehabt."]]],
     ["Welche Pizza willst du?","¿Qué pizza querés?",[["Das ist mir Wurst.",null],["Das ist mich Wurst.","Dativo: mir."],["Ich bin Wurst.","😄 Eso es «soy una salchicha»."]]]]},
