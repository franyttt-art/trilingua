 {id:"en53", lvl:"C1", ic:"🔄", t:"Nunca había visto…", sub:"inversión enfática",
  h:[["A","Never have I seen such a disorganised event.","Nunca vi un evento tan desorganizado."],["B","Not only was it late, but it was also overpriced.","No solo empezó tarde, sino que además era carísimo."],["A","Hardly had we sat down when the speaker left.","Apenas nos sentamos, el orador se fue."],["B","Under no circumstances will I pay for that again.","Bajo ninguna circunstancia vuelvo a pagar por eso."],["A","Little did they know we would write a review.","Poco sabían que íbamos a escribir una reseña."],["B","Rarely do I agree with you, but this time I do.","Rara vez coincido con vos, pero esta vez sí."]],
  v:[["never have I…","nunca he…","🚫","néver jav ai"],["not only… but also","no solo… sino también","➕","not óunli bat ólsou"],["hardly… when","apenas… cuando","⏱️","járdli uen"],["no sooner… than","no bien… que","⚡","nóu súner dan"],["under no circumstances","bajo ninguna circunstancia","⛔","ánder nóu sérkamstansis"],["little did I know","poco sabía yo","🤫","lítol did ai nóu"],["rarely","rara vez","🦄","rérli"],["overpriced","carísimo, sobrevaluado","💸","ouverpráist"],["disorganised","desorganizado","🌀","disórganaisd"],["review","reseña","⭐","riviú"]],
  r:{t:"Inversión para dar énfasis",x:"En inglés formal o dramático, ciertas expresiones negativas o restrictivas al principio invierten el orden, como en una pregunta: Never HAVE I seen… / Not only WAS it… / Rarely DO I… Si no hay auxiliar, se agrega do/does/did.",tabla:[["Never have I felt so tired.","Nunca me sentí tan cansado."],["Not only is it cheap, but it's also good.","No solo es barato, sino que además es bueno."],["Hardly had I arrived when it started.","Apenas llegué, empezó."],["No sooner had she left than he called.","No bien se fue, él llamó."],["Rarely does he apologise.","Rara vez pide perdón."]]},
  c:[["Never ___ I heard such nonsense.",["have","I have","did"],"Nunca escuché semejante disparate.","Inversión: have I."],["Not only ___ he late, but he was also rude.",["was","he was","did"],"No solo llegó tarde, sino que además fue grosero.","Inversión: was he."],["Rarely ___ she go out.",["does","she does","is"],"Rara vez sale.","Sin auxiliar: does she go."],["Hardly had we started ___ it began to rain.",["when","than","that"],"Apenas empezamos, se largó a llover.","hardly … when."]],
  d:[["Was the hotel good?","¿Estaba bueno el hotel?",[["Never have I stayed in such a dirty place.",null],["Never I have stayed in such a dirty place.","Inversión: Never have I…"],["Never did I stayed there.","Después de did, infinitivo: stay."]]],
     ["Will you accept the offer?","¿Vas a aceptar la oferta?",[["Under no circumstances will I accept it.",null],["Under no circumstances I will accept it.","Inversión: will I accept."],["Under no circumstance I accept.","Se dice: Under no circumstances will I accept it."]]],
     ["What happened after you left?","¿Qué pasó después de que te fuiste?",[["No sooner had I left than the fight started.",null],["No sooner I had left when the fight started.","no sooner had I … than."],["No sooner had I left when the fight started.","no sooner va con than."]]]]},
 {id:"en54", lvl:"C1", ic:"🔦", t:"Lo que necesito es…", sub:"cleft sentences",
  h:[["A","What I really need is a long holiday.","Lo que realmente necesito son unas vacaciones largas."],["B","It was your boss who suggested it, wasn't it?","Fue tu jefe el que lo sugirió, ¿no?"],["A","No, it was my doctor. What worries him is my stress.","No, fue mi médico. Lo que le preocupa es mi estrés."],["B","All you need to do is ask for time off.","Lo único que tenés que hacer es pedir días."],["A","The thing is, we're launching a product next month.","El tema es que lanzamos un producto el mes que viene."],["B","What you're doing is putting work before your health.","Lo que estás haciendo es poner el trabajo antes que tu salud."]],
  v:[["What I need is…","lo que necesito es…","🔦","uat ai niid is"],["It was… who…","fue… quien…","☝️","it uos … ju"],["All you need to do is…","lo único que tenés que hacer es…","✅","ol iu niid tu du is"],["The thing is…","el tema es que…","💬","de zing is"],["The reason why…","la razón por la que…","❓","de ríson uái"],["time off","días libres","🏖️","táim of"],["worry","preocupar","😟","uári"],["suggest","sugerir","💡","sachést"],["put before","anteponer","⬆️","put bifór"],["emphasis","énfasis","❗","émfasis"]],
  r:{t:"Oraciones hendidas",x:"Sirven para destacar una parte de la frase. What-cleft: What + sujeto + verbo + is/was… (What I want is peace). It-cleft: It is/was + lo destacado + who/that… (It was Ana who called). También: All I did was… / The reason why… is that…",tabla:[["What I love is the food.","Lo que me encanta es la comida."],["It was John who broke it.","Fue John el que lo rompió."],["It's the price that worries me.","Es el precio lo que me preocupa."],["All I did was ask.","Lo único que hice fue preguntar."],["The reason why I left is that…","La razón por la que me fui es que…"]]},
  c:[["___ I need is some rest.",["What","That","Which"],"Lo que necesito es descansar.","What-cleft."],["It was Maria ___ found the error.",["who","what","which"],"Fue María la que encontró el error.","Persona: who."],["All I did ___ ask a question.",["was","is to","did"],"Lo único que hice fue hacer una pregunta.","All I did was + verbo."],["It's the noise ___ bothers me.",["that","what","who"],"Es el ruido lo que me molesta.","It-cleft con cosa: that."]],
  d:[["Do you like living in London?","¿Te gusta vivir en Londres?",[["What I don't like is the weather.",null],["What I don't like it is the weather.","Sobra it: What I don't like is…"],["That I don't like is the weather.","Se empieza con What."]]],
     ["Did Tom send the email?","¿Tom mandó el mail?",[["No, it was Sarah who sent it.",null],["No, it was Sarah which sent it.","Persona: who."],["No, was Sarah who sent it.","Falta it: It was Sarah…"]]],
     ["How can I fix it?","¿Cómo lo arreglo?",[["All you have to do is restart it.",null],["All you have to do is restarting it.","Después de is: verbo base, restart."],["All what you have to do is restart it.","Se dice: All you have to do…"]]]]},
 {id:"en55", lvl:"C1", ic:"🔀", t:"Si hubiera… ahora sería…", sub:"condicionales mixtos",
  h:[["A","If I had studied medicine, I'd be a doctor now.","Si hubiera estudiado medicina, ahora sería médico."],["B","And if you weren't so squeamish, you would have finished the course.","Y si no fueras tan impresionable, habrías terminado la carrera."],["A","True. If I had taken that job in Berlin, I'd speak fluent German by now.","Cierto. Si hubiera aceptado ese trabajo en Berlín, ya hablaría alemán fluido."],["B","But then you wouldn't have met me.","Pero entonces no me habrías conocido."],["A","Exactly. If I were smarter, I would have gone.","Exacto. Si fuera más inteligente, habría ido."],["B","Very funny.","Muy gracioso."]],
  v:[["squeamish","impresionable (con la sangre)","🩸","skuímish"],["fluent","fluido","🗣️","flúent"],["by now","a esta altura","⏱️","bai náu"],["course","carrera, curso","🎓","kors"],["hindsight","visto en retrospectiva","🔙","jáindsait"],["turn down","rechazar","👎","tern dáun"],["outcome","resultado","🎯","áutkam"],["otherwise","si no, de lo contrario","↩️","áderuais"],["consequence","consecuencia","⛓️","kónsikuens"],["mixed","mixto","🔀","mikst"]],
  r:{t:"Condicionales mixtos",x:"Mezclan tiempos: pasado imaginario → consecuencia presente: If + had + participio, would + verbo (If I had studied, I'd be a doctor now). Presente imaginario → consecuencia pasada: If + pasado, would have + participio (If I were braver, I would have gone).",tabla:[["If I had saved, I'd be rich now.","Si hubiera ahorrado, ahora sería rico."],["If she hadn't moved, she'd live here.","Si no se hubiera mudado, viviría acá."],["If I spoke French, I'd have got the job.","Si hablara francés, habría conseguido el trabajo."],["If he weren't lazy, he'd have finished.","Si no fuera vago, habría terminado."]]},
  c:[["If I had taken the job, I ___ in Paris now.",["would live","would have lived","lived"],"Si hubiera aceptado el trabajo, ahora viviría en París.","Consecuencia presente: would + verbo."],["If she ___ so shy, she would have spoken.",["weren't","hadn't been","isn't"],"Si no fuera tan tímida, habría hablado.","Rasgo presente: weren't."],["If we ___ the train, we'd be home now.",["hadn't missed","didn't miss","wouldn't miss"],"Si no hubiéramos perdido el tren, ahora estaríamos en casa.","Pasado: hadn't missed."],["If I knew him, I ___ him yesterday.",["would have called","would call","called"],"Si lo conociera, lo habría llamado ayer.","Consecuencia pasada: would have called."]],
  d:[["Why aren't you a musician?","¿Por qué no sos músico?",[["If I had practised more, I'd be one now.",null],["If I practised more, I'd have been one now.","Pasado → presente: If I had practised, I'd be…"],["If I would have practised, I'd be one.","Después de if no va would: had practised."]]],
     ["Why didn't you go to the party?","¿Por qué no fuiste a la fiesta?",[["If I weren't so antisocial, I would have gone.",null],["If I wasn't so antisocial, I'd go yesterday.","Consecuencia pasada: would have gone."],["If I hadn't been antisocial, I'd go.","Consecuencia pasada: would have gone."]]],
     ["Do you regret not learning English earlier?","¿Te arrepentís de no haber aprendido inglés antes?",[["Yes. If I had learnt it, I'd have a better job now.",null],["Yes. If I learnt it, I'd have a better job.","Pasado: If I had learnt it."],["Yes. If I had learnt it, I'd had a better job.","Consecuencia presente: I'd have."]]]]},
 {id:"en56", lvl:"C1", ic:"🎚️", t:"No hacía falta", sub:"needn't have, had better, would rather",
  h:[["A","You needn't have bought flowers. But thank you!","No hacía falta que compraras flores. ¡Pero gracias!"],["B","I'd rather you didn't tell anyone. I'm trying to save money.","Prefiero que no le cuentes a nadie. Estoy tratando de ahorrar."],["A","You'd better not spend so much then.","Entonces mejor no gastes tanto."],["B","I could have bought chocolates, but I know you're on a diet.","Podría haber comprado chocolates, pero sé que estás a dieta."],["A","You might have asked me first.","Podrías haberme preguntado antes."],["B","Next time I'd sooner bring you a salad.","La próxima prefiero traerte una ensalada."]],
  v:[["needn't have","no hacía falta (pero lo hice)","🤷","níident jav"],["didn't need to","no hizo falta (y no lo hice)","🙅","dídent niid tu"],["had better","más vale que","⚠️","jad béter"],["would rather","preferiría","🔀","uud ráder"],["would sooner","preferiría (informal)","🔀","uud súner"],["might have","podrías haber (reproche)","😒","máit jav"],["could have","podría haber","💭","kud jav"],["on a diet","a dieta","🥗","on a dáiet"],["save money","ahorrar","🐷","séiv máni"],["be supposed to","se supone que","📋","bi supóusd tu"]],
  r:{t:"Matices de los modales",x:"needn't have + participio = lo hiciste pero no hacía falta. didn't need to = no hizo falta (y probablemente no lo hiciste). had better + verbo = consejo fuerte con advertencia. would rather + verbo; would rather + persona + pasado (I'd rather you didn't).",tabla:[["You needn't have come.","No hacía falta que vinieras."],["I didn't need to pay.","No tuve que pagar."],["You'd better hurry.","Más vale que te apures."],["I'd rather stay home.","Prefiero quedarme en casa."],["I'd rather you didn't smoke here.","Prefiero que no fumes acá."]]},
  c:[["You ___ have cooked. We ordered pizza.",["needn't","mustn't","couldn't"],"No hacía falta que cocinaras. Pedimos pizza.","Innecesario pero hecho: needn't have."],["You'd better ___ late again.",["not be","not to be","don't be"],"Más vale que no llegues tarde otra vez.","had better not + verbo."],["I'd rather you ___ tell her.",["didn't","don't","won't"],"Prefiero que no le digas.","would rather + persona + pasado."],["I'd rather ___ at home tonight.",["stay","to stay","staying"],"Prefiero quedarme en casa esta noche.","would rather + verbo base."]],
  d:[["I brought you an umbrella.","Te traje un paraguas.",[["Thanks, but you needn't have. It's sunny.",null],["Thanks, but you mustn't have.","Innecesario: needn't have."],["Thanks, but you didn't need.","Mejor: you needn't have."]]],
     ["Can I smoke in here?","¿Puedo fumar acá adentro?",[["I'd rather you didn't.",null],["I'd rather you don't.","would rather + persona + pasado: didn't."],["I'd rather you not to.","Se dice: I'd rather you didn't."]]],
     ["The exam is tomorrow.","El examen es mañana.",[["You'd better start studying now.",null],["You'd better to start studying.","had better + verbo sin to."],["You had better started now.","had better + verbo base: start."]]]]},
 {id:"en57", lvl:"C1", ic:"🌫️", t:"Al parecer…", sub:"hedging: suavizar afirmaciones",
  h:[["A","The results seem to suggest that the campaign worked.","Los resultados parecen indicar que la campaña funcionó."],["B","It would appear so, although the data is somewhat limited.","Parecería que sí, aunque los datos son algo limitados."],["A","Arguably, it was the best campaign we've run.","Se podría decir que fue la mejor campaña que hicimos."],["B","Customers tend to respond well to humour.","Los clientes tienden a responder bien al humor."],["A","There's a chance sales could drop in winter, though.","Aunque existe la posibilidad de que las ventas bajen en invierno."],["B","To some extent, that's always the case.","Hasta cierto punto, siempre pasa."]],
  v:[["seem to","parecer","🌫️","siim tu"],["It would appear that…","parecería que…","👀","it uud apír dat"],["arguably","se podría decir que","⚖️","árguiuabli"],["tend to","tender a","📈","tend tu"],["somewhat","algo, un tanto","🔅","sámuat"],["to some extent","hasta cierto punto","📏","tu sam ekstént"],["likely","probable","🎲","láikli"],["suggest","indicar, sugerir","💡","sachést"],["presumably","presuntamente","🤔","prisiúmabli"],["it is widely believed","se cree ampliamente","🌍","it is uáidli bilívd"]],
  r:{t:"Hedging: sonar prudente y profesional",x:"En informes, papers y reuniones, las afirmaciones rotundas suenan poco rigurosas. Se suavizan con verbos (seem, appear, tend, suggest), adverbios (arguably, possibly, somewhat) y estructuras impersonales (It is likely that… / It could be argued that…).",tabla:[["The data suggests that…","Los datos indican que…"],["It is likely that prices will rise.","Es probable que los precios suban."],["It could be argued that…","Podría argumentarse que…"],["This tends to happen in winter.","Esto suele pasar en invierno."],["To a certain extent, yes.","Hasta cierto punto, sí."]]},
  c:[["The results ___ to show a clear trend.",["seem","seems to","are seem"],"Los resultados parecen mostrar una tendencia clara.","results (plural) → seem."],["It is ___ that the price will go up.",["likely","like","likely to"],"Es probable que el precio suba.","It is likely that…"],["It could be ___ that the plan failed.",["argued","argue","arguing"],"Podría argumentarse que el plan fracasó.","Pasiva: could be argued."],["People ___ to spend more in December.",["tend","tends","are tend"],"La gente tiende a gastar más en diciembre.","tend to + verbo."]],
  d:[["Did the new policy work?","¿Funcionó la nueva política?",[["It would appear that it had a positive effect.",null],["Yes, 100%, it's perfect, no doubt.","Demasiado rotundo para un informe."],["It would appear it had positive effect.","Falta a: a positive effect."]]],
     ["Is remote work more productive?","¿Es más productivo el trabajo remoto?",[["To some extent, although it depends on the person.",null],["To some extents, yes.","extent va en singular."],["In some extent, yes.","Se dice: to some extent."]]],
     ["Was it the best film of the year?","¿Fue la mejor película del año?",[["Arguably, yes.",null],["Arguing, yes.","El adverbio es: arguably."],["Arguable yes.","Adverbio: arguably."]]]]},
 {id:"en58", lvl:"C1", ic:"🧷", t:"Habiendo terminado…", sub:"participle clauses",
  h:[["A","Having finished the report, I sent it to the board.","Habiendo terminado el informe, se lo mandé al directorio."],["B","Built in 1920, our office needs renovating.","Construida en 1920, nuestra oficina necesita una remodelación."],["A","Not knowing what to say, I just smiled.","Sin saber qué decir, simplemente sonreí."],["B","Walking into the meeting, I realised I'd forgotten my laptop.","Al entrar a la reunión, me di cuenta de que me había olvidado la notebook."],["A","Given the circumstances, you did well.","Dadas las circunstancias, lo hiciste bien."],["B","Judging by your face, you're lying.","A juzgar por tu cara, estás mintiendo."]],
  v:[["having finished","habiendo terminado","✅","jáving fínisht"],["board","directorio","🏛️","bord"],["renovate","remodelar","🛠️","rénoveit"],["not knowing","sin saber","🤷","not nóuing"],["given","dado, considerando","🎁","guíven"],["judging by","a juzgar por","⚖️","cháching bai"],["realise","darse cuenta","💡","ríalais"],["circumstances","circunstancias","🌐","sérkamstansis"],["smile","sonreír","😊","smáil"],["concise","conciso","✂️","konsáis"]],
  r:{t:"Oraciones de participio",x:"Condensan una oración subordinada y suenan más escritas y concisas. -ing = acción simultánea o causa (Feeling tired, I left). having + participio = acción anterior (Having eaten, we left). participio = sentido pasivo (Written in 1850, the book…). El sujeto debe ser el mismo en las dos partes.",tabla:[["Feeling ill, she went home.","Como se sentía mal, se fue a casa."],["Having read the book, I saw the film.","Después de leer el libro, vi la película."],["Written by a child, the poem won a prize.","Escrito por un chico, el poema ganó un premio."],["Not wanting to wake him, I left quietly.","Como no quería despertarlo, me fui en silencio."]]},
  c:[["___ finished lunch, we went for a walk.",["Having","Had","Have"],"Después de almorzar, salimos a caminar.","Acción anterior: Having + participio."],["___ in 1889, the tower is iconic.",["Built","Building","Having build"],"Construida en 1889, la torre es un ícono.","Sentido pasivo: participio."],["Not ___ the answer, he stayed silent.",["knowing","known","to know"],"Sin saber la respuesta, se quedó callado.","Causa: -ing."],["___ by the results, the team celebrated.",["Encouraged","Encouraging","Encourage"],"Animado por los resultados, el equipo festejó.","Pasivo: participio."]],
  d:[["How did you feel before the speech?","¿Cómo te sentías antes del discurso?",[["Feeling nervous, I drank some water.",null],["Felt nervous, I drank some water.","Simultáneo y activo: Feeling."],["Being felt nervous, I drank water.","Se dice: Feeling nervous…"]]],
     ["When did you call the client?","¿Cuándo llamaste al cliente?",[["Having checked the numbers, I called him.",null],["Having check the numbers, I called him.","having + participio: checked."],["Had checked the numbers, I called him.","Se empieza con Having."]]],
     ["Tell me about this painting.","Contame de este cuadro.",[["Painted in 1503, it's Leonardo's most famous work.",null],["Painting in 1503, it's his most famous work.","Pasivo: Painted."],["Having painted in 1503, it's famous.","El cuadro no pintó nada: Painted in 1503."]]]]},
 {id:"en59", lvl:"C1", ic:"🎩", t:"Registro formal", sub:"conectores y verbos cultos",
  h:[["A","The project was delayed. Nevertheless, it was completed within budget.","El proyecto se atrasó. No obstante, se terminó dentro del presupuesto."],["B","Consequently, the board has approved the second phase.","En consecuencia, el directorio aprobó la segunda etapa."],["A","Moreover, we obtained funding from a new investor.","Además, obtuvimos financiación de un nuevo inversor."],["B","We must, however, address the staff shortage.","Debemos, sin embargo, atender la falta de personal."],["A","Furthermore, the deadline is approaching.","Asimismo, la fecha límite se acerca."],["B","Hence the need to recruit immediately.","De ahí la necesidad de contratar de inmediato."]],
  v:[["nevertheless","no obstante","📜","neverdelés"],["consequently","en consecuencia","➡️","kónsikuentli"],["moreover","además","➕","morróuver"],["furthermore","asimismo","➕","ferdermór"],["hence","de ahí, por lo tanto","∴","jens"],["obtain","obtener (get)","📥","obtéin"],["address","abordar, atender","🎯","adrés"],["commence","comenzar (start)","▶️","koméns"],["shortage","falta, escasez","📉","shórtich"],["recruit","reclutar, contratar","🧑‍💼","rikrúut"]],
  r:{t:"Informal vs formal",x:"El inglés tiene dos capas de vocabulario: palabras cortas de origen germánico (get, start, need, help) y palabras largas de origen latino (obtain, commence, require, assist). En escritura formal se prefieren las latinas… ¡que para un hispanohablante son las fáciles!",tabla:[["get → obtain / receive","obtener / recibir"],["start → commence","comenzar"],["need → require","requerir"],["help → assist","asistir, ayudar"],["but → however / nevertheless","sin embargo / no obstante"],["so → therefore / consequently","por lo tanto / en consecuencia"]]},
  c:[["The meeting will ___ at 9 a.m.",["commence","commencing","starts"],"La reunión comenzará a las 9.","Formal: commence."],["It was expensive. ___, we bought it.",["Nevertheless","Moreover","Hence"],"Era caro. No obstante, lo compramos.","Contraste: Nevertheless."],["Sales fell; ___, profits decreased.",["consequently","nevertheless","although"],"Las ventas bajaron; en consecuencia, las ganancias disminuyeron.","Consecuencia: consequently."],["Applicants are ___ to submit a CV.",["required","needed","requiring"],"Se requiere que los postulantes presenten un CV.","Formal: be required to."]],
  d:[["How do you say «we got the money» formally?","¿Cómo decís «conseguimos la plata» formalmente?",[["We obtained the necessary funding.",null],["We got the cash, man.","Muy informal."],["We obtainated the funding.","El verbo es obtain → obtained."]]],
     ["The product is cheap and it's also eco-friendly.","El producto es barato y además ecológico.",[["The product is affordable. Moreover, it is eco-friendly.",null],["The product is affordable. However, it is eco-friendly.","however es contraste; para sumar: Moreover."],["The product is affordable, moreover is eco-friendly.","Falta el sujeto: Moreover, it is…"]]],
     ["How would you write «we need more staff»?","¿Cómo escribirías «necesitamos más personal»?",[["Additional staff will be required.",null],["We gotta get more people.","Muy informal para un informe."],["Additional staffs are required.","staff no suele llevar s en este uso."]]]]},
 {id:"en60", lvl:"C1", ic:"🏢", t:"Jerga de oficina", sub:"business idioms",
  h:[["A","Let's touch base on Monday about the proposal.","Hablemos el lunes sobre la propuesta."],["B","Sure. Can you give me a ballpark figure for the budget?","Dale. ¿Me das una cifra aproximada del presupuesto?"],["A","Around fifty thousand. But we need to think outside the box.","Unos cincuenta mil. Pero tenemos que pensar fuera de lo común."],["B","Let's not reinvent the wheel. The old plan worked.","No reinventemos la rueda. El plan viejo funcionó."],["A","Fine, but the ball is in your court now.","Bueno, pero ahora la pelota está de tu lado."],["B","I'll get the ball rolling today.","Hoy pongo las cosas en marcha."]],
  v:[["touch base","ponerse en contacto, hablar","📞","tach béis"],["ballpark figure","cifra aproximada","🔢","bólpark fíguer"],["think outside the box","pensar fuera de lo común","📦","zink autsáid de boks"],["reinvent the wheel","reinventar la rueda","🛞","riinvént de uíil"],["the ball is in your court","la pelota está de tu lado","🎾","de bol is in ior kort"],["get the ball rolling","poner en marcha","⚽","guet de bol róuling"],["on the same page","en la misma sintonía","📄","on de séim péich"],["win-win","todos ganan","🏆","uin uin"],["cut corners","hacer las cosas a medias","✂️","kat kórners"],["back to square one","volver a foja cero","🔙","bak tu skuér uan"]],
  r:{t:"Idioms de negocios",x:"En empresas angloparlantes estas frases se usan todo el tiempo en mails y reuniones. Entenderlas es clave; usarlas con moderación te hace sonar natural (abusar de ellas suena a vendedor de humo).",tabla:[["Let's touch base next week.","Hablemos la semana que viene."],["Are we on the same page?","¿Estamos en la misma sintonía?"],["It's a win-win situation.","Todos ganan."],["Don't cut corners.","No lo hagas a medias."],["We're back to square one.","Volvimos a foja cero."]]},
  c:[["Let's touch ___ tomorrow.",["base","bases","basis"],"Hablemos mañana.","Idiom: touch base."],["Can you give me a ___ figure?",["ballpark","baseball","football"],"¿Me das una cifra aproximada?","Idiom: ballpark figure."],["We need to think outside the ___.",["box","square","wall"],"Tenemos que pensar fuera de lo común.","Idiom: outside the box."],["The deal failed. We're back to square ___.",["one","zero","first"],"El trato fracasó. Volvimos a foja cero.","Idiom: square one."]],
  d:[["Before we continue, are we all on the same page?","Antes de seguir, ¿estamos todos en la misma sintonía?",[["Yes, everything is clear.",null],["Yes, page 12.","😄 No es una página literal."],["No, I'm on another book.","Es una expresión: estar de acuerdo."]]],
     ["I sent them our offer.","Les mandé nuestra oferta.",[["Great, so the ball is in their court now.",null],["Great, so the ball is in their garden.","El idiom es «in their court»."],["Great, the ball is court.","Se dice: the ball is in their court."]]],
     ["Should we skip the quality checks to save time?","¿Salteamos los controles de calidad para ahorrar tiempo?",[["No, we shouldn't cut corners.",null],["No, we shouldn't cut circles.","El idiom es «cut corners»."],["No, we shouldn't corner the cut.","Se dice: cut corners."]]]]},
 {id:"en61", lvl:"C1", ic:"🎤", t:"Debatir y persuadir", sub:"argumentar con elegancia",
  h:[["A","I'd argue that remote work boosts productivity.","Yo diría que el trabajo remoto aumenta la productividad."],["B","With all due respect, the evidence is far from conclusive.","Con todo respeto, la evidencia está lejos de ser concluyente."],["A","Granted, it doesn't suit everyone. Even so, the trend is clear.","Es cierto que no le sirve a todos. Aun así, la tendencia es clara."],["B","That may well be true, but what about team culture?","Puede que sea cierto, pero ¿qué pasa con la cultura del equipo?"],["A","That's a valid concern. Let me put it another way.","Es una preocupación válida. Dejame decirlo de otra forma."],["B","I take your point. Perhaps a hybrid model is the answer.","Acepto tu argumento. Quizás un modelo híbrido sea la respuesta."]],
  v:[["I'd argue that…","yo diría que…","🎤","aid árguiu dat"],["With all due respect","con todo respeto","🎩","uiz ol diú rispékt"],["far from","lejos de","↔️","far from"],["conclusive","concluyente","✅","konklúsiv"],["granted","es cierto que","👍","gránted"],["even so","aun así","↩️","íven sóu"],["valid concern","preocupación válida","⚠️","válid konsérn"],["put it another way","decirlo de otra forma","🔄","put it anáder uéi"],["I take your point","acepto tu argumento","🤝","ai téik ior póint"],["boost","impulsar, aumentar","🚀","buust"]],
  r:{t:"Estrategia del buen debate",x:"1) Afirmá con suavidad (I'd argue that…). 2) Concedé algo al otro (Granted, … / That may well be true, but…). 3) Contraatacá (Even so, … / Nevertheless, …). Conceder primero hace tu argumento más convincente.",tabla:[["I'd argue that…","Yo diría que…"],["That may well be true, but…","Puede que sea cierto, pero…"],["Granted, … Even so, …","Es cierto que… Aun así…"],["I take your point, however…","Acepto tu punto; sin embargo…"],["Let me put it another way.","Dejame decirlo de otra forma."]]},
  c:[["I'd ___ that prices are too high.",["argue","argument","arguing"],"Yo diría que los precios son demasiado altos.","I'd argue that…"],["With all ___ respect, you're wrong.",["due","do","dew"],"Con todo respeto, estás equivocado.","Fórmula: with all due respect."],["That may ___ be true, but it's risky.",["well","good","very"],"Puede que sea cierto, pero es arriesgado.","may well = bien puede."],["The evidence is far ___ conclusive.",["from","of","to"],"La evidencia está lejos de ser concluyente.","far from."]],
  d:[["Social media is destroying democracy.","Las redes sociales están destruyendo la democracia.",[["That may well be true, but they also give people a voice.",null],["You are totally stupid.","Eso no es debatir, es pelear 😄"],["That may good be true, but…","Se dice: That may well be true."]]],
     ["Do you see my point?","¿Entendés mi punto?",[["I take your point, but I still disagree.",null],["I take your point, but I still disagree with.","Sobra with al final."],["I catch your point.","Se dice: I take your point."]]],
     ["Your argument isn't clear.","Tu argumento no es claro.",[["Let me put it another way.",null],["Let me put it other way.","Falta another: another way."],["Let me to put it another way.","let me + verbo sin to."]]]]},
 {id:"en62", lvl:"C1", ic:"⚖️", t:"Es esencial que…", sub:"subjuntivo inglés",
  h:[["A","The doctor recommended that he stop smoking immediately.","El médico recomendó que dejara de fumar de inmediato."],["B","It's essential that every patient be informed of the risks.","Es esencial que cada paciente esté informado de los riesgos."],["A","I insist that Felipe attend the clinic.","Insisto en que Felipe vaya a la clínica."],["B","It's high time he quit.","Ya es hora de que deje."],["A","If he were to quit, he'd live longer.","Si llegara a dejar, viviría más."],["B","Were he to listen, I'd be amazed.","Si llegara a escuchar, me sorprendería."]],
  v:[["recommend that","recomendar que","💡","rekoménd dat"],["insist that","insistir en que","☝️","insíst dat"],["It's essential that","es esencial que","❗","its esénshal dat"],["It's high time","ya es hora de que","⏰","its jai táim"],["If he were to…","si llegara a…","🎲","if ji uer tu"],["Were he to…","si llegara a (formal)","🎩","uer ji tu"],["demand","exigir","📢","dimánd"],["propose","proponer","📝","propóus"],["be informed","estar informado","📰","bi infórmd"],["attend","asistir a","🏥","aténd"]],
  r:{t:"El subjuntivo en inglés",x:"Después de verbos como recommend, suggest, insist, demand y de expresiones como It's essential/vital that…, el inglés formal usa el verbo en forma base para todas las personas: that he BE, that she STOP (sin -s). It's (high) time + pasado. Condición formal: If … were to / Were … to.",tabla:[["I suggest that he see a doctor.","Sugiero que vea a un médico."],["It's vital that she be on time.","Es vital que llegue a tiempo."],["They demanded that he resign.","Exigieron que renunciara."],["It's time we left.","Es hora de que nos vayamos."],["Were it to rain, we'd cancel.","Si llegara a llover, cancelaríamos."]]},
  c:[["I suggest that she ___ a lawyer.",["consult","consults","consulted"],"Sugiero que consulte a un abogado.","Subjuntivo: forma base."],["It's essential that everyone ___ present.",["be","is","are"],"Es esencial que todos estén presentes.","Subjuntivo de be: be."],["It's high time you ___ a job.",["found","find","will find"],"Ya es hora de que consigas trabajo.","It's time + pasado."],["___ he to call, tell him I'm out.",["Were","If","Was"],"Si llegara a llamar, decile que salí.","Inversión formal: Were he to…"]],
  d:[["What did the committee decide?","¿Qué decidió el comité?",[["They recommended that the plan be revised.",null],["They recommended that the plan is revised.","Subjuntivo: be revised."],["They recommended the plan to be revise.","Se dice: that the plan be revised."]]],
     ["The kids are still up at midnight.","Los chicos siguen despiertos a medianoche.",[["It's high time they went to bed.",null],["It's high time they go to bed.","It's time + pasado: went."],["It's high time they will go to bed.","It's time + pasado: went."]]],
     ["What should he do about his cough?","¿Qué debería hacer con su tos?",[["I'd insist that he stop smoking.",null],["I'd insist that he stops smoking.","Formal: stop, sin -s."],["I'd insist him to stop smoking.","Se dice: insist that he stop."]]]]},
 {id:"en63", lvl:"C1", ic:"💥", t:"Énfasis", sub:"do, so, such, cuanto más…",
  h:[["A","I do like your new flat!","¡Me gusta mucho tu departamento nuevo!"],["B","Thanks. It was such a bargain.","Gracias. Fue una ganga total."],["A","The view is so beautiful that I'd never leave.","La vista es tan linda que nunca me iría."],["B","The more I live here, the more I love it.","Cuanto más vivo acá, más me gusta."],["A","I did tell you it was a good idea.","Te dije que era buena idea, eh."],["B","You did. The sooner I listen to you, the better.","Es verdad. Cuanto antes te haga caso, mejor."]],
  v:[["I do like…","sí que me gusta…","💥","ai du láik"],["such a","tan, semejante","😲","sach a"],["so … that","tan … que","➡️","sóu … dat"],["bargain","ganga","🏷️","bárguen"],["the more…, the more…","cuanto más…, más…","📈","de mor … de mor"],["the sooner, the better","cuanto antes, mejor","⏩","de súner de béter"],["view","vista","🌇","viú"],["indeed","en efecto","✔️","indíid"],["by far","por lejos","🏁","bai far"],["whatsoever","en absoluto","🚫","uatsouéver"]],
  r:{t:"Recursos de énfasis",x:"do/does/did + verbo en afirmativa refuerza (I DO love it). so + adjetivo; such (a) + adjetivo + sustantivo (so good / such a good film). Doble comparativo: The + comparativo …, the + comparativo… También: by far the best, no … whatsoever.",tabla:[["I did call you!","¡Te llamé, en serio!"],["It was so cold that we left.","Hacía tanto frío que nos fuimos."],["It was such a cold day.","Fue un día tan frío."],["The older I get, the wiser I am.","Cuanto más grande soy, más sabio."],["It's by far the best.","Es por lejos el mejor."]]},
  c:[["It was ___ a good film!",["such","so","very"],"¡Fue tan buena película!","such a + adj + sustantivo."],["It was ___ hot that we stayed in.",["so","such","such a"],"Hacía tanto calor que nos quedamos adentro.","so + adjetivo + that."],["The more you practise, the ___ you get.",["better","best","good"],"Cuanto más practicás, mejor te sale.","the + comparativo."],["I ___ lock the door, I promise!",["did","do did","was"],"¡Cerré la puerta con llave, lo prometo!","Énfasis en pasado: did + verbo."]],
  d:[["You didn't call me.","No me llamaste.",[["I did call you! Twice!",null],["I did called you!","did + verbo base: call."],["I called did you!","Se dice: I did call you."]]],
     ["How was the concert?","¿Cómo estuvo el recital?",[["It was such an amazing night.",null],["It was so an amazing night.","Con sustantivo: such an amazing night."],["It was such amazing night.","Falta an: such an amazing night."]]],
     ["When should we leave?","¿Cuándo deberíamos salir?",[["The sooner, the better.",null],["More soon, more better.","Se dice: The sooner, the better."],["The soon, the good.","Doble comparativo: The sooner, the better."]]]]},
 {id:"en64", lvl:"C1", ic:"🎭", t:"Matices", sub:"palabras que confunden",
  h:[["A","Actually, I'm not sure the meeting is today.","En realidad, no estoy seguro de que la reunión sea hoy."],["B","Eventually we'll find out. I'll check the schedule.","Al final nos vamos a enterar. Reviso la agenda."],["A","I'm sensible enough to double-check, you know.","Soy lo suficientemente sensato como para verificar, eh."],["B","But you're too sensitive when I remind you.","Pero sos muy sensible cuando te lo recuerdo."],["A","That's not fair. I'm just embarrassed I forgot.","No es justo. Solo me da vergüenza haberme olvidado."],["B","Relax. Nobody's perfect.","Tranqui. Nadie es perfecto."]],
  v:[["actually","en realidad (no «actualmente»)","⚠️","ákchuali"],["currently","actualmente","📅","kérentli"],["eventually","finalmente (no «eventualmente»)","🏁","ivénchuali"],["sensible","sensato (no «sensible»)","🧠","sénsibol"],["sensitive","sensible","🥺","sénsitiv"],["embarrassed","avergonzado (no «embarazada»)","😳","embárast"],["pregnant","embarazada","🤰","prégnant"],["library","biblioteca (no «librería»)","📚","láibreri"],["bookshop","librería","🏪","búkshop"],["assist","ayudar (no «asistir» a un lugar)","🤝","asíst"]],
  r:{t:"Falsos amigos",x:"Palabras que parecen españolas pero significan otra cosa. Son la trampa número uno del hispanohablante avanzado. actually = en realidad; eventually = al final; sensible = sensato; embarrassed = avergonzado; library = biblioteca; attend = asistir a un lugar; assist = ayudar.",tabla:[["Actually, I disagree.","En realidad, no estoy de acuerdo."],["I'm currently unemployed.","Actualmente estoy desempleado."],["Eventually, he agreed.","Al final, aceptó."],["She's very sensible.","Es muy sensata."],["I attended the meeting.","Asistí a la reunión."]]},
  c:[["I ___ work from home. (en este momento de mi vida)",["currently","actually","eventually"],"Actualmente trabajo desde casa.","actualmente = currently."],["___, I don't like coffee.",["Actually","Currently","Eventually"],"En realidad, no me gusta el café.","en realidad = actually."],["I was so ___ when I fell.",["embarrassed","pregnant","embarrassing"],"Me dio tanta vergüenza cuando me caí.","avergonzado = embarrassed."],["I borrowed a book from the ___.",["library","bookshop","librery"],"Saqué un libro de la biblioteca.","biblioteca = library."]],
  d:[["Do you work in the city centre?","¿Trabajás en el centro?",[["Currently, yes. I might move next year.",null],["Actually yes, in this moment.","«actualmente» es currently."],["Eventually yes, now.","eventually es «al final»."]]],
     ["Why is your face red?","¿Por qué tenés la cara roja?",[["I'm embarrassed. I called my boss «mum».",null],["I'm pregnant. I called my boss «mum».","😄 pregnant es embarazada."],["I'm embarrassing.","embarrassing es «vergonzoso» (lo que da vergüenza)."]]],
     ["Did you go to the conference?","¿Fuiste a la conferencia?",[["Yes, I attended it last week.",null],["Yes, I assisted it last week.","assist = ayudar. Ir: attend."],["Yes, I assisted to it.","Ir a un evento: attend."]]]]},

  r:{t:"Verbos separables y «um» / «am»",x:"Algunos verbos se parten en dos: «aufstehen» → «Ich stehe um sieben auf» (el prefijo va al final). La hora va con «um» y los días con «am».",tabla:[["aufstehen","Ich stehe um 7 auf."],["anrufen","Er ruft mich an."],["um sieben Uhr","a las siete"],["am Montag","el lunes"]]},
  c:[["Ich stehe um sieben ___.",["auf","an","aus"],"Me levanto a las siete.","aufstehen: el «auf» va al final."],["___ Sonntag schlafe ich.",["Am","Um","Im"],"El domingo duermo.","Días: am."],["Ich arbeite ___ acht Uhr.",["um","am","an"],"Trabajo a las ocho.","Horas: um."],["Was ___ du am Samstag?",["machst","mache","macht"],"¿Qué hacés el sábado?","du → machst."]],
  d:[["Wie spät ist es?","¿Qué hora es?",[["Es ist acht Uhr.",null],["Es ist acht Stunden.","«Stunden» son horas de duración; la hora es «acht Uhr»."],["Ich bin acht.","Eso es «tengo ocho años»."]]],
     ["Wann stehst du auf?","¿A qué hora te levantás?",[["Ich stehe um sieben auf.",null],["Ich aufstehe um sieben.","El verbo se separa: Ich stehe … auf."],["Ich stehe am sieben auf.","Para horas: um."]]],
     ["Was machst du am Sonntag?","¿Qué hacés el domingo?",[["Am Sonntag schlafe ich.",null],["Am Sonntag ich schlafe.","El verbo va segundo: Am Sonntag schlafe ich."],["Um Sonntag schlafe ich.","Días: am."]]]]},
 {id:"de8", ic:"🍕", t:"Comida y gustos", sub:"Ich esse gern Pizza",
  h:[["A","Isst du gern Pizza?","¿Te gusta comer pizza?"],["B","Ja, ich liebe Pizza! Und du?","¡Sí, amo la pizza! ¿Y vos?"],["A","Ich esse gern Pizza, aber ich esse nicht gern Fisch.","Me gusta la pizza, pero no me gusta el pescado."],["B","Wirklich? Ich esse jeden Freitag Fisch.","¿En serio? Como pescado todos los viernes."],["A","Trinkst du Wein?","¿Tomás vino?"],["B","Nein, ich trinke Bier.","No, tomo cerveza."]],
  v:[["essen","comer","🍽️","ésen"],["trinken","beber, tomar","🥤","trínken"],["gern","con gusto (me gusta)","👍","guern"],["der Fisch","el pescado","🐟","der fish"],["das Fleisch","la carne","🥩","das fláish"],["das Hähnchen","el pollo","🍗","das jénjen"],["das Gemüse","la verdura","🥦","das guemüüse"],["der Wein","el vino","🍷","der váin"],["das Bier","la cerveza","🍺","das bíir"],["nicht","no (niega)","🚫","nijt"]],
  r:{t:"«gern» para gustos y «nicht» para negar",x:"Para decir que te gusta HACER algo se agrega «gern» después del verbo: «Ich esse gern Pizza». Para negar se usa «nicht». Ojo: essen es irregular: du isst, er isst.",tabla:[["Ich esse gern Pizza.","Me gusta comer pizza."],["Ich trinke nicht gern Wein.","No me gusta tomar vino."],["du isst · er isst","vos comés · él come"],["Ich esse keinen Fisch.","No como pescado."]]},
  c:[["Ich trinke ___ Kaffee.",["gern","gut","lieb"],"Me gusta tomar café.","Para gustos: gern."],["Du ___ viel Fleisch.",["isst","esst","esse"],"Comés mucha carne.","essen es irregular: du isst."],["Er trinkt ___ gern Bier.",["nicht","kein","nein"],"No le gusta tomar cerveza.","Para negar el verbo: nicht."],["___ du Wein?",["Trinkst","Trinkt","Trinke"],"¿Tomás vino?","du → trinkst."]],
  d:[["Isst du gern Gemüse?","¿Te gustan las verduras?",[["Ja, ich esse gern Gemüse.",null],["Ja, ich gern esse Gemüse.","El verbo va segundo: ich esse gern…"],["Ja, ich mag essen gern.","Sobra «mag»: Ich esse gern Gemüse."]]],
     ["Trinkst du Wein?","¿Tomás vino?",[["Nein, ich trinke Bier.",null],["Nein, ich trinkst Bier.","Con ich: trinke."],["Nein, ich nicht trinke.","«nicht» va después del verbo."]]],
     ["Isst dein Bruder Fleisch?","¿Tu hermano come carne?",[["Ja, er isst viel Fleisch.",null],["Ja, er esst viel Fleisch.","essen es irregular: er isst."],["Ja, sie isst viel Fleisch.","Es tu hermano: er."]]]]},
 {id:"de9", ic:"🏠", t:"La casa", sub:"Die Katze ist unter dem Tisch",
  h:[["A","Willkommen in meiner neuen Wohnung!","¡Bienvenido a mi departamento nuevo!"],["B","Wow, sie ist groß! Wie viele Zimmer gibt es?","¡Guau, es grande! ¿Cuántas habitaciones hay?"],["A","Es gibt drei Schlafzimmer und eine große Küche.","Hay tres dormitorios y una cocina grande."],["B","Wo ist das Bad?","¿Dónde está el baño?"],["A","Neben der Küche.","Al lado de la cocina."],["B","Und die Katze liegt unter dem Tisch!","¡Y el gato está debajo de la mesa!"]],
  v:[["die Wohnung","el departamento","🏢","di vóonung"],["das Haus","la casa","🏠","das jaus"],["das Zimmer","la habitación","🚪","das tsímer"],["das Schlafzimmer","el dormitorio","🛏️","das shláftsimer"],["die Küche","la cocina","🍳","di küje"],["das Bad","el baño","🛁","das baat"],["der Tisch","la mesa","🪑","der tish"],["das Fenster","la ventana","🪟","das fénster"],["unter","debajo de","⬇️","únter"],["neben","al lado de","↔️","néeben"]],
  r:{t:"Dónde está algo: preposición + dativo",x:"Después de in, auf, unter o neben, cuando decís DÓNDE está algo, el artículo pasa a dativo: der → dem, das → dem, die → der. Y «in dem» se contrae en «im».",tabla:[["der Tisch","unter dem Tisch"],["das Bad","im (in dem) Bad"],["die Küche","neben der Küche"],["das Sofa","auf dem Sofa"]]},
  c:[["Die Katze ist unter ___ Tisch.",["dem","der","den"],"El gato está debajo de la mesa.","der Tisch → dem."],["Das Bad ist neben ___ Küche.",["der","dem","die"],"El baño está al lado de la cocina.","die Küche → der."],["Ich bin ___ Bad.",["im","in","am"],"Estoy en el baño.","in + dem = im."],["Es ___ drei Zimmer.",["gibt","sind","hat"],"Hay tres habitaciones.","Hay = es gibt."]],
  d:[["Wo ist die Küche?","¿Dónde está la cocina?",[["Neben dem Bad.",null],["Neben das Bad.","Dónde está algo: dativo, dem Bad."],["Es gibt Küche.","Eso es «hay cocina»."]]],
     ["Wie viele Zimmer gibt es?","¿Cuántas habitaciones hay?",[["Es gibt zwei Zimmer.",null],["Es sind zwei Zimmer gibt.","Se dice «Es gibt zwei Zimmer»."],["Es gibt zwei Zimmers.","El plural de Zimmer es Zimmer."]]],
     ["Wo ist die Katze?","¿Dónde está el gato?",[["Auf dem Sofa.",null],["Auf der Sofa.","das Sofa → dem Sofa."],["Auf den Sofa.","Para «dónde» se usa dativo: dem."]]]]},
 {id:"de10", ic:"💼", t:"El trabajo", sub:"Was bist du von Beruf?",
  h:[["A","Was bist du von Beruf?","¿Cuál es tu profesión?"],["B","Ich bin Webdesigner. Ich arbeite von zu Hause.","Soy diseñador web. Trabajo desde casa."],["A","Gefällt dir deine Arbeit?","¿Te gusta tu trabajo?"],["B","Ja, aber mein Chef ruft mich jeden Tag an.","Sí, pero mi jefe me llama todos los días."],["A","Mein Chef ruft nicht an. Er schreibt E-Mails.","Mi jefe no llama. Escribe mails."],["B","E-Mails um Mitternacht? Das ist schlimmer!","¿Mails a medianoche? ¡Eso es peor!"]],
  v:[["der Beruf","la profesión","💼","der berúf"],["die Arbeit","el trabajo","🛠️","di árbait"],["der Chef","el jefe","🧑‍💼","der shef"],["das Büro","la oficina","🏢","das büró"],["die Firma","la empresa","🏭","di fírma"],["die Besprechung","la reunión","🗓️","di beshpréjung"],["die E-Mail","el mail","📧","di í-meil"],["das Gehalt","el sueldo","💵","das guejált"],["der Ingenieur","el ingeniero","👷","der inshenióor"],["der Arzt","el médico","🩺","der artst"]],
  r:{t:"Profesiones y «kein»",x:"Las profesiones van sin artículo: «Ich bin Ingenieur». Para mujeres se agrega -in: Ingenieurin, Ärztin. Para negar un sustantivo que llevaría ein/eine se usa «kein»: «Ich habe kein Büro».",tabla:[["Ich bin Ingenieur.","Soy ingeniero."],["Sie ist Ärztin.","Ella es médica."],["Ich habe kein Büro.","No tengo oficina."],["Er ruft nicht an.","Él no llama."]]},
  c:[["Sie ist ___. (médica)",["Ärztin","Arzt","Ärzte"],"Ella es médica.","Femenino: -in → Ärztin."],["Ich habe ___ Büro.",["kein","nicht","keine"],"No tengo oficina.","das Büro → kein."],["Mein Chef ruft mich jeden Tag ___.",["an","auf","aus"],"Mi jefe me llama todos los días.","anrufen: el «an» va al final."],["Ich habe ___ Besprechung.",["keine","kein","nicht"],"No tengo reunión.","die Besprechung → keine."]],
  d:[["Was bist du von Beruf?","¿Cuál es tu profesión?",[["Ich bin Designer.",null],["Ich bin ein Designer.","Sin artículo: Ich bin Designer."],["Ich mache Designer.","Se dice «Ich bin Designer»."]]],
     ["Wo arbeitest du?","¿Dónde trabajás?",[["Ich arbeite bei einer Firma in Berlin.",null],["Ich arbeitest bei einer Firma.","Con ich: arbeite."],["Ich arbeite bei einer Firma Berlin.","Falta «in» antes de Berlin."]]],
     ["Hast du heute eine Besprechung?","¿Tenés una reunión hoy?",[["Nein, ich habe keine Besprechung.",null],["Nein, ich habe nicht Besprechung.","Con sustantivo: keine Besprechung."],["Nein, ich habe kein Besprechung.","die Besprechung → keine."]]]]},
 {id:"de11", ic:"🎸", t:"Tiempo libre", sub:"Ich kann Gitarre spielen",

  r:{t:"«können» y el verbo al final",x:"Con «können» y los otros verbos modales, el segundo verbo va al FINAL de la frase y en infinitivo: «Ich kann Gitarre spielen».",tabla:[["ich kann","yo puedo / sé"],["du kannst","vos podés"],["er / sie kann","él / ella puede"],["wir können","nosotros podemos"],["Ich kann gut singen.","Sé cantar bien."],["Kannst du schwimmen?","¿Sabés nadar?"]]},
  c:[["Ich kann Gitarre ___.",["spielen","spiele","spielt"],"Sé tocar la guitarra.","Con kann, el otro verbo va al final en infinitivo."],["___ du schwimmen?",["Kannst","Kann","Können"],"¿Sabés nadar?","du → kannst."],["Er ___ nicht Auto fahren.",["kann","kannst","können"],"Él no sabe manejar.","er → kann."],["Wir können heute Fußball ___.",["spielen","spielt","gespielt"],"Hoy podemos jugar al fútbol.","Infinitivo al final: spielen."]],
  d:[["Kannst du Fußball spielen?","¿Sabés jugar al fútbol?",[["Ja, ich kann Fußball spielen.",null],["Ja, ich kann spiele Fußball.","El segundo verbo va al final en infinitivo."],["Ja, ich kannst Fußball spielen.","Con ich: kann."]]],
     ["Was machst du in deiner Freizeit?","¿Qué hacés en tu tiempo libre?",[["Ich lese und ich sehe Filme.",null],["Ich lesen und Filme.","Con ich: lese."],["Ich bin lesen.","Se dice «Ich lese»."]]],
     ["Kannst du jetzt singen?","¿Podés cantar ahora?",[["Nein, jetzt kann ich nicht. Vielleicht später.",null],["Nein, jetzt ich kann nicht.","Después de «jetzt», el verbo va segundo: jetzt kann ich."],["Nein, ich nicht kann.","«nicht» va después del verbo."]]]]},

  h:[["A","Kann ich Ihnen helfen?","¿Lo puedo ayudar?"],["B","Ja, ich suche ein T-Shirt.","Sí, busco una remera."],["A","Welche Farbe? Wir haben Rot, Blau und Schwarz.","¿Qué color? Tenemos rojo, azul y negro."],["B","Schwarz, bitte. Größe M.","Negra, por favor. Talle M."],["A","Bitte schön. Es kostet zwanzig Euro.","Aquí tiene. Cuesta veinte euros."],["B","Super, ich nehme es!","¡Genial, me la llevo!"]],
  v:[["das T-Shirt","la remera","👕","das tí-shert"],["die Hose","el pantalón","👖","di jóose"],["die Schuhe","los zapatos","👟","di shúue"],["die Jacke","la campera","🧥","di iáke"],["rot","rojo","🔴","root"],["blau","azul","🔵","blau"],["schwarz","negro","⚫","shvarts"],["weiß","blanco","⚪","váis"],["grün","verde","🟢","grüün"],["groß / klein","grande / chico","📏","groos / kláin"]],
  r:{t:"Colores después del verbo, sin cambios",x:"Después de «sein» el color no cambia: «Das T-Shirt ist rot». Delante del sustantivo lleva terminación; para empezar, aprendé estas tres con «ein»: ein roter Pullover, eine rote Jacke, ein rotes T-Shirt.",tabla:[["Die Jacke ist blau.","La campera es azul."],["ein roter Pullover","un pulóver rojo (der)"],["eine rote Jacke","una campera roja (die)"],["ein rotes T-Shirt","una remera roja (das)"]]},
  c:[["Das T-Shirt ist ___.",["rot","rotes","rote"],"La remera es roja.","Después de «ist», el color no cambia."],["Ich suche ___ Jacke.",["eine","ein","einen"],"Busco una campera.","die Jacke → eine."],["Ich nehme ___ rotes T-Shirt.",["ein","eine","einen"],"Me llevo una remera roja.","das T-Shirt → ein."],["Die Schuhe ___ schwarz.",["sind","ist","bin"],"Los zapatos son negros.","Plural: sind."]],
  d:[["Kann ich Ihnen helfen?","¿Lo puedo ayudar?",[["Ja, ich suche eine Jacke.",null],["Ja, ich suche ein Jacke.","die Jacke → eine."],["Ja, ich suche für eine Jacke.","«suchen» no lleva preposición."]]],
     ["Welche Farbe möchten Sie?","¿Qué color desea?",[["Blau, bitte.",null],["Azul, bitte.","😄 En alemán: blau."],["Blaue, bitte.","Solo, sin sustantivo: blau."]]],
     ["Es kostet zwanzig Euro.","Cuesta veinte euros.",[["Gut, ich nehme es.",null],["Gut, ich nimm es.","nehmen: ich nehme."],["Gut, ich bin zwanzig.","Eso es «tengo veinte años»."]]]]},

  v:[["gemacht","hecho (machen)","✅","guemájt"],["gearbeitet","trabajado","💼","guearbáitet"],["gespielt","jugado","⚽","guespílt"],["gekauft","comprado","🛍️","guekáuft"],["gegessen","comido","🍕","gueguésen"],["getrunken","tomado (bebido)","🍺","guetrúnken"],["gesehen","visto","👀","guezéen"],["gelernt","aprendido","📚","guelérnt"],["gestern","ayer","📆","guéstern"],["am Wochenende","el fin de semana","🏖️","am vójenende"]],
  r:{t:"El Perfekt: el pasado que se habla",x:"En la conversación, el alemán cuenta el pasado con haben + participio. El participio va AL FINAL de la frase. Regulares: ge- + raíz + -t (spielen → gespielt). Irregulares: ge- + … + -en (essen → gegessen).",tabla:[["ich habe gespielt","jugué"],["du hast gekauft","compraste"],["er hat gegessen","comió"],["wir haben getrunken","tomamos"],["Was hast du gemacht?","¿Qué hiciste?"]]},
  c:[["Ich ___ Fußball gespielt.",["habe","bin","hat"],"Jugué al fútbol.","ich → habe."],["Er hat eine Pizza ___.",["gegessen","essen","gegesst"],"Comió una pizza.","essen es irregular: gegessen."],["Wir haben viel ___.",["gearbeitet","arbeiten","gearbeiten"],"Trabajamos mucho.","Regular: ge- + arbeit + -et."],["___ du den Film gesehen?",["Hast","Bist","Habe"],"¿Viste la película?","du → hast."]],
  d:[["Was hast du gestern gemacht?","¿Qué hiciste ayer?",[["Ich habe Deutsch gelernt.",null],["Ich habe gelernt Deutsch.","El participio va al final: … Deutsch gelernt."],["Ich lerne gestern Deutsch.","Para el pasado: Ich habe … gelernt."]]],
     ["Hast du schon gegessen?","¿Ya comiste?",[["Ja, ich habe schon gegessen.",null],["Ja, ich bin schon gegessen.","essen va con haben."],["Ja, ich habe schon essen.","Participio: gegessen."]]],
     ["Was hast du gekauft?","¿Qué compraste?",[["Ich habe ein Buch gekauft.",null],["Ich habe ein Buch gekaufen.","kaufen es regular: gekauft."],["Ich kaufte gekauft ein Buch.","Mejor: Ich habe ein Buch gekauft."]]]]},
 {id:"de15", lvl:"A2", ic:"🚆", t:"Ich bin gefahren", sub:"Perfekt con sein",

  v:[["gefahren","viajado (en vehículo)","🚗","guefáren"],["geflogen","volado","✈️","gueflóguen"],["gegangen","ido (a pie)","🚶","guegánguen"],["gekommen","venido, llegado","🏠","guekómen"],["geblieben","quedado","🛏️","gueblíben"],["aufgestanden","levantado","⏰","áufguestanden"],["passiert","pasado, sucedido","❓","pasírt"],["der Zug","el tren","🚆","der tsuk"],["nach Hause","a casa","🏡","naj jáuze"],["im Sommer","en verano","☀️","im zómer"]],
  r:{t:"¿haben o sein?",x:"Los verbos de MOVIMIENTO de un lugar a otro (fahren, fliegen, gehen, kommen) y de CAMBIO de estado (aufstehen, einschlafen) usan sein. También sein y bleiben. Todo lo demás, haben.",tabla:[["ich bin gefahren","viajé"],["du bist geflogen","volaste"],["er ist gekommen","vino"],["wir sind geblieben","nos quedamos"],["ich bin aufgestanden","me levanté"],["Was ist passiert?","¿Qué pasó?"]]},
  c:[["Ich ___ nach Berlin gefahren.",["bin","habe","ist"],"Viajé a Berlín.","Movimiento: sein → bin."],["Sie ist nach Hause ___.",["gegangen","gegeht","gehen"],"Se fue a casa.","gehen → gegangen."],["Wir ___ zwei Wochen geblieben.",["sind","haben","seid"],"Nos quedamos dos semanas.","bleiben va con sein."],["Ich ___ Pizza gegessen.",["habe","bin","ist"],"Comí pizza.","Comer no es movimiento: haben."]],
  d:[["Wie bist du nach Spanien gekommen?","¿Cómo llegaste a España?",[["Ich bin geflogen.",null],["Ich habe geflogen.","fliegen es movimiento: bin geflogen."],["Ich bin gefliegt.","Participio: geflogen."]]],
     ["Was ist passiert?","¿Qué pasó?",[["Ich bin zu spät aufgestanden.",null],["Ich habe zu spät aufgestanden.","aufstehen es cambio de estado: bin."],["Ich bin zu spät aufstehen.","Participio: aufgestanden."]]],
     ["Bist du lange geblieben?","¿Te quedaste mucho?",[["Ja, ich bin drei Tage geblieben.",null],["Ja, ich habe drei Tage geblieben.","bleiben va con sein."],["Ja, ich bleibe drei Tage gestern.","Pasado: bin … geblieben."]]]]},
 {id:"de16", lvl:"A2", ic:"🕰️", t:"Früher", sub:"war, hatte, doch",
  h:[["A","Wo warst du gestern Abend?","¿Dónde estabas ayer a la noche?"],["B","Ich war zu Hause. Ich hatte Kopfschmerzen.","Estaba en casa. Me dolía la cabeza."],["A","Warst du nicht auf der Party?","¿No estuviste en la fiesta?"],["B","Doch! Aber nur eine Stunde.","¡Sí! Pero solo una hora."],["A","Früher warst du immer bis drei Uhr da.","Antes siempre te quedabas hasta las tres."],["B","Früher hatte ich auch mehr Energie.","Antes también tenía más energía."]],
  v:[["war","estaba / era","⏪","var"],["hatte","tenía","🎒","játe"],["früher","antes, antiguamente","🕰️","frúer"],["damals","en aquel entonces","📜","dámals"],["als Kind","de chico","🧒","als kint"],["doch","¡sí! (contra una negación)","☝️","doj"],["die Stunde","la hora","⏱️","di shtúnde"],["gestern Abend","ayer a la noche","🌙","guéstern ábent"],["immer","siempre","♾️","ímer"],["die Energie","la energía","⚡","di energuí"]],
  r:{t:"war y hatte + doch",x:"Con sein y haben el alemán prefiere el Präteritum aun hablando: ich war, ich hatte. «doch» contesta «sí» a una pregunta negativa: —¿No venís? —¡Doch! (¡Sí, vengo!).",tabla:[["ich war / hatte","estaba / tenía"],["du warst / hattest","estabas / tenías"],["er war / hatte","estaba / tenía"],["wir waren / hatten","estábamos / teníamos"],["Kommst du nicht? — Doch!","¿No venís? — ¡Sí!"]]},
  c:[["Gestern ___ ich krank.",["war","hatte","bin"],"Ayer estaba enfermo.","Pasado de sein: war."],["Als Kind ___ ich einen Hund.",["hatte","war","habe"],"De chico tenía un perro.","Pasado de haben: hatte."],["Wo ___ du?",["warst","war","wart"],"¿Dónde estabas?","du → warst."],["Hast du keine Zeit? — ___, ich habe Zeit!",["Doch","Ja","Nein"],"¿No tenés tiempo? — ¡Sí tengo!","Contra una negación: doch."]],
  d:[["Warst du gestern im Büro?","¿Estuviste ayer en la oficina?",[["Nein, ich war krank.",null],["Nein, ich hatte krank.","Estar enfermo: ich war krank."],["Nein, ich bin gestern krank.","Pasado: ich war."]]],
     ["Hattest du einen Hund als Kind?","¿Tenías un perro de chico?",[["Ja, ich hatte zwei Hunde.",null],["Ja, ich war zwei Hunde.","😄 Tener: hatte."],["Ja, ich habe zwei Hunde gehattet.","Con haben se usa hatte."]]],
     ["Kommst du nicht mit?","¿No venís?",[["Doch, ich komme mit!",null],["Ja, ich komme mit!","Contra una pregunta negativa se dice «Doch»."],["Nein, ich komme mit!","«Nein» sería que no venís."]]]]},
 {id:"de17", lvl:"A2", ic:"🔮", t:"Pläne", sub:"futuro: presente y werden",

  r:{t:"Hablar del futuro",x:"El alemán usa casi siempre el PRESENTE con una palabra de tiempo: Morgen fahre ich… Para planes lejanos o promesas: werden + infinitivo al final.",tabla:[["ich werde","voy a"],["du wirst","vas a"],["er / sie wird","va a"],["wir werden","vamos a"],["Ich werde lernen.","Voy a aprender."],["Morgen arbeite ich.","Mañana trabajo."]]},
  c:[["Ich ___ in Berlin wohnen.",["werde","wird","werden"],"Voy a vivir en Berlín.","ich → werde."],["Er wird ein Auto ___.",["kaufen","kauft","gekauft"],"Va a comprar un auto.","werden + infinitivo al final."],["Morgen ___ ich nach Hamburg.",["fahre","fahren","gefahren"],"Mañana viajo a Hamburgo.","Presente con palabra de tiempo."],["___ du nächstes Jahr kommen?",["Wirst","Wird","Werde"],"¿Vas a venir el año que viene?","du → wirst."]],

 {id:"de18", lvl:"A2", ic:"⚖️", t:"Vergleichen", sub:"größer als, am besten",
  h:[["A","Welches Handy ist besser?","¿Qué celular es mejor?"],["B","Das Samsung ist billiger als das iPhone.","El Samsung es más barato que el iPhone."],["A","Aber die Kamera ist nicht so gut wie beim iPhone.","Pero la cámara no es tan buena como la del iPhone."],["B","Stimmt. Das iPhone ist am teuersten, aber am schnellsten.","Cierto. El iPhone es el más caro, pero el más rápido."],["A","Ich nehme das billigere. Ich habe kein Geld.","Me llevo el más barato. No tengo plata."],["B","Die beste Entscheidung!","¡La mejor decisión!"]],
  v:[["billig","barato","💸","bílij"],["teuer","caro","💎","tóier"],["schnell","rápido","🏎️","shnel"],["groß → größer","grande → más grande","🐘","gros / gróser"],["alt → älter","viejo → más viejo","👴","alt / élter"],["gut → besser","bueno → mejor","👍","gut / béser"],["am besten","lo mejor","🏆","am bésten"],["als","que (al comparar)","⚖️","als"],["so … wie","tan … como","🟰","zo … vi"],["lieber","preferentemente","❤️","líber"]],
  r:{t:"Comparar en alemán",x:"Comparativo: adjetivo + -er + als (billiger als). Superlativo: am + adjetivo + -sten (am billigsten). Muchos adjetivos cortos ponen diéresis: groß → größer, alt → älter, jung → jünger. Irregulares: gut → besser → am besten; viel → mehr → am meisten; gern → lieber → am liebsten.",tabla:[["billig","billiger · am billigsten"],["groß","größer · am größten"],["alt","älter · am ältesten"],["gut","besser · am besten"],["gern","lieber · am liebsten"],["so groß wie","tan grande como"]]},
  c:[["Berlin ist ___ als München.",["größer","großer","mehr groß"],"Berlín es más grande que Múnich.","groß → größer, con diéresis."],["Mein Bruder ist älter ___ ich.",["als","wie","dass"],"Mi hermano es más grande que yo.","Comparativo + als."],["Das ist am ___.",["besten","gutsten","besser"],"Eso es lo mejor.","gut → am besten."],["Ich trinke ___ Tee als Kaffee.",["lieber","gerner","mehr gern"],"Prefiero el té al café.","gern → lieber."]],
  d:[["Was trinkst du lieber, Bier oder Wein?","¿Qué preferís, cerveza o vino?",[["Ich trinke lieber Bier.",null],["Ich trinke gerner Bier.","gern → lieber."],["Ich trinke mehr gern Bier.","gern → lieber."]]],
     ["Ist Hamburg so groß wie Berlin?","¿Hamburgo es tan grande como Berlín?",[["Nein, Berlin ist größer.",null],["Nein, Berlin ist mehr groß.","groß → größer."],["Nein, Berlin ist größer wie Hamburg.","Comparativo + als, no wie."]]],
     ["Welches Restaurant ist am besten?","¿Qué restaurante es el mejor?",[["Das italienische ist am besten.",null],["Das italienische ist am gutsten.","gut → am besten."],["Das italienische ist besser am.","Se dice «am besten»."]]]]},
 {id:"de19", lvl:"A2", ic:"🛒", t:"Im Supermarkt", sub:"wie viel, eine Flasche",
  h:[["A","Wir brauchen Milch. Haben wir noch Eier?","Necesitamos leche. ¿Todavía tenemos huevos?"],["B","Nein, wir haben keine Eier mehr.","No, ya no tenemos huevos."],["A","Wie viele Eier brauchen wir?","¿Cuántos huevos necesitamos?"],["B","Zehn. Und eine Flasche Wein und ein Kilo Äpfel.","Diez. Y una botella de vino y un kilo de manzanas."],["A","Wie viel kostet das alles?","¿Cuánto cuesta todo?"],["B","Achtzehn Euro fünfzig.","Dieciocho euros con cincuenta."]],
  v:[["die Milch","la leche","🥛","di milj"],["das Ei / die Eier","el huevo / los huevos","🥚","das ai / di áier"],["der Zucker","el azúcar","🍬","der tsúker"],["der Reis","el arroz","🍚","der ráis"],["der Apfel / die Äpfel","la manzana / las manzanas","🍎","der ápfel / di épfel"],["eine Flasche","una botella","🍾","áine flashe"],["ein Kilo","un kilo","⚖️","ain kílo"],["eine Packung","un paquete","📦","áine pákung"],["kein … mehr","ya no … (más)","🚫","kain … mer"],["wie viel / wie viele","cuánto / cuántos","🔢","vi fil / vi fíle"]],
  r:{t:"Cantidades",x:"«wie viel» con lo que no se cuenta (Milch, Geld); «wie viele» con plurales (Eier, Äpfel). Los envases van SIN preposición: eine Flasche Wein (no «von Wein»). «Ya no hay»: kein … mehr.",tabla:[["Wie viel Milch?","¿Cuánta leche?"],["Wie viele Eier?","¿Cuántos huevos?"],["eine Flasche Wasser","una botella de agua"],["ein Kilo Äpfel","un kilo de manzanas"],["Wir haben kein Brot mehr.","Ya no tenemos pan."]]},
  c:[["Wie ___ Eier brauchst du?",["viele","viel","vieles"],"¿Cuántos huevos necesitás?","Plural: wie viele."],["Ich kaufe eine Flasche ___.",["Wasser","von Wasser","des Wassers"],"Compro una botella de agua.","Sin preposición: eine Flasche Wasser."],["Wir haben ___ Milch mehr.",["keine","nicht","kein"],"Ya no tenemos leche.","die Milch → keine … mehr."],["Wie ___ kostet das?",["viel","viele","vielen"],"¿Cuánto cuesta?","Precio: wie viel."]],
  d:[["Haben wir noch Brot?","¿Todavía tenemos pan?",[["Nein, wir haben kein Brot mehr.",null],["Nein, wir haben nicht Brot mehr.","Con sustantivo: kein … mehr."],["Nein, wir haben Brot nicht.","Mejor: kein Brot mehr."]]],
     ["Wie viele Äpfel möchten Sie?","¿Cuántas manzanas quiere?",[["Ein Kilo, bitte.",null],["Ein Kilo von Äpfel, bitte.","Sin «von»: ein Kilo Äpfel."],["Viel, bitte.","Se responde con una cantidad: ein Kilo."]]],
     ["Wie viel kostet das?","¿Cuánto cuesta?",[["Zwölf Euro.",null],["Zwölf Euros.","En alemán «Euro» no lleva s."],["Es kostet viele.","Se responde con el precio."]]]]},
 {id:"de20", lvl:"A2", ic:"🩺", t:"Beim Arzt", sub:"Kopfschmerzen, du solltest",
  h:[["A","Guten Tag. Was fehlt Ihnen?","Buen día. ¿Qué le pasa?"],["B","Ich habe Kopfschmerzen und Halsschmerzen.","Me duele la cabeza y la garganta."],["A","Haben Sie Fieber?","¿Tiene fiebre?"],["B","Ja, seit gestern. Mir geht es schlecht.","Sí, desde ayer. Me siento mal."],["A","Sie sollten im Bett bleiben und viel Tee trinken.","Debería quedarse en cama y tomar mucho té."],["A","Und Sie dürfen nicht rauchen!","¡Y no puede fumar!"]],
  v:[["der Arzt / die Ärztin","el médico / la médica","🩺","der artst / di értstin"],["die Kopfschmerzen","dolor de cabeza","🤕","di kópfshmertsen"],["die Halsschmerzen","dolor de garganta","😷","di jálsshmertsen"],["das Fieber","la fiebre","🌡️","das fíber"],["der Husten","la tos","🤧","der jústen"],["die Tablette","la pastilla","💊","di tablète"],["krank","enfermo","🤒","krank"],["seit","desde (hace)","⏳","zait"],["Was fehlt Ihnen?","¿Qué le pasa?","❓","vas felt ínen"],["sollten","debería","👉","zólten"]],
  r:{t:"Dolores y consejos",x:"Los dolores se arman con -schmerzen: Kopf + schmerzen, Bauch + schmerzen, y van con haben. Para aconsejar: sollten + infinitivo al final. Para prohibir o permitir: dürfen.",tabla:[["Ich habe Bauchschmerzen.","Me duele la panza."],["Mir geht es schlecht.","Me siento mal."],["Du solltest schlafen.","Deberías dormir."],["Sie sollten Tee trinken.","Debería tomar té."],["Darf ich rauchen? — Nein!","¿Puedo fumar? — ¡No!"]]},
  c:[["Ich ___ Kopfschmerzen.",["habe","bin","tue"],"Me duele la cabeza.","Dolores con haben."],["Du ___ zum Arzt gehen.",["solltest","sollten","sollte"],"Deberías ir al médico.","du → solltest."],["Sie dürfen nicht ___.",["rauchen","raucht","geraucht"],"No puede fumar.","dürfen + infinitivo."],["Ich bin ___ gestern krank.",["seit","für","von"],"Estoy enfermo desde ayer.","Desde ayer: seit gestern."]],
  d:[["Was fehlt Ihnen?","¿Qué le pasa?",[["Ich habe Halsschmerzen.",null],["Ich bin Halsschmerzen.","Dolor: ich habe."],["Mir fehlt Halsschmerzen.","Se responde «Ich habe Halsschmerzen»."]]],
     ["Seit wann haben Sie Fieber?","¿Desde cuándo tiene fiebre?",[["Seit zwei Tagen.",null],["Vor zwei Tagen seit.","«Desde hace dos días»: seit zwei Tagen."],["Für zwei Tage.","Desde hace: seit."]]],
     ["Was soll ich machen?","¿Qué debo hacer?",[["Sie sollten viel schlafen.",null],["Sie sollten schlafen viel.","El infinitivo va al final."],["Sie sollen zu schlafen.","Sin «zu»: sollten … schlafen."]]]]},
 {id:"de21", lvl:"A2", ic:"🚫", t:"Regeln", sub:"müssen, dürfen, man",
  h:[["A","Hier darf man nicht rauchen.","Acá no se puede fumar."],["B","Oh, Entschuldigung. Wo darf man rauchen?","Uy, perdón. ¿Dónde se puede fumar?"],["A","Draußen. Und Sie müssen den Hund an die Leine nehmen.","Afuera. Y tiene que llevar al perro con correa."],["B","Muss ich auch bezahlen?","¿Tengo que pagar también?"],["A","Nein, Sie müssen nicht bezahlen. Der Eintritt ist frei.","No, no hace falta que pague. La entrada es libre."],["B","Super, danke!","¡Genial, gracias!"]],
  v:[["müssen","tener que","📌","músen"],["dürfen","poder (con permiso)","✅","dúrfen"],["nicht müssen","no hace falta","🙅","nijt músen"],["nicht dürfen","estar prohibido","🚫","nijt dúrfen"],["man","uno, se (impersonal)","👤","man"],["draußen","afuera","🌳","dráusen"],["drinnen","adentro","🏠","drínen"],["bezahlen","pagar","💳","betsálen"],["der Eintritt","la entrada","🎟️","der áintrit"],["verboten","prohibido","⛔","ferbóten"]],
  r:{t:"Obligación y permiso",x:"müssen = tener que; dürfen = tener permiso. ¡Ojo! «nicht müssen» = no hace falta, y «nicht dürfen» = está prohibido. «man» es el «se» impersonal y conjuga como er: man darf, man muss.",tabla:[["ich muss / darf","tengo que / puedo"],["du musst / darfst","tenés que / podés"],["man muss","hay que"],["Man darf nicht rauchen.","No se puede fumar."],["Du musst nicht kommen.","No hace falta que vengas."]]},
  c:[["Hier ___ man nicht parken.",["darf","dürfen","muss"],"Acá no se puede estacionar.","Prohibido: man darf nicht."],["Ich ___ morgen arbeiten.",["muss","musst","müssen"],"Mañana tengo que trabajar.","ich → muss."],["Du ___ nicht bezahlen. Es ist gratis.",["musst","darfst","willst"],"No hace falta que pagues. Es gratis.","No hace falta: nicht müssen."],["___ ich hier rauchen?",["Darf","Muss","Dürfe"],"¿Puedo fumar acá?","Pedir permiso: Darf ich…?"]],
  d:[["Darf ich hier fotografieren?","¿Puedo sacar fotos acá?",[["Nein, das ist verboten.",null],["Nein, Sie müssen nicht.","Eso es «no hace falta»."],["Nein, man muss nicht.","Prohibido: man darf nicht / verboten."]]],
     ["Muss ich einen Pass zeigen?","¿Tengo que mostrar pasaporte?",[["Ja, Sie müssen den Pass zeigen.",null],["Ja, Sie müssen zeigen den Pass.","El infinitivo va al final."],["Ja, Sie dürfen den Pass.","Obligación: müssen."]]],
     ["Was darf man im Museum nicht machen?","¿Qué no se puede hacer en el museo?",[["Man darf nicht essen.",null],["Man muss nicht essen.","Eso es «no hace falta comer» 😄"],["Man dürfen nicht essen.","man conjuga como er: man darf."]]]]},
 {id:"de22", lvl:"A2", ic:"📦", t:"Wo oder wohin?", sub:"im / ins, auf dem / auf den",
  h:[["A","Wo ist mein Handy?","¿Dónde está mi celular?"],["B","Es liegt auf dem Tisch.","Está sobre la mesa."],["A","Und wohin hast du meine Schlüssel gelegt?","¿Y dónde pusiste mis llaves?"],["B","Ich habe sie in die Tasche gelegt.","Las puse en la cartera."],["A","Ich gehe jetzt ins Kino.","Ahora me voy al cine."],["B","Ich bin schon im Kino. Beeil dich!","Yo ya estoy en el cine. ¡Apurate!"]],
  v:[["wo?","¿dónde? (lugar fijo)","📍","vo"],["wohin?","¿a dónde? (movimiento)","➡️","vojín"],["liegen","estar (acostado)","🛋️","líguen"],["legen","poner (acostado)","👇","léguen"],["stehen","estar (parado)","🧍","shtéen"],["stellen","poner (parado)","📚","shtélen"],["der Tisch","la mesa","🪑","der tish"],["die Tasche","la cartera, el bolso","👜","di táshe"],["das Kino","el cine","🎬","das kíno"],["im / ins","en el / al (in + dem / das)","🏛️","im / ins"]],
  r:{t:"Preposiciones de dos caras",x:"in, auf, an, unter, über, vor, hinter, neben, zwischen: si la pregunta es WO (quieto) van con dativo; si es WOHIN (movimiento), con acusativo. in dem = im; in das = ins.",tabla:[["Wo? im Kino (dativo)","en el cine"],["Wohin? ins Kino (acusativo)","al cine"],["auf dem Tisch","sobre la mesa (quieto)"],["auf den Tisch","sobre la mesa (lo pongo)"],["in der Tasche / in die Tasche","en la cartera / a la cartera"]]},
  c:[["Ich bin ___ Kino.",["im","ins","in die"],"Estoy en el cine.","Quieto (wo): im."],["Ich gehe ___ Kino.",["ins","im","in dem"],"Voy al cine.","Movimiento (wohin): ins."],["Das Buch liegt auf ___ Tisch.",["dem","den","der"],"El libro está sobre la mesa.","Quieto: dativo, dem."],["Ich lege das Buch auf ___ Tisch.",["den","dem","die"],"Pongo el libro sobre la mesa.","Movimiento: acusativo, den."]],
  d:[["Wo ist die Katze?","¿Dónde está la gata?",[["Sie liegt auf dem Sofa.",null],["Sie liegt auf das Sofa.","Quieta (wo): dativo, dem."],["Sie legt auf dem Sofa.","Estar acostado: liegen → liegt."]]],
     ["Wohin gehst du heute Abend?","¿A dónde vas esta noche?",[["Ich gehe ins Theater.",null],["Ich gehe im Theater.","Movimiento: ins."],["Ich gehe in dem Theater.","Movimiento: ins (in das)."]]],
     ["Wohin hast du den Schlüssel gelegt?","¿Dónde pusiste la llave?",[["In die Schublade.",null],["In der Schublade.","Pregunta wohin: acusativo, die."],["Ins der Schublade.","die Schublade → in die."]]]]},
 {id:"de23", lvl:"A2", ic:"📞", t:"Telefon und E-Mail", sub:"formal, mir / dir / ihm",
  h:[["A","Firma Weber, Schmidt am Apparat.","Empresa Weber, habla Schmidt."],["B","Guten Tag, hier ist Juan García. Kann ich Frau Weber sprechen?","Buen día, habla Juan García. ¿Puedo hablar con la señora Weber?"],["A","Sie ist leider nicht da. Kann ich ihr etwas ausrichten?","Lamentablemente no está. ¿Le dejo algún mensaje?"],["B","Ja, bitte. Sie soll mich zurückrufen.","Sí, por favor. Que me devuelva la llamada."],["A","Gern. Ich schicke ihr eine E-Mail.","Con gusto. Le mando un mail."],["B","Vielen Dank. Auf Wiederhören!","Muchas gracias. ¡Hasta luego! (por teléfono)"]],
  v:[["am Apparat","habla… (al atender)","☎️","am aparát"],["hier ist…","habla… (al llamar)","📞","jír ist"],["zurückrufen","devolver la llamada","🔁","tsurúkrufen"],["ausrichten","transmitir un mensaje","💬","áusrijten"],["schicken","enviar","📤","shíken"],["der Anhang","el adjunto","📎","der ánjang"],["Sehr geehrte Damen und Herren","Estimados señores","✉️","zer gueérte dámen unt jéren"],["Mit freundlichen Grüßen","Saludos cordiales","🖊️","mit fróintlijen grúsen"],["Auf Wiederhören!","¡Hasta luego! (teléfono)","👋","auf víderjoren"],["mir / dir / ihm / ihr","a mí / a vos / a él / a ella","👤","mir / dir / im / ir"]],
  r:{t:"Dativo de los pronombres",x:"Quien RECIBE algo va en dativo: ich → mir, du → dir, er → ihm, sie → ihr, wir → uns, Sie → Ihnen. «Ich schicke ihr eine E-Mail» = le mando un mail (a ella).",tabla:[["Kannst du mir helfen?","¿Me podés ayudar?"],["Ich gebe dir das Buch.","Te doy el libro."],["Ich schreibe ihm.","Le escribo (a él)."],["Ich schicke ihr eine Mail.","Le mando un mail (a ella)."],["Wie geht es Ihnen?","¿Cómo le va? (formal)"]]},
  c:[["Kannst du ___ helfen? (a mí)",["mir","mich","ich"],"¿Me podés ayudar?","helfen pide dativo: mir."],["Ich schicke ___ eine E-Mail. (a ella)",["ihr","sie","ihm"],"Le mando un mail a ella.","A ella: ihr."],["Ich schreibe ___. (a él)",["ihm","ihn","er"],"Le escribo a él.","A él (dativo): ihm."],["Mit freundlichen ___",["Grüßen","Grüße","Gruß"],"Saludos cordiales","Fórmula fija: Mit freundlichen Grüßen."]],
  d:[["Weber, guten Tag.","Weber, buen día.",[["Guten Tag, hier ist Juan García.",null],["Guten Tag, ich bin am Apparat Juan.","«am Apparat» lo dice quien atiende."],["Hallo, Juan hier ist.","Verbo segundo: Hier ist Juan."]]],
     ["Kann ich ihm etwas ausrichten?","¿Le dejo un mensaje?",[["Ja, er soll mich zurückrufen.",null],["Ja, er soll mir zurückrufen.","anrufen/zurückrufen van con acusativo: mich."],["Ja, zurückrufen er mich.","Mejor: Er soll mich zurückrufen."]]],
     ["Wie beginnt man eine formelle E-Mail?","¿Cómo empieza un mail formal?",[["Sehr geehrte Damen und Herren,",null],["Hallo Leute,","Demasiado informal para un mail de trabajo."],["Mit freundlichen Grüßen,","Eso va al final."]]]]},
 {id:"de24", lvl:"A2", ic:"🏨", t:"Im Hotel", sub:"weil y dass: verbo al final",
  h:[["A","Guten Abend. Ich habe ein Zimmer reserviert.","Buenas noches. Reservé una habitación."],["B","Wie ist Ihr Name, bitte?","¿Su nombre, por favor?"],["A","García. Ich komme spät, weil mein Zug Verspätung hatte.","García. Llego tarde porque mi tren se atrasó."],["B","Kein Problem. Das Frühstück ist von sieben bis zehn.","No hay problema. El desayuno es de siete a diez."],["A","Ich glaube, dass die Klimaanlage nicht funktioniert.","Creo que el aire acondicionado no funciona."],["B","Oh! Sie bekommen ein anderes Zimmer.","¡Uy! Le damos otra habitación."]],
  v:[["das Zimmer","la habitación","🛏️","das tsímer"],["reservieren","reservar","📝","reservíren"],["das Frühstück","el desayuno","🥐","das frúshtuk"],["der Schlüssel","la llave","🔑","der shlúsel"],["die Verspätung","el atraso","⏰","di fershpétung"],["die Klimaanlage","el aire acondicionado","❄️","di klímaanlague"],["funktionieren","funcionar","⚙️","funktsioníren"],["weil","porque","❓","vail"],["dass","que (conjunción)","🔗","das"],["glauben","creer","🤔","gláuben"]],
  r:{t:"weil y dass mandan el verbo al final",x:"En las frases que empiezan con weil (porque) o dass (que), el verbo conjugado se va AL FINAL. «Ich komme nicht, weil ich krank bin.»",tabla:[["…, weil ich müde bin.","…porque estoy cansado."],["…, weil der Zug spät ist.","…porque el tren llega tarde."],["Ich glaube, dass er kommt.","Creo que viene."],["Ich weiß, dass das teuer ist.","Sé que es caro."]]},
  c:[["Ich komme nicht, weil ich krank ___.",["bin","ist","sein"],"No vengo porque estoy enfermo.","Después de weil, verbo al final."],["Ich glaube, ___ das Zimmer zu klein ist.",["dass","das","weil"],"Creo que la habitación es muy chica.","Conjunción «que»: dass (con doble s)."],["Ich bin müde, weil ich wenig ___ habe.",["geschlafen","schlafen","schlief"],"Estoy cansado porque dormí poco.","Perfekt: habe … geschlafen, y habe al final."],["Ich möchte ein ___ reservieren.",["Zimmer","Zimmers","Zimmern"],"Quisiera reservar una habitación.","das Zimmer."]],
  d:[["Warum kommen Sie so spät?","¿Por qué llega tan tarde?",[["Weil mein Flug Verspätung hatte.",null],["Weil mein Flug hatte Verspätung.","Con weil, el verbo va al final."],["Denn weil mein Flug spät.","Falta el verbo: Weil mein Flug Verspätung hatte."]]],
     ["Ist alles in Ordnung mit dem Zimmer?","¿Está todo bien con la habitación?",[["Ich glaube, dass die Dusche kaputt ist.",null],["Ich glaube, dass die Dusche ist kaputt.","Con dass, el verbo va al final."],["Ich glaube, das die Dusche kaputt ist.","La conjunción se escribe «dass»."]]],
     ["Wann gibt es Frühstück?","¿Cuándo hay desayuno?",[["Von sieben bis zehn Uhr.",null],["Von sieben zu zehn Uhr.","De … a …: von … bis."],["Um sieben bis um zehn.","Se dice «von sieben bis zehn»."]]]]},
 {id:"de25", lvl:"A2", ic:"📖", t:"Eine Geschichte", sub:"als, wenn, dass",
  h:[["A","Als ich ein Kind war, habe ich in Hamburg gewohnt.","Cuando era chico, vivía en Hamburgo."],["B","Wirklich? Und warum bist du weggezogen?","¿En serio? ¿Y por qué te mudaste?"],["A","Weil mein Vater einen Job in Wien bekommen hat.","Porque mi papá consiguió un trabajo en Viena."],["B","Und vermisst du Hamburg?","¿Y extrañás Hamburgo?"],["A","Ja. Wenn es regnet, denke ich immer an Hamburg.","Sí. Cuando llueve, siempre pienso en Hamburgo."],["B","Dann denkst du ziemlich oft daran!","¡Entonces pensás bastante seguido!"]],
  v:[["als","cuando (una vez, en el pasado)","🕰️","als"],["wenn","cuando (siempre que) / si","🔁","ven"],["das Kind","el niño","🧒","das kint"],["wohnen","vivir (residir)","🏠","vónen"],["umziehen","mudarse","📦","úmtsien"],["bekommen","recibir, conseguir","🎁","bekómen"],["vermissen","extrañar","💔","fermísen"],["denken an","pensar en","💭","dénken an"],["plötzlich","de repente","⚡","plœtslij"],["dann","entonces, después","➡️","dan"]],
  r:{t:"als o wenn",x:"«als» = cuando, para algo que pasó UNA vez en el pasado (Als ich Kind war…). «wenn» = cuando, para cosas que se repiten o en presente/futuro, y también «si». Las dos mandan el verbo al final, y si la frase empieza con ellas, la siguiente arranca con el verbo.",tabla:[["Als ich 10 war, …","Cuando tenía 10 años…"],["Wenn es regnet, …","Cuando (cada vez que) llueve…"],["Wenn ich Zeit habe, komme ich.","Si tengo tiempo, vengo."],["Als er kam, habe ich geschlafen.","Cuando llegó, yo dormía."]]},
  c:[["___ ich ein Kind war, hatte ich einen Hund.",["Als","Wenn","Wann"],"Cuando era chico tenía un perro.","Una vez en el pasado: als."],["___ es regnet, bleibe ich zu Hause.",["Wenn","Als","Wann"],"Cuando llueve me quedo en casa.","Algo que se repite: wenn."],["Wenn ich Zeit habe, ___ ich.",["komme","ich komme","kommen"],"Si tengo tiempo, vengo.","Después de la frase con wenn, primero el verbo."],["___ kommst du? (pregunta)",["Wann","Wenn","Als"],"¿Cuándo venís?","Para preguntar «¿cuándo?»: wann."]],
  d:[["Wo hast du gewohnt, als du Kind warst?","¿Dónde vivías cuando eras chico?",[["Als ich Kind war, habe ich in Rosario gewohnt.",null],["Wenn ich Kind war, habe ich in Rosario gewohnt.","Una etapa del pasado: als."],["Als ich war Kind, …","Con als, el verbo va al final: als ich Kind war."]]],
     ["Was machst du, wenn du frei hast?","¿Qué hacés cuando tenés el día libre?",[["Wenn ich frei habe, lese ich.",null],["Wenn ich frei habe, ich lese.","Después de la frase con wenn: lese ich."],["Als ich frei habe, lese ich.","Algo que se repite: wenn."]]],
     ["Wann bist du nach Wien gezogen?","¿Cuándo te mudaste a Viena?",[["Als ich zwölf war.",null],["Wenn ich zwölf war.","Una vez en el pasado: als."],["Wann ich zwölf war.","«wann» es solo para preguntar."]]]]},
