 {id:"de53", lvl:"C1", ic:"📰", t:"Er sagte, er sei…", sub:"Konjunktiv I: discurso indirecto",
  h:[["A","Der Minister sagte, er habe von nichts gewusst.","El ministro dijo que no sabía nada."],["B","Er behauptete auch, die Wirtschaft sei stabil.","También afirmó que la economía era estable."],["A","Laut Zeitung habe er das Geld schon ausgegeben.","Según el diario, ya habría gastado la plata."],["B","Die Opposition fordert, er solle zurücktreten.","La oposición exige que renuncie."],["A","Er meinte, das werde sich klären.","Dijo que eso se iba a aclarar."],["B","Das sagen sie alle.","Eso dicen todos."]],
  v:[["sei","sea (Konjunktiv I de sein)","📰","sai"],["habe","haya, tenga (Konj. I)","📰","jábe"],["werde","vaya a (Konj. I)","📰","vérde"],["behaupten","afirmar","🗣️","bejáupten"],["laut","según","📄","laut"],["fordern","exigir","📢","fórdern"],["zurücktreten","renunciar","🚪","tsurüktréten"],["die Wirtschaft","la economía","💹","di vírtshaft"],["ausgeben","gastar","💸","áusgueben"],["sich klären","aclararse","🔎","zij kléren"]],
  r:{t:"Konjunktiv I",x:"Lo usan diarios y noticieros para reproducir lo que dijo otro sin hacerse responsables. Se forma con la raíz + -e: er habe, er komme, er werde; sein es irregular: er sei. Si la forma coincide con el presente (wir haben), se usa el Konjunktiv II (wir hätten).",tabla:[["Er sagt, er sei krank.","Dice que está enfermo."],["Sie sagt, sie habe keine Zeit.","Dice que no tiene tiempo."],["Er sagte, er komme morgen.","Dijo que venía mañana."],["Er sagte, er habe es gesehen.","Dijo que lo había visto."],["Sie sagen, sie hätten Hunger.","Dicen que tienen hambre (Konj. II)."]]},
  c:[["Er sagt, er ___ müde.",["sei","ist","wäre sein"],"Dice que está cansado.","Konjunktiv I de sein: sei."],["Sie behauptet, sie ___ das Geld nicht.",["habe","hat","haben"],"Afirma que no tiene la plata.","Konjunktiv I: habe."],["Der Sprecher sagte, der Zug ___ später.",["komme","kommt","kam"],"El vocero dijo que el tren llegaría más tarde.","Konjunktiv I: komme."],["Laut Polizei ___ niemand verletzt worden.",["sei","ist","wäre gewesen"],"Según la policía, nadie resultó herido.","Konjunktiv I: sei … worden."]],
  d:[["Was hat der Chef gesagt?","¿Qué dijo el jefe?",[["Er sagte, das Meeting finde morgen statt.",null],["Er sagte, das Meeting findet morgen stattfindet.","Sobra una repetición: finde … statt."],["Er sagte, das Meeting sei morgen stattfinden.","Konjunktiv I de stattfinden: finde … statt."]]],
     ["Was steht in der Zeitung?","¿Qué dice el diario?",[["Der Präsident habe die Wahl verloren.",null],["Der Präsident hat die Wahl verloren haben.","Konjunktiv I: habe … verloren."],["Der Präsident sei die Wahl verloren.","verlieren va con haben: habe verloren."]]],
     ["Was sagen die Studenten?","¿Qué dicen los estudiantes?",[["Sie sagen, sie hätten keine Zeit.",null],["Sie sagen, sie haben keine Zeit gehabt sei.","Se mezclan formas: sie hätten keine Zeit."],["Sie sagen, sie habe keine Zeit.","Plural: como «haben» coincide con el presente, se usa hätten."]]]]},
 {id:"de54", lvl:"C1", ic:"🧬", t:"Die entwickelte Software", sub:"atributos de participio",
  h:[["A","Die von unserer Firma entwickelte Software ist ein Erfolg.","El software desarrollado por nuestra empresa es un éxito."],["B","Die im letzten Jahr eingeführten Änderungen haben geholfen.","Los cambios introducidos el año pasado ayudaron."],["A","Die ständig steigenden Kosten machen mir aber Sorgen.","Pero los costos en constante aumento me preocupan."],["B","Ein in Berlin lebender Investor will einsteigen.","Un inversor que vive en Berlín quiere entrar."],["A","Der vor zwei Wochen unterschriebene Vertrag sagt etwas anderes.","El contrato firmado hace dos semanas dice otra cosa."],["B","Diese Sätze sind länger als Felipes Lunge.","Estas oraciones son más largas que el pulmón de Felipe."]],
  v:[["entwickeln","desarrollar","💻","entvíkeln"],["einführen","introducir","📥","áinfüren"],["die Änderung","el cambio","🔄","di énderung"],["ständig","constantemente","♾️","shténdij"],["steigen","subir, aumentar","📈","shtáiguen"],["Sorgen machen","preocupar","😟","zórguen májen"],["der Investor","el inversor","💼","der invéstor"],["einsteigen","entrar (a un negocio)","🚪","áinshtaiguen"],["unterschreiben","firmar","✍️","untershráiben"],["der Satz","la oración","📝","der zats"]],
  r:{t:"El atributo extendido",x:"Típico del alemán escrito: en lugar de una oración de relativo, se pone todo ENTRE el artículo y el sustantivo. «die Software, die von uns entwickelt wurde» → «die von uns entwickelte Software». Truco para leer: saltá del artículo al sustantivo y después leé el medio.",tabla:[["der Mann, der dort steht → der dort stehende Mann","el hombre que está parado allí"],["das Buch, das gestern gekauft wurde → das gestern gekaufte Buch","el libro comprado ayer"],["die Preise, die steigen → die steigenden Preise","los precios en aumento"],["ein Kind, das schnell lernt → ein schnell lernendes Kind","un chico que aprende rápido"]]},
  c:[["Die ___ Preise sind ein Problem.",["steigenden","gestiegen","steigen"],"Los precios en aumento son un problema.","En curso: steigenden."],["Das ___ Auto war billig.",["gestern gekaufte","gestern kaufende","gekauft gestern"],"El auto comprado ayer fue barato.","Pasivo terminado: gekaufte."],["Der im Park ___ Hund gehört mir.",["spielende","gespielte","spielend"],"El perro que juega en el parque es mío.","En curso: spielende."],["Die von ihm ___ Rede war lang.",["gehaltene","haltende","gehalten"],"El discurso que dio fue largo.","Pasivo: gehaltene."]],
  d:[["Was bedeutet: „die von Goethe geschriebenen Briefe“?","¿Qué significa «die von Goethe geschriebenen Briefe»?",[["Die Briefe, die Goethe geschrieben hat.",null],["Die Briefe, die an Goethe geschrieben wurden.","von Goethe = por Goethe."],["Goethe, der die Briefe liest.","Es sobre las cartas, no sobre leerlas."]]],
     ["Wie sagt man kürzer: „die Kinder, die im Garten spielen“?","¿Cómo se dice más corto?",[["die im Garten spielenden Kinder",null],["die im Garten gespielten Kinder","Activo y en curso: spielenden."],["die spielenden im Garten Kinder","El complemento va antes del participio."]]],
     ["Was ist „ein oft unterschätztes Problem“?","¿Qué es «ein oft unterschätztes Problem»?",[["Ein Problem, das oft unterschätzt wird.",null],["Ein Problem, das oft unterschätzt.","Falta la pasiva: unterschätzt wird."],["Ein Problem, das andere oft unterschätzen lassen.","Más simple: das oft unterschätzt wird."]]]]},
 {id:"de55", lvl:"C1", ic:"🏛️", t:"Eine Entscheidung treffen", sub:"Funktionsverbgefüge",
  h:[["A","Wir müssen heute eine Entscheidung treffen.","Hoy tenemos que tomar una decisión."],["B","Ich möchte das Konzept nicht in Frage stellen, aber…","No quiero cuestionar el concepto, pero…"],["A","Die Firma stellt uns ein Budget zur Verfügung.","La empresa nos pone un presupuesto a disposición."],["B","Wir sollten auch die Risiken in Betracht ziehen.","También deberíamos tener en cuenta los riesgos."],["A","Der Plan tritt nächsten Monat in Kraft.","El plan entra en vigor el mes que viene."],["B","Dann nehmen wir das zur Kenntnis.","Entonces tomamos nota de eso."]],
  v:[["eine Entscheidung treffen","tomar una decisión","✅","áine entsháidung tréfen"],["in Frage stellen","cuestionar","❓","in fráge shtélen"],["zur Verfügung stellen","poner a disposición","🤲","tsur ferfúgung shtélen"],["in Betracht ziehen","tener en cuenta","🧐","in betrájt tsíen"],["in Kraft treten","entrar en vigor","⚖️","in kraft tréten"],["zur Kenntnis nehmen","tomar nota","📝","tsur kéntnis némen"],["Kritik üben","criticar","🗯️","kritíik üben"],["eine Rolle spielen","tener importancia","🎭","áine róle shpílen"],["zum Ausdruck bringen","expresar","💬","tsum áusdruk bríngen"],["Bescheid geben","avisar","📣","beshái gueben"]],
  r:{t:"Verbo + sustantivo fijo",x:"El alemán formal reemplaza verbos simples por combinaciones fijas de verbo «vacío» + sustantivo: entscheiden → eine Entscheidung treffen; kritisieren → Kritik üben; berücksichtigen → in Betracht ziehen. Suenan más serias y son obligatorias en textos de trabajo.",tabla:[["entscheiden → eine Entscheidung treffen","decidir"],["fragen → eine Frage stellen","preguntar"],["anwenden → zur Anwendung kommen","aplicarse"],["beenden → zum Abschluss bringen","concluir"],["helfen → Hilfe leisten","prestar ayuda"]]},
  c:[["Wir müssen eine Entscheidung ___.",["treffen","machen","nehmen"],"Tenemos que tomar una decisión.","Fijo: eine Entscheidung treffen."],["Das Gesetz tritt morgen in ___.",["Kraft","Macht","Wirkung"],"La ley entra en vigor mañana.","Fijo: in Kraft treten."],["Wir stellen Ihnen ein Auto zur ___.",["Verfügung","Hilfe","Nutzung"],"Le ponemos un auto a disposición.","Fijo: zur Verfügung stellen."],["Das Geld spielt keine ___.",["Rolle","Funktion","Figur"],"La plata no importa.","Fijo: eine Rolle spielen."]],
  d:[["Haben Sie die Kosten berücksichtigt?","¿Tuvo en cuenta los costos?",[["Ja, wir haben sie in Betracht gezogen.",null],["Ja, wir haben sie in Betracht genommen.","Fijo: in Betracht ziehen → gezogen."],["Ja, wir haben sie in Rechnung gezogen.","La expresión es «in Betracht ziehen»."]]],
     ["Sind Sie mit dem Plan einverstanden?","¿Está de acuerdo con el plan?",[["Ich möchte ihn nicht in Frage stellen, aber ich habe Zweifel.",null],["Ich möchte ihn nicht in Frage machen.","Fijo: in Frage stellen."],["Ich stelle ihn nicht in Frage, aber ich habe Zweifeln.","Plural de Zweifel: Zweifel."]]],
     ["Können Sie mir Bescheid sagen?","¿Me puede avisar?",[["Ich gebe Ihnen morgen Bescheid.",null],["Ich mache Ihnen morgen Bescheid.","Fijo: Bescheid geben."],["Ich gebe Sie morgen Bescheid.","Dativo: Ihnen."]]]]},
 {id:"de56", lvl:"C1", ic:"🔁", t:"Das lässt sich machen", sub:"alternativas a la pasiva",
  h:[["A","Lässt sich das Problem lösen?","¿Se puede resolver el problema?"],["B","Ja, das lässt sich machen.","Sí, se puede hacer."],["A","Aber die Kosten sind kaum zu kontrollieren.","Pero los costos casi no se pueden controlar."],["B","Das Dokument ist bis Freitag zu unterschreiben.","El documento hay que firmarlo hasta el viernes."],["A","Ist der Fehler reparierbar?","¿El error se puede reparar?"],["B","Leider nicht. Er ist unvermeidbar.","Lamentablemente no. Es inevitable."]],
  v:[["sich lassen + inf.","poder hacerse","🔁","zij lásen"],["sein + zu + inf.","hay que / se puede","📌","zain tsu"],["-bar","-ble (lesbar = legible)","🔠","bar"],["lösen","resolver","🧩","lœzen"],["kaum","apenas, casi no","🤏","kaum"],["kontrollieren","controlar","🎛️","kontrolíren"],["der Fehler","el error","❌","der féler"],["unvermeidbar","inevitable","🚧","unfermáitbar"],["machbar","factible","✅","májbar"],["unlesbar","ilegible","🖊️","únlesbar"]],
  r:{t:"Pasiva sin werden",x:"Tres formas muy usadas: 1) sich lassen + infinitivo = se puede (Das lässt sich ändern). 2) sein + zu + infinitivo = hay que / se puede (Das ist zu erledigen). 3) adjetivos en -bar = -ble (machbar, essbar, unvermeidbar).",tabla:[["Das lässt sich reparieren.","Se puede reparar."],["Die Rechnung ist sofort zu bezahlen.","La factura hay que pagarla ya."],["Das Problem ist nicht zu lösen.","El problema no tiene solución."],["Das Wasser ist trinkbar.","El agua es potable."],["Das ist machbar.","Es factible."]]},
  c:[["Das Fenster ___ sich nicht öffnen.",["lässt","ist","wird"],"La ventana no se puede abrir.","sich lassen + infinitivo."],["Die Formulare sind bis Montag ___.",["abzugeben","abgegeben","abgeben"],"Los formularios hay que entregarlos hasta el lunes.","sein + zu: abzugeben."],["Dieser Pilz ist nicht ___.",["essbar","essend","gegessen"],"Este hongo no es comestible.","-bar = -ble."],["Das Projekt ist ___.",["machbar","machlich","gemacht bar"],"El proyecto es factible.","machen → machbar."]],
  d:[["Kann man das ändern?","¿Se puede cambiar?",[["Ja, das lässt sich ändern.",null],["Ja, das lässt ändern.","Falta sich: lässt sich ändern."],["Ja, das ist ändern.","Se dice: das lässt sich ändern / ist zu ändern."]]],
     ["Muss man das sofort bezahlen?","¿Hay que pagarlo ya?",[["Ja, die Rechnung ist sofort zu bezahlen.",null],["Ja, die Rechnung ist sofort bezahlen.","Falta zu."],["Ja, die Rechnung hat sofort zu bezahlen.","Con sentido pasivo: ist zu bezahlen."]]],
     ["Kann man die Schrift lesen?","¿Se puede leer la letra?",[["Nein, sie ist völlig unlesbar.",null],["Nein, sie ist völlig unlesend.","-ble = -bar: unlesbar."],["Nein, sie ist völlig ungelesen.","ungelesen = no leído."]]]]},
 {id:"de57", lvl:"C1", ic:"🕵️", t:"Er soll reich sein", sub:"modales subjetivos",
  h:[["A","Der neue Nachbar soll Millionär sein.","Dicen que el vecino nuevo es millonario."],["B","Er will früher Fußballprofi gewesen sein.","Él afirma haber sido futbolista profesional."],["A","Das muss gelogen sein. Er kann kaum laufen.","Eso tiene que ser mentira. Apenas puede caminar."],["B","Er dürfte so um die sechzig sein.","Debe de tener unos sesenta."],["A","Er könnte natürlich auch einfach Glück gehabt haben.","Claro que también podría simplemente haber tenido suerte."],["B","Oder er mag ein Spion sein.","O quizá sea un espía."]],
  v:[["sollen (subjetivo)","dicen que","👂","zólen"],["wollen (subjetivo)","afirma que (él mismo)","🙋","vólen"],["müssen (subjetivo)","tiene que (seguro)","✔️","músen"],["dürfte","debe de (probable)","🎯","dúrfte"],["könnte","podría (posible)","🤔","kœnte"],["mögen (subjetivo)","quizá, puede que","🤷","mœguen"],["lügen → gelogen","mentir","🤥","lüguen / guelóguen"],["der Spion","el espía","🕵️","der shpióon"],["der Profi","el profesional","⚽","der prófi"],["um die sechzig","alrededor de sesenta","🔢","um di zéjtsij"]],
  r:{t:"Modales para suposiciones y rumores",x:"Los modales también expresan qué tan seguro estás: muss (casi seguro) > dürfte (probable) > könnte / mag (posible). «soll» = lo dicen otros (rumor). «will» = lo afirma el propio sujeto (dudoso). Pasado: modal + participio + sein/haben.",tabla:[["Er muss krank sein.","Tiene que estar enfermo."],["Sie dürfte bald kommen.","Probablemente llegue pronto."],["Er soll sehr reich sein.","Dicen que es muy rico."],["Sie will alles gewusst haben.","Afirma que sabía todo."],["Das kann nicht wahr sein.","No puede ser cierto."]]},
  c:[["Man sagt, er sei reich. → Er ___ reich sein.",["soll","will","muss"],"Dicen que es rico.","Rumor: soll."],["Er behauptet, er sei Arzt. → Er ___ Arzt sein.",["will","soll","darf"],"Él afirma que es médico.","El propio sujeto: will."],["Es ist sehr wahrscheinlich. → Das ___ stimmen.",["dürfte","sollte","wollte"],"Probablemente sea cierto.","Probable: dürfte."],["Das Licht ist aus. Sie ___ schon schlafen.",["müssen","sollen","wollen"],"La luz está apagada. Ya deben de estar durmiendo.","Casi seguro: müssen."]],
  d:[["Stimmt es, dass der Chef kündigt?","¿Es cierto que el jefe renuncia?",[["Er soll nächsten Monat gehen.",null],["Er will nächsten Monat gehen, sagen alle.","Si lo dicen otros: soll."],["Er muss nächsten Monat gehen, glaube ich.","muss es casi certeza; para rumor: soll."]]],
     ["Wie alt ist der Professor?","¿Cuántos años tiene el profesor?",[["Er dürfte um die siebzig sein.",null],["Er darf um die siebzig sein.","Suposición: dürfte (Konjunktiv)."],["Er dürfte um die siebzig ist.","Infinitivo al final: sein."]]],
     ["Hat er das Geld gestohlen?","¿Robó la plata?",[["Er soll es gestohlen haben.",null],["Er soll es gestohlen sein.","stehlen va con haben: gestohlen haben."],["Er soll es stehlen haben.","Participio: gestohlen."]]]]},
 {id:"de58", lvl:"C1", ic:"🧷", t:"Infolgedessen…", sub:"conectores formales",
  h:[["A","Die Nachfrage ist gesunken. Infolgedessen müssen wir sparen.","La demanda bajó. En consecuencia, tenemos que ahorrar."],["B","Sofern die Zahlen stimmen, stimme ich zu.","Siempre que los números sean correctos, estoy de acuerdo."],["A","Wir sparen, indem wir weniger reisen.","Ahorramos viajando menos."],["B","Dennoch sollten wir in Werbung investieren.","No obstante, deberíamos invertir en publicidad."],["A","Zumal die Konkurrenz stark ist.","Máxime cuando la competencia es fuerte."],["B","Somit wäre alles geklärt.","Con lo cual todo quedaría aclarado."]],
  v:[["infolgedessen","en consecuencia","➡️","infólguedesen"],["sofern","siempre que","📜","zoférn"],["indem","(haciendo algo) = gerundio","🛠️","indéem"],["dennoch","no obstante","↩️","dénoj"],["zumal","máxime cuando","➕","tsumál"],["somit","con lo cual","∴","zomít"],["die Nachfrage","la demanda","📊","di nájfrague"],["die Konkurrenz","la competencia","🥊","di konkuréns"],["die Werbung","la publicidad","📣","di vérbung"],["sparen","ahorrar","🐷","shpáren"]],
  r:{t:"Conectores del alemán culto",x:"Subordinantes (verbo al final): sofern (siempre que), indem (+ gerundio español: Man lernt, indem man übt = se aprende practicando), zumal (máxime cuando), sodass (de modo que). Adverbios (verbo en posición 2): infolgedessen, dennoch, somit, folglich.",tabla:[["Man lernt, indem man spricht.","Se aprende hablando."],["Sofern es möglich ist, …","Siempre que sea posible…"],["Es regnete, sodass wir blieben.","Llovió, de modo que nos quedamos."],["Er war krank. Dennoch kam er.","Estaba enfermo. No obstante, vino."],["Infolgedessen sanken die Preise.","En consecuencia, bajaron los precios."]]},
  c:[["Man verbessert sein Deutsch, ___ man viel liest.",["indem","sofern","dennoch"],"Se mejora el alemán leyendo mucho.","Modo: indem."],["Er war müde. ___ arbeitete er weiter.",["Dennoch","Indem","Sofern"],"Estaba cansado. No obstante, siguió trabajando.","Contraste: dennoch."],["___ Sie Fragen haben, rufen Sie an.",["Sofern","Dennoch","Somit"],"Siempre que tenga preguntas, llame.","Condición: sofern."],["Die Kosten stiegen. Infolgedessen ___ die Preise.",["stiegen","die Preise stiegen","steigen die"],"Los costos subieron. En consecuencia, subieron los precios.","Adverbio + verbo en posición 2."]],
  d:[["Wie kann man Geld sparen?","¿Cómo se puede ahorrar?",[["Indem man weniger auswärts isst.",null],["Indem man isst weniger auswärts.","Con indem: verbo al final."],["Dennoch man weniger isst.","Modo: indem + verbo al final."]]],
     ["Kommst du zum Meeting?","¿Venís a la reunión?",[["Sofern ich rechtzeitig fertig bin, ja.",null],["Sofern bin ich rechtzeitig fertig, ja.","Con sofern: verbo al final."],["Somit ich fertig bin, ja.","Condición: sofern."]]],
     ["Der Umsatz ist gefallen. Und dann?","Cayeron las ventas. ¿Y entonces?",[["Infolgedessen mussten wir Personal abbauen.",null],["Infolgedessen wir mussten Personal abbauen.","Verbo en posición 2: mussten wir."],["Indem mussten wir Personal abbauen.","Consecuencia: infolgedessen."]]]]},
 {id:"de59", lvl:"C1", ic:"⚖️", t:"Hinsichtlich…", sub:"preposiciones formales",
  h:[["A","Aufgrund der aktuellen Lage verschieben wir das Treffen.","Debido a la situación actual, posponemos la reunión."],["B","Angesichts der Kosten ist das sinnvoll.","Ante los costos, tiene sentido."],["A","Bezüglich Ihrer Anfrage melde ich mich morgen.","Con respecto a su consulta, me comunico mañana."],["B","Hinsichtlich des Budgets gibt es noch Fragen.","En cuanto al presupuesto, todavía hay preguntas."],["A","Laut Vertrag zahlen wir innerhalb von 30 Tagen.","Según el contrato, pagamos dentro de los 30 días."],["B","Mangels Informationen kann ich nichts sagen.","Por falta de información no puedo decir nada."]],
  v:[["aufgrund","debido a","🔎","aufgrúnt"],["angesichts","ante, en vista de","👁️","ánguezijts"],["bezüglich","con respecto a","📌","betsúglij"],["hinsichtlich","en cuanto a","🎯","jínzijtlij"],["mangels","por falta de","🕳️","mánguels"],["zufolge","según (va detrás)","📄","tsufólgue"],["die Lage","la situación","🌐","di lágue"],["sinnvoll","sensato, lógico","💡","zínfol"],["die Anfrage","la consulta","❓","di ánfrague"],["sich melden","comunicarse","📞","zij mélden"]],
  r:{t:"Preposiciones de genitivo del alemán formal",x:"En cartas, contratos y noticias se usan preposiciones que piden genitivo: aufgrund, angesichts, bezüglich, hinsichtlich, mangels, infolge. «laut» y «zufolge» significan «según» (zufolge va después del sustantivo, con dativo: dem Bericht zufolge).",tabla:[["aufgrund des Wetters","debido al clima"],["angesichts der Krise","en vista de la crisis"],["bezüglich Ihres Schreibens","con respecto a su carta"],["mangels Beweisen","por falta de pruebas"],["dem Bericht zufolge","según el informe"]]},
  c:[["___ des Streiks fällt der Zug aus.",["Aufgrund","Bezüglich","Laut"],"Debido a la huelga, se cancela el tren.","Causa: aufgrund."],["___ Ihrer Frage: Wir öffnen um neun.",["Bezüglich","Mangels","Aufgrund"],"Con respecto a su pregunta: abrimos a las nueve.","Referencia: bezüglich."],["Dem Bericht ___ ist die Lage stabil.",["zufolge","laut","gemäß nach"],"Según el informe, la situación es estable.","Detrás: zufolge."],["___ Beweisen wurde er freigesprochen.",["Mangels","Angesichts","Bezüglich"],"Por falta de pruebas, fue absuelto.","Falta: mangels."]],
  d:[["Warum wurde das Konzert abgesagt?","¿Por qué se canceló el recital?",[["Aufgrund der schlechten Wetterlage.",null],["Aufgrund die schlechte Wetterlage.","Genitivo: der schlechten Wetterlage."],["Wegen aufgrund des Wetters.","Se usa una sola: aufgrund des Wetters."]]],
     ["Worum geht es in Ihrer E-Mail?","¿De qué se trata su mail?",[["Bezüglich unseres Termins möchte ich etwas fragen.",null],["Bezüglich unser Termin möchte ich fragen.","Genitivo: unseres Termins."],["Bezüglich unseres Termins ich möchte fragen.","Verbo en posición 2: möchte ich."]]],
     ["Was sagt die Studie?","¿Qué dice el estudio?",[["Der Studie zufolge schlafen wir zu wenig.",null],["Der Studie zufolge wir schlafen zu wenig.","Verbo en posición 2."],["Zufolge der Studie schlafen wir wenig.","zufolge va después: der Studie zufolge."]]]]},
 {id:"de60", lvl:"C1", ic:"🎓", t:"Im Folgenden…", sub:"presentaciones académicas",
  h:[["A","Im Folgenden möchte ich Ihnen die Ergebnisse unserer Studie vorstellen.","A continuación, quisiera presentarles los resultados de nuestro estudio."],["A","Zunächst gehe ich auf die Methode ein.","En primer lugar, me refiero al método."],["A","Wie aus der Grafik hervorgeht, ist die Zahl gestiegen.","Como se desprende del gráfico, la cifra aumentó."],["A","Daraus lässt sich schließen, dass die Maßnahme wirkt.","De ello se puede concluir que la medida funciona."],["A","Zusammenfassend lässt sich sagen, dass weitere Forschung nötig ist.","En resumen, puede decirse que hace falta más investigación."],["B","Vielen Dank für den spannenden Vortrag.","Muchas gracias por la interesante exposición."]],
  v:[["im Folgenden","a continuación","⬇️","im fólguenden"],["zunächst","en primer lugar","1️⃣","tsunéjst"],["eingehen auf","referirse a","🎯","áingueen auf"],["hervorgehen aus","desprenderse de","📊","jerfórgueen aus"],["schließen aus","concluir de","∴","shlísen aus"],["zusammenfassend","en resumen","🧾","tsuzámenfasent"],["das Ergebnis","el resultado","📈","das ergébnis"],["die Maßnahme","la medida","🛠️","di másname"],["die Forschung","la investigación","🔬","di fórshung"],["der Vortrag","la exposición, la charla","🎤","der fórtrak"]],
  r:{t:"Estructurar una exposición",x:"Introducción: Im Folgenden möchte ich… / In meinem Vortrag geht es um… Orden: Zunächst… Anschließend… Abschließend… Datos: Wie aus der Grafik hervorgeht… Conclusión: Zusammenfassend lässt sich sagen, dass… / Daraus folgt, dass…",tabla:[["In meinem Vortrag geht es um…","Mi exposición trata sobre…"],["Zunächst… anschließend… abschließend…","Primero… luego… finalmente…"],["Wie aus Tabelle 2 hervorgeht…","Como se desprende de la tabla 2…"],["Daraus folgt, dass…","De ello se sigue que…"],["Zusammenfassend lässt sich sagen…","En resumen, puede decirse…"]]},
  c:[["Im ___ stelle ich die Ergebnisse vor.",["Folgenden","Folge","Folgendes"],"A continuación presento los resultados.","Fórmula: im Folgenden."],["Wie aus der Tabelle ___, …",["hervorgeht","herausgeht","vorgeht"],"Como se desprende de la tabla…","hervorgehen aus."],["___ lässt sich sagen, dass es funktioniert.",["Zusammenfassend","Zusammenfassen","Zusammengefasst sich"],"En resumen, puede decirse que funciona.","Adverbio: zusammenfassend."],["Zunächst gehe ich ___ die Methode ein.",["auf","an","über"],"En primer lugar me refiero al método.","eingehen auf."]],
  d:[["Wie beginnen Sie Ihren Vortrag?","¿Cómo empieza su exposición?",[["In meinem Vortrag geht es um erneuerbare Energien.",null],["In meinem Vortrag geht um erneuerbare Energien.","Falta es: geht es um."],["Mein Vortrag geht es um Energie.","Se dice: In meinem Vortrag geht es um…"]]],
     ["Was zeigt die Grafik?","¿Qué muestra el gráfico?",[["Aus der Grafik geht hervor, dass die Kosten sinken.",null],["Aus der Grafik geht hervor, dass die Kosten sinken hervor.","Sobra el segundo hervor."],["Die Grafik geht hervor die Kosten.","Se dice: Aus der Grafik geht hervor, dass…"]]],
     ["Was ist Ihr Fazit?","¿Cuál es su conclusión?",[["Daraus folgt, dass wir mehr investieren sollten.",null],["Daraus folgt, dass wir sollten mehr investieren.","Con dass: verbo al final."],["Daraus folgt, wir mehr investieren sollten.","Falta dass o el orden: …, dass wir … sollten."]]]]},
 {id:"de61", lvl:"C1", ic:"🕊️", t:"Wären Sie bereit…?", sub:"negociación diplomática",
  h:[["A","Wären Sie bereit, uns beim Preis entgegenzukommen?","¿Estaría dispuesto a hacernos una concesión en el precio?"],["B","Unter Umständen ließe sich das einrichten.","Eventualmente podría arreglarse."],["A","Ich würde vorschlagen, dass wir uns in der Mitte treffen.","Yo propondría que nos encontremos a mitad de camino."],["B","Das klingt vernünftig, vorausgesetzt, Sie bestellen mehr.","Suena razonable, siempre y cuando pidan más."],["A","Damit könnten wir leben.","Con eso podríamos vivir."],["B","Dann wären wir uns einig.","Entonces estaríamos de acuerdo."]],
  v:[["bereit sein","estar dispuesto","🙋","beráit zain"],["entgegenkommen","hacer una concesión","🤝","entguéguenkomen"],["unter Umständen","eventualmente","🌥️","únter úmshtenden"],["einrichten","arreglar, organizar","🛠️","áinrijten"],["vorschlagen","proponer","💡","fórshlaguen"],["sich in der Mitte treffen","encontrarse a mitad de camino","↔️","zij in der míte tréfen"],["vernünftig","razonable","🧠","fernünftij"],["vorausgesetzt","siempre y cuando","📜","foráusguezetst"],["sich einig sein","estar de acuerdo","✅","zij áinij zain"],["das Angebot","la oferta","🏷️","das ánguebot"]],
  r:{t:"El Konjunktiv II como cortesía",x:"En una negociación alemana, el Konjunktiv II suaviza todo: Wären Sie bereit…? / Ich würde vorschlagen… / Das ließe sich einrichten. Condiciones: vorausgesetzt (, dass)… / unter der Bedingung, dass…",tabla:[["Wären Sie bereit, …?","¿Estaría dispuesto a…?"],["Ich würde vorschlagen, …","Yo propondría…"],["Das ließe sich machen.","Eso podría hacerse."],["vorausgesetzt, dass…","siempre y cuando…"],["Damit wären wir einverstanden.","Con eso estaríamos de acuerdo."]]},
  c:[["___ Sie bereit, den Preis zu senken?",["Wären","Sind","Waren"],"¿Estaría dispuesto a bajar el precio?","Cortesía: Wären."],["Ich ___ vorschlagen, morgen weiterzumachen.",["würde","werde","wurde"],"Propondría seguir mañana.","Cortesía: würde."],["Das ___ sich einrichten.",["ließe","lässt sich","ließ"],"Eso podría arreglarse.","Konjunktiv de lassen: ließe."],["Wir akzeptieren, ___, dass Sie pünktlich liefern.",["vorausgesetzt","vorgesetzt","voraussetzen"],"Aceptamos, siempre que entreguen a tiempo.","Condición: vorausgesetzt."]],
  d:[["Unser Preis liegt bei 50 Euro.","Nuestro precio es de 50 euros.",[["Wären Sie bereit, auf 45 Euro zu gehen?",null],["Sind Sie bereit auf 45 gehen?","Falta zu y la cortesía: Wären Sie bereit, … zu gehen?"],["Geben Sie mir 45, sonst gehe ich.","Muy brusco para negociar."]]],
     ["Wie lösen wir das?","¿Cómo lo resolvemos?",[["Ich würde vorschlagen, dass wir uns in der Mitte treffen.",null],["Ich würde vorschlagen, dass wir treffen uns in der Mitte.","Con dass: verbo al final."],["Ich schlage vorschlagen, …","Se dice: Ich würde vorschlagen…"]]],

 {id:"de62", lvl:"C1", ic:"🧩", t:"ver-, zer-, ent-", sub:"formación de palabras",
  h:[["A","Ich habe mich verlaufen.","Me perdí (caminando)."],["B","Und ich habe den Schlüssel verloren.","Y yo perdí la llave."],["A","Der Hund hat die Zeitung zerrissen.","El perro destrozó el diario."],["B","Wir müssen uns entscheiden: bleiben oder gehen?","Tenemos que decidirnos: ¿quedarnos o irnos?"],["A","Ich entschuldige mich für die Verspätung.","Pido disculpas por la demora."],["B","Du hast dich wieder verschlafen, oder?","Te quedaste dormido otra vez, ¿no?"]],
  v:[["ver- (error)","hacer mal","❌","fer"],["sich verlaufen","perderse caminando","🧭","zij ferláufen"],["sich verschlafen","quedarse dormido","😴","zij fershláfen"],["sich versprechen","trabarse al hablar","👄","zij fershpréjen"],["zer- (destrucción)","romper en pedazos","💥","tser"],["zerreißen","desgarrar, destrozar","📰","tserráisen"],["zerbrechen","romperse en pedazos","🍽️","tserbréjen"],["ent- (quitar, salir)","des-","🔓","ent"],["entkommen","escaparse","🏃","entkómen"],["entdecken","descubrir","🔍","entdéken"]],
  r:{t:"Prefijos que cambian el sentido",x:"Los prefijos inseparables son pistas de significado. ver- = equivocarse o cambiar (sich verlaufen, sich verrechnen); zer- = romper en pedazos (zerreißen, zerstören); ent- = quitar o alejarse (entkommen, entfernen). be- vuelve transitivo un verbo (antworten auf → beantworten).",tabla:[["rechnen → sich verrechnen","calcular → equivocarse al calcular"],["brechen → zerbrechen","romper → hacer añicos"],["decken → entdecken","cubrir → descubrir"],["antworten auf → beantworten","responder a → responder algo"],["fahren → sich verfahren","manejar → perderse manejando"]]},
  c:[["Ich habe mich im Wald ___.",["verlaufen","zerlaufen","entlaufen"],"Me perdí en el bosque.","Error al caminar: sich verlaufen."],["Das Glas ist ___.",["zerbrochen","verbrochen","entbrochen"],"El vaso se hizo añicos.","Destrucción: zer-."],["Kolumbus hat Amerika ___.",["entdeckt","verdeckt","zerdeckt"],"Colón descubrió América.","ent- + decken: entdecken."],["Bitte ___ Sie die Frage.",["beantworten","antworten","verantworten"],"Por favor, responda la pregunta.","be- vuelve transitivo: beantworten."]],
  d:[["Warum kommst du so spät?","¿Por qué llegás tan tarde?",[["Ich habe mich verfahren.",null],["Ich habe mich zerfahren.","Perderse manejando: sich verfahren."],["Ich bin mich verfahren.","Reflexivo con haben: Ich habe mich verfahren."]]],
     ["Was ist mit dem Brief passiert?","¿Qué pasó con la carta?",[["Der Hund hat ihn zerrissen.",null],["Der Hund hat ihn verrissen.","verreißen = criticar duramente. Destrozar: zerreißen."],["Der Hund hat ihn entrissen.","entreißen = arrebatar."]]],

  r:{t:"La 3ª declinación",x:"El nominativo es irregular; la raíz real aparece en el genitivo (rēx → rēg-is). Por eso se aprende de a dos: rēx, rēgis. Desde esa raíz: acusativo -em, ablativo -e, plural -ēs.",tabla:[["rēx","el rey (sujeto)"],["rēgem","al rey (objeto)"],["rēgis","del rey"],["rēge","con / por el rey"],["rēgēs","los reyes (sujeto u objeto)"],["mīles → mīlitem","soldado → al soldado"]]},

  r:{t:"El genitivo: «de»",x:"Para decir «de quién» el latín cambia la terminación, sin preposición: 1ª -ae (puellae = de la chica), 2ª -ī (Mārcī = de Marco), 3ª -is (mīlitis = del soldado). Se oye en el español: «amor patriae».",tabla:[["puella → puellae","de la chica"],["dominus → dominī","del amo"],["rēx → rēgis","del rey"],["fīlius Mārcī","el hijo de Marco"],["amor patriae","el amor de la patria"]]},

 {id:"la27", lvl:"B1", ic:"🪞", t:"Laudor", sub:"voz pasiva: presente",

  v:[["laudātur","es elogiado","👏","laudátur"],["laudor","soy elogiado","🙋","láudor"],["laudāris","sos elogiado","👉","laudáris"],["leguntur","son leídos","📚","legúntur"],["ā / ab + abl.","por (agente)","👤","a / ab"],["vituperāre","criticar, reprochar","👎","uituperáre"],["quia","porque","❓","kúia"],["numquam","nunca","🚫","númkuam"],["saepe","a menudo","🔁","sáipe"],["laudārī","ser elogiado (inf.)","✨","laudári"]],
  r:{t:"La pasiva en presente",x:"El latín forma la pasiva cambiando la terminación: -or, -ris, -tur, -mur, -minī, -ntur. amō (amo) → amor (soy amado). El agente va con ā / ab + ablativo. Infinitivo pasivo: amārī, vidērī, audīrī; en la 3ª: legī.",tabla:[["amor","soy amado"],["amāris","sos amado"],["amātur","es amado"],["amāmur","somos amados"],["amantur","son amados"],["ā magistrō laudātur","es elogiado por el maestro"]]},
  c:[["Puella ā mātre ___.",["amātur","amat","amant"],"La chica es amada por la madre.","Pasiva 3ª sg.: -tur."],["Librī ā puerīs ___.",["leguntur","legunt","legitur"],"Los libros son leídos por los chicos.","Pasiva 3ª pl.: -ntur."],["Mārcus ___ magistrō laudātur.",["ā","cum","in"],"Marco es elogiado por el maestro.","Agente: ā + ablativo."],["Ego ab omnibus ___.",["videor","videō","vidētur"],"Soy visto por todos.","Pasiva 1ª sg.: -or."]],
  d:[["Ā quō laudāris?","¿Por quién sos elogiado?",[["Ā magistrō laudor.",null],["Ā magister laudor.","ā + ablativo: magistrō."],["Ā magistrō laudō.","Pasiva: laudor."]]],
     ["Quid ā puerīs legitur?","¿Qué leen los chicos?",[["Fābula ā puerīs legitur.",null],["Fābulam ā puerīs legitur.","En pasiva, lo leído es sujeto: fābula."],["Fābula ā puerī legitur.","Agente plural: ā puerīs."]]],

 {id:"la28", lvl:"B1", ic:"🏛️", t:"Rōma condita est", sub:"pasiva perfecta y participio",
  h:[["A","Quandō Rōma condita est?","¿Cuándo fue fundada Roma?"],["B","Rōma anno DCCLIII ante Chrīstum condita est.","Roma fue fundada en el año 753 a. C."],["A","Carthāgō ā Rōmānīs dēlēta est.","Cartago fue destruida por los romanos."],["B","Et Caesar ā Brūtō necātus est.","Y César fue asesinado por Bruto."],["A","Librum ā Cicerōne scrīptum legī.","Leí un libro escrito por Cicerón."],["B","Nōs vīctī nōn sumus!","¡No hemos sido vencidos!"]],
  v:[["condita est","fue fundada","🏛️","kóndita est"],["dēlēta est","fue destruida","💥","deléta est"],["necātus est","fue asesinado","🗡️","nekátus est"],["scrīptus, -a, -um","escrito","✍️","skríptus"],["vīctus, -a, -um","vencido","🏳️","uíktus"],["captus, -a, -um","capturado, tomado","⛓️","káptus"],["ante Chrīstum","antes de Cristo","✝️","ánte krístum"],["annus","el año","📅","ánnus"],["Carthāgō","Cartago","🏚️","kartágo"],["Cicerō, -ōnis","Cicerón","🎤","kíkero"]],
  r:{t:"Participio perfecto pasivo",x:"El PPP (amātus, -a, -um) funciona como adjetivo: concuerda en género, número y caso. Con sum forma la pasiva perfecta: amātus sum = fui amado. De ahí vienen muchas palabras: scrīptum → escrito, factum → hecho, captus → cautivo.",tabla:[["amātus / amāta sum","fui amado / amada"],["laudātus est","fue elogiado"],["urbs capta est","la ciudad fue tomada"],["hostēs vīctī sunt","los enemigos fueron vencidos"],["liber scrīptus","un libro escrito"]]},
  c:[["Urbs ā mīlitibus capta ___.",["est","sunt","erat"],"La ciudad fue tomada por los soldados.","Singular: est."],["Carthāgō ___ est.",["dēlēta","dēlētus","dēlētum"],"Cartago fue destruida.","Carthāgō es femenino: -a."],["Hostēs ___ sunt.",["vīctī","vīctus","vīcta"],"Los enemigos fueron vencidos.","Masc. plural: -ī."],["Epistulam ā Caesare ___ legō.",["scrīptam","scrīptus","scrīpta"],"Leo una carta escrita por César.","Concuerda con epistulam (acus. fem.): scrīptam."]],
  d:[["Ā quō Caesar necātus est?","¿Por quién fue asesinado César?",[["Ā Brūtō et Cassiō.",null],["Ā Brūtus et Cassius.","ā + ablativo: Brūtō, Cassiō."],["Brūtum et Cassium.","Agente: ā + ablativo."]]],
     ["Quandō Rōma condita est?","¿Cuándo fue fundada Roma?",[["Annō DCCLIII ante Chrīstum.",null],["Annum DCCLIII.","Tiempo «cuándo»: ablativo, annō."],["Annō DCCLIII post Chrīstum.","Fue antes de Cristo: ante."]]],
     ["Quid ā Rōmānīs dēlētum est?","¿Qué fue destruido por los romanos?",[["Carthāgō dēlēta est.",null],["Carthāgō dēlētum est.","Carthāgō es femenino: dēlēta."],["Carthāginem dēlēta est.","Sujeto en nominativo: Carthāgō."]]]]},
 {id:"la29", lvl:"B1", ic:"🎭", t:"Loquor, sequor", sub:"verbos deponentes",
  h:[["A","Quid loqueris, amīce?","¿Qué decís, amigo?"],["B","Dē Graeciā loquor. Crās proficīscor.","Hablo de Grecia. Mañana parto."],["A","Sequarne tē?","¿Te sigo?"],["B","Sequere mē! Nāvem cōnscendēmus.","¡Seguime! Subiremos a la nave."],["A","Timeō mare. Moriar!","Le temo al mar. ¡Voy a morir!"],["B","Nōlī verērī. Omnēs aliquandō moriuntur.","No temas. Todos mueren alguna vez."]],
  v:[["loquor, loquī","hablar","🗣️","lókuor"],["sequor, sequī","seguir","👣","sékuor"],["proficīscor","partir","🚢","profikískor"],["hortor, hortārī","exhortar, animar","📣","jórtor"],["morior, morī","morir","💀","mórior"],["nāscor, nāscī","nacer","👶","náskor"],["vereor, verērī","temer","😨","uéreor"],["ūtor, ūtī + abl.","usar","🛠️","útor"],["nāvis, nāvis","la nave","⛵","náuis"],["aliquandō","alguna vez","🌀","alikuándo"]],
  r:{t:"Los deponentes",x:"Tienen forma pasiva pero significado ACTIVO: loquor = hablo (no «soy hablado»). Hay que reconocerlos en el diccionario porque su enunciado termina en -or. Imperativo: sequere! (¡seguí!). Muchos dieron palabras españolas: loquaz, secuencia, nacer, muerte.",tabla:[["loquor","hablo"],["loqueris","hablás"],["loquitur","habla"],["loquimur","hablamos"],["loquuntur","hablan"],["locūtus sum","hablé"]]},
  c:[["Quid ___, Mārce?",["loqueris","loquis","loquitur"],"¿Qué decís, Marco?","2ª sg. deponente: -ris."],["Canis dominum ___.",["sequitur","sequit","sequunt"],"El perro sigue a su dueño.","3ª sg.: sequitur."],["Omnēs hominēs ___.",["moriuntur","moriunt","moritur"],"Todos los hombres mueren.","3ª pl.: -ntur."],["Rōmānī gladiīs ___.",["ūtuntur","ūtunt","ūtitur"],"Los romanos usan espadas.","ūtor + ablativo: gladiīs."]],
  d:[["Quis loquitur?","¿Quién habla?",[["Magister loquitur.",null],["Magister loquit.","Deponente: loquitur."],["Magister loquitur ā puerīs.","Es activo: no lleva agente."]]],
     ["Quandō nātus es?","¿Cuándo naciste?",[["Annō MM nātus sum.",null],["Annō MM nāscō.","Deponente en perfecto: nātus sum."],["Annum MM nātus sum.","Tiempo: ablativo, annō."]]],

 {id:"la30", lvl:"B1", ic:"⚔️", t:"Urbe captā…", sub:"ablativo absoluto",
  h:[["A","Urbe captā, mīlitēs gaudēbant.","Tomada la ciudad, los soldados se alegraban."],["B","Caesare duce, Rōmānī semper vincēbant.","Con César como jefe, los romanos siempre vencían."],["A","Sōle oriente, exercitus profectus est.","Al salir el sol, el ejército partió."],["B","Hostibus fugātīs, pāx facta est.","Puestos en fuga los enemigos, se hizo la paz."],["A","Mē vīvō, hoc nōn fīet!","¡Mientras yo viva, esto no sucederá!"],["B","Philippō fūmante, nēmō respīrat.","Con Felipe fumando, nadie respira."]],
  v:[["urbe captā","tomada la ciudad","🏰","úrbe kápta"],["dux, ducis","el jefe","🎖️","duks, dúkis"],["sōl orīēns","el sol naciente","🌅","sol óriens"],["exercitus","el ejército","🛡️","eksérkitus"],["hostis, hostis","el enemigo","⚔️","jóstis"],["fugāre","poner en fuga","🏃","fugáre"],["pāx, pācis","la paz","🕊️","paks"],["mē vīvō","mientras yo viva","💓","me uíuo"],["gaudēre","alegrarse","😃","gaudére"],["fīet","sucederá","🔮","fíet"]],
  r:{t:"El ablativo absoluto",x:"Una construcción muy romana: sustantivo + participio en ABLATIVO, separados del resto de la frase, que indican cuándo, por qué o cómo pasó algo. Se traduce libremente: «urbe captā» = tomada la ciudad / cuando la ciudad fue tomada / después de tomar la ciudad.",tabla:[["urbe captā","tomada la ciudad"],["Caesare duce","con César como jefe"],["sōle oriente","al salir el sol"],["hostibus vīctīs","vencidos los enemigos"],["Cicerōne cōnsule","siendo cónsul Cicerón"]]},
  c:[["Urbe ___, cīvēs fūgērunt.",["captā","capta","captam"],"Tomada la ciudad, los ciudadanos huyeron.","Ablativo: captā."],["___ duce, vīcimus.",["Caesare","Caesar","Caesarem"],"Con César como jefe, vencimos.","Ablativo: Caesare."],["Hostibus ___, pāx venit.",["vīctīs","vīctī","vīctōs"],"Vencidos los enemigos, llegó la paz.","Ablativo plural: vīctīs."],["Sōle ___, surgimus.",["oriente","oriēns","orientem"],"Al salir el sol, nos levantamos.","Participio presente en ablativo: oriente."]],
  d:[["Quid fēcērunt mīlitēs urbe captā?","¿Qué hicieron los soldados tomada la ciudad?",[["Gaudēbant et cantābant.",null],["Urbem captam gaudēbant.","La pregunta ya tiene el abl. absoluto; respondé con el verbo."],["Captā gaudēbat.","Plural: gaudēbant."]]],
     ["Quō duce Galliam vīcērunt?","¿Con qué jefe vencieron a la Galia?",[["Caesare duce.",null],["Caesar dux.","Ablativo absoluto: Caesare duce."],["Caesarem ducem.","Ablativo: Caesare duce."]]],

 {id:"la31", lvl:"B1", ic:"🏃", t:"Moritūrī tē salūtant", sub:"participios presente y futuro",
  h:[["A","Avē, Caesar, moritūrī tē salūtant!","¡Salve, César, los que van a morir te saludan!"],["B","Gladiātōrēs pugnantēs spectāmus.","Miramos a los gladiadores luchando."],["A","Videō leōnem currentem!","¡Veo un león corriendo!"],["B","Populus clāmāns surgit.","El pueblo se levanta gritando."],["A","Imperātor, pollicem vertēns, iūdicat.","El emperador, girando el pulgar, juzga."],["B","Ego, abitūrus, pānem emō.","Yo, a punto de irme, compro pan."]],
  v:[["moritūrus","que va a morir","💀","moritúrus"],["salūtāre","saludar","👋","salutáre"],["pugnāns, -antis","luchando","⚔️","púgnans"],["currēns, -entis","corriendo","🏃","kúrrens"],["clāmāns","gritando","📣","klámans"],["pollex, pollicis","el pulgar","👍","póleks"],["vertere","girar","🔄","uértere"],["iūdicāre","juzgar","⚖️","iudikáre"],["abitūrus","a punto de irse","🚪","abitúrus"],["gladiātor","el gladiador","🛡️","gladiátor"]],
  r:{t:"Participio presente y futuro",x:"Presente activo (-ns, -ntis): acción simultánea, «que está haciendo» (amāns = el que ama → amante). Futuro activo (-ūrus, -a, -um): «que va a / a punto de» (moritūrus = que va a morir). Muchas palabras españolas vienen del participio presente: estudiante, amante, presidente.",tabla:[["amāns, amantis","amante, que ama"],["legēns, legentis","que lee"],["audiēns, audientis","que oye (→ audiencia)"],["amātūrus, -a, -um","que va a amar"],["futūrus, -a, -um","que va a ser (→ futuro)"]]},
  c:[["Videō puerum ___.",["currentem","currēns","curre"],"Veo a un chico corriendo.","Acusativo: currentem."],["Avē, Caesar, ___ tē salūtant!",["moritūrī","moriēns","mortuī"],"¡Salve, César, los que van a morir te saludan!","Futuro activo plural: moritūrī."],["Mīles ___ cadit.",["pugnāns","pugnantem","pugnātus"],"El soldado cae luchando.","Nominativo: pugnāns."],["«Estudiante» viene de ___.",["studēns","studium","studēre est"],"El que estudia.","Participio presente: studēns."]],
  d:[["Quid dīcēbant gladiātōrēs?","¿Qué decían los gladiadores?",[["Avē, Caesar, moritūrī tē salūtant!",null],["Avē, Caesar, mortuī tē salūtant!","mortuī = muertos; «los que van a morir»: moritūrī."],["Avē, Caesar, moriēns tē salūtat!","La frase famosa: moritūrī … salūtant."]]],
     ["Quid vidēs in arēnā?","¿Qué ves en la arena?",[["Leōnem currentem videō.",null],["Leō currēns videō.","Objeto en acusativo: leōnem currentem."],["Leōnem currēns videō.","Concuerda: currentem."]]],

  h:[["A","Nūntius dīcit Caesarem venīre.","El mensajero dice que César viene."],["B","Crēdō Caesarem fortem esse.","Creo que César es valiente."],["A","Sciō hostēs fūgisse.","Sé que los enemigos huyeron."],["B","Putāsne Rōmam aeternam esse?","¿Pensás que Roma es eterna?"],["A","Poētae dīcunt Rōmam aeternam esse.","Los poetas dicen que Roma es eterna."],["B","Ego crēdō Philippum nimis fūmāre.","Yo creo que Felipe fuma demasiado."]],
  v:[["dīcere","decir","💬","díkere"],["crēdere","creer","🤔","krédere"],["scīre","saber","🧠","skíre"],["putāre","pensar, creer","💭","putáre"],["nūntius","el mensajero","📨","núntius"],["fortis","valiente","🦁","fórtis"],["aeternus","eterno","♾️","aitérnus"],["fūgisse","haber huido","🏃","fugísse"],["poēta","el poeta","🖋️","poéta"],["nimis","demasiado","⚠️","nímis"]],
  r:{t:"El acusativo con infinitivo",x:"Después de verbos de decir, pensar, saber o creer, el latín NO usa «que»: pone el sujeto en ACUSATIVO y el verbo en INFINITIVO. «Dīcit Caesarem venīre» = dice que César viene. Infinitivo perfecto (-isse) para algo anterior: dīcit eum vēnisse = dice que vino.",tabla:[["Dīcit Mārcum dormīre.","Dice que Marco duerme."],["Sciō tē esse bonum.","Sé que sos bueno."],["Putō eum vēnisse.","Creo que vino."],["Crēdō eam venturam esse.","Creo que vendrá."]]},
  c:[["Dīcit ___ venīre.",["Caesarem","Caesar","Caesarī"],"Dice que César viene.","Sujeto del infinitivo: acusativo."],["Crēdō Rōmam pulchram ___.",["esse","est","sunt"],"Creo que Roma es hermosa.","Verbo en infinitivo: esse."],["Sciō hostēs ___.",["fūgisse","fugiunt","fūgērunt"],"Sé que los enemigos huyeron.","Anterior: infinitivo perfecto."],["Putat ___ esse stultum.",["mē","ego","mihi"],"Piensa que yo soy tonto.","Sujeto en acusativo: mē."]],
  d:[["Quid dīcit nūntius?","¿Qué dice el mensajero?",[["Dīcit hostēs appropinquāre.",null],["Dīcit hostēs appropinquant.","Verbo en infinitivo: appropinquāre."],["Dīcit quod hostēs appropinquant.","El latín clásico usa acusativo + infinitivo."]]],
     ["Putāsne mē bonum esse?","¿Pensás que soy bueno?",[["Putō tē optimum esse.",null],["Putō tū optimus es.","Acusativo + infinitivo: tē optimum esse."],["Putō tē optimus esse.","El predicativo concuerda: optimum."]]],
     ["Quid sciunt Rōmānī?","¿Qué saben los romanos?",[["Sciunt Carthāginem dēlētam esse.",null],["Sciunt Carthāgō dēlēta est.","Acusativo + infinitivo: Carthāginem dēlētam esse."],["Sciunt Carthāginem dēlēre.","Fue destruida: dēlētam esse."]]]]},
 {id:"la33", lvl:"B1", ic:"🔗", t:"Quī, quae, quod", sub:"pronombre relativo",
  h:[["A","Vir quī in forō stat est senātor.","El hombre que está en el foro es senador."],["B","Fēmina quam vidēs est uxor eius.","La mujer que ves es su esposa."],["A","Librum quem mihi dedistī lēgī.","Leí el libro que me diste."],["B","Urbs in quā habitō est antīqua.","La ciudad en la que vivo es antigua."],["A","Amīcus cuius domus magna est dīves est.","El amigo cuya casa es grande es rico."],["B","Quī multum habet, plūs cupit.","Quien mucho tiene, más desea."]],
  v:[["quī","que, el cual (masc.)","🔗","kui"],["quae","que, la cual (fem.)","🔗","kuai"],["quod","que, lo cual (neutro)","🔗","kuod"],["quem / quam","al que / a la que","➡️","kuem / kuam"],["cuius","cuyo","🔑","kúius"],["cui","al cual (dativo)","🎁","kui"],["senātor","el senador","🏛️","senátor"],["uxor","la esposa","💍","úksor"],["dīves","rico","💰","díues"],["cupere","desear","🤤","kúpere"]],
  r:{t:"El relativo latino",x:"Toma el GÉNERO y NÚMERO de la palabra a la que se refiere, pero el CASO de su función en su propia oración: «librum quem dedistī» (quem, acusativo, porque es lo que diste). Formas clave: quī/quae/quod (nom.), quem/quam/quod (acus.), cuius (gen.), cui (dat.), quō/quā/quō (abl.).",tabla:[["vir quī venit","el hombre que viene"],["vir quem videō","el hombre al que veo"],["fēmina quae cantat","la mujer que canta"],["templum quod vīsitō","el templo que visito"],["urbs in quā habitō","la ciudad en la que vivo"]]},
  c:[["Puer ___ currit est fīlius meus.",["quī","quem","quae"],"El chico que corre es mi hijo.","Sujeto masculino: quī."],["Puella ___ amō Iūlia est.",["quam","quae","quem"],"La chica que amo es Julia.","Objeto femenino: quam."],["Templum ___ vidēs est antīquum.",["quod","quī","quem"],"El templo que ves es antiguo.","Neutro acusativo: quod."],["Domus in ___ habitō parva est.",["quā","quae","quam"],"La casa en la que vivo es pequeña.","in + ablativo fem.: quā."]],
  d:[["Quis est ille vir?","¿Quién es ese hombre?",[["Est senātor quī in forō loquitur.",null],["Est senātor quem in forō loquitur.","Sujeto: quī."],["Est senātor quae in forō loquitur.","Masculino: quī."]]],
     ["Quem librum legis?","¿Qué libro leés?",[["Librum quem pater mihi dedit.",null],["Librum quī pater mihi dedit.","Objeto: quem."],["Librum quod pater mihi dedit.","liber es masculino: quem."]]],
     ["Ubi habitās?","¿Dónde vivís?",[["In urbe quae prope mare est.",null],["In urbe quī prope mare est.","urbs es femenino: quae."],["In urbe quam prope mare est.","Sujeto de est: quae."]]]]},
 {id:"la34", lvl:"B1", ic:"🏔️", t:"Altior, altissimus", sub:"comparativos y superlativos",
  h:[["A","Mōns Olympus altior est quam Vesuvius.","El monte Olimpo es más alto que el Vesubio."],["B","Sed Rōma pulcherrima urbs est!","¡Pero Roma es la ciudad más hermosa!"],["A","Athēnae antīquiōrēs sunt quam Rōma.","Atenas es más antigua que Roma."],["B","Rōmānī fortissimī mīlitēs erant.","Los romanos eran los soldados más valientes."],["A","Melior est vīta brevis et laeta quam longa et trīstis.","Mejor es una vida breve y alegre que una larga y triste."],["B","Hoc Philippō nē dīxeris. Iam plūrimum fūmat.","No le digas eso a Felipe. Ya fuma muchísimo."]],
  v:[["altus, altior, altissimus","alto, más alto, altísimo","🏔️","áltus"],["quam","que (al comparar)","⚖️","kuam"],["pulcherrimus","hermosísimo","🌹","pulkérrimus"],["fortissimus","valentísimo","🦁","fortíssimus"],["bonus → melior → optimus","bueno → mejor → óptimo","🏆","bónus"],["malus → peior → pessimus","malo → peor → pésimo","💩","málus"],["magnus → maior → maximus","grande → mayor → máximo","🐘","mágnus"],["parvus → minor → minimus","pequeño → menor → mínimo","🐜","páruus"],["multum → plūs → plūrimum","mucho → más → muchísimo","📈","múltum"],["brevis","breve","⏱️","bréuis"]],
  r:{t:"Grados del adjetivo",x:"Comparativo: raíz + -ior (m./f.), -ius (n.): altior, altius. Segundo término con «quam». Superlativo: -issimus (altissimus); los terminados en -er: -errimus (pulcherrimus). Irregulares: bonus/melior/optimus, malus/peior/pessimus, magnus/maior/maximus, parvus/minor/minimus. ¡El español los heredó!",tabla:[["altior quam","más alto que"],["altissimus","altísimo, el más alto"],["melior / optimus","mejor / óptimo"],["peior / pessimus","peor / pésimo"],["maior / maximus","mayor / máximo"],["minor / minimus","menor / mínimo"]]},
  c:[["Mārcus ___ est quam Tītus.",["altior","altus","altissimus"],"Marco es más alto que Tito.","Comparativo: -ior."],["Haec est urbs ___.",["pulcherrima","pulchrissima","pulchrior"],"Esta es la ciudad más hermosa.","Terminados en -er: -errimus."],["Vīnum tuum ___ est quam meum.",["melius","bonius","optimum"],"Tu vino es mejor que el mío.","Neutro comparativo de bonus: melius."],["Rōma ___ est quam Ostia.",["maior","magnior","maxima"],"Roma es más grande que Ostia.","Irregular: maior."]],
  d:[["Quis est fortissimus?","¿Quién es el más valiente?",[["Hercules fortissimus est.",null],["Hercules fortior est.","El más: fortissimus."],["Hercules fortisissimus est.","Superlativo: fortissimus."]]],
     ["Estne Athēnae maior quam Rōma?","¿Atenas es más grande que Roma?",[["Minime. Rōma maior est.",null],["Minime. Rōma magnior est.","Irregular: maior."],["Minime. Rōma maxima quam Athēnae.","Para comparar dos: maior … quam."]]],
     ["Quid est optimum?","¿Qué es lo mejor?",[["Mēns sāna in corpore sānō optima est.",null],["Mēns sāna in corpore sānō bonissima est.","Superlativo de bonus: optima."],["Mēns sāna optimior est.","optimus ya es superlativo."]]]]},
 {id:"la35", lvl:"B1", ic:"✋", t:"Manus et rēs", sub:"4ª y 5ª declinación",
  h:[["A","Manus manum lavat.","Una mano lava la otra."],["B","Quae rēs tibi placet?","¿Qué cosa te gusta?"],["A","Rēs pūblica mihi cūrae est.","Me importa la cosa pública (el Estado)."],["B","Diēs longus fuit. Exercitus fessus est.","Fue un día largo. El ejército está cansado."],["A","Senātus populusque Rōmānus!","¡El Senado y el pueblo romano!"],["B","SPQR! Ideō in vexillīs scrībitur.","¡SPQR! Por eso está escrito en los estandartes."]],
  v:[["manus, -ūs (f.)","la mano","✋","mánus"],["exercitus, -ūs","el ejército","🛡️","eksérkitus"],["senātus, -ūs","el senado","🏛️","senátus"],["domus, -ūs (f.)","la casa","🏠","dómus"],["rēs, reī","la cosa, el asunto","📦","res"],["diēs, diēī","el día","☀️","díes"],["fidēs, fideī","la fe, la confianza","🤝","fídes"],["rēs pūblica","el Estado, la república","🏛️","res públika"],["lavāre","lavar","🧼","lauáre"],["vexillum","el estandarte","🚩","ueksíllum"]],
  r:{t:"Las últimas dos declinaciones",x:"4ª declinación: nominativo -us, genitivo -ūs (manus, manūs); casi todos masculinos, salvo manus y domus. 5ª: nominativo -ēs, genitivo -ēī/-eī (rēs, reī; diēs, diēī). «rēs pūblica» = la cosa pública → república. SPQR = Senātus Populusque Rōmānus.",tabla:[["manus / manūs / manum / manū","mano (nom./gen./acus./abl.)"],["exercitus / exercitūs","el ejército / del ejército"],["rēs / reī / rem / rē","cosa (nom./gen./acus./abl.)"],["diēs / diēī / diem / diē","día (nom./gen./acus./abl.)"],["carpe diem","aprovechá el día (acus.)"]]},
  c:[["Manus manum ___.",["lavat","lavant","lavātur"],"Una mano lava la otra.","Sujeto singular: lavat."],["Carpe ___!",["diem","diēs","diē"],"¡Aprovechá el día!","Objeto: diem."],["SPQR = Senātus Populusque ___.",["Rōmānus","Rōmānī","Rōmae"],"El Senado y el pueblo romano.","Concuerda con populus: Rōmānus."],["Dux ___ dūcit.",["exercitum","exercitus","exercituī"],"El jefe conduce al ejército.","Acusativo 4ª: -um."]],
  d:[["Quid significat «rēs pūblica»?","¿Qué significa «rēs pūblica»?",[["La cosa pública: el Estado.",null],["Una cosa de la plaza.","Es el asunto común: el Estado."],["Un rey público.","rēs = cosa, no rēx."]]],
     ["Quid scrībitur in vexillīs Rōmānīs?","¿Qué está escrito en los estandartes romanos?",[["SPQR: Senātus Populusque Rōmānus.",null],["SPQR: Sōl Pāx Quiēs Rōma.","😄 Es Senātus Populusque Rōmānus."],["Senātum Populumque Rōmānum.","Sujeto en nominativo."]]],
     ["Quot diēs in hebdomade sunt?","¿Cuántos días hay en una semana?",[["Septem diēs sunt.",null],["Septem diem sunt.","Plural nominativo: diēs."],["Septem diērum sunt.","Nominativo: septem diēs."]]]]},
 {id:"la36", lvl:"B1", ic:"👉", t:"Hic, ille, ipse", sub:"demostrativos",
  h:[["A","Hic liber meus est, ille tuus.","Este libro es mío; aquel, tuyo."],["B","Haec puella est soror mea.","Esta chica es mi hermana."],["A","Illa urbs, Rōma, caput mundī est.","Aquella ciudad, Roma, es la capital del mundo."],["B","Ipse Caesar hoc dīxit.","El mismo César dijo esto."],["A","Id quod dīcis vērum est.","Eso que decís es cierto."],["B","Is quī fūmat, is tussit.","El que fuma, ese tose."]],
  v:[["hic, haec, hoc","este, esta, esto","👇","jik, jaik, jok"],["ille, illa, illud","aquel, aquella, aquello","👉","íle, íla, ílud"],["is, ea, id","él, ella, eso","👤","is, éa, id"],["ipse, ipsa, ipsum","él mismo","🪞","ípse"],["īdem, eadem, idem","el mismo (idéntico)","🟰","ídem"],["caput, capitis","la cabeza, la capital","🧠","káput"],["mundus","el mundo","🌍","múndus"],["vērus","verdadero","✅","uérus"],["tussīre","toser","🤧","tussíre"],["soror","la hermana","👧","sóror"]],
  r:{t:"Los demostrativos",x:"hic = este (cercano), ille = aquel (lejano), is = él/ese (neutro, remite a algo ya nombrado), ipse = él mismo (énfasis), īdem = el mismo (igual). De ille salieron los artículos españoles: ille → el, illa → la, illud → lo.",tabla:[["hic vir / haec fēmina / hoc templum","este hombre / esta mujer / este templo"],["ille liber","aquel libro"],["ipse dīxit","él mismo lo dijo"],["īdem diēs","el mismo día"],["ille → el, illa → la","origen del artículo español"]]},
  c:[["___ puella soror mea est.",["Haec","Hic","Hoc"],"Esta chica es mi hermana.","Femenino: haec."],["___ templum antīquum est.",["Hoc","Hic","Haec"],"Este templo es antiguo.","Neutro: hoc."],["Caesar ___ vēnit.",["ipse","ipsa","ipsum"],"El mismo César vino.","Masculino: ipse."],["El artículo español «la» viene de ___.",["illa","ille","ipsa"],"Del demostrativo latino.","illa → la."]],
  d:[["Cuius est hic liber?","¿De quién es este libro?",[["Hic meus est, ille tuus.",null],["Haec meus est.","liber es masculino: hic."],["Hoc meus est.","Masculino: hic."]]],
     ["Quis hoc dīxit?","¿Quién dijo esto?",[["Caesar ipse hoc dīxit.",null],["Caesar ipsa hoc dīxit.","César es masculino: ipse."],["Caesar ipsum hoc dīxit.","Nominativo masculino: ipse."]]],
     ["Unde venit «el» Hispānicum?","¿De dónde viene el «el» español?",[["Ab «ille».",null],["Ab «hic».","El artículo viene de ille."],["Ab «is».","Viene de ille."]]]]},
 {id:"la37", lvl:"B1", ic:"🗓️", t:"Īdūs Mārtiae", sub:"números y calendario romano",
  h:[["A","Cavē Īdūs Mārtiās!","¡Cuidate de los idus de marzo!"],["B","Quid sunt Īdūs?","¿Qué son los idus?"],["A","In mēnse Mārtiō, Īdūs sunt diēs quīntus decimus.","En marzo, los idus son el día 15."],["B","Et Kalendae?","¿Y las calendas?"],["A","Kalendae sunt prīmus diēs mēnsis. Inde «calendario».","Las calendas son el primer día del mes. De ahí «calendario»."],["B","Ergō Caesar Īdibus Mārtiīs necātus est.","Entonces César fue asesinado en los idus de marzo."]],
  v:[["Kalendae","las calendas (día 1)","1️⃣","kaléndai"],["Nōnae","las nonas (día 5 o 7)","5️⃣","nónai"],["Īdūs","los idus (día 13 o 15)","🗡️","ídus"],["cavē!","¡cuidate!","⚠️","káue"],["mēnsis","el mes","🗓️","ménsis"],["ūnus, duo, trēs","uno, dos, tres","🔢","únus, dúo, tres"],["decem, centum, mīlle","diez, cien, mil","💯","dékem, kéntum, míle"],["prīmus, secundus, tertius","primero, segundo, tercero","🥇","prímus"],["quīntus decimus","decimoquinto","1️⃣5️⃣","kuíntus dékimus"],["inde","de ahí","➡️","índe"]],
  r:{t:"Contar como los romanos",x:"Números romanos: I=1, V=5, X=10, L=50, C=100, D=500, M=1000; un número menor a la izquierda resta (IV=4, IX=9). Los meses tenían tres días fijos: Kalendae (1), Nōnae (5 o 7) e Īdūs (13 o 15). En marzo, mayo, julio y octubre, las Nonas eran el 7 y los Idus el 15.",tabla:[["IV / IX / XL","4 / 9 / 40"],["XC / CD / CM","90 / 400 / 900"],["MMXXVI","2026"],["Kalendae Iānuāriae","1 de enero"],["Īdūs Mārtiae","15 de marzo"]]},
  c:[["Caesar ___ Mārtiīs necātus est.",["Īdibus","Īdūs","Kalendīs"],"César fue asesinado en los idus de marzo.","Ablativo de tiempo: Īdibus."],["«Calendario» viene de ___.",["Kalendae","Nōnae","calēre"],"Las calendas.","Kalendae = día 1."],["XLIX = ___",["49","51","69"],"Número romano.","XL (40) + IX (9)."],["MCMXC = ___",["1990","1910","2090"],"Número romano.","M + CM (900) + XC (90)."]],
  d:[["Quid dīxit haruspex Caesarī?","¿Qué le dijo el adivino a César?",[["Cavē Īdūs Mārtiās!",null],["Cavē Kalendās Mārtiās!","Fue en los idus: Īdūs Mārtiās."],["Cavē Īdūs Aprīlēs!","Fue en marzo."]]],
     ["Quot sunt XXIV?","¿Cuánto es XXIV?",[["Vīgintī quattuor.",null],["Vīgintī sex.","IV = 4, no 6."],["Trīgintā quattuor.","XX = 20."]]],
     ["Quī diēs sunt Kalendae?","¿Qué día son las calendas?",[["Prīmus diēs mēnsis.",null],["Ultimus diēs mēnsis.","Son el primero."],["Quīntus decimus diēs.","Ese es el idus (en marzo)."]]]]},
 {id:"la38", lvl:"B1", ic:"🗺️", t:"Gallia est omnis dīvīsa", sub:"lectura: César",
  h:[["A","Gallia est omnis dīvīsa in partēs trēs.","La Galia en su totalidad está dividida en tres partes."],["B","Quārum ūnam incolunt Belgae, aliam Aquītānī…","De las cuales una la habitan los belgas, otra los aquitanos…"],["A","…tertiam quī ipsōrum linguā Celtae, nostrā Gallī appellantur.","…la tercera, los que en su lengua se llaman celtas y en la nuestra galos."],["B","Hōrum omnium fortissimī sunt Belgae.","De todos ellos, los más valientes son los belgas."],["A","Caesar dē sē in tertiā persōnā scrībit.","César escribe de sí mismo en tercera persona."],["B","Sīcut Philippus dē pulmōnibus suīs.","Como Felipe cuando habla de sus pulmones."]],
  v:[["omnis, omne","todo, entero","🌐","ómnis"],["dīvīsus","dividido","✂️","diuísus"],["pars, partis","la parte","🧩","pars"],["incolere","habitar","🏡","inkólere"],["alius, alia, aliud","otro","↔️","álius"],["lingua","la lengua","👅","língua"],["appellāre","llamar, nombrar","🏷️","apeláre"],["quārum","de las cuales","🔗","kuárum"],["Belgae","los belgas","🛡️","bélgai"],["nostra (lingua)","nuestra (lengua)","🏛️","nóstra"]],
  r:{t:"Cómo leer a César",x:"«De bello Gallicō» es el texto con el que todos aprenden latín: frases claras, vocabulario militar y mucho relativo. Técnica: 1) buscá los verbos, 2) marcá los sujetos (nominativo), 3) uní cada relativo (quārum, quī) con su antecedente. César habla de sí en tercera persona para parecer objetivo.",tabla:[["Gallia est omnis dīvīsa…","La Galia entera está dividida…"],["quārum ūnam incolunt Belgae","de las cuales una la habitan los belgas"],["ipsōrum linguā Celtae","celtas en su propia lengua"],["nostrā Gallī appellantur","en la nuestra se llaman galos"],["hōrum omnium fortissimī","los más valientes de todos ellos"]]},
  c:[["Gallia est omnis dīvīsa in partēs ___.",["trēs","duās","quattuor"],"La Galia entera está dividida en tres partes.","El famoso inicio."],["Hōrum omnium ___ sunt Belgae.",["fortissimī","fortior","fortēs"],"Los más valientes de todos son los belgas.","Superlativo: fortissimī."],["Gallī sua linguā Celtae ___.",["appellantur","appellant","appellātur"],"Los galos en su lengua se llaman celtas.","Pasiva plural: appellantur."],["Quārum ūnam ___ Belgae.",["incolunt","incolit","incolitur"],"Una de las cuales la habitan los belgas.","Sujeto plural: incolunt."]],
  d:[["Quis scrīpsit «Dē bellō Gallicō»?","¿Quién escribió «La guerra de las Galias»?",[["Gāius Iūlius Caesar.",null],["Cicerō.","Cicerón escribió discursos y cartas."],["Vergilius.","Virgilio escribió la Eneida."]]],
     ["In quot partēs dīvīsa est Gallia?","¿En cuántas partes está dividida la Galia?",[["In trēs partēs.",null],["In tribus partēs.","in + acusativo (dirección/división): trēs partēs."],["In quattuor partēs.","Son tres."]]],
     ["Quī sunt fortissimī Gallōrum?","¿Quiénes son los más valientes de los galos?",[["Belgae.",null],["Aquītānī.","César dice que son los belgas."],["Rōmānī.","Pregunta por los galos: los belgas."]]]]},
