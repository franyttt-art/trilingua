<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0A1A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trilingua">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Trilingua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
/* Diseño nocturno único (cielo estrellado): se elige a propósito un solo tema oscuro */
:root, :root[data-theme="light"], :root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0A1A; --sky1:#1B1740; --sky2:#0B0A1A;
  --surface:rgba(30,26,52,.86); --surface2:#2B2650; --ink:#F3F0FF; --muted:#B4ADD6; --line:#3A3464;
  --brand:#FF8A3D; --brand-dark:#D96A1F; --brand-soft:#3E2A22;
  --act:#8C73FF; --act-dark:#6A4FE0; --act-soft:#2C2654;
  --good:#2FD08A; --good-dark:#1FA06A; --good-soft:#143A2C;
  --bad:#FF6461; --bad-dark:#D9423F; --bad-soft:#40181D;
  --gold:#FFC23A; --lock:#3A3560; --lock-dark:#27234A;
  --en:#4F7FE6; --en-dark:#3560C0; --de:#F0B72A; --de-dark:#C99210; --la:#D2445D; --la-dark:#A52F45;
  --f-display:"Baloo 2","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-roman:"Cinzel",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--sky1) 0%,var(--sky2) 70%) fixed,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app,nav.tabs,#toast{position:relative;z-index:1}
nav.tabs{position:fixed}
#toast{position:fixed}
.card,.opt,.item,.kpi,.bubble,.tok,.line .txt,input.answer,select{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.app{max-width:600px;margin:0 auto;min-height:100%;padding-inline:16px;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
/* ---------- barra superior ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(11,10,26,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;gap:10px}
.lvlhead{text-align:center;padding:14px 16px;border-radius:18px;border:2px dashed var(--line);background:rgba(30,26,52,.6);width:100%;max-width:360px}
.lvlhead b{font-family:var(--f-display);font-size:22px;display:block}
.flags{display:flex;gap:6px}
.flagbtn{border:3px solid transparent;background:none;padding:2px;border-radius:12px;line-height:0;transition:transform .15s}
.flagbtn svg{width:40px;height:28px;border-radius:7px;display:block;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.flagbtn[aria-pressed="true"]{border-color:var(--lc)}
.flagbtn:active{transform:scale(.92)}
.pills{margin-left:auto;display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:4px;font-weight:800;font-size:15px;padding:4px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.pill.fire{color:var(--brand)}.pill.xp{color:var(--gold)}
/* ---------- navegación ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--muted);font-weight:800;position:relative}
nav.tabs .ic{font-size:24px;line-height:1.1;filter:grayscale(.6);transition:transform .15s}
nav.tabs button[aria-current="page"]{color:var(--act)}
nav.tabs button[aria-current="page"] .ic{filter:none;transform:translateY(-2px) scale(1.1)}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:#fff;font-size:11px;border-radius:99px;padding:0 6px;font-weight:800}
body.inlesson nav.tabs{display:none}
body.inlesson .app{padding-bottom:24px}
/* ---------- piezas comunes ---------- */
main{display:flex;flex-direction:column;gap:16px;padding-block:4px 16px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1;min-width:0}
.btn{--c:var(--surface);--cd:var(--line);--ct:var(--ink);border:2px solid var(--cd);border-bottom-width:5px;background:var(--c);color:var(--ct);padding:11px 18px;border-radius:16px;font-weight:800;font-size:16px;letter-spacing:.02em;transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px}
.btn.pri{--c:var(--act);--cd:var(--act-dark);--ct:#fff}
.btn.good{--c:var(--good);--cd:var(--good-dark);--ct:#fff}
.btn.bad{--c:var(--bad);--cd:var(--bad-dark);--ct:#fff}
.btn.lang{--c:var(--lc);--cd:var(--lcd);--ct:#fff}
.btn.big{width:100%;padding:14px;font-size:17px;text-transform:uppercase}
.btn:disabled{opacity:.45;cursor:default}
.btn.link{border:0;background:none;color:var(--act);padding:8px;text-transform:none}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:700}
.tito-row{display:flex;align-items:flex-end;gap:10px}
.tito-row .bubble{flex:1}
.tito-row .bubble::before{content:"";position:absolute;left:-10px;bottom:18px;border:8px solid transparent;border-right-color:var(--line)}
.tito-row .bubble::after{content:"";position:absolute;left:-6px;bottom:19px;border:7px solid transparent;border-right-color:var(--surface)}
.tito{flex:none;display:block}
.tito.idle{animation:bob 2.6s ease-in-out infinite}
.tito.happy{animation:hop .6s ease}
.tito.sad{animation:droop .6s ease forwards}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes hop{30%{transform:translateY(-16px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
@keyframes droop{to{transform:rotate(-8deg) translateY(3px)}}
.bocanada{position:absolute;pointer-events:none;z-index:3;opacity:0;animation:bocanada 1.4s ease-out forwards}
@keyframes bocanada{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:.95}100%{opacity:0;transform:translate(26px,-46px) scale(1.6)}}
@media (prefers-reduced-motion:reduce){.bocanada{animation-duration:.01s}}
.tito{cursor:pointer;-webkit-tap-highlight-color:transparent}
.tito.enojo{animation:enojo .45s ease}
@keyframes enojo{0%,100%{transform:none}20%{transform:translateX(-5px) rotate(-6deg)}40%{transform:translateX(5px) rotate(6deg)}60%{transform:translateX(-4px) rotate(-4deg)}80%{transform:translateX(3px)}}
.tito.afuera{animation:sevaFelipe 7s ease forwards}
@keyframes sevaFelipe{0%{transform:none;opacity:1}12%{transform:translate(40px,-30px) rotate(12deg);opacity:0}88%{transform:translate(40px,-30px);opacity:0}100%{transform:none;opacity:1}}
.tito .humo{animation:humo 3s ease-in-out infinite;transform-origin:88px 58px}
@keyframes humo{0%{opacity:0;transform:translateY(4px) scaleY(.7)}40%{opacity:.75}100%{opacity:0;transform:translateY(-10px) scaleY(1.1)}}
.cert{border:3px solid var(--gold);background:linear-gradient(135deg,var(--surface),var(--brand-soft));border-radius:20px;padding:18px;text-align:center}
/* ---------- camino ---------- */
.hero{display:flex;gap:12px;align-items:center;background:var(--lc);color:#fff;border-radius:22px;padding:14px 16px;border-bottom:5px solid var(--lcd)}
.hero .eyebrow{color:rgba(255,255,255,.85)}
.hero h2{color:#fff}
.goal{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring b{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.path{display:flex;flex-direction:column;align-items:center;gap:26px;padding-block:40px 20px;position:relative}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.node button.disc{width:78px;height:72px;border-radius:50%;border:0;background:var(--lc);box-shadow:0 7px 0 var(--lcd);font-size:32px;display:grid;place-items:center;transition:transform .1s;position:relative}
.node button.disc:active{transform:translateY(5px);box-shadow:0 2px 0 var(--lcd)}
.node.locked button.disc{background:var(--lock);box-shadow:0 7px 0 var(--lock-dark);filter:grayscale(1);cursor:default}
.node.done button.disc{background:var(--gold);box-shadow:0 7px 0 #C98600}
.node.current button.disc::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--lc);opacity:.35;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.25);opacity:0}}
.node .lbl{font-weight:800;font-size:14px;text-align:center;max-width:170px;line-height:1.2}
.node .lbl small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.node .start{position:absolute;top:-38px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:3px 10px;font-weight:800;font-size:13px;color:var(--lc);white-space:nowrap;animation:bob 2s ease-in-out infinite}
.node .tito-side{position:absolute;top:0}
/* ---------- lección ---------- */
.lesson-top{display:flex;align-items:center;gap:10px;padding-block:8px}
.xbtn{border:0;background:none;font-size:26px;color:var(--muted);padding:4px 8px;line-height:1}
.pbar{flex:1;height:16px;border-radius:99px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--good);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);transition:width .35s ease}
.combo{font-weight:800;color:var(--brand);font-size:14px;min-width:44px;text-align:right}
.stage{display:flex;flex-direction:column;gap:16px;min-height:60vh}
.prompt{font-family:var(--f-display);font-size:24px;font-weight:800}
.target{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.la .target{font-family:var(--f-roman);font-size:30px;letter-spacing:.02em}
.say{border:0;background:var(--act);color:#fff;border-radius:14px;width:52px;height:52px;font-size:24px;box-shadow:0 4px 0 var(--act-dark);flex:none}
.say.slow{background:var(--surface2);color:var(--ink);box-shadow:0 4px 0 var(--line);font-size:20px}
.say:active{transform:translateY(3px);box-shadow:0 1px 0 var(--act-dark)}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);border-radius:16px;padding:14px;text-align:left;font-size:17px;font-weight:700;transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt.sel{border-color:var(--act);background:var(--act-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good-dark)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-dark)}
.opt .em{font-size:40px;display:block;text-align:center;margin-bottom:4px}
.opt.pic{text-align:center}
.tokens{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:10px 4px;border-bottom:2px solid var(--line)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:800}
.tok.used{visibility:hidden}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .opt{text-align:center;padding:12px 8px;font-size:16px}
.pairs .opt.gone{opacity:.25;pointer-events:none}
input.answer{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;font-size:18px;font-weight:700}
input.answer:focus{border-color:var(--act);outline:none}
.sheet{position:sticky;bottom:0;margin-inline:-16px;padding:16px;border-radius:20px 20px 0 0;display:flex;flex-direction:column;gap:10px;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet.ok{background:var(--good-soft)}.sheet.no{background:var(--bad-soft)}
.sheet h3{font-size:22px}
.sheet.ok h3{color:var(--good-dark)}.sheet.no h3{color:var(--bad-dark)}
.sheet .exp{font-weight:600}
/* historia / diálogo */
.line{display:flex;gap:10px;align-items:flex-start}
.line .who{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:22px;flex:none}
.line .txt{flex:1;background:var(--surface);border:2px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 12px;cursor:pointer}
.line .txt b{display:block;font-size:17px}
.la .line .txt b{font-family:var(--f-roman);font-size:16px}
.line .txt .es{color:var(--muted);font-size:14px;font-weight:700}
.line.me{flex-direction:row-reverse}
.line.me .txt{border-radius:16px 4px 16px 16px;background:var(--act-soft);border-color:transparent}
.hint-tap{font-size:13px;color:var(--muted);text-align:center}
.vcard{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:26px 16px}
.vcard .em{font-size:72px;line-height:1}
.tip{background:var(--brand-soft);border-radius:16px;padding:12px 14px;font-weight:700}
.nombre-in{flex:1 1 180px;min-width:0;box-sizing:border-box;border-radius:14px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);padding:12px 14px;font:700 18px var(--f-body)}
.nombre-in:focus{outline:none;border-color:var(--act)}
.bienvenida{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:24px}
.bienvenida .nombre-in{width:100%;max-width:340px;flex:none;text-align:center;font-size:22px}
.bienvenida .btn{width:100%;max-width:340px}
.codigo{width:100%;box-sizing:border-box;border-radius:14px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);padding:10px;font:600 13px/1.35 ui-monospace,monospace;resize:vertical}
.banner-instalar{display:flex;flex-direction:column;gap:12px;border-color:var(--act);text-align:left;width:100%;max-width:460px;box-sizing:border-box}
.banner-instalar .xbtn{flex:none}
.banner-instalar .pasos{font-weight:700;line-height:1.5;background:var(--act-soft);border-radius:14px;padding:10px 12px}
html,body{overscroll-behavior-y:none}
@media (pointer:coarse){
  .card,.opt,.item,.kpi,.bubble,.tok,.line .txt,input.answer,select,header.top{backdrop-filter:none;-webkit-backdrop-filter:none}
  .card,.opt,.item,.kpi,.bubble,.tok,.line .txt{background:#1E1A34}
  header.top{background:rgba(11,10,26,.94)}
}
#stars{top:0;left:0;right:auto;bottom:auto;width:100vw;height:100vh;height:100lvh;will-change:transform;transform:translateZ(0);contain:strict}
.envivo{font-weight:800;font-size:18px;padding:10px 12px;border-radius:14px;background:var(--act-soft)}
.medidor{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.medidor i{display:block;height:100%;width:0;background:var(--good);transition:width .08s}
.micbox{display:flex;flex-direction:column;gap:10px}
.btn.mic{--c:#2A1F55;--cd:#7C5CFF;--ct:#fff}
.btn.mic.rec{--c:#B3261E;--cd:#7A120C;animation:latido 1s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.03)}}
.micres{display:flex;flex-direction:column;gap:8px}
.micres .frase{font-size:20px;font-weight:800}
.micres .ok{color:var(--good)} .micres .mal{color:var(--bad);text-decoration:underline wavy}
.micpide{display:flex;flex-direction:column;gap:12px;border-color:var(--brand);min-width:0}
.micpide .row{flex-wrap:wrap}.micpide .row .btn{flex:1 1 140px}.micpide .sp{min-width:0}
@media (prefers-reduced-motion:reduce){.btn.mic.rec{animation:none}}
.rule{display:flex;flex-direction:column;gap:12px}
.rule table{width:100%;border-collapse:separate;border-spacing:0;border:2px solid var(--line);border-radius:14px;overflow:hidden;font-size:15px}
.rule td,.rule th{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
.rule tr:last-child td{border-bottom:0}
.rule th{background:var(--surface2);font-weight:800}
.rule td:first-child{font-weight:800;color:var(--lc)}
.scroll-x{overflow-x:auto}
.celebrate{align-items:center;text-align:center;justify-content:center}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat3{border:2px solid var(--c);border-radius:16px;overflow:hidden;text-align:center}
.stat3 .h{background:var(--c);color:#fff;font-size:12px;font-weight:800;padding:3px;text-transform:uppercase}
.stat3 b{display:block;font-size:22px;font-family:var(--f-display);padding:6px}
/* listas */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px}
.item .ic{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:24px;flex:none}
.item b{display:block}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center}
.kpi .e{font-size:28px}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;font-weight:800;color:var(--muted)}
.week i{display:block;width:30px;height:30px;margin:4px auto 0;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-style:normal;font-size:15px}
.week i.on{background:var(--brand);color:#fff}
.method li{margin-bottom:10px}
.method b{color:var(--act)}
select{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:700}
.switch{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.hide{display:none!important}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;z-index:30;max-width:90vw;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="stars" aria-hidden="true"></canvas>
<div class="app" id="app">
  <header class="top" id="topbar">
    <div class="flags" id="flags" role="group" aria-label="Idioma"></div>
    <div class="pills">
      <span class="pill fire" title="Días seguidos">🔥 <span id="pRacha">0</span></span>
      <span class="pill xp" title="Puntos de experiencia">⚡ <span id="pXp">0</span></span>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Secciones"><div class="in">
  <button data-v="camino" aria-current="page"><span class="ic">🗺️</span>Aprender</button>
  <button data-v="repaso"><span class="ic">🧠</span>Repasar<span class="badge hide" id="dueBadge"></span></button>
  <button data-v="practica"><span class="ic">💬</span>Practicar</button>
  <button data-v="perfil"><span class="ic">🐦</span>Perfil</button>
</div></nav>
<div id="toast" hidden></div>
<canvas id="confetti" hidden></canvas>

<script>

 {id:"en30", lvl:"B1", ic:"🧒", t:"Cuando era chico", sub:"used to, would",
  h:[["A","Did you use to play football as a kid?","¿Jugabas al fútbol de chico?"],["B","Yes, I used to play every day after school.","Sí, jugaba todos los días después del colegio."],["A","Me too. My grandma would bring us lemonade.","Yo también. Mi abuela nos traía limonada."],["B","I didn't use to like vegetables back then.","En esa época no me gustaban las verduras."],["A","And now?","¿Y ahora?"],["B","Now I'm used to eating them. I'm getting old!","Ahora estoy acostumbrado a comerlas. ¡Me estoy poniendo viejo!"]],
  v:[["used to","solía (ya no)","🕰️","iust tu"],["would","(acción repetida en el pasado)","🔁","uud"],["be used to","estar acostumbrado a","👌","bi iust tu"],["get used to","acostumbrarse a","🔄","guet iust tu"],["as a kid","de chico","🧒","as a kid"],["back then","en esa época","📼","bak den"],["grandma","abuela","👵","gránma"],["lemonade","limonada","🍋","lemonéid"],["school","colegio, escuela","🏫","skuul"],["childhood","infancia","🧸","cháildjud"]],
  r:{t:"Hábitos del pasado",x:"used to + verbo = algo que hacías antes y ya no (I used to smoke). En pregunta y negación: did/didn't use to (sin -d). «would» también cuenta rutinas pasadas, pero no estados. ¡Ojo! be used to + -ing = estar acostumbrado.",tabla:[["I used to live in Rosario.","Antes vivía en Rosario."],["Did you use to…?","¿Antes…?"],["I didn't use to like it.","Antes no me gustaba."],["We would play all day.","Jugábamos todo el día."],["I'm used to working late.","Estoy acostumbrado a trabajar tarde."]]},
  c:[["I ___ to live in Córdoba.",["used","use","was used"],"Antes vivía en Córdoba.","Afirmativa: used to."],["Did you ___ to smoke?",["use","used","using"],"¿Antes fumabas?","Con did: use to."],["I'm used to ___ early.",["getting up","get up","got up"],"Estoy acostumbrado a levantarme temprano.","be used to + -ing."],["She ___ to like coffee, but now she loves it.",["didn't use","didn't used","wasn't use"],"Antes no le gustaba el café, pero ahora le encanta.","Negativa: didn't use to."]],
  d:[["Did you use to play any sports?","¿Hacías algún deporte?",[["Yes, I used to play tennis.",null],["Yes, I use to play tennis.","Pasado: used to."],["Yes, I was used to play tennis.","Eso sería «estaba acostumbrado». Se dice: I used to play."]]],
     ["Is it hard to work at night?","¿Es difícil trabajar de noche?",[["Not anymore. I'm used to it.",null],["Not anymore. I used to it.","Estar acostumbrado: I'm used to it."],["Not anymore. I use to it.","Se dice: I'm used to it."]]],
     ["What did you do on summer holidays?","¿Qué hacías en las vacaciones de verano?",[["We would go to the beach every year.",null],["We would to go to the beach.","would + verbo sin to."],["We used go to the beach.","Falta to: used to go."]]]]},
 {id:"en31", lvl:"B1", ic:"☔", t:"Si llueve…", sub:"primer condicional, unless",
  h:[["A","If it rains tomorrow, will we still go?","Si llueve mañana, ¿vamos igual?"],["B","If it rains, we'll go to the cinema instead.","Si llueve, vamos al cine en vez."],["A","OK. I'll call you when I wake up.","Bueno. Te llamo cuando me despierte."],["B","Don't call before nine, unless it's urgent.","No llames antes de las nueve, salvo que sea urgente."],["A","As soon as I know, I'll text you.","Apenas sepa, te mando mensaje."],["B","Perfect. If you're late, I'll leave without you!","Perfecto. ¡Si llegás tarde, me voy sin vos!"]],
  v:[["if","si","❓","if"],["unless","a menos que","🚧","anlés"],["as soon as","apenas, en cuanto","⚡","as suun as"],["when","cuando","⏰","uen"],["instead","en cambio, en vez","🔄","instéd"],["urgent","urgente","🚨","érchent"],["text","mandar un mensaje","📱","tekst"],["wake up","despertarse","⏰","uéik ap"],["in case","por si acaso","☂️","in kéis"],["still","igual, todavía","🔁","stil"]],
  r:{t:"Primer condicional",x:"Para algo posible en el futuro: If + presente, will + verbo. ¡Después de if, when, as soon as y unless NO va will! «If it rains» (no «if it will rain»). unless = if not.",tabla:[["If it rains, I'll stay home.","Si llueve, me quedo en casa."],["I'll call you when I arrive.","Te llamo cuando llegue."],["Unless you hurry, you'll miss it.","Si no te apurás, lo perdés."],["As soon as I know, I'll tell you.","Apenas sepa, te digo."]]},
  c:[["If it ___ tomorrow, we'll stay home.",["rains","will rain","rained"],"Si llueve mañana, nos quedamos en casa.","Después de if: presente."],["I'll call you when I ___.",["arrive","will arrive","arrived"],"Te llamo cuando llegue.","Después de when: presente."],["You'll fail ___ you study.",["unless","if","when"],"Vas a desaprobar a menos que estudies.","unless = si no."],["If you're late, I ___ leave without you.",["will","would","am"],"Si llegás tarde, me voy sin vos.","Resultado: will."]],
  d:[["What will you do if you lose your job?","¿Qué vas a hacer si perdés el trabajo?",[["If I lose it, I'll start my own business.",null],["If I will lose it, I'll start a business.","Después de if: presente, lose."],["If I lose it, I start a business tomorrow.","Resultado futuro: I'll start."]]],
     ["Can I call you later?","¿Te puedo llamar más tarde?",[["Sure, unless it's after midnight.",null],["Sure, unless it isn't after midnight.","unless ya es negativo: unless it's after midnight."],["Sure, if not it's after midnight.","Se dice: unless it's after midnight."]]],
     ["When will you tell me?","¿Cuándo me vas a decir?",[["As soon as I know.",null],["As soon as I will know.","Después de as soon as: presente."],["As soon I know.","Falta as: as soon as."]]]]},
 {id:"en32", lvl:"B1", ic:"🎰", t:"Si ganara la lotería", sub:"segundo condicional",
  h:[["A","What would you do if you won the lottery?","¿Qué harías si ganaras la lotería?"],["B","I'd buy a house by the sea.","Me compraría una casa frente al mar."],["A","If I were you, I'd invest some of it.","Yo que vos, invertiría una parte."],["B","If I had your brain, I'd be a millionaire already.","Si tuviera tu cerebro, ya sería millonario."],["A","Would you quit your job?","¿Dejarías tu trabajo?"],["B","The same day. I wouldn't even say goodbye.","El mismo día. Ni me despediría."]],
  v:[["win","ganar (premio)","🏆","uin"],["lottery","lotería","🎰","lóteri"],["invest","invertir","📈","invést"],["quit","renunciar, dejar","🚪","kuit"],["millionaire","millonario","💰","milionér"],["by the sea","frente al mar","🌊","bai de sii"],["If I were you","yo que vos","👉","if ai uer iu"],["would","-ría (condicional)","🔮","uud"],["even","incluso, ni siquiera","➕","íven"],["dream","sueño","💭","driim"]],
  r:{t:"Segundo condicional",x:"Para situaciones imaginarias o poco probables: If + pasado, would + verbo. Con «be» se usa «were» para todas las personas en estilo cuidado: If I were rich… Consejo: If I were you, I'd…",tabla:[["If I had money, I'd travel.","Si tuviera plata, viajaría."],["If I were you, I'd rest.","Yo que vos, descansaría."],["What would you do if…?","¿Qué harías si…?"],["I wouldn't do that.","Yo no haría eso."]]},
  c:[["If I ___ rich, I'd travel the world.",["were","am","will be"],"Si fuera rico, viajaría por el mundo.","Imaginario: were."],["If you won, what ___ you do?",["would","will","did"],"Si ganaras, ¿qué harías?","Resultado imaginario: would."],["If I ___ time, I'd help you.",["had","have","would have"],"Si tuviera tiempo, te ayudaría.","Después de if: pasado."],["If I were you, I ___ call her.",["would","will","am"],"Yo que vos, la llamaría.","Consejo: I'd (would)."]],
  d:[["What would you do with a million dollars?","¿Qué harías con un millón de dólares?",[["I'd travel around the world.",null],["I'll travel around the world.","Imaginario: I'd (would) travel."],["I would to travel around the world.","would + verbo sin to."]]],
     ["Should I accept the job?","¿Debería aceptar el trabajo?",[["If I were you, I'd accept it.",null],["If I am you, I'll accept it.","Consejo: If I were you, I'd…"],["If I would be you, I'd accept it.","Después de if no va would: If I were you."]]],
     ["Would you live abroad?","¿Vivirías en el exterior?",[["Yes, if I spoke the language well.",null],["Yes, if I would speak the language.","Después de if: pasado, spoke."],["Yes, if I speak the language well I would.","Imaginario: if I spoke."]]]]},
 {id:"en33", lvl:"B1", ic:"🏗️", t:"Fue construido…", sub:"voz pasiva",
  h:[["A","This bridge is amazing. When was it built?","Este puente es increíble. ¿Cuándo se construyó?"],["B","It was built in 1890 and it was designed by a French engineer.","Se construyó en 1890 y lo diseñó un ingeniero francés."],["A","Is it still used?","¿Se sigue usando?"],["B","Yes, it's crossed by thousands of cars every day.","Sí, lo cruzan miles de autos por día."],["A","Is English spoken by all the guides here?","¿Todos los guías de acá hablan inglés?"],["B","Yes, and tickets are sold online.","Sí, y las entradas se venden por internet."]],
  v:[["build → built","construir","🏗️","bild / bilt"],["design","diseñar","📐","disáin"],["bridge","puente","🌉","brich"],["engineer","ingeniero","👷","enchiníer"],["cross","cruzar","↔️","kros"],["sell → sold","vender","🏷️","sel / sóuld"],["make → made","hacer, fabricar","🏭","méik / méid"],["by","por (quién lo hace)","👤","bai"],["invent","inventar","💡","invént"],["steal → stolen","robar","🦹","stiil / stóulen"]],
  r:{t:"La voz pasiva",x:"Cuando importa la acción más que quién la hace: be + participio. Presente: is/are made. Pasado: was/were built. Quien lo hace va con «by». Muchas veces el español usa «se»: English is spoken here = acá se habla inglés.",tabla:[["It is made in China.","Se fabrica en China."],["It was built in 1890.","Se construyó en 1890."],["They were stolen.","Fueron robados."],["It was painted by Picasso.","Lo pintó Picasso."],["Is it used?","¿Se usa?"]]},
  c:[["This car ___ made in Germany.",["was","were","did"],"Este auto se fabricó en Alemania.","Singular pasado: was."],["The tickets are ___ online.",["sold","sell","selling"],"Las entradas se venden por internet.","be + participio: sold."],["The telephone was invented ___ Bell.",["by","from","of"],"El teléfono lo inventó Bell.","Quién lo hace: by."],["My bikes ___ stolen last night.",["were","was","are"],"Me robaron las bicis anoche.","Plural pasado: were."]],
  d:[["Where are these shoes made?","¿Dónde se fabrican estos zapatos?",[["They're made in Italy.",null],["They make in Italy.","Pasiva: They're made."],["They're make in Italy.","Participio: made."]]],
     ["Who painted the Mona Lisa?","¿Quién pintó la Mona Lisa?",[["It was painted by Leonardo da Vinci.",null],["It was painted from Leonardo.","Quién lo hace: by."],["It painted by Leonardo.","Falta was: It was painted."]]],
     ["What happened to your phone?","¿Qué le pasó a tu celular?",[["It was stolen on the bus.",null],["It stole on the bus.","Pasiva: It was stolen."],["It was steal on the bus.","Participio: stolen."]]]]},
 {id:"en34", lvl:"B1", ic:"🔗", t:"La persona que…", sub:"who, which, that, where",
  h:[["A","Who's the guy who's talking to your sister?","¿Quién es el pibe que está hablando con tu hermana?"],["B","He's the chef who works at the restaurant where we had dinner.","Es el cocinero que trabaja en el restaurante donde cenamos."],["A","The restaurant that was on TV?","¿El restaurante que salió en la tele?"],["B","Yes. The pasta which they make is incredible.","Sí. La pasta que hacen es increíble."],["A","Is that the car he bought?","¿Ese es el auto que se compró?"],["B","Yes, the one whose engine never works.","Sí, ese cuyo motor nunca anda."]],
  v:[["who","que (personas)","🧑","ju"],["which","que (cosas)","📦","uich"],["that","que (personas o cosas)","🔗","dat"],["where","donde","📍","uér"],["whose","cuyo","🔑","juus"],["chef","cocinero","👨‍🍳","shef"],["engine","motor","⚙️","énchin"],["the one","el que, ese","☝️","de uan"],["incredible","increíble","🤯","inkrédibol"],["neighbour","vecino","🏡","néibor"]],
  r:{t:"Oraciones de relativo",x:"who para personas, which para cosas, that para ambas (más informal), where para lugares, whose = cuyo. Si el relativo es el OBJETO del verbo se puede omitir: the car (that) he bought.",tabla:[["The man who called…","El hombre que llamó…"],["The book which / that I read…","El libro que leí…"],["The city where I was born…","La ciudad donde nací…"],["The girl whose dog bit me…","La chica cuyo perro me mordió…"],["The car he bought…","El auto que se compró…"]]},
  c:[["The woman ___ lives next door is a doctor.",["who","which","where"],"La mujer que vive al lado es médica.","Persona: who."],["The phone ___ I bought is broken.",["which","who","where"],"El celular que compré está roto.","Cosa: which / that."],["That's the hotel ___ we stayed.",["where","which","who"],"Ese es el hotel donde nos quedamos.","Lugar: where."],["He's the man ___ car was stolen.",["whose","who","which"],"Es el hombre cuyo auto robaron.","cuyo: whose."]],
  d:[["Who's Laura?","¿Quién es Laura?",[["She's the girl who works with me.",null],["She's the girl which works with me.","Persona: who."],["She's the girl who she works with me.","No se repite el sujeto: who works."]]],
     ["Which one is your house?","¿Cuál es tu casa?",[["The one that has a red door.",null],["The one who has a red door.","Cosa: that / which."],["The one where has a red door.","where es para «donde»; acá: that has."]]],
     ["Do you remember that bar?","¿Te acordás de ese bar?",[["Yes, the bar where we met!",null],["Yes, the bar which we met!","Lugar donde: where (o which … in)."],["Yes, the bar who we met!","who es para personas."]]]]},
 {id:"en35", lvl:"B1", ic:"🗨️", t:"Me dijo que…", sub:"estilo indirecto",
  h:[["A","What did the boss say?","¿Qué dijo el jefe?"],["B","He said that he was very happy with our work.","Dijo que estaba muy contento con nuestro trabajo."],["A","Did he say anything about the bonus?","¿Dijo algo del bono?"],["B","He told me he would pay it next month.","Me dijo que lo iba a pagar el mes que viene."],["A","He said the same thing last year.","Dijo lo mismo el año pasado."],["B","He also asked me if I wanted to work on Saturday.","También me preguntó si quería trabajar el sábado."]],
  v:[["say → said","decir","💬","sei / sed"],["tell → told","decir (a alguien)","🗣️","tel / tóuld"],["ask","preguntar, pedir","❓","ask"],["answer","responder","💡","ánser"],["explain","explicar","📖","ekspléin"],["bonus","bono, plus","💵","bóunos"],["promise","prometer","🤞","prómis"],["whether","si (en preguntas indirectas)","❔","uéder"],["complain","quejarse","😤","kompléin"],["the next day","al día siguiente","📅","de nekst dei"]],
  r:{t:"Contar lo que dijo otro",x:"Los tiempos retroceden un paso: «I am happy» → he said he WAS happy; «I will pay» → he said he WOULD pay. say + (that); tell + persona. Preguntas: asked if/whether + orden normal (asked if I wanted, no «did I want»).",tabla:[["«I'm tired.» → She said she was tired.","Dijo que estaba cansada."],["«I'll call.» → He said he would call.","Dijo que llamaría."],["He told me that…","Me dijo que…"],["«Do you want…?» → She asked if I wanted…","Me preguntó si quería…"],["«Where do you live?» → He asked where I lived.","Me preguntó dónde vivía."]]},
  c:[["She ___ me that she was tired.",["told","said","asked"],"Me dijo que estaba cansada.","tell + persona."],["He said he ___ call me later.",["would","will","can"],"Dijo que me llamaría más tarde.","will → would."],["She asked me ___ I liked jazz.",["if","that","what"],"Me preguntó si me gustaba el jazz.","Pregunta de sí/no: if."],["He asked where I ___.",["lived","did live","live"],"Me preguntó dónde vivía.","Orden normal y tiempo atrás: lived."]],
  d:[["What did your doctor say?","¿Qué dijo tu médico?",[["He said I needed to rest.",null],["He said me I needed to rest.","say no lleva persona: He told me / He said."],["He told that I needed to rest.","tell necesita persona: He told me that…"]]],

     ["Did he promise anything?","¿Prometió algo?",[["He promised he would help us.",null],["He promised he will help us.","Retrocede: will → would."],["He promised helping us.","promise + to / that: He promised to help us."]]]]},

  v:[["enjoy","disfrutar","😊","enchói"],["avoid","evitar","🙅","avóid"],["decide","decidir","✅","disáid"],["hope","esperar (con deseo)","🤞","jóup"],["mind","molestar (Do you mind…?)","🙄","máind"],["practise","practicar","🎸","práktis"],["join","unirse, entrar a","🤝","chóin"],["forgive","perdonar","🙏","forguív"],["remember","acordarse","🧠","rimémber"],["stop","dejar de / parar","🛑","stop"]],
  r:{t:"Gerundio o infinitivo",x:"Algunos verbos piden -ing (enjoy, avoid, mind, finish, suggest); otros to + verbo (want, decide, hope, plan, need). Después de preposición siempre -ing (good at cooking). ¡Ojo! stop smoking = dejar de fumar; stop to smoke = parar para fumar.",tabla:[["I enjoy reading.","Disfruto leer."],["I want to travel.","Quiero viajar."],["Do you mind waiting?","¿Te molesta esperar?"],["I'm good at cooking.","Soy bueno cocinando."],["I stopped smoking. / I stopped to smoke.","Dejé de fumar. / Paré para fumar."]]},
  c:[["I enjoy ___ in the rain.",["walking","to walk","walk"],"Disfruto caminar bajo la lluvia.","enjoy + -ing."],["We decided ___ a car.",["to buy","buying","buy"],"Decidimos comprar un auto.","decide + to."],["Do you mind ___ the window?",["opening","to open","open"],"¿Te molesta abrir la ventana?","mind + -ing."],["She's good at ___ languages.",["learning","learn","to learn"],"Es buena aprendiendo idiomas.","Después de preposición: -ing."]],
  d:[["What do you like doing on weekends?","¿Qué te gusta hacer los fines de semana?",[["I enjoy going to the cinema.",null],["I enjoy to go to the cinema.","enjoy + -ing."],["I enjoy go to the cinema.","enjoy + -ing: going."]]],
     ["Why did you stop smoking?","¿Por qué dejaste de fumar?",[["I wanted to feel healthier.",null],["I wanted feeling healthier.","want + to."],["I wanted feel healthier.","want + to: to feel."]]],
     ["Would you mind helping me?","¿Te molestaría ayudarme?",[["Not at all.",null],["Yes, of course!","«Yes» a «Do you mind» significa «sí, me molesta» 😄"],["No, I mind.","Para decir que no molesta: Not at all."]]]]},
 {id:"en37", lvl:"B1", ic:"🕵️", t:"Debe de ser…", sub:"must, might, can't",

  v:[["must","debe de (casi seguro)","✔️","mast"],["might","puede que, capaz","🤷","máit"],["may","puede que","🤔","méi"],["could","podría (posibilidad)","💭","kud"],["can't","no puede ser","❌","kant"],["jacket","campera","🧥","cháket"],["wear","llevar puesto","👕","uér"],["gift","regalo","🎁","guift"],["probably","probablemente","📊","próbabli"],["guess","adivinar, suponer","🎯","gues"]],

  d:[["Where's Pedro?","¿Dónde está Pedro?",[["He might be in the kitchen.",null],["He might to be in the kitchen.","might + verbo sin to."],["He mights be in the kitchen.","Los modales no llevan -s."]]],

 {id:"en48", lvl:"B2", ic:"🤝", t:"Negociar", sub:"ofertas y condiciones",
  h:[["A","If you order 500 units, we could offer a 10% discount.","Si piden 500 unidades, podríamos ofrecer un 10% de descuento."],["B","That's a good start, but we were hoping for 15%.","Es un buen comienzo, pero esperábamos un 15%."],["A","We might be able to go up to 12%, provided you pay in advance.","Podríamos llegar al 12%, siempre que paguen por adelantado."],["B","Would you be willing to include free delivery?","¿Estarían dispuestos a incluir el envío gratis?"],["A","As long as the order is confirmed this week, yes.","Siempre y cuando el pedido se confirme esta semana, sí."],["B","It's a deal.","Trato hecho."]],
  v:[["discount","descuento","🏷️","dískaunt"],["order","pedido, pedir","📦","órder"],["in advance","por adelantado","⏩","in adváns"],["provided (that)","siempre que","📜","prováided"],["as long as","siempre y cuando","↔️","as long as"],["be willing to","estar dispuesto a","🙋","bi uíling tu"],["delivery","envío, entrega","🚚","delíveri"],["It's a deal","trato hecho","🤝","its a diil"],["counteroffer","contraoferta","🔄","káunterofer"],["bottom line","piso, lo mínimo","📉","bótom láin"]],
  r:{t:"Lenguaje de negociación",x:"Se usan condicionales y modales para no sonar rígido: we could / we might be able to / would you be willing to…? Para poner condiciones: provided (that), as long as, on condition that + presente.",tabla:[["We could offer…","Podríamos ofrecer…"],["Would you be willing to…?","¿Estarían dispuestos a…?"],["provided you pay in advance","siempre que paguen por adelantado"],["as long as it arrives on time","siempre y cuando llegue a tiempo"],["That's our final offer.","Es nuestra oferta final."]]},
  c:[["We ___ offer a small discount.",["could","can to","would to"],"Podríamos ofrecer un pequeño descuento.","Suave: we could."],["Would you be ___ to lower the price?",["willing","wanting","agree"],"¿Estarían dispuestos a bajar el precio?","be willing to."],["We accept, provided you ___ in advance.",["pay","will pay","paid"],"Aceptamos, siempre que paguen por adelantado.","provided + presente."],["It's a ___!",["deal","done","business"],"¡Trato hecho!","Fórmula: It's a deal."]],
  d:[["Our price is 20 dollars per unit.","Nuestro precio es 20 dólares por unidad.",[["Would you be willing to go down to 17?",null],["Too expensive. Bye.","Así se termina la negociación, no se negocia."],["Would you willing to go down?","Falta be: Would you be willing…?"]]],
     ["We can deliver in two weeks.","Podemos entregar en dos semanas.",[["That works, as long as it's before the 15th.",null],["That works, as long it's before the 15th.","Falta as: as long as."],["That works, provided it will be before the 15th.","provided + presente: it's."]]],
     ["Is that your final offer?","¿Es su oferta final?",[["I'm afraid it is.",null],["Yes, take it or leave it, idiot.","Nunca insultes al cliente 😄"],["I'm afraid it's.","Al final de la frase no se contrae: it is."]]]]},
 {id:"en49", lvl:"B2", ic:"🍰", t:"Frases hechas", sub:"idioms comunes",
  h:[["A","How was the exam?","¿Cómo te fue en el examen?"],["B","A piece of cake! But the teacher was a pain in the neck.","¡Pan comido! Pero el profe era un plomo."],["A","Now you can let your hair down.","Ahora podés relajarte."],["B","I'm over the moon. Let's celebrate, my treat!","Estoy re feliz. Festejemos, ¡invito yo!"],["A","That restaurant costs an arm and a leg.","Ese restaurante sale un ojo de la cara."],["B","OK, let's not go overboard. Pizza it is.","Bueno, no nos zarpemos. Pizza entonces."]],

  r:{t:"Idioms: no se traducen palabra por palabra",x:"Los idioms son como nuestros dichos: el significado no sale de las palabras. Aprendelos enteros y con su situación. Usalos con moderación en contextos formales.",tabla:[["It's raining cats and dogs.","Llueve a cántaros."],["Break a leg!","¡Mucha suerte! (antes de actuar)"],["I'm feeling under the weather.","Me siento medio mal."],["Let's call it a day.","Dejemos por hoy."],["Speak of the devil!","¡Hablando del rey de Roma!"]]},
  c:[["The test was a piece of ___.",["cake","pie","bread"],"El examen fue pan comido.","Idiom: a piece of cake."],["That car costs an arm and a ___.",["leg","foot","hand"],"Ese auto sale un ojo de la cara.","Idiom: an arm and a leg."],["I'm tired. Let's call it a ___.",["day","night","time"],"Estoy cansado. Dejemos por hoy.","Idiom: call it a day."],["I'm feeling a bit under the ___.",["weather","rain","sky"],"Me siento medio mal.","Idiom: under the weather."]],
  d:[["How do you break the ice at a party?","¿Cómo rompés el hielo en una fiesta?",[["I usually ask people how they know the host.",null],["I break the ice with a hammer.","😄 Es una expresión: iniciar la charla."],["I don't break nothing.","Doble negación: I don't break anything."]]],

 {id:"en50", lvl:"B2", ic:"🧲", t:"Make o do", sub:"collocations",
  h:[["A","I need to make a decision about the offer.","Tengo que tomar una decisión sobre la oferta."],["B","Don't make a mistake. Do some research first.","No te equivoques. Investigá primero."],["A","I've made a list of pros and cons.","Hice una lista de pros y contras."],["B","Good. Have you done the maths?","Bien. ¿Hiciste las cuentas?"],["A","Yes. It would make a big difference to my salary.","Sí. Haría una gran diferencia en mi sueldo."],["B","Then take the chance and do your best!","¡Entonces aprovechá la oportunidad y hacé lo mejor que puedas!"]],

  r:{t:"Palabras que van juntas",x:"Muchas combinaciones no se deducen: se dice «make a decision» (no «take»), «do homework» (no «make»). Regla general: make = crear o producir algo; do = actividades, tareas y trabajo. Aprendelas en bloque.",tabla:[["make: a decision, a mistake, money, a plan, noise","make"],["do: homework, the dishes, business, a favour","do"],["take: a photo, a break, a chance","take"],["pay: attention, a visit, a compliment","pay"],["keep: a promise, a secret, calm","keep"]]},
  c:[["I made a terrible ___.",["mistake","error do","homework"],"Cometí un error terrible.","make a mistake."],["Can you ___ me a favour?",["do","make","take"],"¿Me hacés un favor?","do a favour."],["Let's ___ a break.",["take","do","make"],"Tomemos un descanso.","take a break."],["Please ___ attention.",["pay","do","make"],"Presten atención.","pay attention."]],
  d:[["What do you do on Sundays?","¿Qué hacés los domingos?",[["I do the housework and relax.",null],["I make the housework.","Tareas: do the housework."],["I do the relax.","relax es verbo: I relax."]]],

 {id:"en51", lvl:"B2", ic:"📊", t:"Presentaciones", sub:"estructurar una charla",
  h:[["A","Good morning, everyone. Today I'm going to talk about our sales results.","Buen día a todos. Hoy voy a hablar de los resultados de ventas."],["A","First, I'll give you an overview. Then, I'll focus on the challenges.","Primero, les voy a dar un panorama. Después, me voy a centrar en los desafíos."],["A","As you can see from this chart, sales rose by 20%.","Como pueden ver en este gráfico, las ventas subieron un 20%."],["A","Moving on to the next point: costs.","Pasando al siguiente punto: los costos."],["A","To sum up, it was a very good year.","Para resumir, fue un muy buen año."],["B","Thank you. Are there any questions?","Gracias. ¿Hay alguna pregunta?"]],
  v:[["overview","panorama general","🗺️","óuverviu"],["focus on","centrarse en","🎯","fóukus on"],["chart","gráfico","📊","chart"],["rise → rose","subir","📈","ráis / róus"],["fall → fell","bajar","📉","fol / fel"],["Moving on to…","pasando a…","➡️","múving on tu"],["To sum up","para resumir","🧾","tu sam ap"],["slide","diapositiva","🖼️","sláid"],["figure","cifra","🔢","fíguer"],["significantly","significativamente","📏","signífikantli"]],
  r:{t:"Señalizar la charla",x:"Una buena presentación le dice al público dónde está: introducción (Today I'm going to talk about…), orden (First… Then… Finally…), transiciones (Moving on to… / Let's turn to…), gráficos (As you can see…) y cierre (To sum up… / Thank you for your attention).",tabla:[["Today I'd like to talk about…","Hoy me gustaría hablar de…"],["Let's turn to…","Pasemos a…"],["As you can see from this slide…","Como ven en esta diapositiva…"],["Sales fell by 5%.","Las ventas bajaron un 5%."],["To sum up / In conclusion…","Para resumir / En conclusión…"]]},
  c:[["Sales ___ by 20% last year.",["rose","raised","rise"],"Las ventas subieron un 20% el año pasado.","rise → rose (sin objeto)."],["As you can see ___ this chart…",["from","to","of"],"Como ven en este gráfico…","Fórmula: as you can see from."],["___ on to the next point.",["Moving","Move","Moved"],"Pasando al siguiente punto.","Moving on to…"],["To ___ up, it was a great year.",["sum","summary","resume"],"Para resumir, fue un gran año.","To sum up."]],
  d:[["How do you open a presentation?","¿Cómo abrís una presentación?",[["Good morning. Today I'm going to talk about…",null],["Hello. I talk about sales now.","Mejor: Today I'm going to talk about…"],["Good morning. Let's sum up.","«sum up» es para cerrar."]]],
     ["How did profits change?","¿Cómo cambiaron las ganancias?",[["They fell slightly in the second quarter.",null],["They felt slightly.","felt es de «feel». Bajar: fell."],["They falled slightly.","fall → fell."]]],
