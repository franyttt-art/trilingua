<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0A1A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trilingua">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Trilingua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
/* Diseño nocturno único (cielo estrellado): se elige a propósito un solo tema oscuro */
:root, :root[data-theme="light"], :root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0A1A; --sky1:#1B1740; --sky2:#0B0A1A;
  --surface:rgba(30,26,52,.86); --surface2:#2B2650; --ink:#F3F0FF; --muted:#B4ADD6; --line:#3A3464;
  --brand:#FF8A3D; --brand-dark:#D96A1F; --brand-soft:#3E2A22;
  --act:#8C73FF; --act-dark:#6A4FE0; --act-soft:#2C2654;
  --good:#2FD08A; --good-dark:#1FA06A; --good-soft:#143A2C;
  --bad:#FF6461; --bad-dark:#D9423F; --bad-soft:#40181D;
  --gold:#FFC23A; --lock:#3A3560; --lock-dark:#27234A;
  --en:#4F7FE6; --en-dark:#3560C0; --de:#F0B72A; --de-dark:#C99210; --la:#D2445D; --la-dark:#A52F45;
  --f-display:"Baloo 2","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-roman:"Cinzel",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--sky1) 0%,var(--sky2) 70%) fixed,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app,nav.tabs,#toast{position:relative;z-index:1}
nav.tabs{position:fixed}
#toast{position:fixed}
.card,.opt,.item,.kpi,.bubble,.tok,.line .txt,input.answer,select{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.app{max-width:600px;margin:0 auto;min-height:100%;padding-inline:16px;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
/* ---------- barra superior ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(11,10,26,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;gap:10px}
.lvlhead{text-align:center;padding:14px 16px;border-radius:18px;border:2px dashed var(--line);background:rgba(30,26,52,.6);width:100%;max-width:360px}
.lvlhead b{font-family:var(--f-display);font-size:22px;display:block}
.flags{display:flex;gap:6px}
.flagbtn{border:3px solid transparent;background:none;padding:2px;border-radius:12px;line-height:0;transition:transform .15s}
.flagbtn svg{width:40px;height:28px;border-radius:7px;display:block;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.flagbtn[aria-pressed="true"]{border-color:var(--lc)}
.flagbtn:active{transform:scale(.92)}
.pills{margin-left:auto;display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:4px;font-weight:800;font-size:15px;padding:4px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.pill.fire{color:var(--brand)}.pill.xp{color:var(--gold)}
/* ---------- navegación ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--muted);font-weight:800;position:relative}
nav.tabs .ic{font-size:24px;line-height:1.1;filter:grayscale(.6);transition:transform .15s}
nav.tabs button[aria-current="page"]{color:var(--act)}
nav.tabs button[aria-current="page"] .ic{filter:none;transform:translateY(-2px) scale(1.1)}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:#fff;font-size:11px;border-radius:99px;padding:0 6px;font-weight:800}
body.inlesson nav.tabs{display:none}
body.inlesson .app{padding-bottom:24px}
/* ---------- piezas comunes ---------- */
main{display:flex;flex-direction:column;gap:16px;padding-block:4px 16px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1;min-width:0}
.btn{--c:var(--surface);--cd:var(--line);--ct:var(--ink);border:2px solid var(--cd);border-bottom-width:5px;background:var(--c);color:var(--ct);padding:11px 18px;border-radius:16px;font-weight:800;font-size:16px;letter-spacing:.02em;transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px}
.btn.pri{--c:var(--act);--cd:var(--act-dark);--ct:#fff}
.btn.good{--c:var(--good);--cd:var(--good-dark);--ct:#fff}
.btn.bad{--c:var(--bad);--cd:var(--bad-dark);--ct:#fff}
.btn.lang{--c:var(--lc);--cd:var(--lcd);--ct:#fff}
.btn.big{width:100%;padding:14px;font-size:17px;text-transform:uppercase}
.btn:disabled{opacity:.45;cursor:default}
.btn.link{border:0;background:none;color:var(--act);padding:8px;text-transform:none}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:700}
.tito-row{display:flex;align-items:flex-end;gap:10px}
.tito-row .bubble{flex:1}
.tito-row .bubble::before{content:"";position:absolute;left:-10px;bottom:18px;border:8px solid transparent;border-right-color:var(--line)}
.tito-row .bubble::after{content:"";position:absolute;left:-6px;bottom:19px;border:7px solid transparent;border-right-color:var(--surface)}
.tito{flex:none;display:block}
.tito.idle{animation:bob 2.6s ease-in-out infinite}
.tito.happy{animation:hop .6s ease}
.tito.sad{animation:droop .6s ease forwards}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes hop{30%{transform:translateY(-16px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
@keyframes droop{to{transform:rotate(-8deg) translateY(3px)}}
.tito{cursor:pointer;-webkit-tap-highlight-color:transparent}
.tito.enojo{animation:enojo .45s ease}
@keyframes enojo{0%,100%{transform:none}20%{transform:translateX(-5px) rotate(-6deg)}40%{transform:translateX(5px) rotate(6deg)}60%{transform:translateX(-4px) rotate(-4deg)}80%{transform:translateX(3px)}}
.tito.afuera{animation:sevaFelipe 7s ease forwards}
@keyframes sevaFelipe{0%{transform:none;opacity:1}12%{transform:translate(40px,-30px) rotate(12deg);opacity:0}88%{transform:translate(40px,-30px);opacity:0}100%{transform:none;opacity:1}}
.tito .humo{animation:humo 3s ease-in-out infinite;transform-origin:88px 58px}
@keyframes humo{0%{opacity:0;transform:translateY(4px) scaleY(.7)}40%{opacity:.75}100%{opacity:0;transform:translateY(-10px) scaleY(1.1)}}
.cert{border:3px solid var(--gold);background:linear-gradient(135deg,var(--surface),var(--brand-soft));border-radius:20px;padding:18px;text-align:center}
/* ---------- camino ---------- */
.hero{display:flex;gap:12px;align-items:center;background:var(--lc);color:#fff;border-radius:22px;padding:14px 16px;border-bottom:5px solid var(--lcd)}
.hero .eyebrow{color:rgba(255,255,255,.85)}
.hero h2{color:#fff}
.goal{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring b{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.path{display:flex;flex-direction:column;align-items:center;gap:26px;padding-block:40px 20px;position:relative}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.node button.disc{width:78px;height:72px;border-radius:50%;border:0;background:var(--lc);box-shadow:0 7px 0 var(--lcd);font-size:32px;display:grid;place-items:center;transition:transform .1s;position:relative}
.node button.disc:active{transform:translateY(5px);box-shadow:0 2px 0 var(--lcd)}
.node.locked button.disc{background:var(--lock);box-shadow:0 7px 0 var(--lock-dark);filter:grayscale(1);cursor:default}
.node.done button.disc{background:var(--gold);box-shadow:0 7px 0 #C98600}
.node.current button.disc::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--lc);opacity:.35;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.25);opacity:0}}
.node .lbl{font-weight:800;font-size:14px;text-align:center;max-width:170px;line-height:1.2}
.node .lbl small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.node .start{position:absolute;top:-38px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:3px 10px;font-weight:800;font-size:13px;color:var(--lc);white-space:nowrap;animation:bob 2s ease-in-out infinite}
.node .tito-side{position:absolute;top:0}
/* ---------- lección ---------- */
.lesson-top{display:flex;align-items:center;gap:10px;padding-block:8px}
.xbtn{border:0;background:none;font-size:26px;color:var(--muted);padding:4px 8px;line-height:1}
.pbar{flex:1;height:16px;border-radius:99px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--good);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);transition:width .35s ease}
.combo{font-weight:800;color:var(--brand);font-size:14px;min-width:44px;text-align:right}
.stage{display:flex;flex-direction:column;gap:16px;min-height:60vh}
.prompt{font-family:var(--f-display);font-size:24px;font-weight:800}
.target{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.la .target{font-family:var(--f-roman);font-size:30px;letter-spacing:.02em}
.say{border:0;background:var(--act);color:#fff;border-radius:14px;width:52px;height:52px;font-size:24px;box-shadow:0 4px 0 var(--act-dark);flex:none}
.say.slow{background:var(--surface2);color:var(--ink);box-shadow:0 4px 0 var(--line);font-size:20px}
.say:active{transform:translateY(3px);box-shadow:0 1px 0 var(--act-dark)}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);border-radius:16px;padding:14px;text-align:left;font-size:17px;font-weight:700;transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt.sel{border-color:var(--act);background:var(--act-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good-dark)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-dark)}
.opt .em{font-size:40px;display:block;text-align:center;margin-bottom:4px}
.opt.pic{text-align:center}
.tokens{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:10px 4px;border-bottom:2px solid var(--line)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:800}
.tok.used{visibility:hidden}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .opt{text-align:center;padding:12px 8px;font-size:16px}
.pairs .opt.gone{opacity:.25;pointer-events:none}
input.answer{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;font-size:18px;font-weight:700}
input.answer:focus{border-color:var(--act);outline:none}
.sheet{position:sticky;bottom:0;margin-inline:-16px;padding:16px;border-radius:20px 20px 0 0;display:flex;flex-direction:column;gap:10px;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet.ok{background:var(--good-soft)}.sheet.no{background:var(--bad-soft)}
.sheet h3{font-size:22px}
.sheet.ok h3{color:var(--good-dark)}.sheet.no h3{color:var(--bad-dark)}
.sheet .exp{font-weight:600}
/* historia / diálogo */
.line{display:flex;gap:10px;align-items:flex-start}
.line .who{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:22px;flex:none}
.line .txt{flex:1;background:var(--surface);border:2px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 12px;cursor:pointer}
.line .txt b{display:block;font-size:17px}
.la .line .txt b{font-family:var(--f-roman);font-size:16px}
.line .txt .es{color:var(--muted);font-size:14px;font-weight:700}
.line.me{flex-direction:row-reverse}
.line.me .txt{border-radius:16px 4px 16px 16px;background:var(--act-soft);border-color:transparent}
.hint-tap{font-size:13px;color:var(--muted);text-align:center}
.vcard{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:26px 16px}
.vcard .em{font-size:72px;line-height:1}
.tip{background:var(--brand-soft);border-radius:16px;padding:12px 14px;font-weight:700}
.nombre-in{flex:1 1 180px;min-width:0;box-sizing:border-box;border-radius:14px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);padding:12px 14px;font:700 18px var(--f-body)}
.nombre-in:focus{outline:none;border-color:var(--act)}
.bienvenida{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:24px}
.bienvenida .nombre-in{width:100%;max-width:340px;flex:none;text-align:center;font-size:22px}
.bienvenida .btn{width:100%;max-width:340px}
.codigo{width:100%;box-sizing:border-box;border-radius:14px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);padding:10px;font:600 13px/1.35 ui-monospace,monospace;resize:vertical}
.micbox{display:flex;flex-direction:column;gap:10px}
.btn.mic{--c:#2A1F55;--cd:#7C5CFF;--ct:#fff}
.btn.mic.rec{--c:#B3261E;--cd:#7A120C;animation:latido 1s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.03)}}
.micres{display:flex;flex-direction:column;gap:8px}
.micres .frase{font-size:20px;font-weight:800}
.micres .ok{color:var(--good)} .micres .mal{color:var(--bad);text-decoration:underline wavy}
.micpide{display:flex;flex-direction:column;gap:12px;border-color:var(--brand);min-width:0}
.micpide .row{flex-wrap:wrap}.micpide .row .btn{flex:1 1 140px}.micpide .sp{min-width:0}
@media (prefers-reduced-motion:reduce){.btn.mic.rec{animation:none}}
.rule{display:flex;flex-direction:column;gap:12px}
.rule table{width:100%;border-collapse:separate;border-spacing:0;border:2px solid var(--line);border-radius:14px;overflow:hidden;font-size:15px}
.rule td,.rule th{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
.rule tr:last-child td{border-bottom:0}
.rule th{background:var(--surface2);font-weight:800}
.rule td:first-child{font-weight:800;color:var(--lc)}
.scroll-x{overflow-x:auto}
.celebrate{align-items:center;text-align:center;justify-content:center}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat3{border:2px solid var(--c);border-radius:16px;overflow:hidden;text-align:center}
.stat3 .h{background:var(--c);color:#fff;font-size:12px;font-weight:800;padding:3px;text-transform:uppercase}
.stat3 b{display:block;font-size:22px;font-family:var(--f-display);padding:6px}
/* listas */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px}
.item .ic{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:24px;flex:none}
.item b{display:block}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center}
.kpi .e{font-size:28px}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;font-weight:800;color:var(--muted)}
.week i{display:block;width:30px;height:30px;margin:4px auto 0;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-style:normal;font-size:15px}
.week i.on{background:var(--brand);color:#fff}
.method li{margin-bottom:10px}
.method b{color:var(--act)}
select{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:700}
.switch{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.hide{display:none!important}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;z-index:30;max-width:90vw;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="stars" aria-hidden="true"></canvas>
<div class="app" id="app">
  <header class="top" id="topbar">
    <div class="flags" id="flags" role="group" aria-label="Idioma"></div>
    <div class="pills">
      <span class="pill fire" title="Días seguidos">🔥 <span id="pRacha">0</span></span>
      <span class="pill xp" title="Puntos de experiencia">⚡ <span id="pXp">0</span></span>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Secciones"><div class="in">
  <button data-v="camino" aria-current="page"><span class="ic">🗺️</span>Aprender</button>
  <button data-v="repaso"><span class="ic">🧠</span>Repasar<span class="badge hide" id="dueBadge"></span></button>
  <button data-v="practica"><span class="ic">💬</span>Practicar</button>
  <button data-v="perfil"><span class="ic">🐦</span>Perfil</button>
</div></nav>
<div id="toast" hidden></div>
<canvas id="confetti" hidden></canvas>

<script>
/* =========================================================================
   CONTENIDO DEL CURSO
   Unidad normal: h = historia [quién, frase, traducción] · v = vocabulario [palabra, significado, emoji, pronunciación]
   r = regla {t, x, tabla} · c = completar [frase con ___, [opciones (la 1ª es la correcta)], traducción, explicación]
   d = diálogo [[frase del otro, traducción, [[respuesta, null si es correcta | explicación del error], ...]], ...]
   Unidad de sonidos: s = tarjetas [palabra, significado, pronunciación, consejo] · pares mínimos · q = preguntas
   ========================================================================= */
const CURSO = {
en:{nombre:"Inglés", voz:"en-GB", gente:["🧔","👩"], unidades:[
 {id:"en0", ic:"👂", t:"Los sonidos del inglés", sub:"Pronunciación desde el día 1", tipo:"sonidos",
  s:[["think","pensar","zink","TH sin voz: la punta de la lengua entre los dientes y soplá."],["this","esto","dis","TH con voz: igual, pero haciendo vibrar la garganta, como una d muy suave."],
     ["hello","hola","jeló","La H es un soplido suave, como cuando empañás un vidrio."],["ship","barco","ship","i corta y relajada."],["sheep","oveja","shiip","ee larga, estirando la sonrisa."],

  h:[["A","Have you ever been to Europe?","¿Alguna vez estuviste en Europa?"],["B","Yes, I have. I've been to Spain and Italy.","Sí. Estuve en España e Italia."],["A","Have you ever eaten sushi?","¿Alguna vez comiste sushi?"],["B","No, I've never eaten sushi.","No, nunca comí sushi."],["A","Really? You have to try it!","¿En serio? ¡Tenés que probarlo!"],["B","OK, let's go this weekend.","Bueno, vamos este fin de semana."]],

  r:{t:"der, die, das → mein, meine",x:"Cada sustantivo tiene género y hay que aprenderlo con su artículo. El posesivo cambia según ese género: con «die» se agrega -e.",tabla:[["der Vater","mein Vater"],["das Kind","mein Kind"],["die Mutter","meine Mutter"],["die Schwester","deine Schwester"]]},
  c:[["Das ist ___ Mutter.",["meine","mein","meinen"],"Esta es mi mamá.","die Mutter → meine."],["Das ist ___ Vater.",["mein","meine","meiner"],"Este es mi papá.","der Vater → mein."],["Ist das ___ Bruder?",["dein","deine","du"],"¿Es tu hermano?","der Bruder → dein."],["___ Schwester heißt Kati.",["Meine","Mein","Ich"],"Mi hermana se llama Kati.","die Schwester → meine."]],
  d:[["Wer ist das?","¿Quién es?",[["Das ist meine Schwester.",null],["Das ist mein Schwester.","Schwester es femenino (die): meine."],["Das ist ich Schwester.","«ich» es yo; «mi» es mein/meine."]]],

 {id:"de6", ic:"🚉", t:"En la ciudad", sub:"Wo ist der Bahnhof?",
  h:[["A","Entschuldigung! Wo ist der Bahnhof?","¡Disculpe! ¿Dónde está la estación?"],["B","Er ist nah. Gehen Sie geradeaus.","Está cerca. Siga derecho."],["A","Geradeaus… und dann?","Derecho… ¿y después?"],["B","Dann links. Der Bahnhof ist rechts.","Después a la izquierda. La estación está a la derecha."],["A","Gibt es eine Toilette im Bahnhof?","¿Hay un baño en la estación?"],["B","Ja, es gibt eine Toilette.","Sí, hay un baño."]],
  v:[["die Straße","la calle","🛣️","di shtráse"],["der Bahnhof","la estación","🚉","der bánjof"],["die Toilette","el baño","🚻","di toaléte"],["links","a la izquierda","⬅️","links"],["rechts","a la derecha","➡️","rejts"],["geradeaus","derecho","⬆️","guerádeaus"],["nah","cerca","📍","naa"],["weit","lejos","🧭","váit"],["Wo ist…?","¿Dónde está…?","❓","vo ist"],["es gibt","hay","✨","es guipt"]],
  r:{t:"El verbo va segundo",x:"En una frase afirmativa el verbo conjugado siempre está en el segundo lugar. Si empezás con otra palabra («Dann…»), el sujeto pasa después del verbo. En las preguntas de sí/no, el verbo va primero.",tabla:[["Der Bahnhof ist rechts.","La estación está a la derecha."],["Dann gehen Sie links.","Después vaya a la izquierda."],["Wo ist die Toilette?","¿Dónde está el baño?"],["Gibt es ein Taxi?","¿Hay un taxi?"]]},
  c:[["Wo ___ der Bahnhof?",["ist","sind","bin"],"¿Dónde está la estación?","der Bahnhof (uno) → ist."],["Dann ___ Sie links.",["gehen","geht","gehe"],"Después vaya a la izquierda.","Sie (usted) → gehen, y el verbo va segundo."],["Es ___ eine Toilette.",["gibt","ist","hat"],"Hay un baño.","Hay = es gibt."],["Der Bahnhof ist ___.",["rechts","recht","rechte"],"La estación está a la derecha.","A la derecha = rechts."]],
  d:[["Kann ich helfen?","¿Lo puedo ayudar?",[["Ja, wo ist der Bahnhof?",null],["Ja, wo der Bahnhof?","Falta el verbo: wo IST der Bahnhof?"],["Ja, wo sind der Bahnhof?","Una sola estación: ist."]]],

 {id:"de7", ic:"🕒", t:"El día y la hora", sub:"Wie spät ist es?",

  r:{t:"Verbos separables y «um» / «am»",x:"Algunos verbos se parten en dos: «aufstehen» → «Ich stehe um sieben auf» (el prefijo va al final). La hora va con «um» y los días con «am».",tabla:[["aufstehen","Ich stehe um 7 auf."],["anrufen","Er ruft mich an."],["um sieben Uhr","a las siete"],["am Montag","el lunes"]]},
  c:[["Ich stehe um sieben ___.",["auf","an","aus"],"Me levanto a las siete.","aufstehen: el «auf» va al final."],["___ Sonntag schlafe ich.",["Am","Um","Im"],"El domingo duermo.","Días: am."],["Ich arbeite ___ acht Uhr.",["um","am","an"],"Trabajo a las ocho.","Horas: um."],["Was ___ du am Samstag?",["machst","mache","macht"],"¿Qué hacés el sábado?","du → machst."]],
  d:[["Wie spät ist es?","¿Qué hora es?",[["Es ist acht Uhr.",null],["Es ist acht Stunden.","«Stunden» son horas de duración; la hora es «acht Uhr»."],["Ich bin acht.","Eso es «tengo ocho años»."]]],

     ["Was machst du am Sonntag?","¿Qué hacés el domingo?",[["Am Sonntag schlafe ich.",null],["Am Sonntag ich schlafe.","El verbo va segundo: Am Sonntag schlafe ich."],["Um Sonntag schlafe ich.","Días: am."]]]]},
 {id:"de8", ic:"🍕", t:"Comida y gustos", sub:"Ich esse gern Pizza",

  v:[["essen","comer","🍽️","ésen"],["trinken","beber, tomar","🥤","trínken"],["gern","con gusto (me gusta)","👍","guern"],["der Fisch","el pescado","🐟","der fish"],["das Fleisch","la carne","🥩","das fláish"],["das Hähnchen","el pollo","🍗","das jénjen"],["das Gemüse","la verdura","🥦","das guemüüse"],["der Wein","el vino","🍷","der váin"],["das Bier","la cerveza","🍺","das bíir"],["nicht","no (niega)","🚫","nijt"]],

  c:[["Ich trinke ___ Kaffee.",["gern","gut","lieb"],"Me gusta tomar café.","Para gustos: gern."],["Du ___ viel Fleisch.",["isst","esst","esse"],"Comés mucha carne.","essen es irregular: du isst."],["Er trinkt ___ gern Bier.",["nicht","kein","nein"],"No le gusta tomar cerveza.","Para negar el verbo: nicht."],["___ du Wein?",["Trinkst","Trinkt","Trinke"],"¿Tomás vino?","du → trinkst."]],
  d:[["Isst du gern Gemüse?","¿Te gustan las verduras?",[["Ja, ich esse gern Gemüse.",null],["Ja, ich gern esse Gemüse.","El verbo va segundo: ich esse gern…"],["Ja, ich mag essen gern.","Sobra «mag»: Ich esse gern Gemüse."]]],

  d:[["Wo ist die Küche?","¿Dónde está la cocina?",[["Neben dem Bad.",null],["Neben das Bad.","Dónde está algo: dativo, dem Bad."],["Es gibt Küche.","Eso es «hay cocina»."]]],

  r:{t:"Profesiones y «kein»",x:"Las profesiones van sin artículo: «Ich bin Ingenieur». Para mujeres se agrega -in: Ingenieurin, Ärztin. Para negar un sustantivo que llevaría ein/eine se usa «kein»: «Ich habe kein Büro».",tabla:[["Ich bin Ingenieur.","Soy ingeniero."],["Sie ist Ärztin.","Ella es médica."],["Ich habe kein Büro.","No tengo oficina."],["Er ruft nicht an.","Él no llama."]]},

  d:[["Kann ich Ihnen helfen?","¿Lo puedo ayudar?",[["Ja, ich suche eine Jacke.",null],["Ja, ich suche ein Jacke.","die Jacke → eine."],["Ja, ich suche für eine Jacke.","«suchen» no lleva preposición."]]],

  r:{t:"El Perfekt: el pasado que se habla",x:"En la conversación, el alemán cuenta el pasado con haben + participio. El participio va AL FINAL de la frase. Regulares: ge- + raíz + -t (spielen → gespielt). Irregulares: ge- + … + -en (essen → gegessen).",tabla:[["ich habe gespielt","jugué"],["du hast gekauft","compraste"],["er hat gegessen","comió"],["wir haben getrunken","tomamos"],["Was hast du gemacht?","¿Qué hiciste?"]]},

  v:[["gefahren","viajado (en vehículo)","🚗","guefáren"],["geflogen","volado","✈️","gueflóguen"],["gegangen","ido (a pie)","🚶","guegánguen"],["gekommen","venido, llegado","🏠","guekómen"],["geblieben","quedado","🛏️","gueblíben"],["aufgestanden","levantado","⏰","áufguestanden"],["passiert","pasado, sucedido","❓","pasírt"],["der Zug","el tren","🚆","der tsuk"],["nach Hause","a casa","🏡","naj jáuze"],["im Sommer","en verano","☀️","im zómer"]],
  r:{t:"¿haben o sein?",x:"Los verbos de MOVIMIENTO de un lugar a otro (fahren, fliegen, gehen, kommen) y de CAMBIO de estado (aufstehen, einschlafen) usan sein. También sein y bleiben. Todo lo demás, haben.",tabla:[["ich bin gefahren","viajé"],["du bist geflogen","volaste"],["er ist gekommen","vino"],["wir sind geblieben","nos quedamos"],["ich bin aufgestanden","me levanté"],["Was ist passiert?","¿Qué pasó?"]]},
  c:[["Ich ___ nach Berlin gefahren.",["bin","habe","ist"],"Viajé a Berlín.","Movimiento: sein → bin."],["Sie ist nach Hause ___.",["gegangen","gegeht","gehen"],"Se fue a casa.","gehen → gegangen."],["Wir ___ zwei Wochen geblieben.",["sind","haben","seid"],"Nos quedamos dos semanas.","bleiben va con sein."],["Ich ___ Pizza gegessen.",["habe","bin","ist"],"Comí pizza.","Comer no es movimiento: haben."]],

 {id:"de16", lvl:"A2", ic:"🕰️", t:"Früher", sub:"war, hatte, doch",
  h:[["A","Wo warst du gestern Abend?","¿Dónde estabas ayer a la noche?"],["B","Ich war zu Hause. Ich hatte Kopfschmerzen.","Estaba en casa. Me dolía la cabeza."],["A","Warst du nicht auf der Party?","¿No estuviste en la fiesta?"],["B","Doch! Aber nur eine Stunde.","¡Sí! Pero solo una hora."],["A","Früher warst du immer bis drei Uhr da.","Antes siempre te quedabas hasta las tres."],["B","Früher hatte ich auch mehr Energie.","Antes también tenía más energía."]],
  v:[["war","estaba / era","⏪","var"],["hatte","tenía","🎒","játe"],["früher","antes, antiguamente","🕰️","frúer"],["damals","en aquel entonces","📜","dámals"],["als Kind","de chico","🧒","als kint"],["doch","¡sí! (contra una negación)","☝️","doj"],["die Stunde","la hora","⏱️","di shtúnde"],["gestern Abend","ayer a la noche","🌙","guéstern ábent"],["immer","siempre","♾️","ímer"],["die Energie","la energía","⚡","di energuí"]],
  r:{t:"war y hatte + doch",x:"Con sein y haben el alemán prefiere el Präteritum aun hablando: ich war, ich hatte. «doch» contesta «sí» a una pregunta negativa: —¿No venís? —¡Doch! (¡Sí, vengo!).",tabla:[["ich war / hatte","estaba / tenía"],["du warst / hattest","estabas / tenías"],["er war / hatte","estaba / tenía"],["wir waren / hatten","estábamos / teníamos"],["Kommst du nicht? — Doch!","¿No venís? — ¡Sí!"]]},
  c:[["Gestern ___ ich krank.",["war","hatte","bin"],"Ayer estaba enfermo.","Pasado de sein: war."],["Als Kind ___ ich einen Hund.",["hatte","war","habe"],"De chico tenía un perro.","Pasado de haben: hatte."],["Wo ___ du?",["warst","war","wart"],"¿Dónde estabas?","du → warst."],["Hast du keine Zeit? — ___, ich habe Zeit!",["Doch","Ja","Nein"],"¿No tenés tiempo? — ¡Sí tengo!","Contra una negación: doch."]],
  d:[["Warst du gestern im Büro?","¿Estuviste ayer en la oficina?",[["Nein, ich war krank.",null],["Nein, ich hatte krank.","Estar enfermo: ich war krank."],["Nein, ich bin gestern krank.","Pasado: ich war."]]],
     ["Hattest du einen Hund als Kind?","¿Tenías un perro de chico?",[["Ja, ich hatte zwei Hunde.",null],["Ja, ich war zwei Hunde.","😄 Tener: hatte."],["Ja, ich habe zwei Hunde gehattet.","Con haben se usa hatte."]]],
     ["Kommst du nicht mit?","¿No venís?",[["Doch, ich komme mit!",null],["Ja, ich komme mit!","Contra una pregunta negativa se dice «Doch»."],["Nein, ich komme mit!","«Nein» sería que no venís."]]]]},
 {id:"de17", lvl:"A2", ic:"🔮", t:"Pläne", sub:"futuro: presente y werden",

  r:{t:"Hablar del futuro",x:"El alemán usa casi siempre el PRESENTE con una palabra de tiempo: Morgen fahre ich… Para planes lejanos o promesas: werden + infinitivo al final.",tabla:[["ich werde","voy a"],["du wirst","vas a"],["er / sie wird","va a"],["wir werden","vamos a"],["Ich werde lernen.","Voy a aprender."],["Morgen arbeite ich.","Mañana trabajo."]]},
  c:[["Ich ___ in Berlin wohnen.",["werde","wird","werden"],"Voy a vivir en Berlín.","ich → werde."],["Er wird ein Auto ___.",["kaufen","kauft","gekauft"],"Va a comprar un auto.","werden + infinitivo al final."],["Morgen ___ ich nach Hamburg.",["fahre","fahren","gefahren"],"Mañana viajo a Hamburgo.","Presente con palabra de tiempo."],["___ du nächstes Jahr kommen?",["Wirst","Wird","Werde"],"¿Vas a venir el año que viene?","du → wirst."]],
  d:[["Was machst du morgen?","¿Qué hacés mañana?",[["Morgen arbeite ich.",null],["Morgen ich arbeite.","El verbo va segundo: Morgen arbeite ich."],["Morgen ich werde arbeiten.","Verbo segundo: Morgen werde ich arbeiten."]]],

 {id:"de18", lvl:"A2", ic:"⚖️", t:"Vergleichen", sub:"größer als, am besten",
  h:[["A","Welches Handy ist besser?","¿Qué celular es mejor?"],["B","Das Samsung ist billiger als das iPhone.","El Samsung es más barato que el iPhone."],["A","Aber die Kamera ist nicht so gut wie beim iPhone.","Pero la cámara no es tan buena como la del iPhone."],["B","Stimmt. Das iPhone ist am teuersten, aber am schnellsten.","Cierto. El iPhone es el más caro, pero el más rápido."],["A","Ich nehme das billigere. Ich habe kein Geld.","Me llevo el más barato. No tengo plata."],["B","Die beste Entscheidung!","¡La mejor decisión!"]],
  v:[["billig","barato","💸","bílij"],["teuer","caro","💎","tóier"],["schnell","rápido","🏎️","shnel"],["groß → größer","grande → más grande","🐘","gros / gróser"],["alt → älter","viejo → más viejo","👴","alt / élter"],["gut → besser","bueno → mejor","👍","gut / béser"],["am besten","lo mejor","🏆","am bésten"],["als","que (al comparar)","⚖️","als"],["so … wie","tan … como","🟰","zo … vi"],["lieber","preferentemente","❤️","líber"]],
  r:{t:"Comparar en alemán",x:"Comparativo: adjetivo + -er + als (billiger als). Superlativo: am + adjetivo + -sten (am billigsten). Muchos adjetivos cortos ponen diéresis: groß → größer, alt → älter, jung → jünger. Irregulares: gut → besser → am besten; viel → mehr → am meisten; gern → lieber → am liebsten.",tabla:[["billig","billiger · am billigsten"],["groß","größer · am größten"],["alt","älter · am ältesten"],["gut","besser · am besten"],["gern","lieber · am liebsten"],["so groß wie","tan grande como"]]},
  c:[["Berlin ist ___ als München.",["größer","großer","mehr groß"],"Berlín es más grande que Múnich.","groß → größer, con diéresis."],["Mein Bruder ist älter ___ ich.",["als","wie","dass"],"Mi hermano es más grande que yo.","Comparativo + als."],["Das ist am ___.",["besten","gutsten","besser"],"Eso es lo mejor.","gut → am besten."],["Ich trinke ___ Tee als Kaffee.",["lieber","gerner","mehr gern"],"Prefiero el té al café.","gern → lieber."]],
  d:[["Was trinkst du lieber, Bier oder Wein?","¿Qué preferís, cerveza o vino?",[["Ich trinke lieber Bier.",null],["Ich trinke gerner Bier.","gern → lieber."],["Ich trinke mehr gern Bier.","gern → lieber."]]],
     ["Ist Hamburg so groß wie Berlin?","¿Hamburgo es tan grande como Berlín?",[["Nein, Berlin ist größer.",null],["Nein, Berlin ist mehr groß.","groß → größer."],["Nein, Berlin ist größer wie Hamburg.","Comparativo + als, no wie."]]],
     ["Welches Restaurant ist am besten?","¿Qué restaurante es el mejor?",[["Das italienische ist am besten.",null],["Das italienische ist am gutsten.","gut → am besten."],["Das italienische ist besser am.","Se dice «am besten»."]]]]},
 {id:"de19", lvl:"A2", ic:"🛒", t:"Im Supermarkt", sub:"wie viel, eine Flasche",
  h:[["A","Wir brauchen Milch. Haben wir noch Eier?","Necesitamos leche. ¿Todavía tenemos huevos?"],["B","Nein, wir haben keine Eier mehr.","No, ya no tenemos huevos."],["A","Wie viele Eier brauchen wir?","¿Cuántos huevos necesitamos?"],["B","Zehn. Und eine Flasche Wein und ein Kilo Äpfel.","Diez. Y una botella de vino y un kilo de manzanas."],["A","Wie viel kostet das alles?","¿Cuánto cuesta todo?"],["B","Achtzehn Euro fünfzig.","Dieciocho euros con cincuenta."]],
  v:[["die Milch","la leche","🥛","di milj"],["das Ei / die Eier","el huevo / los huevos","🥚","das ai / di áier"],["der Zucker","el azúcar","🍬","der tsúker"],["der Reis","el arroz","🍚","der ráis"],["der Apfel / die Äpfel","la manzana / las manzanas","🍎","der ápfel / di épfel"],["eine Flasche","una botella","🍾","áine flashe"],["ein Kilo","un kilo","⚖️","ain kílo"],["eine Packung","un paquete","📦","áine pákung"],["kein … mehr","ya no … (más)","🚫","kain … mer"],["wie viel / wie viele","cuánto / cuántos","🔢","vi fil / vi fíle"]],
  r:{t:"Cantidades",x:"«wie viel» con lo que no se cuenta (Milch, Geld); «wie viele» con plurales (Eier, Äpfel). Los envases van SIN preposición: eine Flasche Wein (no «von Wein»). «Ya no hay»: kein … mehr.",tabla:[["Wie viel Milch?","¿Cuánta leche?"],["Wie viele Eier?","¿Cuántos huevos?"],["eine Flasche Wasser","una botella de agua"],["ein Kilo Äpfel","un kilo de manzanas"],["Wir haben kein Brot mehr.","Ya no tenemos pan."]]},
  c:[["Wie ___ Eier brauchst du?",["viele","viel","vieles"],"¿Cuántos huevos necesitás?","Plural: wie viele."],["Ich kaufe eine Flasche ___.",["Wasser","von Wasser","des Wassers"],"Compro una botella de agua.","Sin preposición: eine Flasche Wasser."],["Wir haben ___ Milch mehr.",["keine","nicht","kein"],"Ya no tenemos leche.","die Milch → keine … mehr."],["Wie ___ kostet das?",["viel","viele","vielen"],"¿Cuánto cuesta?","Precio: wie viel."]],
  d:[["Haben wir noch Brot?","¿Todavía tenemos pan?",[["Nein, wir haben kein Brot mehr.",null],["Nein, wir haben nicht Brot mehr.","Con sustantivo: kein … mehr."],["Nein, wir haben Brot nicht.","Mejor: kein Brot mehr."]]],
     ["Wie viele Äpfel möchten Sie?","¿Cuántas manzanas quiere?",[["Ein Kilo, bitte.",null],["Ein Kilo von Äpfel, bitte.","Sin «von»: ein Kilo Äpfel."],["Viel, bitte.","Se responde con una cantidad: ein Kilo."]]],
     ["Wie viel kostet das?","¿Cuánto cuesta?",[["Zwölf Euro.",null],["Zwölf Euros.","En alemán «Euro» no lleva s."],["Es kostet viele.","Se responde con el precio."]]]]},
 {id:"de20", lvl:"A2", ic:"🩺", t:"Beim Arzt", sub:"Kopfschmerzen, du solltest",
  h:[["A","Guten Tag. Was fehlt Ihnen?","Buen día. ¿Qué le pasa?"],["B","Ich habe Kopfschmerzen und Halsschmerzen.","Me duele la cabeza y la garganta."],["A","Haben Sie Fieber?","¿Tiene fiebre?"],["B","Ja, seit gestern. Mir geht es schlecht.","Sí, desde ayer. Me siento mal."],["A","Sie sollten im Bett bleiben und viel Tee trinken.","Debería quedarse en cama y tomar mucho té."],["A","Und Sie dürfen nicht rauchen!","¡Y no puede fumar!"]],
  v:[["der Arzt / die Ärztin","el médico / la médica","🩺","der artst / di értstin"],["die Kopfschmerzen","dolor de cabeza","🤕","di kópfshmertsen"],["die Halsschmerzen","dolor de garganta","😷","di jálsshmertsen"],["das Fieber","la fiebre","🌡️","das fíber"],["der Husten","la tos","🤧","der jústen"],["die Tablette","la pastilla","💊","di tablète"],["krank","enfermo","🤒","krank"],["seit","desde (hace)","⏳","zait"],["Was fehlt Ihnen?","¿Qué le pasa?","❓","vas felt ínen"],["sollten","debería","👉","zólten"]],
  r:{t:"Dolores y consejos",x:"Los dolores se arman con -schmerzen: Kopf + schmerzen, Bauch + schmerzen, y van con haben. Para aconsejar: sollten + infinitivo al final. Para prohibir o permitir: dürfen.",tabla:[["Ich habe Bauchschmerzen.","Me duele la panza."],["Mir geht es schlecht.","Me siento mal."],["Du solltest schlafen.","Deberías dormir."],["Sie sollten Tee trinken.","Debería tomar té."],["Darf ich rauchen? — Nein!","¿Puedo fumar? — ¡No!"]]},
  c:[["Ich ___ Kopfschmerzen.",["habe","bin","tue"],"Me duele la cabeza.","Dolores con haben."],["Du ___ zum Arzt gehen.",["solltest","sollten","sollte"],"Deberías ir al médico.","du → solltest."],["Sie dürfen nicht ___.",["rauchen","raucht","geraucht"],"No puede fumar.","dürfen + infinitivo."],["Ich bin ___ gestern krank.",["seit","für","von"],"Estoy enfermo desde ayer.","Desde ayer: seit gestern."]],
  d:[["Was fehlt Ihnen?","¿Qué le pasa?",[["Ich habe Halsschmerzen.",null],["Ich bin Halsschmerzen.","Dolor: ich habe."],["Mir fehlt Halsschmerzen.","Se responde «Ich habe Halsschmerzen»."]]],
     ["Seit wann haben Sie Fieber?","¿Desde cuándo tiene fiebre?",[["Seit zwei Tagen.",null],["Vor zwei Tagen seit.","«Desde hace dos días»: seit zwei Tagen."],["Für zwei Tage.","Desde hace: seit."]]],
     ["Was soll ich machen?","¿Qué debo hacer?",[["Sie sollten viel schlafen.",null],["Sie sollten schlafen viel.","El infinitivo va al final."],["Sie sollen zu schlafen.","Sin «zu»: sollten … schlafen."]]]]},
 {id:"de21", lvl:"A2", ic:"🚫", t:"Regeln", sub:"müssen, dürfen, man",
  h:[["A","Hier darf man nicht rauchen.","Acá no se puede fumar."],["B","Oh, Entschuldigung. Wo darf man rauchen?","Uy, perdón. ¿Dónde se puede fumar?"],["A","Draußen. Und Sie müssen den Hund an die Leine nehmen.","Afuera. Y tiene que llevar al perro con correa."],["B","Muss ich auch bezahlen?","¿Tengo que pagar también?"],["A","Nein, Sie müssen nicht bezahlen. Der Eintritt ist frei.","No, no hace falta que pague. La entrada es libre."],["B","Super, danke!","¡Genial, gracias!"]],
  v:[["müssen","tener que","📌","músen"],["dürfen","poder (con permiso)","✅","dúrfen"],["nicht müssen","no hace falta","🙅","nijt músen"],["nicht dürfen","estar prohibido","🚫","nijt dúrfen"],["man","uno, se (impersonal)","👤","man"],["draußen","afuera","🌳","dráusen"],["drinnen","adentro","🏠","drínen"],["bezahlen","pagar","💳","betsálen"],["der Eintritt","la entrada","🎟️","der áintrit"],["verboten","prohibido","⛔","ferbóten"]],
  r:{t:"Obligación y permiso",x:"müssen = tener que; dürfen = tener permiso. ¡Ojo! «nicht müssen» = no hace falta, y «nicht dürfen» = está prohibido. «man» es el «se» impersonal y conjuga como er: man darf, man muss.",tabla:[["ich muss / darf","tengo que / puedo"],["du musst / darfst","tenés que / podés"],["man muss","hay que"],["Man darf nicht rauchen.","No se puede fumar."],["Du musst nicht kommen.","No hace falta que vengas."]]},
  c:[["Hier ___ man nicht parken.",["darf","dürfen","muss"],"Acá no se puede estacionar.","Prohibido: man darf nicht."],["Ich ___ morgen arbeiten.",["muss","musst","müssen"],"Mañana tengo que trabajar.","ich → muss."],["Du ___ nicht bezahlen. Es ist gratis.",["musst","darfst","willst"],"No hace falta que pagues. Es gratis.","No hace falta: nicht müssen."],["___ ich hier rauchen?",["Darf","Muss","Dürfe"],"¿Puedo fumar acá?","Pedir permiso: Darf ich…?"]],
  d:[["Darf ich hier fotografieren?","¿Puedo sacar fotos acá?",[["Nein, das ist verboten.",null],["Nein, Sie müssen nicht.","Eso es «no hace falta»."],["Nein, man muss nicht.","Prohibido: man darf nicht / verboten."]]],
     ["Muss ich einen Pass zeigen?","¿Tengo que mostrar pasaporte?",[["Ja, Sie müssen den Pass zeigen.",null],["Ja, Sie müssen zeigen den Pass.","El infinitivo va al final."],["Ja, Sie dürfen den Pass.","Obligación: müssen."]]],
     ["Was darf man im Museum nicht machen?","¿Qué no se puede hacer en el museo?",[["Man darf nicht essen.",null],["Man muss nicht essen.","Eso es «no hace falta comer» 😄"],["Man dürfen nicht essen.","man conjuga como er: man darf."]]]]},
 {id:"de22", lvl:"A2", ic:"📦", t:"Wo oder wohin?", sub:"im / ins, auf dem / auf den",
  h:[["A","Wo ist mein Handy?","¿Dónde está mi celular?"],["B","Es liegt auf dem Tisch.","Está sobre la mesa."],["A","Und wohin hast du meine Schlüssel gelegt?","¿Y dónde pusiste mis llaves?"],["B","Ich habe sie in die Tasche gelegt.","Las puse en la cartera."],["A","Ich gehe jetzt ins Kino.","Ahora me voy al cine."],["B","Ich bin schon im Kino. Beeil dich!","Yo ya estoy en el cine. ¡Apurate!"]],
  v:[["wo?","¿dónde? (lugar fijo)","📍","vo"],["wohin?","¿a dónde? (movimiento)","➡️","vojín"],["liegen","estar (acostado)","🛋️","líguen"],["legen","poner (acostado)","👇","léguen"],["stehen","estar (parado)","🧍","shtéen"],["stellen","poner (parado)","📚","shtélen"],["der Tisch","la mesa","🪑","der tish"],["die Tasche","la cartera, el bolso","👜","di táshe"],["das Kino","el cine","🎬","das kíno"],["im / ins","en el / al (in + dem / das)","🏛️","im / ins"]],
  r:{t:"Preposiciones de dos caras",x:"in, auf, an, unter, über, vor, hinter, neben, zwischen: si la pregunta es WO (quieto) van con dativo; si es WOHIN (movimiento), con acusativo. in dem = im; in das = ins.",tabla:[["Wo? im Kino (dativo)","en el cine"],["Wohin? ins Kino (acusativo)","al cine"],["auf dem Tisch","sobre la mesa (quieto)"],["auf den Tisch","sobre la mesa (lo pongo)"],["in der Tasche / in die Tasche","en la cartera / a la cartera"]]},
  c:[["Ich bin ___ Kino.",["im","ins","in die"],"Estoy en el cine.","Quieto (wo): im."],["Ich gehe ___ Kino.",["ins","im","in dem"],"Voy al cine.","Movimiento (wohin): ins."],["Das Buch liegt auf ___ Tisch.",["dem","den","der"],"El libro está sobre la mesa.","Quieto: dativo, dem."],["Ich lege das Buch auf ___ Tisch.",["den","dem","die"],"Pongo el libro sobre la mesa.","Movimiento: acusativo, den."]],
  d:[["Wo ist die Katze?","¿Dónde está la gata?",[["Sie liegt auf dem Sofa.",null],["Sie liegt auf das Sofa.","Quieta (wo): dativo, dem."],["Sie legt auf dem Sofa.","Estar acostado: liegen → liegt."]]],
     ["Wohin gehst du heute Abend?","¿A dónde vas esta noche?",[["Ich gehe ins Theater.",null],["Ich gehe im Theater.","Movimiento: ins."],["Ich gehe in dem Theater.","Movimiento: ins (in das)."]]],
     ["Wohin hast du den Schlüssel gelegt?","¿Dónde pusiste la llave?",[["In die Schublade.",null],["In der Schublade.","Pregunta wohin: acusativo, die."],["Ins der Schublade.","die Schublade → in die."]]]]},
 {id:"de23", lvl:"A2", ic:"📞", t:"Telefon und E-Mail", sub:"formal, mir / dir / ihm",
  h:[["A","Firma Weber, Schmidt am Apparat.","Empresa Weber, habla Schmidt."],["B","Guten Tag, hier ist Juan García. Kann ich Frau Weber sprechen?","Buen día, habla Juan García. ¿Puedo hablar con la señora Weber?"],["A","Sie ist leider nicht da. Kann ich ihr etwas ausrichten?","Lamentablemente no está. ¿Le dejo algún mensaje?"],["B","Ja, bitte. Sie soll mich zurückrufen.","Sí, por favor. Que me devuelva la llamada."],["A","Gern. Ich schicke ihr eine E-Mail.","Con gusto. Le mando un mail."],["B","Vielen Dank. Auf Wiederhören!","Muchas gracias. ¡Hasta luego! (por teléfono)"]],
  v:[["am Apparat","habla… (al atender)","☎️","am aparát"],["hier ist…","habla… (al llamar)","📞","jír ist"],["zurückrufen","devolver la llamada","🔁","tsurúkrufen"],["ausrichten","transmitir un mensaje","💬","áusrijten"],["schicken","enviar","📤","shíken"],["der Anhang","el adjunto","📎","der ánjang"],["Sehr geehrte Damen und Herren","Estimados señores","✉️","zer gueérte dámen unt jéren"],["Mit freundlichen Grüßen","Saludos cordiales","🖊️","mit fróintlijen grúsen"],["Auf Wiederhören!","¡Hasta luego! (teléfono)","👋","auf víderjoren"],["mir / dir / ihm / ihr","a mí / a vos / a él / a ella","👤","mir / dir / im / ir"]],
  r:{t:"Dativo de los pronombres",x:"Quien RECIBE algo va en dativo: ich → mir, du → dir, er → ihm, sie → ihr, wir → uns, Sie → Ihnen. «Ich schicke ihr eine E-Mail» = le mando un mail (a ella).",tabla:[["Kannst du mir helfen?","¿Me podés ayudar?"],["Ich gebe dir das Buch.","Te doy el libro."],["Ich schreibe ihm.","Le escribo (a él)."],["Ich schicke ihr eine Mail.","Le mando un mail (a ella)."],["Wie geht es Ihnen?","¿Cómo le va? (formal)"]]},
  c:[["Kannst du ___ helfen? (a mí)",["mir","mich","ich"],"¿Me podés ayudar?","helfen pide dativo: mir."],["Ich schicke ___ eine E-Mail. (a ella)",["ihr","sie","ihm"],"Le mando un mail a ella.","A ella: ihr."],["Ich schreibe ___. (a él)",["ihm","ihn","er"],"Le escribo a él.","A él (dativo): ihm."],["Mit freundlichen ___",["Grüßen","Grüße","Gruß"],"Saludos cordiales","Fórmula fija: Mit freundlichen Grüßen."]],
  d:[["Weber, guten Tag.","Weber, buen día.",[["Guten Tag, hier ist Juan García.",null],["Guten Tag, ich bin am Apparat Juan.","«am Apparat» lo dice quien atiende."],["Hallo, Juan hier ist.","Verbo segundo: Hier ist Juan."]]],
     ["Kann ich ihm etwas ausrichten?","¿Le dejo un mensaje?",[["Ja, er soll mich zurückrufen.",null],["Ja, er soll mir zurückrufen.","anrufen/zurückrufen van con acusativo: mich."],["Ja, zurückrufen er mich.","Mejor: Er soll mich zurückrufen."]]],
     ["Wie beginnt man eine formelle E-Mail?","¿Cómo empieza un mail formal?",[["Sehr geehrte Damen und Herren,",null],["Hallo Leute,","Demasiado informal para un mail de trabajo."],["Mit freundlichen Grüßen,","Eso va al final."]]]]},
 {id:"de24", lvl:"A2", ic:"🏨", t:"Im Hotel", sub:"weil y dass: verbo al final",
  h:[["A","Guten Abend. Ich habe ein Zimmer reserviert.","Buenas noches. Reservé una habitación."],["B","Wie ist Ihr Name, bitte?","¿Su nombre, por favor?"],["A","García. Ich komme spät, weil mein Zug Verspätung hatte.","García. Llego tarde porque mi tren se atrasó."],["B","Kein Problem. Das Frühstück ist von sieben bis zehn.","No hay problema. El desayuno es de siete a diez."],["A","Ich glaube, dass die Klimaanlage nicht funktioniert.","Creo que el aire acondicionado no funciona."],["B","Oh! Sie bekommen ein anderes Zimmer.","¡Uy! Le damos otra habitación."]],
  v:[["das Zimmer","la habitación","🛏️","das tsímer"],["reservieren","reservar","📝","reservíren"],["das Frühstück","el desayuno","🥐","das frúshtuk"],["der Schlüssel","la llave","🔑","der shlúsel"],["die Verspätung","el atraso","⏰","di fershpétung"],["die Klimaanlage","el aire acondicionado","❄️","di klímaanlague"],["funktionieren","funcionar","⚙️","funktsioníren"],["weil","porque","❓","vail"],["dass","que (conjunción)","🔗","das"],["glauben","creer","🤔","gláuben"]],
  r:{t:"weil y dass mandan el verbo al final",x:"En las frases que empiezan con weil (porque) o dass (que), el verbo conjugado se va AL FINAL. «Ich komme nicht, weil ich krank bin.»",tabla:[["…, weil ich müde bin.","…porque estoy cansado."],["…, weil der Zug spät ist.","…porque el tren llega tarde."],["Ich glaube, dass er kommt.","Creo que viene."],["Ich weiß, dass das teuer ist.","Sé que es caro."]]},
  c:[["Ich komme nicht, weil ich krank ___.",["bin","ist","sein"],"No vengo porque estoy enfermo.","Después de weil, verbo al final."],["Ich glaube, ___ das Zimmer zu klein ist.",["dass","das","weil"],"Creo que la habitación es muy chica.","Conjunción «que»: dass (con doble s)."],["Ich bin müde, weil ich wenig ___ habe.",["geschlafen","schlafen","schlief"],"Estoy cansado porque dormí poco.","Perfekt: habe … geschlafen, y habe al final."],["Ich möchte ein ___ reservieren.",["Zimmer","Zimmers","Zimmern"],"Quisiera reservar una habitación.","das Zimmer."]],
  d:[["Warum kommen Sie so spät?","¿Por qué llega tan tarde?",[["Weil mein Flug Verspätung hatte.",null],["Weil mein Flug hatte Verspätung.","Con weil, el verbo va al final."],["Denn weil mein Flug spät.","Falta el verbo: Weil mein Flug Verspätung hatte."]]],
     ["Ist alles in Ordnung mit dem Zimmer?","¿Está todo bien con la habitación?",[["Ich glaube, dass die Dusche kaputt ist.",null],["Ich glaube, dass die Dusche ist kaputt.","Con dass, el verbo va al final."],["Ich glaube, das die Dusche kaputt ist.","La conjunción se escribe «dass»."]]],
     ["Wann gibt es Frühstück?","¿Cuándo hay desayuno?",[["Von sieben bis zehn Uhr.",null],["Von sieben zu zehn Uhr.","De … a …: von … bis."],["Um sieben bis um zehn.","Se dice «von sieben bis zehn»."]]]]},
 {id:"de25", lvl:"A2", ic:"📖", t:"Eine Geschichte", sub:"als, wenn, dass",
  h:[["A","Als ich ein Kind war, habe ich in Hamburg gewohnt.","Cuando era chico, vivía en Hamburgo."],["B","Wirklich? Und warum bist du weggezogen?","¿En serio? ¿Y por qué te mudaste?"],["A","Weil mein Vater einen Job in Wien bekommen hat.","Porque mi papá consiguió un trabajo en Viena."],["B","Und vermisst du Hamburg?","¿Y extrañás Hamburgo?"],["A","Ja. Wenn es regnet, denke ich immer an Hamburg.","Sí. Cuando llueve, siempre pienso en Hamburgo."],["B","Dann denkst du ziemlich oft daran!","¡Entonces pensás bastante seguido!"]],
  v:[["als","cuando (una vez, en el pasado)","🕰️","als"],["wenn","cuando (siempre que) / si","🔁","ven"],["das Kind","el niño","🧒","das kint"],["wohnen","vivir (residir)","🏠","vónen"],["umziehen","mudarse","📦","úmtsien"],["bekommen","recibir, conseguir","🎁","bekómen"],["vermissen","extrañar","💔","fermísen"],["denken an","pensar en","💭","dénken an"],["plötzlich","de repente","⚡","plœtslij"],["dann","entonces, después","➡️","dan"]],
  r:{t:"als o wenn",x:"«als» = cuando, para algo que pasó UNA vez en el pasado (Als ich Kind war…). «wenn» = cuando, para cosas que se repiten o en presente/futuro, y también «si». Las dos mandan el verbo al final, y si la frase empieza con ellas, la siguiente arranca con el verbo.",tabla:[["Als ich 10 war, …","Cuando tenía 10 años…"],["Wenn es regnet, …","Cuando (cada vez que) llueve…"],["Wenn ich Zeit habe, komme ich.","Si tengo tiempo, vengo."],["Als er kam, habe ich geschlafen.","Cuando llegó, yo dormía."]]},
  c:[["___ ich ein Kind war, hatte ich einen Hund.",["Als","Wenn","Wann"],"Cuando era chico tenía un perro.","Una vez en el pasado: als."],["___ es regnet, bleibe ich zu Hause.",["Wenn","Als","Wann"],"Cuando llueve me quedo en casa.","Algo que se repite: wenn."],["Wenn ich Zeit habe, ___ ich.",["komme","ich komme","kommen"],"Si tengo tiempo, vengo.","Después de la frase con wenn, primero el verbo."],["___ kommst du? (pregunta)",["Wann","Wenn","Als"],"¿Cuándo venís?","Para preguntar «¿cuándo?»: wann."]],
  d:[["Wo hast du gewohnt, als du Kind warst?","¿Dónde vivías cuando eras chico?",[["Als ich Kind war, habe ich in Rosario gewohnt.",null],["Wenn ich Kind war, habe ich in Rosario gewohnt.","Una etapa del pasado: als."],["Als ich war Kind, …","Con als, el verbo va al final: als ich Kind war."]]],
     ["Was machst du, wenn du frei hast?","¿Qué hacés cuando tenés el día libre?",[["Wenn ich frei habe, lese ich.",null],["Wenn ich frei habe, ich lese.","Después de la frase con wenn: lese ich."],["Als ich frei habe, lese ich.","Algo que se repite: wenn."]]],
     ["Wann bist du nach Wien gezogen?","¿Cuándo te mudaste a Viena?",[["Als ich zwölf war.",null],["Wenn ich zwölf war.","Una vez en el pasado: als."],["Wann ich zwölf war.","«wann» es solo para preguntar."]]]]},

 {id:"la1", ic:"👋", t:"Salūtātiōnēs", sub:"Saludos romanos",
  h:[["A","Salvē, Iūlia!","¡Hola, Julia!"],["B","Salvē, Mārce! Quid agis?","¡Hola, Marco! ¿Cómo estás?"],["A","Bene, grātiās. Et tū?","Bien, gracias. ¿Y vos?"],["B","Ego quoque bene.","Yo también, bien."],["A","Valē, Iūlia!","¡Chau, Julia!"],["B","Valē, amīce!","¡Chau, amigo!"]],

  r:{t:"El vocativo: para llamar a alguien",x:"Cuando le hablás directamente a alguien, los nombres en -us cambian a -e. Y el saludo cambia si le hablás a uno o a varios.",tabla:[["Mārcus","Salvē, Mārce!"],["amīcus","Valē, amīce!"],["a una persona","Salvē · Valē"],["a varias personas","Salvēte · Valēte"]]},
  c:[["Salvē, Mārc___!",["e","us","um"],"¡Hola, Marco!","Para llamar a Mārcus: Mārce."],["Salv___, amīcī!",["ēte","ē","a"],"¡Hola, amigos!","A varios: Salvēte."],["Quid ___?",["agis","est","sum"],"¿Cómo estás?","La pregunta fija es «Quid agis?»."],["Bene, ___.",["grātiās","valē","minimē"],"Bien, gracias.","Gracias = grātiās."]],
  d:[["Salvē!","¡Hola!",[["Salvē!",null],["Valē!","«Valē» es chau."],["Minimē!","«Minimē» es «para nada»."]]],
     ["Quid agis?","¿Cómo estás?",[["Bene, grātiās.",null],["Mārcus sum.","Eso responde «¿quién sos?»."],["Salvēte!","Eso es un saludo a varios."]]],

  h:[["A","Salvēte, discipulī!","¡Hola, alumnos!"],["B","Salvē, magister!","¡Hola, maestro!"],["A","Quis es tū?","¿Quién sos vos?"],["B","Ego sum Mārcus. Rōmānus sum.","Yo soy Marco. Soy romano."],["A","Et quis est puella?","¿Y quién es la niña?"],["B","Puella est Iūlia. Laeta est.","La niña es Julia. Está contenta."]],
  v:[["sum","soy","🙋","sum"],["est","es / está","👉","est"],["sunt","son / están","👥","sunt"],["puella","niña","👧","puéla"],["puer","niño","👦","púer"],["magister","maestro","👨‍🏫","maguíster"],["discipulus","alumno","🧑‍🎓","diskípulus"],["Rōmānus","romano","🏛️","románus"],["laetus","contento","😊","láetus"],["quis?","¿quién?","❓","kuis"]],
  r:{t:"El verbo «esse» (ser)",x:"Fijate lo parecido que es al español. El sujeto se puede omitir porque la terminación ya dice quién es («Rōmānus sum» = soy romano), y el verbo suele ir al final.",tabla:[["sum","soy"],["es","sos / eres"],["est","es"],["sumus","somos"],["estis","sois / ustedes son"],["sunt","son"]]},
  c:[["Ego ___ Mārcus.",["sum","est","sunt"],"Yo soy Marco.","ego → sum."],["Puella laeta ___.",["est","sum","sunt"],"La niña está contenta.","puella (ella) → est."],["Nōs Rōmānī ___.",["sumus","sunt","estis"],"Nosotros somos romanos.","nōs → sumus."],["Puer et puella ___.",["sunt","est","sumus"],"El niño y la niña son…","Dos personas → sunt."]],

     ["Rōmānus es?","¿Sos romano?",[["Ita, Rōmānus sum.",null],["Ita, Rōmānus est.","«est» es «él es»; vos decís sum."],["Minimē, grātiās.","Eso es «no, gracias», como si te ofrecieran algo."]]],

  r:{t:"Los números viven en el español",x:"Septiembre, octubre, noviembre y diciembre eran los meses 7, 8, 9 y 10 del calendario romano. Si conocés el español, ya sabés la mitad del latín.",tabla:[["ūnus","uno, único"],["duo","dúo"],["quattuor","cuarteto"],["quīnque","quinto"],["septem","septiembre"],["octō","octubre"],["novem","noviembre"],["decem","diciembre, década"]]},
  c:[["Ūnus + ūnus = ___",["duo","trēs","decem"],"1 + 1 = 2","Dos = duo."],["Trēs + duo = ___",["quīnque","sex","septem"],"3 + 2 = 5","Cinco = quīnque."],["Decem − ūnus = ___",["novem","octō","sex"],"10 − 1 = 9","Nueve = novem."],["X = ___",["decem","quīnque","ūnus"],"X romano = 10","X es diez: decem."]],

// Devuelve una promesa que se cumple cuando termina de hablar.

function decir(texto, l = S.lang, lento = false, quien = null){

        const mismaVoz = elegirVoz(lang, "A") === elegirVoz(lang, "B");

/* =========================================================================

/* Cielo estrellado: estrellas que titilan y se desplazan despacio, con alguna estrella fugaz */
function cielo(){
  const c = document.getElementById("stars"), x = c.getContext("2d");
  const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, dpr, estrellas = [], fugaz = null, ultima = 0;

      v:Math.random() * .12 + .02, f:Math.random() * Math.PI * 2, t:Math.random() * .03 + .008,
      c:Math.random() < .12 ? "255,210,150" : Math.random() < .2 ? "180,200,255" : "255,255,255"}));
  };
  const dibujar = ts => {
    x.clearRect(0, 0, W, H);
    for (const s of estrellas) {
      if (!quieto) { s.y += s.v; s.x -= s.v * .35; s.f += s.t; if (s.y > H + 2) { s.y = -2; s.x = Math.random() * W; } if (s.x < -2) s.x = W + 2; }

      if (s.r > 1.35) { x.fillStyle = `rgba(${s.c},${a * .15})`; x.beginPath(); x.arc(s.x, s.y, s.r * 3.2, 0, Math.PI * 2); x.fill(); }
    }
    if (!quieto) {
      if (!fugaz && ts - ultima > 6000 && Math.random() < .01) { fugaz = {x:Math.random() * W * .8 + W * .2, y:Math.random() * H * .4, vx:-7, vy:3.2, vida:1}; ultima = ts; }
      if (fugaz) {
        const g = x.createLinearGradient(fugaz.x, fugaz.y, fugaz.x - fugaz.vx * 14, fugaz.y - fugaz.vy * 14);
        g.addColorStop(0, `rgba(255,255,255,${fugaz.vida})`); g.addColorStop(1, "rgba(255,255,255,0)");

        fugaz.x += fugaz.vx; fugaz.y += fugaz.vy; fugaz.vida -= .012; if (fugaz.vida <= 0 || fugaz.x < -50) fugaz = null;
      }

    }
  };

}
