 {id:"la40", lvl:"B2", ic:"🙏", t:"Utinam!", sub:"subjuntivo presente",
  h:[["A","Utinam pāx sit!","¡Ojalá haya paz!"],["B","Dī tē servent!","¡Que los dioses te protejan!"],["A","Eāmus in forum!","¡Vamos al foro!"],["B","Nē timeās, amīce.","No temas, amigo."],["A","Vīvat rēx! Vīvant omnēs!","¡Viva el rey! ¡Vivan todos!"],["B","Requiēscat in pāce, dīxit Philippus dē pulmōnibus suīs.","Que descanse en paz, dijo Felipe de sus pulmones."]],
  v:[["utinam","ojalá","🙏","útinam"],["sit","sea, haya","✨","sit"],["servent","protejan","🛡️","séruent"],["eāmus","vamos (exhortación)","🚶","eámus"],["nē + subj.","que no, no (prohibición)","🚫","ne"],["vīvat","¡viva!","🎉","uíuat"],["requiēscat","que descanse","🕯️","rekuiéskat"],["dī (deī)","los dioses","⚡","di"],["pulmō, -ōnis","el pulmón","🫁","púlmo"],["amem, amēs, amet","que ame, ames, ame","💘","ámem"]],
  r:{t:"El subjuntivo presente",x:"1ª conjugación: -e- (amem, amēs, amet). 2ª, 3ª y 4ª: -a- (habeam, legam, audiam). esse: sim, sīs, sit. Usos independientes: deseo (utinam + subj.), exhortación (eāmus = vamos), prohibición (nē + subj.) y «que» con 3ª persona (vīvat = ¡viva!).",tabla:[["amem / habeam / legam","que ame / tenga / lea"],["sim, sīs, sit","que sea (yo, vos, él)"],["Utinam veniat!","¡Ojalá venga!"],["Gaudeāmus!","¡Alegrémonos!"],["Requiēscat in pāce (R.I.P.)","Que descanse en paz"]]},
  c:[["Utinam pāx ___!",["sit","est","esse"],"¡Ojalá haya paz!","Deseo: subjuntivo sit."],["Vīvat ___!",["rēx","rēgem","rēgī"],"¡Viva el rey!","Sujeto: rēx."],["___ in pāce.",["Requiēscat","Requiēscit","Requiēscere"],"Que descanse en paz.","Subjuntivo 3ª conj.: -at."],["Gaude___ igitur!",["āmus","ēmus","imus"],"¡Alegrémonos, pues!","Subjuntivo 2ª conj.: gaudeāmus."]],
  d:[["Quid in sepulcrīs scrībitur?","¿Qué se escribe en las tumbas?",[["R.I.P.: Requiēscat in pāce.",null],["R.I.P.: Rēx in palātiō.","😄 Es Requiēscat in pāce."],["Requiēscit in pāce.","Deseo: subjuntivo requiēscat."]]],
     ["Quid dīcis amīcō timentī?","¿Qué le decís a un amigo que tiene miedo?",[["Nē timeās!",null],["Nē timēs!","Prohibición: nē + subjuntivo, timeās."],["Nōn timēre!","Se dice: Nē timeās / Nōlī timēre."]]],
     ["Quid optās?","¿Qué deseás?",[["Utinam dīves sim!",null],["Utinam dīves sum!","Deseo: subjuntivo sim."],["Utinam dīves esse!","Verbo conjugado: sim."]]]]},
 {id:"la41", lvl:"B2", ic:"🎯", t:"Ut discam", sub:"finales: ut / nē",
  h:[["A","Rōmam veniō ut linguam Latīnam discam.","Vengo a Roma para aprender latín."],["B","Edimus ut vīvāmus, nōn vīvimus ut edāmus.","Comemos para vivir, no vivimos para comer."],["A","Tacē, nē magister audiat!","¡Callate, para que no oiga el maestro!"],["B","Mīlitēs mūrōs aedificant ut urbem dēfendant.","Los soldados construyen murallas para defender la ciudad."],["A","Laboro ut pecūniam habeam.","Trabajo para tener dinero."],["B","Et Philippus fūmat nē cōgitet.","Y Felipe fuma para no pensar."]],
  v:[["ut + subj.","para que, para","🎯","ut"],["nē + subj.","para que no","🚫","ne"],["discere","aprender","📚","dískere"],["edere","comer","🍽️","édere"],["dēfendere","defender","🛡️","deféndere"],["pecūnia","el dinero","💰","pekúnia"],["cōgitāre","pensar","💭","koguitáre"],["mūrus","la muralla","🧱","múrus"],["tacēre","callar","🤫","takére"],["labōrāre","trabajar","💼","laboráre"]],
  r:{t:"Oraciones finales",x:"Para expresar «para (que)» el latín usa ut + subjuntivo; «para que no», nē + subjuntivo. A diferencia del español, se usa subjuntivo aunque el sujeto sea el mismo: veniō ut discam = vengo para aprender.",tabla:[["Edimus ut vīvāmus.","Comemos para vivir."],["Currit ut vincat.","Corre para ganar."],["Tacē, nē audiant.","Callate, para que no oigan."],["Venit ut mē videat.","Viene para verme."]]},
  c:[["Veniō ___ tē videam.",["ut","nē","quod"],"Vengo para verte.","Finalidad: ut."],["Fuge, ___ capiāris!",["nē","ut","nōn"],"¡Huí, para que no te atrapen!","Finalidad negativa: nē."],["Edimus ut ___.",["vīvāmus","vīvimus","vīvere"],"Comemos para vivir.","ut + subjuntivo: vīvāmus."],["Labōrō ut pecūniam ___.",["habeam","habeō","habēre"],"Trabajo para tener dinero.","ut + subjuntivo: habeam."]],
  d:[["Cūr Latīnam discis?","¿Por qué aprendés latín?",[["Discō ut librōs antīquōs legam.",null],["Discō ut librōs antīquōs legō.","ut + subjuntivo: legam."],["Discō legere ut librōs.","Se dice: ut librōs legam."]]],
     ["Cūr tacēs?","¿Por qué te callás?",[["Taceō nē īnfāns excitētur.",null],["Taceō ut īnfāns excitētur.","«para que NO»: nē."],["Taceō nē īnfāns excitātur.","nē + subjuntivo: excitētur."]]],
     ["Cūr edimus?","¿Por qué comemos?",[["Edimus ut vīvāmus.",null],["Vīvimus ut edāmus.","😄 Es al revés, dice el proverbio."],["Edimus ut vīvimus.","ut + subjuntivo: vīvāmus."]]]]},
 {id:"la42", lvl:"B2", ic:"🌊", t:"Tam fortis ut…", sub:"consecutivas",
  h:[["A","Tantus erat ventus ut nāvis frangerētur.","Tan fuerte era el viento que la nave se rompió."],["B","Mīles tam fortis erat ut nēmō eum vinceret.","El soldado era tan valiente que nadie lo vencía."],["A","Ita clāmābat ut omnēs audīrent.","Gritaba de tal modo que todos lo oían."],["B","Adeō fessus eram ut statim dormīrem.","Estaba tan cansado que me dormí enseguida."],["A","Tot librōs habet ut numerāre nōn possit.","Tiene tantos libros que no los puede contar."],["B","Philippus tam multum fūmat ut nūbēs appāreat.","Felipe fuma tanto que aparece una nube."]],
  v:[["tam … ut","tan … que","➡️","tam … ut"],["tantus … ut","tan grande … que","🐘","tántus"],["ita … ut","de tal modo … que","🔁","íta"],["adeō … ut","hasta tal punto … que","📏","ádeo"],["tot … ut","tantos … que","🔢","tot"],["ventus","el viento","🌬️","uéntus"],["frangere","romper","💥","frángere"],["statim","enseguida","⚡","státim"],["numerāre","contar","🧮","numeráre"],["nūbēs","la nube","☁️","núbes"]],
  r:{t:"Oraciones consecutivas",x:"Un adverbio de intensidad en la principal (tam, ita, tantus, tot, adeō) anuncia la consecuencia: ut + subjuntivo (tan… que…). Negativa: ut nōn (¡no nē!). Con verbos en pasado se usa el subjuntivo imperfecto (-rem): ut dormīrem.",tabla:[["tam fortis ut…","tan valiente que…"],["ita … ut","de tal modo que"],["tantus … ut","tan grande que"],["ut nōn (negativa)","que no"],["frangerētur (subj. imperf.)","se rompiera / se rompió"]]},
  c:[["___ fessus erat ut dormīret.",["Tam","Ut","Nē"],"Estaba tan cansado que se durmió.","Intensidad: tam."],["Ita clāmāvit ___ omnēs audīrent.",["ut","nē","quod"],"Gritó de tal modo que todos lo oyeron.","Consecuencia: ut."],["Tam celer erat ut nēmō eum ___.",["caperet","capit","capere"],"Era tan rápido que nadie lo atrapaba.","Pasado: subj. imperfecto caperet."],["Tam stultus est ut ___ intellegat.",["nōn","nē","nec ut"],"Es tan tonto que no entiende.","Consecutiva negativa: ut nōn."]],
  d:[["Quantus erat ventus?","¿Qué tan fuerte era el viento?",[["Tantus ut arborēs caderent.",null],["Tantus ut arborēs cadunt.","Pasado consecutivo: caderent."],["Tantus nē arborēs caderent.","Consecutiva: ut."]]],
     ["Quam dīves est Crassus?","¿Qué tan rico es Craso?",[["Tam dīves ut exercitum emere possit.",null],["Tam dīves ut exercitum emere potest.","ut + subjuntivo: possit."],["Tam dīves nē exercitum emat.","Consecutiva: ut."]]],
     ["Quam multum fūmat Philippus?","¿Cuánto fuma Felipe?",[["Tam multum ut vix respīret.",null],["Tam multum ut nē respīret.","Negativa consecutiva: ut nōn (o vix)."],["Tam multum ut respīrat.","ut + subjuntivo: respīret."]]]]},
 {id:"la43", lvl:"B2", ic:"⏳", t:"Cum vēnisset…", sub:"cum + subjuntivo",
  h:[["A","Cum Caesar in Galliam vēnisset, bellum incēpit.","Como César había llegado a la Galia, empezó la guerra."],["B","Cum hostēs fugerent, Rōmānī eōs secūtī sunt.","Mientras los enemigos huían, los romanos los persiguieron."],["A","Cum sīs amīcus meus, tibi crēdō.","Como sos mi amigo, te creo."],["B","Cum dīves sit, tamen nōn est laetus.","Aunque es rico, sin embargo no es feliz."],["A","Cum tacent, clāmant.","Al callar, gritan. (Cicerón)"],["B","Cum Philippus fūmāret, omnēs tussiēbant.","Mientras Felipe fumaba, todos tosían."]],
  v:[["cum + subj.","como, cuando, aunque","⏳","kum"],["vēnisset","hubiera llegado","🚶","uenísset"],["incipere","empezar","▶️","inkípere"],["fugere","huir","🏃","fúguere"],["sequī","seguir, perseguir","👣","sékui"],["tamen","sin embargo","↩️","támen"],["laetus","feliz","😊","láitus"],["bellum","la guerra","⚔️","béllum"],["tussīre","toser","🤧","tussíre"],["crēdere + dat.","creerle a alguien","🤝","krédere"]],
  r:{t:"cum histórico, causal y concesivo",x:"cum + subjuntivo tiene tres valores según el contexto: temporal-histórico (cuando / después de que), causal (como, ya que) y concesivo (aunque, suele ir con tamen). Subjuntivo imperfecto (-rem) = simultáneo; pluscuamperfecto (-issem) = anterior.",tabla:[["Cum vēnisset, … (plusc.)","Después de llegar…"],["Cum fugerent, … (imperf.)","Mientras huían…"],["Cum sīs amīcus, …","Como sos amigo…"],["Cum dīves sit, tamen…","Aunque es rico, sin embargo…"],["Cum + indicativo","cuando (temporal simple)"]]},
  c:[["Cum Rōmam ___, Caesarem vīdit.",["vēnisset","vēnit","venīre"],"Después de llegar a Roma, vio a César.","Anterior: pluscuamperfecto subj."],["Cum hostēs ___, Rōmānī vīcērunt.",["fugerent","fugiunt","fugere"],"Mientras los enemigos huían, los romanos vencieron.","Simultáneo: imperfecto subj."],["Cum pauper sit, ___ laetus est.",["tamen","ergō","quia"],"Aunque es pobre, sin embargo es feliz.","Concesivo: tamen."],["Cum ___ amīcus meus, tē adiuvābō.",["sīs","es","esse"],"Como sos mi amigo, te voy a ayudar.","Causal: cum + subjuntivo."]],
  d:[["Quid fēcit Caesar cum Rubicōnem trānsīsset?","¿Qué hizo César después de cruzar el Rubicón?",[["Rōmam contendit.",null],["Rōmam contendat.","Principal en indicativo: contendit."],["Rōmam contendere.","Verbo conjugado: contendit."]]],
     ["Cūr eī crēdis?","¿Por qué le creés?",[["Cum sit frāter meus.",null],["Cum est frāter meus.","Causal: cum + subjuntivo, sit."],["Cum esse frāter meus.","Verbo conjugado: sit."]]],
     ["Estne Crassus laetus?","¿Craso es feliz?",[["Cum dīves sit, tamen trīstis est.",null],["Cum dīves est, tamen trīstis sit.","Al revés: subjuntivo en la de cum."],["Cum dīves sit, ergō trīstis est.","Concesivo: tamen."]]]]},
 {id:"la44", lvl:"B2", ic:"❓", t:"Quaerō quid faciās", sub:"interrogativas indirectas",
  h:[["A","Nescio quid faciam.","No sé qué hacer."],["B","Quaerō ubi sīs.","Pregunto dónde estás."],["A","Dīc mihi cūr fleās.","Decime por qué llorás."],["B","Rogat num Rōmam īre velīmus.","Pregunta si queremos ir a Roma."],["A","Scīsne quis hoc fēcerit?","¿Sabés quién hizo esto?"],["B","Nēmō scit quantum Philippus fūmet.","Nadie sabe cuánto fuma Felipe."]],
  v:[["nescīre","no saber","🤷","neskíre"],["quaerere","preguntar, buscar","🔍","kuáirere"],["rogāre","preguntar, pedir","🙋","rogáre"],["num","si (pregunta indirecta)","❔","num"],["quid","qué","❓","kuid"],["cūr","por qué","🤔","kur"],["quot","cuántos","🔢","kuot"],["flēre","llorar","😢","flére"],["velle","querer","💭","uélle"],["fēcerit","haya hecho","✅","fékerit"]],
  r:{t:"Preguntas indirectas",x:"Una pregunta que depende de otro verbo (sé, pregunto, decime) lleva el verbo en SUBJUNTIVO: Quid facis? → Nescio quid faciās. Si la pregunta es de sí/no, se introduce con num o -ne: Rogat num veniās = pregunta si venís.",tabla:[["Quid facis? → Rogō quid faciās.","Pregunto qué hacés."],["Ubi est? → Nescio ubi sit.","No sé dónde está."],["Quis vēnit? → Sciō quis vēnerit.","Sé quién vino."],["Venīsne? → Rogat num veniās.","Pregunta si venís."]]},
  c:[["Nescio ubi Mārcus ___.",["sit","est","esse"],"No sé dónde está Marco.","Indirecta: subjuntivo sit."],["Dīc mihi quid ___.",["cupiās","cupis","cupere"],"Decime qué querés.","Subjuntivo: cupiās."],["Rogat ___ Rōmam veniāmus.",["num","ut","quod"],"Pregunta si venimos a Roma.","Sí/no indirecta: num."],["Scīsne quis hoc ___?",["fēcerit","fēcit","facere"],"¿Sabés quién hizo esto?","Pasado en indirecta: fēcerit."]],
  d:[["Scīsne ubi sit Iūlia?","¿Sabés dónde está Julia?",[["Nescio ubi sit.",null],["Nescio ubi est.","Indirecta: subjuntivo sit."],["Nescio num ubi sit.","Sobra num: nescio ubi sit."]]],
     ["Quid tē rogāvit?","¿Qué te preguntó?",[["Rogāvit num Latīnē loquerer.",null],["Rogāvit num Latīnē loquor.","Indirecta y pasado: loquerer."],["Rogāvit ut Latīnē loquar.","Para «si»: num."]]],
     ["Cūr flēs?","¿Por qué llorás?",[["Nescio cūr fleam. Fortasse propter cēpās.",null],["Nescio cūr fleō.","Indirecta: fleam."],["Nescio quid fleam cēpae.","Se dice: Nescio cūr fleam."]]]]},
 {id:"la45", lvl:"B2", ic:"💘", t:"Ars amandī", sub:"gerundio y gerundivo",
  h:[["A","Ovidius librum «Ars amandī» scrīpsit.","Ovidio escribió el libro «El arte de amar»."],["B","Discendī causā Rōmam vēnī.","Vine a Roma para aprender."],["A","Carthāgō dēlenda est!","¡Cartago debe ser destruida!"],["B","Nōn est cupidus labōrandī.","No tiene ganas de trabajar."],["A","Hic liber legendus est.","Este libro debe ser leído."],["B","Fūmandum nōn est — dīxit Philippus, fūmāns.","No hay que fumar, dijo Felipe, fumando."]],
  v:[["amandī","de amar","💘","amándi"],["ars, artis","el arte","🎨","ars"],["discendī causā","para aprender","📚","diskéndi káusa"],["dēlenda","que debe ser destruida","💥","delénda"],["cupidus + gen.","deseoso de","🤤","kúpidus"],["legendus","que debe leerse","📖","leguéndus"],["agenda","cosas que deben hacerse","📋","aguénda"],["memorandum","cosa que debe recordarse","📝","memorándum"],["addendum","cosa que debe añadirse","➕","addéndum"],["Carthāgō","Cartago","🏚️","kartágo"]],
  r:{t:"Gerundio y gerundivo",x:"Gerundio = el infinitivo declinado (ars amandī = el arte de amar; discendī causā = para aprender). Gerundivo = adjetivo en -ndus que indica obligación: Carthāgō dēlenda est = Cartago debe ser destruida. ¡De ahí agenda, memorándum, examinando, dividendo!",tabla:[["ars amandī","el arte de amar"],["legendī causā","para leer"],["cupidus discendī","deseoso de aprender"],["Liber legendus est.","El libro debe ser leído."],["agenda, memorandum, addendum","lo que hay que hacer, recordar, añadir"]]},
  c:[["Ovidius «Ars ___» scrīpsit.",["amandī","amāre","amandum"],"Ovidio escribió «El arte de amar».","Genitivo del gerundio: amandī."],["Carthāgō ___ est!",["dēlenda","dēlendum","dēlēre"],"¡Cartago debe ser destruida!","Gerundivo femenino: dēlenda."],["Vēnī videndī ___.",["causā","causa","causam"],"Vine para ver.","Finalidad: genitivo + causā."],["«Agenda» significa ___.",["las cosas que deben hacerse","la agenda de papel","el acto"],"Gerundivo neutro plural.","agenda = lo que debe hacerse."]],
  d:[["Quid dīcēbat Catō semper?","¿Qué decía siempre Catón?",[["Carthāgō dēlenda est!",null],["Carthāgō dēlēta est!","Él pedía destruirla: dēlenda (debe ser)."],["Carthāginem dēlenda est!","Sujeto en nominativo: Carthāgō."]]],
     ["Cūr in bibliothēcā es?","¿Por qué estás en la biblioteca?",[["Legendī causā.",null],["Legere causā.","Con causā: gerundio en genitivo, legendī."],["Legendum causā.","Genitivo: legendī."]]],
     ["Quid est «memorandum»?","¿Qué es un «memorándum»?",[["Rēs quae memoranda est.",null],["Rēs quae memorāta est.","memorandum = que debe recordarse (futuro, obligación)."],["Memoria magna.","Viene del gerundivo: lo que debe recordarse."]]]]},
 {id:"la46", lvl:"B2", ic:"🔮", t:"Sī tacuissēs…", sub:"condicionales",
  h:[["A","Sī vīs pācem, parā bellum.","Si querés la paz, preparate para la guerra."],["B","Sī dīves essem, nāvem emerem.","Si fuera rico, compraría una nave."],["A","Sī tacuissēs, philosophus mānsissēs.","Si te hubieras callado, habrías seguido pareciendo filósofo."],["B","Sī hoc dīcās, errēs.","Si dijeras esto, te equivocarías."],["A","Nisi veniēs, trīstis erō.","Si no venís, voy a estar triste."],["B","Sī Philippus nōn fūmāsset, diūtius vīxisset.","Si Felipe no hubiera fumado, habría vivido más."]],
  v:[["sī","si","❓","si"],["nisi","si no","🚫","nísi"],["essem","fuera, estuviera","💭","éssem"],["emerem","compraría","💸","émerem"],["tacuissēs","te hubieras callado","🤫","takuísses"],["mānsissēs","habrías permanecido","🏠","mansísses"],["philosophus","el filósofo","🧔","filósofus"],["errāre","equivocarse","❌","erráre"],["diūtius","más tiempo","⏳","diútius"],["parāre","preparar","🛠️","paráre"]],
  r:{t:"Tres tipos de condicional",x:"Real (indicativo): Sī vīs pācem, parā bellum. Posible (subj. presente): Sī hoc dīcās, errēs = si dijeras, te equivocarías. Irreal presente (subj. imperfecto): Sī dīves essem, emerem. Irreal pasado (subj. pluscuamperfecto): Sī tacuissēs, philosophus mānsissēs.",tabla:[["Sī venīs, gaudeō.","Si venís, me alegro (real)."],["Sī veniās, gaudeam.","Si vinieras, me alegraría (posible)."],["Sī venīrēs, gaudērem.","Si vinieras (ahora), me alegraría (irreal)."],["Sī vēnissēs, gāvīsus essem.","Si hubieras venido, me habría alegrado."]]},
  c:[["Sī vīs pācem, parā ___.",["bellum","pācem","bellō"],"Si querés la paz, preparate para la guerra.","Proverbio: parā bellum."],["Sī dīves ___, vīllam emerem.",["essem","sum","fuī"],"Si fuera rico, compraría una villa.","Irreal presente: essem."],["Sī tacuissēs, philosophus ___.",["mānsissēs","manēs","manēbis"],"Si te hubieras callado, habrías seguido siendo filósofo.","Irreal pasado: mānsissēs."],["___ venīs, trīstis erō.",["Nisi","Sī nōn est","Nōn"],"Si no venís, voy a estar triste.","si no: nisi."]],
  d:[["Quid faceres sī rēx essēs?","¿Qué harías si fueras rey?",[["Sī rēx essem, pācem facerem.",null],["Sī rēx sum, pācem facerem.","Irreal: essem."],["Sī rēx essem, pācem faciō.","Consecuencia irreal: facerem."]]],
     ["Quid significat «sī tacuissēs, philosophus mānsissēs»?","¿Qué significa?",[["Si te hubieras callado, habrías seguido pareciendo sabio.",null],["Si hablás, sos filósofo.","Es irreal pasado: si te hubieras callado…"],["Los filósofos no hablan.","Se burla de quien habla de más."]]],
     ["Quid dīcit proverbium dē pāce?","¿Qué dice el proverbio sobre la paz?",[["Sī vīs pācem, parā bellum.",null],["Sī vīs bellum, parā pācem.","Es al revés."],["Sī vīs pāx, parā bellum.","Objeto: pācem."]]]]},
 {id:"la47", lvl:"B2", ic:"🎤", t:"Quō ūsque tandem?", sub:"lectura: Cicerón",
  h:[["A","Quō ūsque tandem abūtēre, Catilīna, patientiā nostrā?","¿Hasta cuándo, Catilina, abusarás de nuestra paciencia?"],["B","Quam diū etiam furor iste tuus nōs ēlūdet?","¿Cuánto tiempo más esa locura tuya se burlará de nosotros?"],["A","Ō tempora, ō mōrēs!","¡Oh tiempos, oh costumbres!"],["B","Senātus haec intellegit, cōnsul videt; hic tamen vīvit.","El Senado entiende esto, el cónsul lo ve; y sin embargo este vive."],["A","Cicerō hanc ōrātiōnem in senātū habuit annō LXIII ante Chrīstum.","Cicerón pronunció este discurso en el Senado en el 63 a. C."],["B","Philippus eam in tabernā recitat, cum vīnum nōn est.","Felipe lo recita en la taberna cuando no hay vino."]],
  v:[["quō ūsque","hasta cuándo","⏳","kuo úskue"],["tandem","por fin, (enfático)","😤","tándem"],["abūtī + abl.","abusar de","🙄","abúti"],["patientia","la paciencia","🧘","patiéntia"],["furor","la locura, el furor","🤪","fúror"],["ēlūdere","burlarse de","😏","elúdere"],["mōs, mōris","la costumbre","🏺","mos"],["ōrātiō","el discurso","🎤","orátio"],["cōnsul","el cónsul","🏛️","kónsul"],["tempus, temporis","el tiempo","⌛","témpus"]],
  r:{t:"La retórica de Cicerón",x:"Cicerón es el modelo de la prosa latina. Sus recursos: preguntas retóricas (Quō ūsque tandem…?), exclamaciones (Ō tempora, ō mōrēs!), anáfora (repetir el inicio) y el ritmo en tres partes. Abūtēre = abūteris (futuro, 2ª sg. de un deponente).",tabla:[["Quō ūsque tandem…?","¿Hasta cuándo…?"],["abūtēre (= abūteris)","abusarás"],["patientiā nostrā (abl.)","de nuestra paciencia"],["Ō tempora, ō mōrēs!","¡Oh tiempos, oh costumbres!"],["hic tamen vīvit","y sin embargo este vive"]]},
  c:[["Quō ūsque tandem abūtēre, Catilīna, ___ nostrā?",["patientiā","patientiam","patientia"],"¿Hasta cuándo, Catilina, abusarás de nuestra paciencia?","abūtor + ablativo."],["Ō tempora, ō ___!",["mōrēs","mōrem","mōre"],"¡Oh tiempos, oh costumbres!","Nominativo/vocativo plural: mōrēs."],["Cicerō hanc ___ habuit.",["ōrātiōnem","ōrātiō","ōrātiōnis"],"Cicerón pronunció este discurso.","Objeto: ōrātiōnem."],["Senātus haec intellegit, cōnsul ___.",["videt","vident","vidētur"],"El Senado lo entiende, el cónsul lo ve.","Sujeto singular: videt."]],
  d:[["Quis dīxit «Ō tempora, ō mōrēs»?","¿Quién dijo «Oh tiempos, oh costumbres»?",[["Cicerō in Catilīnam.",null],["Caesar in Galliā.","Fue Cicerón contra Catilina."],["Catilīna in Cicerōnem.","Al revés: Cicerón contra Catilina."]]],
     ["Contrā quem Cicerō loquitur?","¿Contra quién habla Cicerón?",[["Contrā Catilīnam.",null],["Contrā Catilīna.","contrā + acusativo: Catilīnam."],["Contrā Caesarem.","Habla contra Catilina."]]],
     ["Quid significat «tandem» hīc?","¿Qué significa «tandem» acá?",[["Expresa impaciencia: «de una vez», «hasta cuándo».",null],["Significa «tándem», la bici de dos.","😄 La bici tomó el nombre después."],["Significa «nunca».","Es enfático: impaciencia."]]]]},
 {id:"la48", lvl:"B2", ic:"🪶", t:"Sī essem…", sub:"subjuntivo imperfecto y pluscuamperfecto",
  h:[["A","Sī avis essem, volārem.","Si fuera un pájaro, volaría."],["B","Philippus avis est, sed nōn volat. Fūmat.","Felipe es un pájaro, pero no vuela. Fuma."],["A","Utinam hoc nōn dīxissēs!","¡Ojalá no hubieras dicho eso!"],["B","Rogāvit cūr rīdērem.","Preguntó por qué me reía."],["A","Cum domum vēnissem, dormīvī.","Cuando había llegado a casa, dormí."],["B","Utinam dormīre possem!","¡Ojalá pudiera dormir!"]],
  v:[["essem","fuera (subj. imperf.)","💭","éssem"],["volāre","volar","🕊️","uoláre"],["avis","el pájaro","🐦","áuis"],["dīxissēs","hubieras dicho","💬","diksísses"],["rīdēre","reírse","😂","ridére"],["possem","pudiera","💪","póssem"],["amārem","amara","💘","amárem"],["amāvissem","hubiera amado","💔","amauíssem"],["domum","a casa","🏠","dómum"],["dormīre","dormir","😴","dormíre"]],
  r:{t:"Subjuntivos del pasado",x:"Imperfecto: infinitivo + terminaciones (amāre-m, amārē-s, amāre-t; esse-m). Pluscuamperfecto: raíz de perfecto + -isse- + terminaciones (amāv-isse-m). Se usan en deseos irrealizables, condicionales irreales, cum histórico y dependencias de verbos en pasado.",tabla:[["amārem, amārēs, amāret","amara, amaras, amara"],["essem, essēs, esset","fuera, fueras, fuera"],["amāvissem","hubiera amado"],["fuissem","hubiera sido"],["Utinam adessēs!","¡Ojalá estuvieras acá!"]]},
  c:[["Sī avis ___, volārem.",["essem","sum","esse"],"Si fuera un pájaro, volaría.","Irreal: essem."],["Utinam hoc nōn ___!",["dīxissēs","dīcis","dīxistī"],"¡Ojalá no hubieras dicho eso!","Deseo irreal pasado: pluscuamperfecto."],["Rogāvit cūr ___.",["rīdērem","rīdeō","rīsī"],"Preguntó por qué me reía.","Indirecta en pasado: rīdērem."],["Utinam dormīre ___!",["possem","possum","potuī"],"¡Ojalá pudiera dormir!","Deseo irreal presente: possem."]],
  d:[["Quid facerēs sī avis essēs?","¿Qué harías si fueras un pájaro?",[["Volārem ad Graeciam.",null],["Volābō ad Graeciam.","Irreal: volārem."],["Volāre ad Graeciam.","Verbo conjugado: volārem."]]],
     ["Dīxistī Philippō eum senem esse!","¡Le dijiste a Felipe que es viejo!",[["Utinam id nōn dīxissem!",null],["Utinam id nōn dīxī!","Deseo irreal: dīxissem."],["Utinam id nōn dīcō!","Pasado irreal: dīxissem."]]],
     ["Quid tē rogāvit magister?","¿Qué te preguntó el maestro?",[["Rogāvit cūr sērō venīrem.",null],["Rogāvit cūr sērō veniō.","Indirecta pasada: venīrem."],["Rogāvit cūr sērō vēnī.","Subjuntivo: venīrem."]]]]},
 {id:"la49", lvl:"B2", ic:"🪽", t:"Daedalus et Īcarus", sub:"lectura: Ovidio",
  h:[["A","Daedalus ālās fēcit ut ē Crētā fugeret.","Dédalo hizo alas para huir de Creta."],["B","Fīliō dīxit: «Mediō tūtissimus ībis.»","Le dijo a su hijo: «Por el medio irás más seguro.»"],["A","Sed Īcarus audāx ad caelum altius volāvit.","Pero Ícaro, audaz, voló más alto hacia el cielo."],["B","Sōl cēram mollīvit, et puer in mare cecidit.","El sol ablandó la cera y el chico cayó al mar."],["A","Pater miser clāmāvit: «Īcare, Īcare, ubi es?»","El padre, desdichado, gritó: «Ícaro, Ícaro, ¿dónde estás?»"],["B","Ergō: nōlī nimis altē volāre, nec nimis fūmāre.","Moraleja: no vueles demasiado alto. Ni fumes demasiado."]],
  v:[["āla","el ala","🪽","ála"],["Crēta","Creta","🏝️","kréta"],["medius","del medio","↔️","médius"],["tūtus","seguro","🛡️","tútus"],["audāx","audaz","😎","áudaks"],["caelum","el cielo","☁️","káilum"],["cēra","la cera","🕯️","kéra"],["mollīre","ablandar","🫠","molíre"],["cadere → cecidit","caer → cayó","⬇️","kádere / kékidit"],["miser","desdichado","😭","míser"]],
  r:{t:"Ovidio y las Metamorfosis",x:"Ovidio (43 a. C. – 17 d. C.) escribió en verso las «Metamorfosis», 250 mitos de transformaciones. Consejo de lectura: en poesía el orden de las palabras es muy libre; seguí las terminaciones, no la posición. «Mediō tūtissimus ībis» = irás tutísimo por el medio (camino).",tabla:[["Mediō tūtissimus ībis.","Por el medio irás más seguro."],["Īcarus altius volāvit.","Ícaro voló más alto."],["Sōl cēram mollīvit.","El sol ablandó la cera."],["in mare cecidit","cayó al mar"],["Metamorphōsēs","Transformaciones"]]},
  c:[["Daedalus ālās fēcit ut ___.",["fugeret","fugit","fugere"],"Dédalo hizo alas para huir.","Final en pasado: fugeret."],["Mediō ___ ībis.",["tūtissimus","tūtior","tūtus est"],"Por el medio irás más seguro.","Superlativo: tūtissimus."],["Sōl ___ mollīvit.",["cēram","cēra","cērae"],"El sol ablandó la cera.","Objeto: cēram."],["Puer in mare ___.",["cecidit","cadit","cadēbat"],"El chico cayó al mar.","Perfecto: cecidit."]],
  d:[["Cūr Īcarus cecidit?","¿Por qué cayó Ícaro?",[["Quia nimis altē volāvit et sōl cēram mollīvit.",null],["Quia nimis humī volāvit.","Voló demasiado alto, no bajo."],["Quia ālās nōn habuit.","Tenía alas, pero se derritió la cera."]]],
     ["Quid dīxit Daedalus fīliō?","¿Qué le dijo Dédalo a su hijo?",[["Mediō tūtissimus ībis.",null],["Altē volā!","Le dijo lo contrario: por el medio."],["Mediō tūtissimum ībis.","Concuerda con el sujeto: tūtissimus."]]],
     ["Quis scrīpsit Metamorphōsēs?","¿Quién escribió las Metamorfosis?",[["Ovidius.",null],["Vergilius.","Virgilio escribió la Eneida."],["Caesar.","César escribió sobre sus guerras."]]]]},
 {id:"la50", lvl:"B2", ic:"⚖️", t:"Latín jurídico", sub:"frases del derecho",
  h:[["A","In dubiō prō reō.","En caso de duda, a favor del acusado."],["B","Pacta sunt servanda.","Los pactos deben cumplirse."],["A","Habeās corpus!","Que se presente al detenido (literalmente: que tengas el cuerpo)."],["B","Contractus ipsō factō nūllus est.","El contrato es nulo por el hecho mismo."],["A","Dē factō et dē iūre.","De hecho y de derecho."],["B","Nēmō iūdex in causā suā.","Nadie es juez en su propia causa."]],
  v:[["in dubiō prō reō","en la duda, a favor del reo","⚖️","in dúbio pro réo"],["pacta sunt servanda","los pactos deben cumplirse","🤝","pákta sunt seruánda"],["habeās corpus","que se presente al detenido","🧍","jábeas kórpus"],["ipsō factō","por el hecho mismo","⚡","ípso fákto"],["dē factō","de hecho","👁️","de fákto"],["dē iūre","de derecho","📜","de iúre"],["reus","el acusado","👤","réus"],["iūdex, iūdicis","el juez","👨‍⚖️","iúdeks"],["causa","la causa, el juicio","📁","káusa"],["ad hoc","para esto","🎯","ad jok"]],
  r:{t:"El derecho habla latín",x:"El derecho occidental nace del derecho romano, y abogados y jueces siguen usando sus fórmulas. Ahora ya entendés su gramática: «pacta sunt servanda» es un gerundivo (deben ser cumplidos); «habeās corpus», un subjuntivo (que tengas).",tabla:[["Dura lēx, sed lēx.","La ley es dura, pero es la ley."],["Nūlla poena sine lēge.","No hay pena sin ley."],["Onus probandī","la carga de la prueba"],["Ultrā vīrēs","más allá de las facultades"],["Alibī","en otro lugar (coartada)"]]},
  c:[["In dubiō prō ___.",["reō","reus","reum"],"En la duda, a favor del reo.","prō + ablativo: reō."],["Pacta sunt ___.",["servanda","servāta","servāre"],"Los pactos deben cumplirse.","Gerundivo: servanda."],["Dura lēx, sed ___.",["lēx","lēgem","lēgis"],"La ley es dura, pero es la ley.","Nominativo: lēx."],["«Alibī» significa ___.",["en otro lugar","sin culpa","el abogado"],"Coartada.","alibī = en otra parte."]],
  d:[["Quid significat «dē factō»?","¿Qué significa «de facto»?",[["De hecho, aunque no por ley.",null],["Por ley.","Eso es dē iūre."],["Falso.","dē factō = de hecho."]]],
     ["Quid est «onus probandī»?","¿Qué es el «onus probandi»?",[["La carga de la prueba.",null],["El honor del juez.","onus = carga."],["La prueba falsa.","onus probandī = carga de probar."]]],
     ["Estne iūdex in causā suā?","¿Puede alguien ser juez de su propia causa?",[["Minime: nēmō iūdex in causā suā.",null],["Ita: omnēs iūdicēs in causā suā.","El principio dice lo contrario."],["Nēmō iūdicem in causā suā.","Sujeto: iūdex."]]]]},
 {id:"la51", lvl:"B2", ic:"🧪", t:"Latín científico", sub:"medicina y biología",
  h:[["A","Homō sapiēns sum.","Soy un Homo sapiens: un «hombre sabio»."],["B","Hoc experīmentum in vitrō factum est.","Este experimento se hizo in vitro (en el laboratorio)."],["A","Medicāmentum per ōs sūmendum est.","El remedio debe tomarse por boca."],["B","Medicus corpus post mortem īnspicit.","El médico examina el cuerpo después de la muerte."],["A","Nōmen scientificum Philippī est Synallaxis.","El nombre científico de Felipe, el pijuí, es Synallaxis."],["B","Philippus sē «Synallaxis fūmāns» appellat.","Felipe se llama a sí mismo «Synallaxis fumans»."]],
  v:[["homō sapiēns","hombre sabio","🧠","jómo sápiens"],["in vitrō","en vidrio (laboratorio)","🧪","in uítro"],["in vīvō","en el ser vivo","🐁","in uíuo"],["per ōs","por boca","👄","per os"],["post mortem","después de la muerte","⚰️","post mórtem"],["placēbō","complaceré (placebo)","💊","plakébo"],["virus","el veneno","🦠","uírus"],["cor, cordis","el corazón","❤️","kor, kórdis"],["genus, generis","el género, la estirpe","🧬","guénus"],["species","el aspecto, la especie","🐦","spékies"]],
  r:{t:"La ciencia nombra en latín",x:"Desde Linneo (siglo XVIII), cada especie tiene un nombre latino de dos partes: género + especie (Homō sapiēns, Canis lupus, Fēlis catus). La medicina también: placēbō es un futuro («complaceré»), virus era «veneno», y los órganos conservan nombres latinos (cor → cardíaco, pulmō → pulmonar).",tabla:[["Canis lupus familiāris","el perro"],["Fēlis catus","el gato"],["Tyrannosaurus rēx","el rey lagarto tirano"],["placēbō (futuro de placēre)","complaceré"],["cor → cardíaco","corazón"]]},
  c:[["Homō ___ = hombre sabio.",["sapiēns","sapientia","sapere"],"Nuestra especie.","Participio: sapiēns."],["In ___ = en el laboratorio.",["vitrō","vītā","vīnō"],"En vidrio.","in + ablativo: vitrō."],["«Placēbō» significa ___.",["complaceré","placer","pastilla falsa"],"Futuro de placēre.","placēbō = complaceré."],["Post ___ = después de la muerte.",["mortem","mors","mortis"],"Autopsia.","post + acusativo: mortem."]],
  d:[["Quid est «in vīvō»?","¿Qué es «in vivo»?",[["En un organismo vivo.",null],["En vidrio.","Eso es in vitrō."],["En vino.","😄 vīnum es vino; vīvus es vivo."]]],
     ["Unde venit «cardíaco»?","¿De dónde viene «cardíaco»?",[["Del griego kardía, como el latín cor, cordis.",null],["De carne.","Viene de corazón (kardía / cor)."],["De cardo, la bisagra.","Viene de corazón."]]],
     ["Quid est nōmen scientificum canis?","¿Cuál es el nombre científico del perro?",[["Canis lupus familiāris.",null],["Fēlis catus.","Ese es el gato."],["Homō sapiēns.","Ese sos vos."]]]]},

 {id:"la53", lvl:"C1", ic:"📣", t:"Ōrātiō oblīqua", sub:"discurso indirecto",
  h:[["A","Lēgātī dīxērunt sē pācem petere.","Los embajadores dijeron que ellos pedían la paz."],["B","Caesar respondit sē eōs in dēditiōnem acceptūrum esse.","César respondió que él los aceptaría en rendición."],["A","Addidit nē arma retinērent.","Añadió que no conservaran las armas."],["B","Quārē venīrent? Num dubitārent?","¿Por qué venían? ¿Acaso dudaban?"],["A","Sē nōn pugnātūrōs esse, sī obsidēs darentur.","Que ellos no lucharían si se entregaban rehenes."],["B","Sīc Caesar in librīs suīs scrībit.","Así lo escribe César en sus libros."]],
  v:[["lēgātus","el embajador","🧑‍💼","legátus"],["sē","se, él mismo (reflexivo)","🪞","se"],["petere","pedir, buscar","🙏","pétere"],["dēditiō","la rendición","🏳️","deditio"],["acceptūrus esse","que aceptaría","🤝","akseptúrus ésse"],["addere","añadir","➕","áddere"],["arma, -ōrum","las armas","⚔️","árma"],["retinēre","retener","✋","retinére"],["obses, obsidis","el rehén","⛓️","óbses"],["dubitāre","dudar","🤔","dubitáre"]],
  r:{t:"El estilo indirecto largo",x:"Historiadores como César y Livio narran discursos enteros en indirecto: las afirmaciones van en acusativo + infinitivo, las órdenes y preguntas en subjuntivo, y los pronombres cambian (ego → sē, meus → suus). El tiempo del subjuntivo sigue al verbo principal (secuencia temporal).",tabla:[["Dīxit sē venīre.","Dijo que él venía."],["Dīxit sē ventūrum esse.","Dijo que vendría."],["Imperāvit ut abīrent.","Ordenó que se fueran."],["Rogāvit cūr venīrent.","Preguntó por qué venían."],["meus → suus / ego → sē","mío → suyo / yo → él"]]},
  c:[["Dīxit ___ fessum esse.",["sē","eum","ipse"],"Dijo que él (mismo) estaba cansado.","Reflexivo del sujeto: sē."],["Respondit sē ___ esse.",["ventūrum","venīre","vēnit"],"Respondió que vendría.","Futuro: ventūrum esse."],["Imperāvit nē arma ___.",["retinērent","retinent","retinēre"],"Ordenó que no conservaran las armas.","Orden en indirecto: subjuntivo."],["Rogāvit cūr ___.",["venīrent","veniunt","venīre"],"Preguntó por qué venían.","Pregunta en indirecto: subjuntivo."]],
  d:[["Quid dīxērunt lēgātī?","¿Qué dijeron los embajadores?",[["Sē pācem petere.",null],["Nōs pācem petimus.","En indirecto: sē … petere."],["Eōs pācem petunt.","Acusativo + infinitivo: sē … petere."]]],
     ["Quid Caesar imperāvit?","¿Qué ordenó César?",[["Ut obsidēs darentur.",null],["Obsidēs dantur.","Orden en indirecto: ut + subjuntivo."],["Ut obsidēs dant.","Subjuntivo: darentur."]]],
     ["Cūr «sē» et nōn «eum»?","¿Por qué «sē» y no «eum»?",[["Porque se refiere al sujeto de la oración principal.",null],["Porque es plural.","sē sirve para singular y plural."],["Porque es femenino.","sē no marca género."]]]]},
 {id:"la54", lvl:"C1", ic:"🛡️", t:"Arma virumque canō", sub:"lectura: Virgilio",
  h:[["A","Arma virumque canō, Trōiae quī prīmus ab ōrīs…","Canto las armas y al hombre que, primero desde las costas de Troya…"],["B","…Ītaliam, fātō profugus, Lāvīniaque vēnit lītora.","…llegó a Italia, prófugo por el destino, y a las costas lavinias."],["A","Tantae mōlis erat Rōmānam condere gentem.","Tan grande esfuerzo era fundar el pueblo romano."],["B","Timeō Danaōs et dōna ferentēs.","Temo a los griegos, incluso cuando traen regalos."],["A","Sunt lacrimae rērum.","Hay lágrimas en las cosas."],["B","Et Philippus: «Sunt lacrimae fūmī.»","Y Felipe: «Hay lágrimas del humo.»"]],
  v:[["canere","cantar","🎶","kánere"],["vir, virī","el hombre, el héroe","🛡️","uir"],["Trōia","Troya","🐴","tróia"],["ōra","la costa","🏖️","óra"],["fātum","el destino","🔮","fátum"],["profugus","prófugo","🏃","prófugus"],["mōlēs","la mole, el gran esfuerzo","🪨","móles"],["gēns, gentis","el pueblo, la estirpe","👥","guens"],["Danaī","los griegos","🇬🇷","dánai"],["lacrima","la lágrima","💧","lákrima"]],
  r:{t:"La Eneida",x:"Virgilio (70–19 a. C.) escribió la Eneida por encargo de Augusto: el troyano Eneas huye de Troya y sus descendientes fundan Roma. Es poesía épica en hexámetros: el orden de las palabras es libre y hay que reconstruir la frase por las terminaciones. «-que» = «y» pegado al final (virumque = et virum).",tabla:[["Arma virumque canō","Canto las armas y al héroe"],["virumque = et virum","y al hombre"],["fātō profugus","prófugo por el destino"],["Timeō Danaōs et dōna ferentēs","Temo a los griegos aunque traigan regalos"],["Sunt lacrimae rērum","Hay lágrimas en las cosas"]]},
  c:[["Arma ___ canō.",["virumque","virque","vir et"],"Canto las armas y al hombre.","-que = y, al final: virumque."],["Timeō Danaōs et dōna ___.",["ferentēs","ferunt","ferre"],"Temo a los griegos aunque traigan regalos.","Participio acus. pl.: ferentēs."],["Tantae ___ erat Rōmānam condere gentem.",["mōlis","mōlēs","mōlem"],"Tan gran esfuerzo era fundar el pueblo romano.","Genitivo: mōlis."],["Sunt lacrimae ___.",["rērum","rēs","rem"],"Hay lágrimas en las cosas.","Genitivo plural: rērum."]],
  d:[["Quis est «vir» in prīmō versū?","¿Quién es el «hombre» del primer verso?",[["Aenēās Troiānus.",null],["Ulixēs.","Ulises es de la Odisea. Acá: Eneas."],["Caesar.","Es Eneas, antepasado mítico de los romanos."]]],
     ["Quid significat «Timeō Danaōs et dōna ferentēs»?","¿Qué significa?",[["Desconfío de los griegos aunque traigan regalos.",null],["Me gustan los regalos griegos.","Es sobre el caballo de Troya: desconfianza."],["Temo los regalos de Dana.","Danaī = los griegos."]]],

 {id:"la55", lvl:"C1", ic:"🎼", t:"Hexameter", sub:"métrica: el ritmo del verso",
  h:[["A","Versus Latīnī nōn rīmam habent, sed numerum.","Los versos latinos no tienen rima, sino ritmo."],["B","Syllabae longae et brevēs alternantur.","Se alternan sílabas largas y breves."],["A","Dactylus est longa, brevis, brevis: — ∪ ∪.","El dáctilo es larga, breve, breve."],["B","Hexameter sex pedēs habet.","El hexámetro tiene seis pies."],["A","Ārma vi | rūmque ca | nō, Trō | iae quī | prīmus ab | ōrīs.","Así se escande el primer verso de la Eneida."],["B","Philippus hexametrōs tussit.","Felipe tose en hexámetros."]],
  v:[["versus","el verso","📜","uérsus"],["syllaba","la sílaba","🔤","síllaba"],["longa / brevis","larga / breve","📏","lónga / bréuis"],["pēs, pedis","el pie (métrico)","🦶","pes"],["dactylus","dáctilo (— ∪ ∪)","☝️","dáktilus"],["spondēus","espondeo (— —)","✌️","spondéus"],["hexameter","hexámetro (6 pies)","6️⃣","jeksámeter"],["elīsiō","elisión","🔗","elísio"],["caesūra","la cesura, pausa","⏸️","kaisúra"],["numerus","el ritmo","🥁","númerus"]],
  r:{t:"Cómo suena la poesía latina",x:"El verso latino se basa en la CANTIDAD: sílabas largas (vocal larga, diptongo o vocal + dos consonantes) y breves. El hexámetro dactílico tiene 6 pies: los 4 primeros dáctilos (— ∪ ∪) o espondeos (— —), el 5º casi siempre dáctilo y el 6º de dos sílabas. Una vocal final se «come» ante otra vocal (elisión).",tabla:[["— ∪ ∪","dáctilo"],["— —","espondeo"],["5º pie: — ∪ ∪ / 6º: — —","final típico: «prīmus ab | ōrīs»"],["vocal + 2 consonantes = larga","armā → «ar» es larga"],["ae, au, oe","diptongos: siempre largos"]]},
  c:[["Hexameter ___ pedēs habet.",["sex","quīnque","septem"],"El hexámetro tiene seis pies.","hexa = seis."],["Dactylus est: ___",["— ∪ ∪","∪ ∪ —","— —"],"Larga, breve, breve.","Como un dedo: falange larga y dos cortas."],["Syllaba cum diphthongō semper ___ est.",["longa","brevis","media"],"La sílaba con diptongo siempre es larga.","Diptongo = larga."],["Versūs Latīnī rīmam ___ habent.",["nōn","semper","saepe"],"Los versos latinos no tienen rima.","Se basan en el ritmo."]],
  d:[["Quot pedēs habet hexameter?","¿Cuántos pies tiene el hexámetro?",[["Sex.",null],["Quīnque.","hexa = seis."],["Decem.","Son seis."]]],
     ["Quid est elīsiō?","¿Qué es la elisión?",[["Cuando una vocal final se pierde ante otra vocal.",null],["Cuando se elige un verso.","Es la vocal que se «come»."],["Una rima final.","El verso latino no rima."]]],
     ["Estne syllaba «ar» in «arma» longa?","¿Es larga la sílaba «ar» de «arma»?",[["Longa est, quia duae cōnsonantēs sequuntur.",null],["Brevis est, quia vōcālis «a» brevis.","Vocal + dos consonantes = larga por posición."],["Nec longa nec brevis.","Toda sílaba es larga o breve."]]]]},
 {id:"la56", lvl:"C1", ic:"🧘", t:"Vindicā tē tibi", sub:"lectura: Séneca",
  h:[["A","Ita fac, mī Lūcīlī: vindicā tē tibi.","Hacé así, querido Lucilio: reclamate a vos mismo."],["B","Omnia, Lūcīlī, aliēna sunt; tempus tantum nostrum est.","Todo, Lucilio, es ajeno; solo el tiempo es nuestro."],["A","Nōn est ad astra mollis ē terrīs via.","No es suave el camino de la tierra a las estrellas."],["B","Dum differtur, vīta trānscurrit.","Mientras se posterga, la vida pasa."],["A","Errāre hūmānum est, perseverāre diabolicum.","Errar es humano; persistir, diabólico."],["B","Philippus perseverat. Fūmat adhūc.","Felipe persiste. Todavía fuma."]],
  v:[["vindicāre","reclamar, liberar","🔓","uindikáre"],["mī Lūcīlī","querido Lucilio (vocativo)","💌","mi lukíli"],["aliēnus","ajeno","🙅","aliénus"],["tantum","solo","☝️","tántum"],["astrum","el astro, la estrella","⭐","ástrum"],["mollis","suave, blando","☁️","mólis"],["differre","postergar","📅","diférre"],["trānscurrere","transcurrir","⏳","transkúrrere"],["perseverāre","persistir","🔁","perseueráre"],["adhūc","todavía","⏱️","adjúk"]],
  r:{t:"Séneca, el estoico",x:"Séneca (4 a. C. – 65 d. C.), nacido en Córdoba, escribió las «Cartas a Lucilio»: consejos cortos para vivir bien. Estilo sentencioso: frases breves, antítesis y paralelismos. Su tema central es el tiempo: «omnia aliēna sunt, tempus tantum nostrum est».",tabla:[["Vindicā tē tibi.","Reclamate a vos mismo."],["Tempus tantum nostrum est.","Solo el tiempo es nuestro."],["Per aspera ad astra.","Por lo áspero hacia las estrellas."],["Docendō discimus.","Enseñando aprendemos."],["Nōn scholae sed vītae discimus.","No aprendemos para la escuela, sino para la vida."]]},
  c:[["Omnia aliēna sunt; tempus ___ nostrum est.",["tantum","tamen","tam"],"Todo es ajeno; solo el tiempo es nuestro.","solo: tantum."],["Nōn est ad ___ mollis ē terrīs via.",["astra","astrum","astrīs"],"No es suave el camino de la tierra a las estrellas.","ad + acusativo plural: astra."],["Docendō ___.",["discimus","discere","discit"],"Enseñando aprendemos.","1ª pl.: discimus."],["Nōn scholae sed ___ discimus.",["vītae","vītam","vīta"],"Aprendemos para la vida, no para la escuela.","Dativo: vītae."]],
  d:[["Unde erat Seneca?","¿De dónde era Séneca?",[["Cordubā, in Hispāniā.",null],["Rōmā.","Nació en Córdoba, en Hispania."],["Athēnīs.","Era hispano: de Córdoba."]]],
     ["Quid est nostrum, secundum Senecam?","Según Séneca, ¿qué es nuestro?",[["Tempus tantum.",null],["Pecūnia.","Dice que todo es ajeno, menos el tiempo."],["Omnia.","Dice que todo es ajeno."]]],
     ["Quid significat «per aspera ad astra»?","¿Qué significa?",[["A las estrellas por caminos difíciles.",null],["Los astros son ásperos.","aspera = lo difícil."],["Por el aire a las estrellas.","Es: por lo áspero."]]]]},
 {id:"la57", lvl:"C1", ic:"🍷", t:"Carpe diem", sub:"lectura: Horacio",
  h:[["A","Tū nē quaesierīs, scīre nefās, quem mihi, quem tibi fīnem dī dederint.","No preguntes, no es lícito saberlo, qué fin nos darán los dioses a mí y a vos."],["B","Dum loquimur, fūgerit invida aetās.","Mientras hablamos, habrá huido el tiempo envidioso."],["A","Carpe diem, quam minimum crēdula posterō.","Aprovechá el día, confiando lo menos posible en el mañana."],["B","Aurea mediocritās.","El dorado término medio."],["A","Exēgī monumentum aere perennius.","Levanté un monumento más duradero que el bronce."],["B","Nōn omnis moriar.","No moriré del todo."]],
  v:[["quaerere","preguntar","❓","kuáirere"],["nefās","lo prohibido, ilícito","🚫","néfas"],["invidus","envidioso","😒","ínuidus"],["aetās","la edad, el tiempo","⏳","áitas"],["carpere","cosechar, aprovechar","🌾","kárpere"],["crēdulus","crédulo, confiado","🙈","krédulus"],["posterus","el siguiente, el mañana","➡️","pósterus"],["aureus","dorado","🥇","áureus"],["aes, aeris","el bronce","🔔","ais"],["perennis","duradero","♾️","perénnis"]],
  r:{t:"Horacio, el poeta del equilibrio",x:"Horacio (65–8 a. C.) escribió Odas llenas de frases que se hicieron proverbios. Su filosofía: disfrutar el presente (carpe diem), buscar el término medio (aurea mediocritās) y confiar en que la poesía vence a la muerte (nōn omnis moriar). «Carpe» es imperativo de carpere: cosechar, como una fruta madura.",tabla:[["Carpe diem","Aprovechá el día"],["quam minimum crēdula posterō","confiando lo menos posible en el mañana"],["Aurea mediocritās","El dorado término medio"],["Exēgī monumentum aere perennius","Levanté un monumento más duradero que el bronce"],["Nōn omnis moriar","No moriré del todo"]]},
  c:[["Carpe ___!",["diem","diēs","diē"],"¡Aprovechá el día!","Objeto: diem."],["Aurea ___.",["mediocritās","mediocris","medium"],"El dorado término medio.","Sustantivo: mediocritās."],["Exēgī monumentum aere ___.",["perennius","perennis","perenniter"],"Levanté un monumento más duradero que el bronce.","Comparativo neutro: perennius."],["Nōn omnis ___.",["moriar","morior","mortuus"],"No moriré del todo.","Futuro de morior: moriar."]],
  d:[["Quid significat «carpe»?","¿Qué significa «carpe»?",[["Cosechá, arrancá (como una fruta).",null],["Pescá una carpa.","😄 carpere = cosechar."],["Escribí.","carpere = cosechar."]]],
     ["Quid est «aurea mediocritās»?","¿Qué es la «aurea mediocritas»?",[["El valioso punto medio entre dos excesos.",null],["La mediocridad de oro, algo malo.","Para Horacio es virtud, no algo malo."],["Un tesoro escondido.","Es el equilibrio."]]],
     ["Quid Horātius dē poēsī suā dīcit?","¿Qué dice Horacio de su poesía?",[["Exēgī monumentum aere perennius.",null],["Poēsis mea mortua est.","Dice que durará más que el bronce."],["Nōn legite mē.","Dice que no morirá del todo."]]]]},
 {id:"la58", lvl:"C1", ic:"💔", t:"Ōdī et amō", sub:"lectura: Catulo",
  h:[["A","Ōdī et amō. Quārē id faciam, fortasse requīris.","Odio y amo. Por qué lo hago, quizá preguntes."],["B","Nescio, sed fierī sentiō et excrucior.","No lo sé, pero siento que sucede y me atormento."],["A","Vīvāmus, mea Lesbia, atque amēmus.","Vivamos, Lesbia mía, y amemos."],["B","Dā mī bāsia mīlle, deinde centum.","Dame mil besos, después cien."],["A","Sōlēs occidere et redīre possunt.","Los soles pueden ponerse y volver."],["B","Philippus: «Ōdī et amō… tabācum.»","Felipe: «Odio y amo… el tabaco.»"]],
  v:[["ōdī","odio (perfecto con valor presente)","😡","ódi"],["quārē","por qué","❓","kuáre"],["requīrere","preguntar, buscar","🔍","rekuírere"],["fierī","suceder, hacerse","⚙️","fíeri"],["excruciāre","atormentar","😖","ekskrukiáre"],["bāsium","el beso","💋","básium"],["mīlle","mil","🔢","míle"],["occidere","ponerse (el sol), caer","🌇","okkídere"],["redīre","volver","🔄","redíre"],["tabācum","el tabaco (latín moderno)","🚬","tabákum"]],
  r:{t:"Catulo, el poeta del amor",x:"Catulo (84–54 a. C.) escribió poemas breves y apasionados a «Lesbia». «Ōdī et amō» es el poema más famoso: dos versos con toda la contradicción del amor. Ojo: ōdī tiene forma de perfecto pero significa presente (odio); lo mismo meminī (recuerdo).",tabla:[["Ōdī et amō.","Odio y amo."],["Quārē id faciam?","¿Por qué lo hago?"],["Nescio, sed fierī sentiō","No sé, pero siento que pasa"],["et excrucior","y me atormento"],["Dā mī bāsia mīlle","Dame mil besos"]]},
  c:[["___ et amō.",["Ōdī","Ōdiō","Ōdit"],"Odio y amo.","Verbo defectivo: ōdī."],["Dā mī bāsia ___.",["mīlle","mīlia","mīllem"],"Dame mil besos.","Número: mīlle."],["Vīvāmus, mea Lesbia, atque ___.",["amēmus","amāmus","amāre"],"Vivamos, Lesbia mía, y amemos.","Subjuntivo exhortativo: amēmus."],["Nescio, sed fierī sentiō et ___.",["excrucior","excruciō","excruciat"],"No sé, pero lo siento y me atormento.","Pasiva 1ª sg.: excrucior."]],
  d:[["Quid sentit Catullus?","¿Qué siente Catulo?",[["Et odium et amōrem simul.",null],["Tantum amōrem.","Siente las dos cosas a la vez."],["Nihil.","Siente odio y amor."]]],
     ["Quot bāsia petit Catullus?","¿Cuántos besos pide Catulo?",[["Mīlle, deinde centum, et plūra.",null],["Ūnum sōlum.","Pide miles."],["Nūlla.","Pide mil y después cien."]]],
     ["Cūr «ōdī» est speciāle?","¿Por qué «ōdī» es especial?",[["Tiene forma de perfecto pero significa presente.",null],["Porque es un sustantivo.","Es un verbo defectivo."],["Porque es futuro.","Forma de perfecto, significado presente."]]]]},
 {id:"la59", lvl:"C1", ic:"✝️", t:"In principiō", sub:"lectura: la Vulgata",
  h:[["A","In principiō erat Verbum, et Verbum erat apud Deum.","En el principio era el Verbo, y el Verbo estaba junto a Dios."],["B","Fiat lūx. Et facta est lūx.","Hágase la luz. Y la luz fue hecha."],["A","Pater noster, quī es in caelīs, sānctificētur nōmen tuum.","Padre nuestro, que estás en los cielos, santificado sea tu nombre."],["B","Ecce homō.","He aquí el hombre."],["A","Vānitās vānitātum, et omnia vānitās.","Vanidad de vanidades, todo es vanidad."],["B","Quō vādis?","¿Adónde vas?"]],
  v:[["principium","el principio","🌅","prinkípium"],["verbum","la palabra, el verbo","💬","uérbum"],["apud + acus.","junto a, en casa de","🏠","ápud"],["fīat","hágase","✨","fíat"],["lūx, lūcis","la luz","💡","luks"],["sānctificāre","santificar","😇","sanktifikáre"],["ecce","he aquí","👉","ékke"],["vānitās","la vanidad, lo vacío","🫧","uánitas"],["vādere","ir","🚶","uádere"],["Vulgāta","la Vulgata (Biblia latina)","📖","uulgáta"]],
  r:{t:"El latín de la Iglesia",x:"San Jerónimo tradujo la Biblia al latín hacia el año 400: la «Vulgata» (edición para el pueblo). Su latín es más simple que el clásico, con orden de palabras cercano al español. Durante mil años fue el libro más leído de Europa y llenó las lenguas modernas de expresiones.",tabla:[["Fīat lūx","Hágase la luz"],["Ecce homō","He aquí el hombre"],["Quō vādis?","¿Adónde vas?"],["Vānitās vānitātum","Vanidad de vanidades"],["Dominus vōbīscum","El Señor esté con ustedes"]]},
  c:[["In ___ erat Verbum.",["principiō","principium","principī"],"En el principio era el Verbo.","in + ablativo: principiō."],["Fīat ___.",["lūx","lūcem","lūcis"],"Hágase la luz.","Sujeto: lūx."],["Pater noster, quī es in ___.",["caelīs","caelōs","caelum"],"Padre nuestro, que estás en los cielos.","in + ablativo plural: caelīs."],["Quō ___?",["vādis","vādit","vādere"],"¿Adónde vas?","2ª sg.: vādis."]],
  d:[["Quis Vulgātam scrīpsit?","¿Quién hizo la Vulgata?",[["Sānctus Hierōnymus.",null],["Cicerō.","Cicerón vivió siglos antes."],["Iūlius Caesar.","Fue san Jerónimo, hacia el año 400."]]],

     ["Quid dīxit Deus prīmō diē?","¿Qué dijo Dios el primer día?",[["Fīat lūx.",null],["Fīat nox.","Fue: Fīat lūx."],["Lūx fīunt.","Singular: Fīat lūx."]]]]},
 {id:"la60", lvl:"C1", ic:"🎡", t:"Ō Fortūna", sub:"latín medieval",
  h:[["A","Ō Fortūna, velut lūna statū variābilis.","Oh Fortuna, como la luna, de estado variable."],["B","Semper crēscis aut dēcrēscis.","Siempre creces o decreces."],["A","Gaudeāmus igitur, iuvenēs dum sumus!","¡Alegrémonos, pues, mientras somos jóvenes!"],["B","Post iūcundam iuventūtem, post molestam senectūtem, nōs habēbit humus.","Después de la alegre juventud, después de la molesta vejez, nos tendrá la tierra."],["A","Haec carmina scholārēs mediī aevī cantābant.","Estas canciones las cantaban estudiantes medievales."],["B","Philippus «Ō Fortūna» cantat cum pecūniam perdit.","Felipe canta «O Fortuna» cuando pierde plata."]],
  v:[["velut","como","🌙","uélut"],["status, -ūs","el estado","📊","státus"],["variābilis","variable","🔄","uariábilis"],["crēscere","crecer","📈","kréskere"],["dēcrēscere","decrecer","📉","dekréskere"],["igitur","pues, entonces","➡️","íguitur"],["iuvenis","joven","🧑","iúuenis"],["iūcundus","alegre, agradable","😄","iukúndus"],["senectūs, -ūtis","la vejez","👴","senéktus"],["humus","la tierra","🪨","júmus"]],
  r:{t:"El latín después de Roma",x:"Durante la Edad Media el latín siguió vivo como lengua de la Iglesia, las universidades y la ciencia. Los «Carmina Burana» (siglo XIII) son canciones de estudiantes vagabundos sobre la suerte, el vino y el amor; Carl Orff las musicalizó en 1937. «Gaudeamus igitur» todavía se canta en graduaciones.",tabla:[["Ō Fortūna, velut lūna","Oh Fortuna, como la luna"],["statū variābilis","variable en su estado"],["Gaudeāmus igitur","Alegrémonos, pues"],["iuvenēs dum sumus","mientras somos jóvenes"],["nōs habēbit humus","nos tendrá la tierra"]]},
  c:[["Ō Fortūna, velut ___.",["lūna","lūnam","lūnae"],"Oh Fortuna, como la luna.","Nominativo: lūna."],["Gaudeāmus ___!",["igitur","ergō sum","ita"],"¡Alegrémonos, pues!","igitur = pues."],["Iuvenēs dum ___.",["sumus","sunt","esse"],"Mientras somos jóvenes.","1ª pl.: sumus."],["Nōs habēbit ___.",["humus","humum","humō"],"Nos tendrá la tierra.","Sujeto: humus."]],
  d:[["Quid sunt «Carmina Burāna»?","¿Qué son los «Carmina Burana»?",[["Canciones medievales de estudiantes.",null],["Poemas de Virgilio.","Son medievales, del siglo XIII."],["Leyes romanas.","Son canciones."]]],
     ["Quandō cantātur «Gaudeāmus igitur»?","¿Cuándo se canta «Gaudeamus igitur»?",[["In ceremōniīs acadēmicīs.",null],["In fūneribus.","Se canta en graduaciones."],["Numquam.","Todavía se canta en universidades."]]],
     ["Cūr Fortūna est «velut lūna»?","¿Por qué la Fortuna es «como la luna»?",[["Quia semper mūtātur.",null],["Quia nocte lūcet.","Por lo variable, no por brillar."],["Quia rotunda est.","Por lo cambiante."]]]]},
 {id:"la61", lvl:"C1", ic:"📚", t:"Historia", sub:"lectura: Tácito y Livio",
  h:[["A","Ubi sōlitūdinem faciunt, pācem appellant.","Donde hacen un desierto, lo llaman paz."],["B","Tacitus haec verba ducī Britannō, Calgacō, attribuit.","Tácito atribuye estas palabras al jefe británico Calgaco."],["A","Vae victīs!","¡Ay de los vencidos!"],["B","Brennus, dux Gallōrum, hoc Rōmānīs dīxit.","Breno, jefe de los galos, les dijo esto a los romanos."],["A","Historia magistra vītae.","La historia es maestra de la vida."],["B","Philippus: «Historia mea magistra tussis.»","Felipe: «Mi historia es maestra de la tos.»"]],

  r:{t:"Los historiadores romanos",x:"Livio (59 a. C. – 17 d. C.) contó la historia de Roma desde su fundación en 142 libros. Tácito (c. 56–120) escribió con frases densas y amargas sobre el poder imperial. Truco de Tácito: pone críticas a Roma en boca de sus enemigos, como Calgaco.",tabla:[["Ubi sōlitūdinem faciunt, pācem appellant.","Donde hacen un desierto, lo llaman paz."],["Vae victīs!","¡Ay de los vencidos!"],["Historia magistra vītae.","La historia es maestra de la vida (Cicerón)."],["Ab urbe conditā","Desde la fundación de la ciudad (Livio)"],["sine īrā et studiō","sin ira ni parcialidad (Tácito)"]]},
  c:[["Ubi sōlitūdinem faciunt, ___ appellant.",["pācem","pāx","pācis"],"Donde hacen un desierto, lo llaman paz.","Objeto: pācem."],["Vae ___!",["victīs","victōs","victī"],"¡Ay de los vencidos!","vae + dativo: victīs."],["Historia magistra ___.",["vītae","vītam","vīta"],"La historia es maestra de la vida.","Genitivo: vītae."],["Livius scrīpsit «Ab urbe ___».",["conditā","condita","conditam"],"Desde la fundación de la ciudad.","ab + ablativo: conditā."]],
  d:[["Quis dīxit «Vae victīs»?","¿Quién dijo «Vae victis»?",[["Brennus, dux Gallōrum.",null],["Caesar.","Lo dijo el galo Breno a los romanos."],["Cicerō.","Fue Breno."]]],
     ["Quid Tacitus dē Rōmānīs dīcit per Calgacum?","¿Qué dice Tácito de los romanos a través de Calgaco?",[["Eōs vastitātem «pācem» appellāre.",null],["Eōs pācem amāre.","Es una crítica: llaman paz a la devastación."],["Eōs nihil facere.","Critica su violencia."]]],

/* =========================================================================
   ARRANQUE: dibuja al instante con lo guardado en el navegador y sincroniza en segundo plano
   ========================================================================= */
/* Cielo estrellado: estrellas que titilan y se desplazan despacio, con alguna estrella fugaz */
function cielo(){
  const c = document.getElementById("stars"), x = c.getContext("2d");
  const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, dpr, estrellas = [], fugaz = null, ultima = 0;
  // En el celular la barra de direcciones aparece y desaparece al hacer scroll y cambia el alto:
  // el lienzo se dimensiona al alto máximo de la pantalla y solo se rearma si cambia el ancho (girar el celu).
  const armar = () => {
    if (W === innerWidth && estrellas.length) return;
    dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth;
    H = Math.max(c.clientHeight || 0, innerHeight); // 100lvh: el alto con la barra escondida, no cambia al hacer scroll
    c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(220, W * H / 5500));
    estrellas = Array.from({length:n}, () => ({x:Math.random() * W, y:Math.random() * H, r:Math.random() * 1.4 + .3,
      v:Math.random() * .12 + .02, f:Math.random() * Math.PI * 2, t:Math.random() * .03 + .008,
      c:Math.random() < .12 ? "255,210,150" : Math.random() < .2 ? "180,200,255" : "255,255,255"}));
  };
  const dibujar = ts => {
    x.clearRect(0, 0, W, H);
    for (const s of estrellas) {
      if (!quieto) { s.y += s.v; s.x -= s.v * .35; s.f += s.t; if (s.y > H + 2) { s.y = -2; s.x = Math.random() * W; } if (s.x < -2) s.x = W + 2; }
      const a = .45 + .55 * Math.abs(Math.sin(s.f));
      x.beginPath(); x.arc(s.x, s.y, s.r, 0, Math.PI * 2); x.fillStyle = `rgba(${s.c},${a})`; x.fill();
      if (s.r > 1.35) { x.fillStyle = `rgba(${s.c},${a * .15})`; x.beginPath(); x.arc(s.x, s.y, s.r * 3.2, 0, Math.PI * 2); x.fill(); }
    }
    if (!quieto) {
      if (!fugaz && ts - ultima > 6000 && Math.random() < .01) { fugaz = {x:Math.random() * W * .8 + W * .2, y:Math.random() * H * .4, vx:-7, vy:3.2, vida:1}; ultima = ts; }
      if (fugaz) {
        const g = x.createLinearGradient(fugaz.x, fugaz.y, fugaz.x - fugaz.vx * 14, fugaz.y - fugaz.vy * 14);
        g.addColorStop(0, `rgba(255,255,255,${fugaz.vida})`); g.addColorStop(1, "rgba(255,255,255,0)");
        x.strokeStyle = g; x.lineWidth = 2; x.beginPath(); x.moveTo(fugaz.x, fugaz.y); x.lineTo(fugaz.x - fugaz.vx * 14, fugaz.y - fugaz.vy * 14); x.stroke();
        fugaz.x += fugaz.vx; fugaz.y += fugaz.vy; fugaz.vida -= .012; if (fugaz.vida <= 0 || fugaz.x < -50) fugaz = null;
      }
      requestAnimationFrame(dibujar);
    }
  };
  armar(); addEventListener("resize", armar); requestAnimationFrame(dibujar);
}
cielo();
